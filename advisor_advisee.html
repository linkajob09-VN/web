var _saleModalStaffName = null;
var _saleModalDayIdx = 0;
var _saleModalDays = [];

function openSaleScheduleModal(staffName) {
  selectedSaleSlots.clear();
  _saleModalStaffName = staffName;
  _saleModalDayIdx = 0;

  const base = new Date();
  _saleModalDays = [];
  for (let i=0;i<7;i++) { const d = new Date(base); d.setDate(base.getDate()+i); _saleModalDays.push(d); }

  document.getElementById('modal-title').textContent = '📅 Thêm lịch trống — ' + staffName;
  renderSaleScheduleModalBody();

  var modalBox = document.querySelector('.modal');
  if (modalBox) modalBox.style.maxWidth = '560px';
  document.getElementById('modal-overlay').classList.add('open');
}

function renderSaleScheduleModalBody() {
  const staffName = _saleModalStaffName;
  const existingKeys = {};
  MOCK.saleSlots.forEach(function(sl){
    if (sl.staff === staffName) existingKeys[sl.date + '_' + sl.time] = sl.status;
  });

  // Đếm số slot đã chọn/đã có mỗi ngày để hiện chấm trên tab ngày
  function countForDay(d) {
    const dateStr = ymd(d);
    let n = 0;
    ['09:00','10:00','11:00','14:00','15:00','16:00','17:00','19:00','20:00'].forEach(function(t){
      const key = dateStr + '_' + t;
      if (selectedSaleSlots.has(key) || existingKeys[key] === 'available') n++;
    });
    return n;
  }

  let html = '<div style="font-size:13px;color:var(--muted);margin-bottom:14px">Chọn ngày rồi bấm giờ trống cho <b>' + staffName + '</b>. Mỗi buổi 20 phút tư vấn miễn phí.</div>';

  // Thanh chọn ngày
  html += '<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;border-bottom:1.5px solid var(--border)">';
  _saleModalDays.forEach(function(d, i){
    const dow = DAYS_VI[d.getDay()];
    const active = i === _saleModalDayIdx;
    const cnt = countForDay(d);
    html += '<button onclick="switchSaleModalDay(' + i + ')" style="flex-shrink:0;min-width:56px;padding:8px 6px;border-radius:10px;border:1.5px solid ' + (active?'var(--brand)':'var(--border)') + ';background:' + (active?'var(--brand)':'var(--white)') + ';color:' + (active?'#fff':'var(--text)') + ';cursor:pointer;text-align:center;font-family:inherit">';
    html += '<div style="font-size:11px;font-weight:600">' + dow + '</div><div style="font-size:13px;font-weight:700">' + d.getDate() + '/' + (d.getMonth()+1) + '</div>';
    if (cnt > 0) html += '<div style="font-size:9px;margin-top:2px;' + (active?'color:#fff':'color:var(--brand)') + '">' + cnt + ' slot</div>';
    html += '</button>';
  });
  html += '</div>';

  // Giờ trong ngày đang chọn
  const curDay = _saleModalDays[_saleModalDayIdx];
  const dateStr = ymd(curDay);
  const dow = DAYS_VI[curDay.getDay()];
  html += '<div style="font-size:13px;font-weight:700;margin-bottom:10px">' + dow + ' ' + curDay.getDate() + '/' + (curDay.getMonth()+1) + ' — chọn giờ trống</div>';
  html += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px" id="sale-slot-grid">';
  ['09:00','10:00','11:00','14:00','15:00','16:00','17:00','19:00','20:00'].forEach(function(t){
    const key = dateStr + '_' + t;
    const exist = existingKeys[key];
    let cls = 'day-time-chip';
    let disabled = '';
    let label = '<b>' + t + '</b>';
    if (exist === 'booked') { cls += ' booked'; disabled = 'disabled'; label += '<br><span style="font-size:9px">Đã đặt</span>'; }
    else if (selectedSaleSlots.has(key) || exist === 'available') { cls += ' selected'; label += '<br><span style="font-size:9px">' + (exist==='available'?'Đã có':'Mới chọn') + '</span>'; }
    html += '<button class="' + cls + '" data-key="' + key + '" ' + disabled + ' onclick="toggleSaleSlot(this,\'' + key + '\')" style="padding:12px 4px;font-size:13px;line-height:1.4">' + label + '</button>';
  });
  html += '</div>';

  html += '<div style="font-size:12px;color:var(--muted);margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">Tổng đã chọn (tất cả các ngày): <span id="sale-sel-count" style="color:var(--brand);font-weight:700">' + selectedSaleSlots.size + '</span> slot</div>';

  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal-body').style.maxHeight = '65vh';
  document.getElementById('modal-body').style.overflowY = 'auto';
  document.getElementById('modal-actions').innerHTML =
    '<button class="btn-secondary" onclick="closeModal()" style="width:auto;padding:10px 20px">Huỷ</button>' +
    '<button class="login-btn" id="sale-send-btn" onclick="saveSaleSlots(\'' + staffName + '\')" style="width:auto;padding:10px 24px">Lưu lịch trống (' + selectedSaleSlots.size + ')</button>';
}

function switchSaleModalDay(idx) {
  _saleModalDayIdx = idx;
  renderSaleScheduleModalBody();
}

function toggleSaleSlot(btn, key) {
  if (btn.classList.contains('booked')) return;
  if (selectedSaleSlots.has(key)) selectedSaleSlots.delete(key);
  else selectedSaleSlots.add(key);
  renderSaleScheduleModalBody();
}

function saveSaleSlots(staffName) {
  if (selectedSaleSlots.size === 0) { toast('Chưa chọn giờ nào!', 'error'); return; }
  var st = MOCK.staffList.find(function(x){ return x.name === staffName; });
  var btn = document.getElementById('sale-send-btn');
  if (btn) { btn.innerHTML = '<span class="spinner"></span> Đang lưu...'; btn.disabled = true; }

  var slotsToAdd = Array.from(selectedSaleSlots); // ["2026-07-20_09:00", ...]

  apiPost({
    action: 'addSlots',
    advisor: STAFF_SLOT_IDENTITY,
    advisor_email: st ? st.email : '',
    created_by: staffName,
    slots: slotsToAdd,
  }).then(function(res){
    if (res && res.success) {
      // ── Optimistic update: hiện ngay trên UI, không đợi fetch lại Sheet ──
      slotsToAdd.forEach(function(key){
        var parts = key.split('_');
        var d = parts[0], t = parts[1];
        var already = MOCK.saleSlots.some(function(sl){ return sl.staff === staffName && sl.date === d && sl.time === t; });
        if (!already) {
          MOCK.saleSlots.push({ staff: staffName, date: d, time: t, status: 'available', client: '', note: 'Tư vấn miễn phí', slot_id: null });
        }
      });

      toast('Đã lưu ' + slotsToAdd.length + ' slot cho ' + staffName + ' ✅', 'success');
      selectedSaleSlots.clear();
      closeModal();
      if (_staffDetailId) document.getElementById('main-content').innerHTML = renderStaffMemberDetail(_staffDetailId, 'schedule', _staffDetailSelfView);
      else navTo('stf-schedule');

      // Đồng bộ nền với Sheet (không xoá dữ liệu local nếu Sheet thiếu cột created_by)
      if (_staffDetailId) loadStaffScheduleTabAsync();
    } else {
      toast('Lỗi: ' + (res && res.error ? res.error : 'không lưu được lên Sheet'), 'error');
      if (btn) { btn.innerHTML = 'Lưu lịch trống đã chọn'; btn.disabled = false; }
    }
  }).catch(function(err){
    toast('Lỗi kết nối: ' + err.message, 'error');
    if (btn) { btn.innerHTML = 'Lưu lịch trống đã chọn'; btn.disabled = false; }
  });
}

function deleteSaleSlot(i) {
  var sl = MOCK.saleSlots[i];
  if (!sl) return;

  if (!sl.slot_id) {
    MOCK.saleSlots.splice(i, 1);
    toast('Đã xoá slot (chỉ ở local, chưa từng lưu lên Sheet)', 'success');
    navTo('stf-schedule');
    return;
  }

  toast('Đang xoá trên Sheet...', '');
  apiPost({ action: 'deleteSlot', slot_id: sl.slot_id }).then(function(res){
    if (res && res.success) toast('Đã xoá slot ✅', 'success');
    else toast('Lỗi: ' + (res && res.error ? res.error : 'không xoá được'), 'error');
    loadStaffSchedulePageAsync();
  }).catch(function(err){
    toast('Lỗi kết nối: ' + err.message, 'error');
  });
}

function saveNewAdvisor() {
  var name = document.getElementById('na-name').value.trim();
  var title = document.getElementById('na-title').value.trim();
  var email = document.getElementById('na-email').value.trim();
  var phone = document.getElementById('na-phone').value.trim();
  if (!name || !title || !email || !phone) { toast('Vui lòng điền đầy đủ các trường bắt buộc (*)', 'error'); return; }

  var supportItems = [];
  for (var i = 0; i < 3; i++) {
    var t = document.getElementById('na-si-title-' + i).value.trim();
    if (t) supportItems.push({ icon: document.getElementById('na-si-icon-' + i).value.trim() || '✦', title: t, desc: document.getElementById('na-si-desc-' + i).value.trim() });
  }

  var experience = [];
  document.querySelectorAll('#na-exp-list .ea-exp-row').forEach(function(row){
    var t = row.querySelector('.ea-exp-title').value.trim();
    if (!t) return;
    experience.push({
      title: t,
      company: row.querySelector('.ea-exp-company').value.trim(),
      type: row.querySelector('.ea-exp-type').value,
      location: row.querySelector('.ea-exp-location').value.trim(),
      dateRange: row.querySelector('.ea-exp-daterange').value.trim(),
      desc: row.querySelector('.ea-exp-desc').value.trim(),
    });
  });

  var products = Array.from(document.querySelectorAll('.na-pkg-cb:checked')).map(function(cb){ return cb.value; });

  apiPost({
    action: 'registerAdvisor',
    name: name, role: title,
    company: document.getElementById('na-company').value.trim(),
    industry: document.getElementById('na-tags').value.trim(),
    email: email, phone: phone,
    bio: document.getElementById('na-bio').value.trim(),
    experience: experience,
  }).then(function(res){
    if (res && res.success) {
      toast('Đã thêm ' + name + ' — cần vào Sheet đổi is_active = TRUE để hiện trên web ✅', 'success');
      navTo('adv-list');
    } else {
      toast('Lỗi khi lưu lên Sheet: ' + (res && res.error), 'error');
    }
  }).catch(function(err){
    toast('Lỗi kết nối: ' + err.message, 'error');
  });
}

      html += '<td><div style="display:flex;align-items:center;gap:10px">' + avatarCircle(a.name, 36) + '<div><div style="font-weight:700">' + a.name + '</div><div style="font-size:12px;color:var(--muted)">' + a.title + '</div></div></div></td>';
      html += '<td><b>' + myAdvisees.length + '</b> <span style="color:var(--muted);font-size:12px">advisee</span></td>';
      html += '<td><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;height:6px;background:var(--bg);border-radius:100px;overflow:hidden;min-width:60px"><div style="height:100%;width:' + (a.sessionsTotal>0?Math.round(a.sessionsDone/a.sessionsTotal*100):0) + '%;background:var(--green);border-radius:100px"></div></div><span style="font-size:12px;color:var(--muted);white-space:nowrap">' + a.sessionsDone + '/' + a.sessionsTotal + '</span>' + (needNote ? '<span style="background:#FEF3C7;color:#92400E;font-size:10px;font-weight:700;padding:2px 7px;border-radius:100px">Cần nhận xét</span>' : '') + '</div></td>';
      html += '<td style="font-size:13px;color:var(--muted)">' + a.email + '</td>';
      html += '<td><button class="detail-btn" onclick="navToStaffAdvisorDetail(\'' + a.id + '\')">Xem chi tiết →</button></td>';
      html += '</tr>';
    });
    html += '</tbody></table>';
  }
  html += '</div>';

  // Inactive
  if (inactive.length > 0) {
    html += '<div class="card"><div class="card-header"><div class="card-header-left">Advisor không hoạt động</div></div>';
    html += '<table class="bookings-table"><thead><tr><th>TÊN</th><th>CHỨC DANH</th><th>EMAIL</th><th></th></tr></thead><tbody>';
    inactive.forEach(function(a){
      html += '<tr><td>' + a.name + '</td><td style="color:var(--muted)">' + a.title + '</td><td style="font-size:13px;color:var(--muted)">' + a.email + '</td><td><button class="update-btn" onclick="navToStaffAdvisorDetail(\'' + a.id + '\')">Chi tiết</button></td></tr>';
    });
    html += '</tbody></table></div>';
  }
  return html;
}

function navToStaffAdvisorDetail(advisorId) {

}

  // Thống kê
  html += '<div style="padding-top:4px"><div style="font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px">Thống kê nhanh</div>';

      html += '<span style="font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap">' + ae.sessionsDone + '/' + ae.sessionsTotal + '</span></div>';
      if (needNoteAe) html += '<span style="background:#FEF3C7;color:#92400E;font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px;flex-shrink:0">Cần nhận xét</span>';
      html += '<button class="detail-btn" onclick="navToStaffAdviseeDetail(\'' + ae.id + '\',\'' + advisorId + '\')" style="flex-shrink:0">Chi tiết →</button>';
      html += '</div>';
    });
  }
  html += '</div>';
  return html;
}

function toggleAdvisorActive(advisorId) {
  var a = sheetData.advisors.find(function(x){ return x.id === advisorId; });
  if (!a) return;
  a.active = !a.active;
  apiPost({ action: 'updateAdvisor', advisor_id: advisorId, is_active: a.active }).then(function(res){
    if (res && res.success) toast((a.active ? '✅ Đã hiện trên web' : '🔕 Đã ẩn khỏi web') + ' (đã đồng bộ Sheet)', 'success');
    else { a.active = !a.active; toast('Lỗi khi lưu Sheet: ' + (res && res.error), 'error'); }
    navToStaffAdvisorDetail(advisorId);
  }).catch(function(err){
    a.active = !a.active;
    toast('Lỗi kết nối: ' + err.message, 'error');
    navToStaffAdvisorDetail(advisorId);
  });
}

function saveAdvisorEdit(advisorId) {
  var a = sheetData.advisors.find(function(x){ return x.id === advisorId; });
  if (!a) return;
  a.name    = document.getElementById('ea-name').value.trim()    || a.name;
  a.title   = document.getElementById('ea-title').value.trim()   || a.title;
  a.company = document.getElementById('ea-company').value.trim();
  a.tags    = document.getElementById('ea-tags').value.split(',').map(function(t){ return t.trim(); }).filter(Boolean);
  a.email   = document.getElementById('ea-email').value.trim()   || a.email;
  a.phone   = document.getElementById('ea-phone').value.trim()   || a.phone;
  a.contact = document.getElementById('ea-contact').value.trim();
  a.bio     = document.getElementById('ea-bio').value.trim()     || a.bio;
  a.message = document.getElementById('ea-message').value.trim() || a.message;

  a.supportItems = [];
  for (var i = 0; i < 3; i++) {
    var iconEl = document.getElementById('ea-si-icon-' + i);
    var titleEl = document.getElementById('ea-si-title-' + i);
    var descEl = document.getElementById('ea-si-desc-' + i);
    if (titleEl && titleEl.value.trim()) {
      a.supportItems.push({ icon: iconEl.value.trim() || '✦', title: titleEl.value.trim(), desc: descEl.value.trim() });
    }
  }

  a.experience = [];
  document.querySelectorAll('#ea-exp-list .ea-exp-row').forEach(function(row){
    var title = row.querySelector('.ea-exp-title').value.trim();
    if (!title) return;
    a.experience.push({
      title: title,
      company: row.querySelector('.ea-exp-company').value.trim(),
      type: row.querySelector('.ea-exp-type').value,
      location: row.querySelector('.ea-exp-location').value.trim(),
      dateRange: row.querySelector('.ea-exp-daterange').value.trim(),
      desc: row.querySelector('.ea-exp-desc').value.trim(),
    });
  });

  a.products = Array.from(document.querySelectorAll('.ea-pkg-cb:checked')).map(function(cb){ return cb.value; });

  var uncheckedFb = Array.from(document.querySelectorAll('.ea-fb-cb')).filter(function(cb){ return !cb.checked; }).map(function(cb){ return cb.value; });
  if (document.querySelector('.ea-fb-cb')) a.hiddenFeedback = uncheckedFb;

  apiPost({
    action: 'updateAdvisor',
    advisor_id: advisorId,
    name: a.name, role: a.title, company: a.company,
    industry: (a.tags||[]).join(', '),
    email: a.email, phone: a.phone, zalo_id: a.contact,
    bio: a.bio, message: a.message,
    experience: a.experience, products: a.products, feedbacks: a.feedbacks,
  }).then(function(res){
    if (res && res.success) toast('Đã lưu & đồng bộ lên Sheet ✅', 'success');
    else toast('Lỗi khi lưu lên Sheet: ' + (res && res.error), 'error');
  }).catch(function(err){ toast('Lỗi kết nối: ' + err.message, 'error'); });
  closeModal();

  if (currentUser && currentUser.role === 'Advisor' && currentUser.name === a.name) {
    // Advisor tự sửa thông tin của mình — cập nhật lại topbar rồi render lại tab hiện tại
    document.getElementById('user-name').textContent = a.name;
    document.getElementById('dropdown-name').textContent = a.name;
    document.getElementById('user-avatar').textContent = mkInitials(a.name);
    renderAdvisor(_activeRoleTab || 'overview');
  } else {
    navToStaffAdvisorDetail(advisorId);
  }
}

function openAdvisorSelfEditModal() {
  if (!currentUser) return;
  var a = sheetData.advisors.find(function(x){ return x.name === currentUser.name; });
  if (!a) { toast('Không tìm thấy hồ sơ Advisor tương ứng', 'error'); return; }
  closeUserMenu();
  openEditAdvisorModal(a.id);
}

function renderAdviseeModule() {
  var html = '';
  var pendingReschedules = MOCK.rescheduleRequests.filter(function(r){ return r.status === 'pending'; });

  // KPI
  html += '<div class="stats-row" style="margin-bottom:20px">';
  html += '<div class="stat-cell"><div class="stat-num">' + MOCK.advisees.length + '</div><div class="stat-label">Tổng advisee</div></div>';
  var needFb = MOCK.advisees.filter(function(ae){ return ae.sessions.some(function(s){ return s.status==='feedback'; }); }).length;
  var totalRevenue = MOCK.advisees.reduce(function(s,ae){ return s + ae.paid; }, 0);
  html += '<div class="stat-cell"><div class="stat-num" style="' + (pendingReschedules.length?'color:var(--brand)':'') + '">' + pendingReschedules.length + '</div><div class="stat-label">🔔 Yêu cầu đổi lịch</div></div>';
  html += '<div class="stat-cell"><div class="stat-num">' + fmtMoney(totalRevenue) + '</div><div class="stat-label">Tổng doanh thu</div></div>';
  html += '</div>';

  html += '<div class="card"><div class="card-header"><div class="card-header-left">Danh sách Advisee</div></div>';
  if (MOCK.advisees.length === 0) {
    html += '<div class="empty-state"><div class="icon">🙋</div>Chưa có advisee nào</div>';
  } else {
    html += '<table class="bookings-table"><thead><tr><th>ADVISEE</th><th>GÓI · ADVISOR</th><th>TIẾN ĐỘ</th><th>TRẠNG THÁI</th><th></th></tr></thead><tbody>';
    MOCK.advisees.forEach(function(ae) {
      var pct = Math.round(ae.sessionsDone / ae.sessionsTotal * 100);
      var hasFeedback = ae.sessions.some(function(s){ return s.status === 'feedback'; });
      var hasUpcoming = ae.sessions.some(function(s){ return s.status === 'upcoming'; });
      var hasReschedule = pendingReschedules.some(function(r){ return r.aeId === ae.id; });
      var statusTag = hasFeedback
        ? '<span style="background:#FEF3C7;color:#92400E;font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px">Cần feedback</span>'
        : hasUpcoming
          ? '<span style="background:#EFF6FF;color:#1D4ED8;font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px">Sắp tới</span>'
          : '<span style="background:var(--green-bg);color:var(--green);font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px">Hoàn thành</span>';
      if (hasReschedule) statusTag += ' <span style="background:var(--brand-light);color:var(--brand);font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px">🔔 Yêu cầu đổi lịch</span>';
      html += '<tr>';
      html += '<td><div style="display:flex;align-items:center;gap:10px">' + avatarCircle(ae.name, 34) + '<div><div style="font-weight:700">' + ae.name + '</div><div style="font-size:12px;color:var(--muted)">' + ae.email + '</div></div></div></td>';
      html += '<td><div style="font-weight:600;font-size:13px">Gói ' + ae.pkg + '</div><div style="font-size:12px;color:var(--muted)">' + ae.advisor + '</div></td>';
      html += '<td><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;height:6px;background:var(--bg);border-radius:100px;overflow:hidden;min-width:60px"><div style="height:100%;width:' + pct + '%;background:var(--green);border-radius:100px"></div></div><span style="font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap">' + ae.sessionsDone + '/' + ae.sessionsTotal + '</span></div></td>';
      html += '<td>' + statusTag + '</td>';
      html += '<td><button class="detail-btn" onclick="navToStaffAdviseeDetail(\'' + ae.id + '\',null)">Xem chi tiết →</button></td>';
      html += '</tr>';
    });
    html += '</tbody></table>';
  }
  html += '</div>';
  return html;
}

  html += '</div>';

function saveAdviseeEdit(aeId, fromAdvisorId) {
  var ae = MOCK.advisees.find(function(x){ return x.id === aeId; });
  if (!ae) return;

  var newName  = document.getElementById('eae-name').value.trim();
  var newEmail = document.getElementById('eae-email').value.trim();
  var newTotal = Number(document.getElementById('eae-total').value) || ae.sessionsTotal;
  var newDone  = Number(document.getElementById('eae-done').value);
  if (!newName || !newEmail) { toast('Vui lòng điền tên và email', 'error'); return; }
  if (newDone > newTotal) { toast('Số buổi đã dùng không thể lớn hơn tổng số buổi', 'error'); return; }

  ae.name          = newName;
  ae.email         = newEmail;
  ae.phone         = document.getElementById('eae-phone').value.trim();
  ae.contact       = document.getElementById('eae-contact').value.trim();
  ae.pkg           = document.getElementById('eae-pkg').value;
  ae.sessionsTotal = newTotal;
  ae.sessionsDone  = newDone;
  ae.paid          = Number(document.getElementById('eae-paid').value) || ae.paid;
  ae.expiry        = document.getElementById('eae-expiry').value || ae.expiry;

  toast('Đã lưu thông tin Advisee ✅', 'success');
  closeModal();
  navToStaffAdviseeDetail(aeId, fromAdvisorId || null);
}

      if (s.prepInfo.question)   body += '<div class="prep-submitted-row"><span class="prep-submitted-label">Câu hỏi</span><span class="prep-submitted-val">' + s.prepInfo.question + '</span></div>';
      if (s.prepInfo.otherLinks) body += '<div class="prep-submitted-row"><span class="prep-submitted-label">Links khác</span><span class="prep-submitted-val">' + s.prepInfo.otherLinks + '</span></div>';
      body += '</div>';
    } else {
      body += '<div class="prep-panel" style="border-radius:10px">';
      body += '<div class="prep-alert">📋 <div>Điền thông tin chuẩn bị để <strong>Advisor đọc trước buổi meeting</strong>.</div></div>';
      body += '<div class="prep-section-label">CV / Hồ sơ</div><input class="prep-input" id="m-prep-cv-' + sessionNo + '" placeholder="Link Google Drive, Notion..."/>';

    body += '<textarea class="aee-feedback-textarea" id="m-fbtext-' + sessionNo + '" rows="3" placeholder="VD: Anh giải thích rất rõ, em muốn buổi sau thực hành nhiều hơn..."></textarea>';
    body += '</div>';
  }

  // Feedback đã gửi (done)
  if (s.status === 'done' && s.feedback) {
    body += '<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:16px 0 8px">Feedback của bạn</div>';
    body += '<div style="background:#FFF7ED;border:1.5px solid #FED7AA;border-radius:10px;padding:12px 14px">';

    for (var i2=1;i2<=5;i2++) stars2 += '<span style="color:'+(i2<=s.feedback.rating?'#F59E0B':'#D1D5DB')+';font-size:16px">★</span>';

    if (s.feedback.text) body += '<div style="font-size:13px;color:var(--text);line-height:1.65">' + s.feedback.text + '</div>';
    body += '</div>';
  }

  document.getElementById('modal-body').innerHTML = body;
  var actions = '<button class="btn-secondary" onclick="closeModal()" style="width:auto;padding:10px 20px">Đóng</button>';

  if (s.status === 'feedback') actions += '<button class="login-btn" onclick="submitAdviseeFeedbackModal('+sessionNo+')" style="width:auto;padding:10px 24px;background:#C2410C">Gửi feedback & mở khoá →</button>';
  document.getElementById('modal-actions').innerHTML = actions;
  document.getElementById('modal-overlay').classList.add('open');
}

  var _bookSessionCtx = null; // { aeId, sessionNo, advisorName }
var _bookSessionSlots = {}; // { 'YYYY-MM-DD': [{slot_id, time}] }

function openBookSessionModal(aeId, sessionNo) {
  var ae = MOCK.advisees.find(function(x){ return x.id === aeId; });
  if (!ae) return;
  _bookSessionCtx = { aeId: aeId, sessionNo: sessionNo, advisorName: ae.advisor };
  _bookSessionSlots = {};

  document.getElementById('modal-title').textContent = 'Chọn giờ meeting — Buổi ' + sessionNo;
  document.getElementById('modal-body').innerHTML = skeletonRows(2);
  document.getElementById('modal-actions').innerHTML =
    '<button class="btn-secondary" onclick="closeModal()" style="width:auto;padding:10px 20px">Đóng</button>';
  document.getElementById('modal-overlay').classList.add('open');

  apiGet('getSlots', { advisor: ae.advisor, only_available: '1' }).then(function(res){
    var raw = (res && res.data) ? res.data : [];
    raw.forEach(function(s){
      var d = String(s.date || '').slice(0, 10);
      if (!d) return;
      if (!_bookSessionSlots[d]) _bookSessionSlots[d] = [];
      _bookSessionSlots[d].push({ slot_id: s.slot_id, time: s.time_start, timeEnd: s.time_end });
    });
    Object.keys(_bookSessionSlots).forEach(function(d){
      _bookSessionSlots[d].sort(function(a,b){ return a.time.localeCompare(b.time); });
    });
    renderBookSessionModalBody();
  }).catch(function(err){
    document.getElementById('modal-body').innerHTML =
      '<div class="empty-state"><div class="icon">⚠</div>Không tải được lịch trống của Advisor.<br><small style="color:var(--muted)">' + err.message + '</small></div>';
  });
}

  var dates = Object.keys(_bookSessionSlots).filter(function(d){ return _bookSessionSlots[d].length > 0; }).sort();
  var html = '<div style="font-size:13px;color:var(--muted);margin-bottom:14px">Chọn 1 khung giờ trống từ lịch của Advisor <b>' + _bookSessionCtx.advisorName + '</b>.</div>';

  if (dates.length === 0) {
    html += '<div class="empty-state"><div class="icon">📭</div>Advisor hiện chưa có giờ trống nào. Vui lòng liên hệ đội LinkaJob để được hỗ trợ xếp lịch.</div>';
  } else {
    dates.forEach(function(d){
      var dateObj = new Date(d + 'T00:00:00');
      var label = DAYS_VI[dateObj.getDay()] + ' ' + dateObj.getDate() + '/' + (dateObj.getMonth()+1) + '/' + dateObj.getFullYear();
      html += '<div style="font-size:12.5px;font-weight:700;color:var(--text);margin:14px 0 8px">' + label + '</div>';
      html += '<div style="display:flex;flex-wrap:wrap;gap:8px">';
      _bookSessionSlots[d].forEach(function(sl){
        html += '<button class="day-time-chip" onclick="confirmBookSession(\'' + d + '\',\'' + sl.time + '\',\'' + sl.slot_id + '\')">' + sl.time + '</button>';
      });
      html += '</div>';
    });
  }
  document.getElementById('modal-body').innerHTML = html;
}

function confirmBookSession(dateStr, time, slotId) {
  var ctx = _bookSessionCtx;
  var ae = MOCK.advisees.find(function(x){ return x.id === ctx.aeId; });
  if (!ae) return;

  toast('Đang đặt lịch...', '');
  apiPost({
    action: 'bookSession',
    slot_id: slotId,
    booking_id: ae.bookingId,
    session_number: ctx.sessionNo,
    advisee_name: ae.name,
  }).then(function(res){
    if (!res || !res.success) {
      toast('Lỗi: ' + (res && res.error ? res.error : 'không đặt được lịch — slot có thể vừa bị người khác chọn'), 'error');
      openBookSessionModal(ctx.aeId, ctx.sessionNo);
      return;
    }
    var s = ae.sessions.find(function(x){ return x.no === ctx.sessionNo; });
    if (s) { s.date = dateStr; s.timeStart = time; }
    toast('Đã đặt lịch buổi ' + ctx.sessionNo + ' ✅', 'success');
    closeModal();
    document.getElementById('main-content').innerHTML = renderMyBookings();
  }).catch(function(err){
    toast('Lỗi kết nối: ' + err.message, 'error');
  });
}

  // Lưu thật lên Sheet (tab AdvisorNotes) — KHÔNG public, chỉ Advisee & Staff xem được.
  apiPost({
    action: 'submitAdvisorNotes',
    session_id: notesSessionId,
    advisor_name: ae.advisor,
    advisee_name: ae.name,
    summary: summary.trim(),
    feedback: feedback.trim(),
    action_items: actionItems.trim(),

  }).catch(function(err){ toast('Đã lưu tạm — lỗi kết nối: ' + err.message, 'error'); });

    summary: summary.trim(),
    feedback: feedback.trim(),
    actionItems: actionItems.trim(),
    submittedAt: pad(now.getDate()) + '/' + pad(now.getMonth()+1) + '/' + now.getFullYear() + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes())
  };

  // Thời gian + link Meet
  body += '<div style="display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:10px;padding:12px 16px;margin-bottom:16px;flex-wrap:wrap;gap:8px">';
  body += '<div><div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px">Thời gian</div><div style="font-size:14px;font-weight:600">' + dateLabel + '</div></div>';
  body += '<div style="display:flex;gap:8px">';
  if (s.meetLink) body += '<a href="' + s.meetLink + '" target="_blank" class="detail-btn">🎥 Vào Meet</a>';
  if (s.status === 'upcoming') body += '<button class="detail-btn" onclick="closeModal();openRescheduleModal(\'' + ae.id + '\',' + sessionNo + ',\'advisor\')">🔄 Đổi giờ</button>';
  body += '</div></div>';

  // Prep info từ Advisee
  body += '<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px">Chuẩn bị của Advisee</div>';
  body += renderPrepCard(s.prepInfo);

  // Feedback của Advisee cho Advisor (nếu có)
  if (s.feedback) {
    body += '<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:14px 0 8px">Feedback của Advisee</div>';
    body += '<div style="background:#FFF7ED;border:1.5px solid #FED7AA;border-radius:10px;padding:12px 14px">';
    var stars = '';
    for (var i=1;i<=5;i++) stars += '<span style="color:' + (i<=s.feedback.rating?'#F59E0B':'#D1D5DB') + ';font-size:15px">★</span>';
    body += '<div style="margin-bottom:6px">' + stars + '</div>';
    if (s.feedback.text) body += '<div style="font-size:13px;color:var(--text);line-height:1.65">' + s.feedback.text + '</div>';
    body += '</div>';
  }

  // Advisor notes — đã có hoặc form điền mới
  body += '<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:14px 0 8px">Nhận xét của Advisor</div>';
  if (s.advisorNotes) {
    body += renderAdvisorNotesCard(s.advisorNotes, false, null, s.no);
    body += '<div style="margin-top:8px;text-align:right"><button class="anote-edit-btn" style="font-size:12px" onclick="openAdvisorNotesEdit(\'' + aeId + '\',' + sessionNo + ')">✎ Sửa nhận xét</button></div>';
  } else if (s.status === 'done' || s.status === 'feedback') {
    // Form nhận xét inline trong modal
    body += '<div style="background:#FAF5FF;border:1.5px solid #E9D5FF;border-radius:10px;padding:14px">';
    body += '<div style="font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Nội dung đã trao đổi <span style="color:var(--brand)">*</span></div>';
    body += '<textarea class="anote-input" id="an-summary-' + aeId + '-' + sessionNo + '" rows="3" placeholder="Tóm tắt nội dung chính đã thảo luận..."></textarea>';
    body += '<div style="font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 6px">Nhận xét & Góp ý <span style="color:var(--brand)">*</span></div>';
    body += '<textarea class="anote-input" id="an-feedback-' + aeId + '-' + sessionNo + '" rows="3" placeholder="Điểm mạnh, điểm cần cải thiện..."></textarea>';
    body += '<div style="font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 6px">Việc cần làm trước buổi sau</div>';
    body += '<textarea class="anote-input" id="an-actions-' + aeId + '-' + sessionNo + '" rows="2" placeholder="1. Cập nhật CV...\n2. Đọc case study..."></textarea>';
    body += '</div>';
  } else {
    body += '<div class="anote-missing">Buổi chưa diễn ra.</div>';
  }

  document.getElementById('modal-body').innerHTML = body;

  // Actions
  var actions = '<button class="btn-secondary" onclick="closeModal()" style="width:auto;padding:10px 20px">Đóng</button>';
  if (!s.advisorNotes && (s.status === 'done' || s.status === 'feedback')) {
    actions += '<button class="login-btn" onclick="submitAdvisorNotes(\'' + aeId + '\',' + sessionNo + ')" style="width:auto;padding:10px 24px;background:#7C3AED">Gửi nhận xét →</button>';
  }
  document.getElementById('modal-actions').innerHTML = actions;
  document.getElementById('modal-overlay').classList.add('open');
}


// ════════════════════════════════════════════════════════════
//  ĐỔI GIỜ MEETING — Advisor/Advisee đề xuất, Staff xác nhận
// ════════════════════════════════════════════════════════════
function openRescheduleModal(aeId, sessionNo, requestedBy) {
  var ae = MOCK.advisees.find(function(x){ return x.id === aeId; });
  if (!ae) return;
  var s = ae.sessions.find(function(x){ return x.no === sessionNo; });
  if (!s) return;

  document.getElementById('modal-title').textContent = '🔄 Đổi giờ meeting — Buổi ' + sessionNo;
  var body = '<div style="font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:14px">Điền lý do không thể tham gia và đề xuất 2 khung giờ khác. Staff sẽ xác nhận và thông báo cho ' + (requestedBy === 'advisee' ? 'Advisor' : 'Advisee') + ' qua Zalo/Email.</div>';
  body += '<div class="form-label" style="margin-bottom:6px">Lý do <span style="color:var(--brand)">*</span></div>';
  body += '<textarea class="form-textarea" id="rs-reason" rows="2" placeholder="VD: Đột xuất có việc bận trùng giờ..." style="margin-bottom:14px"></textarea>';
  body += '<div class="form-label" style="margin-bottom:6px">Đề xuất khung giờ 1 <span style="color:var(--brand)">*</span></div>';
  body += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">';
  body += '<input class="form-input" type="date" id="rs-date1"><input class="form-input" type="time" id="rs-time1">';
  body += '</div>';
  body += '<div class="form-label" style="margin-bottom:6px">Đề xuất khung giờ 2 <span style="color:var(--brand)">*</span></div>';
  body += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">';
  body += '<input class="form-input" type="date" id="rs-date2"><input class="form-input" type="time" id="rs-time2">';
  body += '</div>';

  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal-actions').innerHTML =
    '<button class="btn-secondary" onclick="closeModal()" style="width:auto;padding:10px 20px">Huỷ</button>' +
    '<button class="login-btn" onclick="submitRescheduleRequest(\'' + aeId + '\',' + sessionNo + ',\'' + requestedBy + '\')" style="width:auto;padding:10px 24px">Gửi yêu cầu đổi giờ →</button>';
  document.getElementById('modal-overlay').classList.add('open');
}

function submitRescheduleRequest(aeId, sessionNo, requestedBy) {
  var ae = MOCK.advisees.find(function(x){ return x.id === aeId; });
  if (!ae) return;
  var reason = document.getElementById('rs-reason').value.trim();
  var d1 = document.getElementById('rs-date1').value, t1 = document.getElementById('rs-time1').value;
  var d2 = document.getElementById('rs-date2').value, t2 = document.getElementById('rs-time2').value;
  if (!reason || !d1 || !t1 || !d2 || !t2) { toast('Vui lòng điền đầy đủ lý do và 2 khung giờ đề xuất', 'error'); return; }

  var now = new Date();
  MOCK.rescheduleRequests.push({
    id: 'rs' + Date.now(),
    aeId: aeId, aeName: ae.name, advisor: ae.advisor, sessionNo: sessionNo,
    requestedBy: requestedBy, // 'advisor' hoặc 'advisee'
    reason: reason,
    proposedSlots: [{date:d1,time:t1},{date:d2,time:t2}],
    status: 'pending',
    createdAt: pad(now.getDate())+'/'+pad(now.getMonth()+1)+'/'+now.getFullYear()+' '+pad(now.getHours())+':'+pad(now.getMinutes()),
  });

  toast('Đã gửi yêu cầu đổi giờ — Staff sẽ xác nhận sớm ✅', 'success');
  closeModal();
}

function renderRescheduleRequestsPage() {
  var html = pageHeader('🔔 Yêu cầu đổi lịch', 'Advisor/Advisee đề xuất đổi giờ meeting — cần Staff xác nhận');
  var pending = MOCK.rescheduleRequests.filter(function(r){ return r.status === 'pending'; });
  var resolved = MOCK.rescheduleRequests.filter(function(r){ return r.status !== 'pending'; });

  html += '<div class="card" style="margin-bottom:16px"><div class="card-header"><div class="card-header-left">Đang chờ xác nhận (' + pending.length + ')</div></div>';
  if (pending.length === 0) {
    html += '<div class="empty-state"><div class="icon">✅</div>Không có yêu cầu đổi lịch nào đang chờ</div>';
  } else {
    pending.forEach(function(r){
      var ae = MOCK.advisees.find(function(x){ return x.id === r.aeId; });
      html += '<div style="padding:16px 24px;border-top:1px solid var(--border)">';
      html += '<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">' + avatarCircle(r.aeName, 36);
      html += '<div style="flex:1"><div style="font-weight:700;font-size:14px">' + r.aeName + ' · Buổi ' + r.sessionNo + '</div>';
      html += '<div style="font-size:12px;color:var(--muted)">Advisor: ' + r.advisor + ' · Đề xuất bởi: ' + (r.requestedBy==='advisee'?'Advisee':'Advisor') + ' · ' + r.createdAt + '</div></div>';
      html += '<button class="update-btn" style="border-color:var(--brand);color:var(--brand)" onclick="rejectReschedule(\'' + r.id + '\')">Từ chối</button>';
      html += '</div>';
      html += '<div style="font-size:13px;color:var(--text);background:var(--bg);border-radius:8px;padding:10px 12px;margin-bottom:10px"><b>Lý do:</b> ' + r.reason + '</div>';
      html += '<div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Chọn 1 khung giờ để xác nhận</div>';
      html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">';
      r.proposedSlots.forEach(function(slot, si){
        html += '<button class="detail-btn" style="padding:12px" onclick="confirmReschedule(\'' + r.id + '\',' + si + ')">📅 ' + fmtDateStr(slot.date) + ' · ' + slot.time + '</button>';
      });
      html += '</div></div>';
    });
  }
  html += '</div>';

  if (resolved.length > 0) {
    html += '<div class="card"><div class="card-header"><div class="card-header-left">Đã xử lý</div></div>';
    resolved.forEach(function(r){
      var tag = r.status === 'confirmed' ? '<span class="badge badge-confirmed">✓ Đã xác nhận</span>' : '<span class="badge badge-cancelled">Đã từ chối</span>';
      html += '<div style="display:flex;align-items:center;gap:12px;padding:14px 24px;border-top:1px solid var(--border)">' + avatarCircle(r.aeName, 32);
      html += '<div style="flex:1"><div style="font-weight:600;font-size:13px">' + r.aeName + ' · Buổi ' + r.sessionNo + '</div><div style="font-size:12px;color:var(--muted)">' + r.reason + '</div></div>' + tag + '</div>';
    });
    html += '</div>';
  }
  return html;
}

function confirmReschedule(reqId, slotIdx) {
  var r = MOCK.rescheduleRequests.find(function(x){ return x.id === reqId; });
  if (!r) return;
  var ae = MOCK.advisees.find(function(x){ return x.id === r.aeId; });
  var s = ae && ae.sessions.find(function(x){ return x.no === r.sessionNo; });
  var slot = r.proposedSlots[slotIdx];
  if (s) { s.date = slot.date; s.timeStart = slot.time; }
  r.status = 'confirmed';
  toast('Đã xác nhận đổi giờ — thông báo cho Advisor & Advisee qua Zalo/Email ✅', 'success');
  navTo('aee-reschedule');
}

function rejectReschedule(reqId) {
  var r = MOCK.rescheduleRequests.find(function(x){ return x.id === reqId; });
  if (!r) return;
  r.status = 'rejected';
  toast('Đã từ chối yêu cầu — thông báo cho người đề xuất qua Zalo/Email', 'success');
  navTo('aee-reschedule');
}


function submitBooking() {
  const btn = document.getElementById('submit-booking-btn');
  const msg = document.getElementById('submit-msg');
  const data = {
    advisee_name: v('f-advisee-name'), advisee_phone: v('f-advisee-phone'),
    advisee_email: v('f-advisee-email'), advisee_year: v('f-advisee-year'),
    advisee_industry: v('f-advisee-industry'), advisee_goal: v('f-goal'),
    advisor_name: v('f-advisor-name'), advisor_email: v('f-advisor-email'),
    package_name: document.getElementById('f-package').value
  };
  if (!data.advisee_name || !data.advisee_email || !data.advisor_name) { toast('Điền đầy đủ các trường bắt buộc (*)', 'error'); return; }
  btn.innerHTML = '<span class="spinner"></span> Đang gửi...'; btn.disabled = true;
  apiPost(data).then(function(res){
    if (res && res.success) {
      toast('Booking ' + res.booking_id + ' đã tạo!', 'success');
      msg.textContent = 'ID: ' + res.booking_id;
      msg.style.color = 'var(--green)';
    } else {
      toast('Lỗi: ' + (res && res.error), 'error');
      msg.textContent = res && res.error;
      msg.style.color = 'var(--brand)';
    }
    btn.innerHTML = 'Tạo Booking &amp; Gửi Email'; btn.disabled = false;
  }).catch(function(e){
    toast('Lỗi: ' + e.message, 'error');
    msg.textContent = e.message; msg.style.color = 'var(--brand)';
    btn.innerHTML = 'Tạo Booking &amp; Gửi Email'; btn.disabled = false;
  });
}

function confirmBooking(id) {
  apiPost({ action: 'updateStatus', booking_id: id, status: 'confirmed' }).then(function(res){
    if (res && res.success) { toast('Đã xác nhận! Email & Meet link đã gửi.', 'success'); loadDashboard('Staff','all-bookings'); }
    else toast('Vào Sheet, cột Status, đổi thành confirmed.', 'error');
  }).catch(function(){ toast('Vào Sheet, cột Status, đổi thành confirmed.', 'error'); });
}

function markComplete(id) {
  apiPost({ action: 'updateStatus', booking_id: id, status: 'completed' }).then(function(res){
    if (res && res.success) { toast('Đã đánh dấu hoàn thành!', 'success'); loadDashboard('Advisor','booked'); }
    else toast('Vào Sheet, cột Status, đổi thành completed.', 'error');
  }).catch(function(){ toast('Vào Sheet, cột Status, đổi thành completed.', 'error'); });
}

function toggleSlot(btn, key) {
  if (selectedSlots.has(key)) { selectedSlots.delete(key); btn.classList.remove('selected'); }
  else { selectedSlots.add(key); btn.classList.add('selected'); }
  document.getElementById('sel-count').innerHTML = 'Đã chọn <span>' + selectedSlots.size + '</span> slot';
  document.getElementById('slot-send-btn').textContent = 'Gửi lịch trống (' + selectedSlots.size + ' slot)';
}

function sendSlots() {
  if (selectedSlots.size === 0) { toast('Chưa chọn giờ nào!', 'error'); return; }
  const btn = document.getElementById('day-send-btn');
  if (btn) { btn.innerHTML = '<span class="spinner"></span> Đang gửi...'; btn.disabled = true; }
  apiPost({ action: 'addSlots', advisor: currentUser.name, advisor_email: currentUser.email, slots: Array.from(selectedSlots) }).then(function(res){
    if (res && res.success) {
      toast('Đã gửi ' + selectedSlots.size + ' slot!', 'success');
      selectedSlots.clear();
      closeModal();
      switchRoleTab('schedule');
    } else {
      toast('Lỗi: ' + (res && res.error), 'error');
      if (btn) { btn.innerHTML = 'Gửi lịch trống đã chọn'; btn.disabled = false; }
    }
  }).catch(function(e){
    toast('Lỗi: ' + e.message, 'error');
    if (btn) { btn.innerHTML = 'Gửi lịch trống đã chọn'; btn.disabled = false; }
  });
}

function changeWeek(dir) { weekOffset += dir; loadDashboard('Advisor','schedule'); }

function showDetail(b) {
  document.getElementById('modal-title').textContent = 'Chi tiết Booking';
  let html = '<div class="modal-field"><b>Booking ID:</b> ' + (b.booking_id||'—') + '</div>';
  html += '<div class="modal-field"><b>Advisee:</b> ' + (b.advisee_name||'—') + ' · ' + (b.advisee_email||'') + '</div>';
  html += '<div class="modal-field"><b>Advisor:</b> ' + (b.advisor_name||'—') + '</div>';
  html += '<div class="modal-field"><b>Gói:</b> ' + (b.package_name||'—') + ' · ' + (b.sessions_total||0) + ' buổi</div>';
  html += '<div class="modal-field"><b>Đã dùng:</b> ' + (b.sessions_used||0) + '/' + (b.sessions_total||0) + '</div>';
  html += '<div class="modal-field"><b>Trạng thái:</b> ' + statusBadge(b.status) + '</div>';
  if (b.meet_link) html += '<div class="modal-field"><b>Meet:</b> <a href="' + b.meet_link + '" target="_blank">' + b.meet_link + '</a></div>';
  if (b.notes) html += '<div class="modal-field"><b>Ghi chú:</b> ' + b.notes + '</div>';
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal-actions').innerHTML = '<button class="login-btn" onclick="closeModal()" style="width:auto;padding:10px 24px">Đóng</button>';
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  var modalBox = document.querySelector('.modal');
  if (modalBox) modalBox.style.maxWidth = '';
  var mb = document.getElementById('modal-body');
  if (mb) { mb.style.maxHeight = ''; mb.style.overflowY = ''; }
}
document.getElementById('modal-overlay').addEventListener('click', function(e){ if (e.target.id === 'modal-overlay') closeModal(); });

const AV_COLORS = [['#D0E8FF','#2475B0'],['#FFD6D0','#C0392B'],['#D0F0E8','#1A7A5E'],['#EDE9FE','#6D28D9'],['#FEF3C7','#92400E'],['#FCE7F3','#9D174D']];
const colorCache = {};
function avatarCircle(name, size) {
  size = size || 38;
  if (!name) name = '?';
  if (!colorCache[name]) colorCache[name] = AV_COLORS[name.charCodeAt(0) % AV_COLORS.length];
  const c = colorCache[name];
  const ini = name.split(' ').filter(Boolean).map(function(w){ return w[0]; }).join('').slice(0,2).toUpperCase();
  return '<div class="av-circle" style="width:' + size + 'px;height:' + size + 'px;background:' + c[0] + ';color:' + c[1] + ';font-size:' + (size*0.33) + 'px;flex-shrink:0">' + ini + '</div>';
}

function statusBadge(s) {
  const map = {pending_payment:'badge-pending',confirmed:'badge-confirmed',completed:'badge-completed',cancelled:'badge-cancelled'};
  const lbl = {pending_payment:'Chờ thanh toán',confirmed:'Đã xác nhận',completed:'Hoàn thành',cancelled:'Đã hủy'};
  return '<span class="badge ' + (map[s]||'badge-pending') + '">' + (lbl[s]||s||'—') + '</span>';
}
function statusLabel(s) { return {pending_payment:'Chờ thanh toán',confirmed:'Đã xác nhận',completed:'Hoàn thành',cancelled:'Đã hủy'}[s] || s; }

function sessionItemHTML(b) {
  let html = '<div class="session-item">' + avatarCircle(b.advisee_name) + '<div class="session-info"><div class="session-name">' + b.advisee_name + '</div><div class="session-meta">' + (b.package_name||'') + ' · Buổi ' + (b.sessions_used||0) + '/' + (b.sessions_total||0) + '</div></div>';
  html += '<div class="session-time"><strong>' + (b.session_date?fmtDate(b.session_date):'—') + '</strong>' + (b.session_time||'') + '</div>';
  html += '<button class="detail-btn" onclick="showDetail(' + esc(b) + ')">Chi tiết</button>';
  if (b.meet_link) html += '<a href="' + b.meet_link + '" target="_blank" class="detail-btn">Meet</a>';
  html += '</div>';
  return html;
}

function skeletonRows(n) {
  let s = '<div class="card">';
  for (let i=0;i<n;i++) {
    s += '<div class="skel-row"><div class="skeleton" style="width:38px;height:38px;border-radius:50%;flex-shrink:0"></div><div style="flex:1"><div class="skeleton" style="height:14px;width:55%;margin-bottom:8px;border-radius:4px"></div><div class="skeleton" style="height:12px;width:38%;border-radius:4px"></div></div></div>';
  }
  s += '</div>';
  return s;
}

function getMondayOfWeek(date, offset) {
  offset = offset || 0;
  const d = new Date(date);
  const day = d.getDay();
  d.setDate(d.getDate() - day + (day===0?-6:1) + offset*7);
  d.setHours(0,0,0,0);
  return d;
}
function slotKey(date, time) { return date.getFullYear() + '-' + pad(date.getMonth()+1) + '-' + pad(date.getDate()) + '_' + time; }
function slotKeyFromSheetRow(s) {
  // Sheet that tra ve date dang "2026-07-01" va time_start dang "19:00"
  if (!s.date || !s.time_start) return '';
  var d = String(s.date).slice(0,10); // phong khi date la ISO datetime
  return d + '_' + s.time_start;
}
function fmtDate(d) { if (!d) return '—'; const dt = new Date(d); return DAYS_VI[dt.getDay()] + ' ' + dt.getDate() + '/' + (dt.getMonth()+1) + ' · ' + pad(dt.getHours()) + ':' + pad(dt.getMinutes()); }
function fmtShort(d) { return d.getDate() + '/' + (d.getMonth()+1); }
function pad(n) { return String(n).padStart(2,'0'); }
function v(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }
function esc(obj) { return JSON.stringify(obj).replace(/"/g, '&quot;'); }
function mkInitials(name) { return name.split(' ').filter(Boolean).map(function(w){ return w[0]; }).join('').slice(0,2).toUpperCase(); }

document.getElementById('login-password').addEventListener('keydown', function(e){ if (e.key === 'Enter') doLogin(); });
</script>
