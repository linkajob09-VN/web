    var side;
    if (!st.day) {
      side = '<div class="ljs-hint">👆 Bấm vào một ngày có giờ trống<br>để chọn giờ bắt đầu.</div>';
    } else {
      var list = (slots[st.day] || []).slice().sort(function (a, b) { return a.m - b.m; });
      var rs = rangesOf(list.map(function (x) { return x.m; }), dur);
      side = '<h4>' + esc(dayFull(st.day)) + '</h4><div class="ljs-sub">Advisor rảnh: ' + rs.map(function (r) { return str(r[0]) + '–' + str(r[1]); }).join(', ') + '</div>';
      [['Sáng', 0, 720], ['Chiều', 720, 1080], ['Tối', 1080, 1440]].forEach(function (g) {
        var part = list.filter(function (x) { return x.m >= g[1] && x.m < g[2]; });
        if (!part.length) return;
        side += '<div class="ljs-grp">' + g[0].toUpperCase() + '</div><div class="ljs-chips">' + part.map(function (x) {
          var on = o.sel && o.sel.date === st.day && o.sel.m === x.m;
          return '<button type="button" class="ljs-chip' + (on ? ' on' : '') + '" onclick="LJS.picker._time(\'' + key + '\',\'' + st.day + '\',' + x.m + ')">' + str(x.m) + '</button>';
        }).join('') + '</div>';
      });
    }
    var sum = (o.sel && o.sel.date)
      ? '<div class="ljs-sum"><span class="ck">✓</span><div>Buổi meeting: <b>' + esc(dayFull(o.sel.date)) + '</b> · <b class="t">' + str(o.sel.m) + ' – ' + str(o.sel.m + dur) + '</b> <span style="color:var(--muted,#555);font-size:12.5px">(' + dur + ' phút)</span></div></div>'
      : '';
    host.innerHTML = '<div class="ljs"><div class="ljs-pk"><div>' + cal + '</div><div><div class="ljs-side">' + side + '</div>' + sum + '</div></div>' + (o.note || '') + '</div>';
  }

  /* ═════════════════════════════ GỬI LỊCH TRỐNG ═════════════════════════════ */
  // opts: { key, advisor:{name,id,email}, actor:{email}, staffMode, onLoaded }
  var AV = {};
  function buildModel(rows, advisorName) {
    var today = ymd(new Date()), by = {};
    (rows || []).forEach(function (s) {
      if (s.advisor_name && norm(s.advisor_name) !== norm(advisorName)) return;
      var d = String(s.date || '').slice(0, 10);
      if (!d || d < today) return;
      var a = minOf(s.time_start); if (a == null) return;
      var b = minOf(s.time_end); if (b == null || b <= a) b = a + MEET; b = Math.max(b, a + MEET);
      var st = String(s.status || 'available').toLowerCase();
      var o = by[d] = by[d] || { avail: [], booked: [], free: [] };
      if (st === 'booked') o.booked.push([a, a + MEET]);
      else if (st === 'available') o.avail.push({ id: s.slot_id, a: a, b: b });
    });
    Object.keys(by).forEach(function (d) {
      var o = by[d], merged = [];
      o.booked.sort(function (x, y) { return x[0] - y[0]; });
      o.avail.slice().sort(function (x, y) { return x.a - y.a; }).forEach(function (r) {
        var last = merged[merged.length - 1];
        if (last && r.a <= last.b) { last.b = Math.max(last.b, r.b); last.ids.push(r.id); } else merged.push({ a: r.a, b: r.b, ids: [r.id] });
      });
      merged.forEach(function (m) { subtract(m.a, m.b, o.booked).forEach(function (p) { o.free.push({ a: p[0], b: p[1], ids: m.ids }); }); });
      o.free.sort(function (x, y) { return x.a - y.a; });
    });
    return by;
  }
  function who(st) { var a = st.o.advisor || {}; return { advisor_name: a.name, advisor_id: a.id || '', advisor_email: a.email || '' }; }
  function timeSelect(id, val) {
    var h = '<select class="ljs-in" id="' + id + '">';
    for (var m = 5 * 60; m <= 23 * 60 + 45; m += STEP) h += '<option value="' + str(m) + '"' + (str(m) === val ? ' selected' : '') + '>' + str(m) + '</option>';
    return h + '</select>';
  }

  var avail = {
    mount: function (host, o) {
      if (!host) return;
      injectCss();
      var key = safeKey(o.key || 'av'), st = AV[key];
      if (!st || st.o.advisor.name !== o.advisor.name) st = AV[key] = { month: ymd(new Date()).slice(0, 7), day: null, comp: null, rules: [], rows: [], loading: true };
      st.o = o; st.host = host; st.key = key;
      avail.refresh(key);
    },
    refresh: function (key) {
      var st = AV[key]; if (!st) return;
      st.loading = true; paint(st);
      var adv = st.o.advisor.name;
      Promise.all([
        global.apiGet('getSlots', { advisor: adv }).catch(function (e) { return { _err: e.message }; }),
        global.apiPost({ action: 'getAvailabilityRules', advisor_name: adv }).catch(function (e) { return { _err: e.message }; })
      ]).then(function (r) {
        var s = r[0], ru = r[1];
        st.rows = (s && s.data) || []; st.slotsErr = (s && s._err) || '';
        if (ru && ru.success) { st.rules = ru.data || []; st.rulesErr = ''; st.rulesOk = true; }
        else { st.rules = []; st.rulesOk = false; var msg = (ru && (ru.error || ru._err)) || 'không tải được'; st.rulesErr = /Unknown action/i.test(msg) ? 'Backend chưa bật tính năng lịch cố định hàng tuần (cần Availability.gs).' : msg; }
        st.loading = false; paint(st);
        if (st.o.onLoaded) { var f = st.o.onLoaded; st.o.onLoaded = null; try { f(); } catch (e) { } }
      });
    },
    _month: function (key, dir) { var st = AV[key]; if (!st) return; st.month = stepMonth(st.month, dir); paint(st); },
    _day: function (key, ds) { var st = AV[key]; if (!st) return; st.day = ds; st.comp = null; paint(st); },
    // mở form thêm / sửa. opts: {} | {rule:id} | {date, range:index} | {date}
    _open: function (key, opts) {
      var st = AV[key]; if (!st) return; opts = opts || {};
      var model = buildModel(st.rows, st.o.advisor.name), c = { mode: st.rulesOk ? 'weekly' : 'single', dows: [], date: '', from: '09:00', to: '17:00', ruleId: '', replaceIds: [], lock: false, title: 'Thêm lịch trống' };
      if (opts.rule) {
        var r = st.rules.filter(function (x) { return String(x.rule_id) === String(opts.rule); })[0]; if (!r) return;
        c.mode = 'weekly'; c.ruleId = r.rule_id; c.dows = [Number(r.dow)]; c.from = r.time_start; c.to = r.time_end; c.lock = true; c.title = 'Sửa lịch cố định · ' + DOW_FULL[r.dow - 1];
      } else if (opts.date && opts.range != null) {
        var o = model[opts.date], f = o && o.free[opts.range]; if (!f) return;
        c.mode = 'single'; c.date = opts.date; c.from = str(f.a); c.to = str(f.b); c.replaceIds = f.ids.slice(); c.lock = true; c.title = dayShort(opts.date) + ' · sửa khung giờ';
      } else {
        var d = opts.date || st.day || ymd(new Date(Date.now() + 86400000));
        c.date = d; c.dows = [dowIdx(d) + 1];
        if (opts.date) c.mode = 'single';
      }
      st.comp = c; paint(st);
      var el = st.host.querySelector('.ljs-comp'); if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    },
    _close: function (key) { var st = AV[key]; if (!st) return; st.comp = null; paint(st); },
    _mode: function (key, m) { var st = AV[key]; if (!st || !st.comp) return; keepComp(st); st.comp.mode = m; paint(st); },
    _dow: function (key, i) {
      var st = AV[key]; if (!st || !st.comp || st.comp.lock) return; keepComp(st);
      var a = st.comp.dows, k = a.indexOf(i); if (k > -1) a.splice(k, 1); else a.push(i); paint(st);
    },
    _save: function (key) { save(AV[key]); },
    _delRule: function (key, id) {
      var st = AV[key]; if (!st) return;
      var r = st.rules.filter(function (x) { return String(x.rule_id) === String(id); })[0]; if (!r) return;
      if (!global.confirm('Xoá lịch cố định ' + DOW_FULL[r.dow - 1] + ' ' + r.time_start + ' – ' + r.time_end + '?\nCác ngày sắp tới của lịch này sẽ bị gỡ. Giờ đã có advisee đặt được giữ lại.')) return;
      global.apiPost({ action: 'deleteAvailabilityRule', rule_id: id, by: actorEmail(st) }).then(function (res) {
        if (!res || !res.success) { say('Lỗi: ' + ((res && res.error) || 'không xoá được'), 'error'); return; }
        say('Đã xoá lịch cố định ✅', 'success'); avail.refresh(key);
      }).catch(function (e) { say('Lỗi kết nối: ' + e.message, 'error'); });
    },
    _delRange: function (key, ds, idx) {
      var st = AV[key]; if (!st) return;
      var f = (buildModel(st.rows, st.o.advisor.name)[ds] || { free: [] }).free[idx]; if (!f) return;
      if (!global.confirm('Xoá khung giờ ' + str(f.a) + ' – ' + str(f.b) + ' ngày ' + dayFull(ds) + '?\nGiờ đã có advisee đặt được giữ lại.')) return;
      delSlots(st, f.ids, 'Đã xoá khung giờ');
    },
    _skip: function (key, ds) {
      var st = AV[key]; if (!st) return;
      var o = buildModel(st.rows, st.o.advisor.name)[ds]; if (!o) return;
      var ids = []; o.free.forEach(function (f) { f.ids.forEach(function (id) { if (ids.indexOf(id) < 0) ids.push(id); }); });
      if (!ids.length) return;
      if (!global.confirm((st.o.staffMode ? 'Advisor nghỉ ' : 'Nghỉ ') + dayFull(ds) + '?\nCác khoảng giờ trống của ngày này sẽ bị gỡ. Giờ đã có advisee đặt được giữ lại (cần báo advisee hoặc LinkaJob để đổi giờ buổi đó).\nCác tuần khác của lịch cố định không bị ảnh hưởng.')) return;
      delSlots(st, ids, 'Đã nghỉ ' + dayShort(ds));
    }
  };
  function actorEmail(st) { return (st.o.actor && st.o.actor.email) || ''; }
  function delSlots(st, ids, okMsg) {
    global.apiPost({ action: 'deleteSlots', slot_ids: ids }).then(function (res) {
      if (!res || !res.success) { say('Lỗi: ' + ((res && res.error) || 'không xoá được'), 'error'); return; }
      say(okMsg + (res.skipped_booked ? ' (giữ lại giờ đã có người đặt)' : '') + ' ✅', 'success'); avail.refresh(st.key);
    }).catch(function (e) { say('Lỗi kết nối: ' + e.message, 'error'); });
  }
  // lưu giá trị đang gõ trong form trước khi vẽ lại
  function keepComp(st) {
    var c = st.comp; if (!c) return;
    var f = document.getElementById('ljs-' + st.key + '-from'), t = document.getElementById('ljs-' + st.key + '-to'), d = document.getElementById('ljs-' + st.key + '-date');
    if (f) c.from = f.value; if (t) c.to = t.value; if (d && !c.lock) c.date = d.value;
  }
  function busy(st, on) {
    var b = document.getElementById('ljs-' + st.key + '-save');
    if (b) { b.disabled = on; b.innerHTML = on ? 'Đang lưu...' : 'Lưu lịch'; }
  }

  function save(st) {
    var c = st && st.comp; if (!c) return;
    keepComp(st);
    var from = Math.ceil(minOf(c.from) / STEP) * STEP, to = Math.floor(minOf(c.to) / STEP) * STEP;
    if (isNaN(from) || isNaN(to)) { say('Vui lòng chọn giờ bắt đầu và kết thúc', 'error'); return; }
    if (to - from < MEET) { say('Khoảng giờ phải dài ít nhất 60 phút', 'error'); return; }
    var p = who(st), actor = actorEmail(st);

    if (c.mode === 'weekly') {
      if (!c.dows.length) { say('Chọn ít nhất 1 ngày trong tuần', 'error'); return; }
      busy(st, true);
      global.apiPost({ action: 'saveAvailabilityRule', advisor_name: p.advisor_name, advisor_id: p.advisor_id, advisor_email: p.advisor_email, days: c.dows, time_start: str(from), time_end: str(to), rule_id: c.ruleId || '', by: actor }).then(function (res) {
        if (!res || !res.success) { say('Lỗi: ' + ((res && res.error) || 'không lưu được'), 'error'); busy(st, false); return; }
        say('Đã lưu lịch cố định hàng tuần ✅', 'success'); st.comp = null; avail.refresh(st.key);
      }).catch(function (e) { say('Lỗi kết nối: ' + e.message, 'error'); busy(st, false); });
      return;
    }

    var ds = c.date;
    if (!ds) { say('Vui lòng chọn ngày', 'error'); return; }
    if (ds < ymd(new Date())) { say('Ngày phải từ hôm nay trở đi', 'error'); return; }
    var model = buildModel(st.rows, st.o.advisor.name), o = model[ds] || { free: [], booked: [] };
    var busyR = o.booked.slice();
    if (!c.replaceIds.length) o.free.forEach(function (x) { busyR.push([x.a, x.b]); });     // thêm mới: chỉ ghi phần chưa có
    var nowM = nowMinIfToday(ds);
    if (nowM >= 0) from = Math.max(from, Math.ceil((nowM + 1) / STEP) * STEP);
    var pieces = subtract(from, to, busyR);
    if (!pieces.length) { say('Khung giờ này đã có trong lịch (hoặc trùng giờ đã đặt)', 'error'); return; }
    busy(st, true);
    var groups = {};
    pieces.forEach(function (pc) { var d = pc[1] - pc[0]; (groups[d] = groups[d] || []).push(ds + '_' + str(pc[0])); });
    var durs = Object.keys(groups), i = 0;
    var addNext = function () {
      if (i >= durs.length) { say('Đã lưu khung giờ ✅', 'success'); st.comp = null; avail.refresh(st.key); return; }
      var d = durs[i++];
      global.apiPost({ action: 'addSlots', advisor: p.advisor_name, advisor_id: p.advisor_id, advisor_email: p.advisor_email, slots: groups[d], duration_minutes: Number(d), added_by: actor }).then(function (res) {
        if (!res || !res.success) { say('Lỗi: ' + ((res && res.error) || 'không gửi được'), 'error'); busy(st, false); avail.refresh(st.key); return; }
        addNext();
      }).catch(function (e) { say('Lỗi kết nối: ' + e.message, 'error'); busy(st, false); avail.refresh(st.key); });
    };
    if (c.replaceIds.length) {
      global.apiPost({ action: 'deleteSlots', slot_ids: c.replaceIds }).then(function (res) {
        if (!res || !res.success) { say('Lỗi: ' + ((res && res.error) || 'không cập nhật được'), 'error'); busy(st, false); return; }
        addNext();
      }).catch(function (e) { say('Lỗi kết nối: ' + e.message, 'error'); busy(st, false); });
    } else addNext();
  }

  function paint(st) {
    var host = st.host;
    if (!inDom(host)) { var again = host.id && document.getElementById(host.id); if (again) host = st.host = again; else return; }
    var key = st.key, o = st.o, adv = o.advisor.name;
    var title = o.staffMode ? '📅 Lịch trống của ' + esc(adv) : '📅 Lịch trống của tôi';
    var h = '<div class="ljs"><div class="ljs-card">' +
      '<div class="ljs-h"><div class="ljs-t">' + title + '</div><div class="ljs-acts">' +
      '<button type="button" class="ljs-btn sec sm" onclick="LJS.avail.refresh(\'' + key + '\')">↻ Làm mới</button>' +
      '<button type="button" class="ljs-btn" onclick="LJS.avail._open(\'' + key + '\')">+ Thêm lịch trống</button></div></div>';
    h += '<p class="ljs-p">' + (o.staffMode
      ? 'Bạn đang chỉnh lịch <b>thay Advisor</b>. Mọi thay đổi hiện ngay cho Advisee khi đặt lịch.'
      : 'Bạn chỉ cần gửi lịch <b>một lần</b> — hệ thống tự áp dụng cho các tuần tiếp theo. Khi bận, hãy <b>nghỉ ngày đó</b> hoặc sửa giờ ngay trên lịch.') +
      ' Mỗi buổi meeting dài 60 phút.</p>';
    if (st.loading && !st.rows.length) { host.innerHTML = h + '<div class="ljs-empty">Đang tải lịch…</div></div></div>'; return; }
    if (st.slotsErr) h += '<div class="ljs-warn">⚠ Không tải được lịch trống: ' + esc(st.slotsErr) + '</div>';

    var model = buildModel(st.rows, adv), dates = Object.keys(model);
    var nFree = 0, nBooked = 0;
    dates.forEach(function (d) { nFree += model[d].free.length; nBooked += model[d].booked.length; });
    h += '<div class="ljs-stats"><span class="ljs-tag ljs-free" style="font-size:12px;padding:4px 10px">🟢 ' + nFree + ' khung giờ trống sắp tới</span>' +
      '<span class="ljs-tag ljs-booked" style="font-size:12px;padding:4px 10px">🟡 ' + nBooked + ' buổi đã được đặt</span></div>';

    // 1) lịch cố định hàng tuần
    h += '<div class="ljs-sec">🔁 Lịch cố định hàng tuần</div>';
    if (st.rulesErr) h += '<div class="ljs-warn">⚠ ' + esc(st.rulesErr) + '</div>';
    if (st.rulesOk && !st.rules.length) h += '<div class="ljs-empty">Chưa có lịch cố định. Bấm <b>+ Thêm lịch trống</b> → “Lặp lại hàng tuần” để chọn các thứ trong tuần và khoảng giờ rảnh.</div>';
    if (st.rules.length) {
      h += '<div class="ljs-rules">' + st.rules.slice().sort(function (a, b) { return a.dow - b.dow || String(a.time_start).localeCompare(String(b.time_start)); }).map(function (r) {
        return '<span class="ljs-rl">' + DOW_FULL[r.dow - 1] + ' · ' + esc(r.time_start) + '–' + esc(r.time_end) +
          '<span><button type="button" title="Sửa" onclick="LJS.avail._open(\'' + key + '\',{rule:\'' + esc(r.rule_id) + '\'})">✎</button>' +
          '<button type="button" title="Xoá" onclick="LJS.avail._delRule(\'' + key + '\',\'' + esc(r.rule_id) + '\')">🗑</button></span></span>';
      }).join('') + '</div><div class="ljs-lb">Tự áp dụng cho các tuần tiếp theo (luôn giữ sẵn 8 tuần phía trước).</div>';
    }
    h += '<hr class="ljs-hr">';

    // 2) lịch tháng
    h += '<div class="ljs-sec">🗓 Lịch theo ngày <span style="font-weight:400;color:var(--muted,#555)">— bấm vào một ngày để xem, sửa hoặc nghỉ</span></div>';
    h += calHtml({
      month: st.month, selected: st.day,
      nav: function (d) { return "LJS.avail._month('" + key + "'," + d + ")"; },
      day: function (ds) { return "LJS.avail._day('" + key + "','" + ds + "')"; },
      cell: function (ds) {
        var m = model[ds], past = ds < ymd(new Date());
        var html = '';
        if (m && m.free.length) html += '<span class="ljs-pill ljs-free">' + rangeText(m.free.map(function (f) { return [f.a, f.b]; })) + '</span>';
        if (m && m.booked.length) html += '<span class="ljs-pill ljs-booked">' + m.booked.length + ' đã đặt</span>';
        return { enabled: !past, html: html };
      }
    });
    h += '<div class="ljs-legend"><span><i style="background:#10B981"></i>Giờ trống</span><span><i style="background:#F59E0B"></i>Đã có người đặt</span><span><i style="background:var(--brand,#F4451A)"></i>Hôm nay</span></div>';

    // 3) form thêm/sửa hoặc panel ngày
    if (st.comp) h += compHtml(st);
    else if (st.day) h += dayHtml(st, model);
    h += '</div></div>';
    host.innerHTML = h;
  }

  function dayHtml(st, model) {
    var key = st.key, ds = st.day, o = model[ds] || { free: [], booked: [] };
    var h = '<div class="ljs-day"><div class="ljs-h" style="margin-bottom:10px"><div class="ljs-t" style="font-size:15px">' + esc(dayFull(ds)) + '</div><div class="ljs-acts">' +
      '<button type="button" class="ljs-btn sec sm" onclick="LJS.avail._open(\'' + key + '\',{date:\'' + ds + '\'})">+ Thêm giờ ngày này</button>' +
      (o.free.length ? '<button type="button" class="ljs-btn sec sm danger" onclick="LJS.avail._skip(\'' + key + '\',\'' + ds + '\')">' + (st.o.staffMode ? '🚫 Advisor nghỉ ngày này' : '🚫 Nghỉ ngày này') + '</button>' : '') + '</div></div>';
    if (!o.free.length && !o.booked.length) h += '<div class="ljs-empty">Chưa có khung giờ nào cho ngày này.</div>';
    o.free.forEach(function (f, i) {
      h += '<div class="ljs-row"><span><span class="ljs-tag ljs-free" style="font-size:12.5px;padding:4px 10px">🕐 ' + str(f.a) + ' – ' + str(f.b) + '</span> <span style="font-weight:400;color:var(--muted,#555);font-size:12.5px;margin-left:6px">Trống</span></span>' +
        '<span class="ljs-acts"><button type="button" class="ljs-btn sec sm" onclick="LJS.avail._open(\'' + key + '\',{date:\'' + ds + '\',range:' + i + '})">✎ Sửa giờ</button>' +
        '<button type="button" class="ljs-btn sec sm danger" onclick="LJS.avail._delRange(\'' + key + '\',\'' + ds + '\',' + i + ')">🗑 Xoá</button></span></div>';
    });
    o.booked.forEach(function (b) { h += '<div class="ljs-row bk"><span>🔒 ' + str(b[0]) + ' – ' + str(b[1]) + ' · Đã có Advisee đặt</span></div>'; });
    return h + '</div>';
  }

  function compHtml(st) {
    var key = st.key, c = st.comp, id = 'ljs-' + key;
    var h = '<div class="ljs-comp"><div class="ljs-t" style="font-size:15px;margin-bottom:10px">' + esc(c.title) + '</div>';
    if (!c.lock) {
      h += '<div class="ljs-seg"><button type="button" class="' + (c.mode === 'weekly' ? 'on' : '') + '"' + (st.rulesOk ? '' : ' disabled style="opacity:.5;cursor:not-allowed"') + ' onclick="LJS.avail._mode(\'' + key + '\',\'weekly\')">🔁 Lặp lại hàng tuần</button>' +
        '<button type="button" class="' + (c.mode === 'single' ? 'on' : '') + '" onclick="LJS.avail._mode(\'' + key + '\',\'single\')">Chỉ một ngày</button></div>';
    }
    if (c.mode === 'weekly') {
      h += '<div class="ljs-lb">Các ngày rảnh trong tuần <span style="color:var(--brand,#F4451A)">*</span></div><div class="ljs-dows">';
      for (var i = 1; i <= 7; i++) h += '<button type="button" class="ljs-dow' + (c.dows.indexOf(i) > -1 ? ' on' : '') + '"' + (c.lock ? ' disabled' : '') + ' onclick="LJS.avail._dow(\'' + key + '\',' + i + ')">' + DOW_SHORT[i - 1] + '</button>';
      h += '</div>';
    } else {
      h += '<div class="ljs-fields"><div><div class="ljs-lb">Ngày <span style="color:var(--brand,#F4451A)">*</span></div><input class="ljs-in" type="date" id="' + id + '-date" value="' + esc(c.date) + '" min="' + ymd(new Date()) + '"' + (c.lock ? ' disabled' : '') + '></div></div>';
    }
    h += '<div class="ljs-fields"><div><div class="ljs-lb">Rảnh từ</div>' + timeSelect(id + '-from', c.from) + '</div><div><div class="ljs-lb">Đến</div>' + timeSelect(id + '-to', c.to) + '</div></div>';
    h += '<div class="ljs-lb" style="line-height:1.6;margin-top:8px">Tối thiểu 60 phút. VD rảnh 09:00 – 17:00 thì Advisee đặt được mọi giờ bắt đầu từ 09:00 đến 16:00 (kể cả 09:30, 10:15…).' +
      (c.mode === 'weekly' ? '<br>Lịch cố định tự áp dụng cho các tuần tiếp theo, không cần gửi lại.' : '') + '</div>';
    h += '<div class="ljs-foot"><button type="button" class="ljs-btn sec" onclick="LJS.avail._close(\'' + key + '\')">Đóng</button>' +
      '<button type="button" class="ljs-btn" id="' + id + '-save" onclick="LJS.avail._save(\'' + key + '\')">Lưu lịch</button></div></div>';
    return h;
  }

  global.LJS = { picker: picker, avail: avail, util: { rangesOf: rangesOf, str: str, minOf: minOf, dayFull: dayFull, ymd: ymd, esc: esc, injectCss: injectCss }, version: '1.0' };
})(window);
</script>
</body>
</html>
