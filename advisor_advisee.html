function saveAdvisorEdit(advisorId) {
  var a = sheetData.advisors.find(function(x){ return x.id === advisorId; });
  if (!a) return;
  a.name    = document.getElementById('ea-name').value.trim()    || a.name;
  a.title   = document.getElementById('ea-title').value.trim()   || a.title;
  a.company = document.getElementById('ea-company').value.trim();
  a.tags    = document.getElementById('ea-tags').value.split(',').map(function(t){ return t.trim(); }).filter(Boolean);
  a.email   = document.getElementById('ea-email').value.trim()   || a.email;
  a.phone   = document.getElementById('ea-phone').value.trim()   || a.phone;
  a.contact = document.getElementById('ea-contact').value.trim();
  a.bio     = document.getElementById('ea-bio').value.trim()     || a.bio;
  a.message = document.getElementById('ea-message').value.trim() || a.message;

  a.supportItems = [];
  for (var i = 0; i < 3; i++) {
    var iconEl = document.getElementById('ea-si-icon-' + i);
    var titleEl = document.getElementById('ea-si-title-' + i);
    var descEl = document.getElementById('ea-si-desc-' + i);
    if (titleEl && titleEl.value.trim()) {
      a.supportItems.push({ icon: iconEl.value.trim() || '✦', title: titleEl.value.trim(), desc: descEl.value.trim() });
    }
  }

  a.experience = [];
  document.querySelectorAll('#ea-exp-list .ea-exp-row').forEach(function(row){
    var title = row.querySelector('.ea-exp-title').value.trim();
    if (!title) return;
    a.experience.push({
      title: title,
      company: row.querySelector('.ea-exp-company').value.trim(),
      type: row.querySelector('.ea-exp-type').value,
      location: row.querySelector('.ea-exp-location').value.trim(),
      dateRange: row.querySelector('.ea-exp-daterange').value.trim(),
      desc: row.querySelector('.ea-exp-desc').value.trim(),
    });
  });

  a.products = Array.from(document.querySelectorAll('.ea-pkg-cb:checked')).map(function(cb){ return cb.value; });

  var uncheckedFb = Array.from(document.querySelectorAll('.ea-fb-cb')).filter(function(cb){ return !cb.checked; }).map(function(cb){ return cb.value; });
  if (document.querySelector('.ea-fb-cb')) a.hiddenFeedback = uncheckedFb;

  apiPost({
    action: 'updateAdvisor',
    advisor_id: advisorId,
    name: a.name, role: a.title, company: a.company,
    industry: (a.tags||[]).join(', '),
    email: a.email, phone: a.phone, zalo_id: a.contact,
    bio: a.bio, message: a.message,
    experience: a.experience, products: a.products, feedbacks: a.feedbacks,
  }).then(function(res){
    if (res && res.success) toast('Đã lưu & đồng bộ lên Sheet ✅', 'success');
    else toast('Lỗi khi lưu lên Sheet: ' + (res && res.error), 'error');
  }).catch(function(err){ toast('Lỗi kết nối: ' + err.message, 'error'); });
  closeModal();

  if (currentUser && currentUser.role === 'Advisor' && currentUser.name === a.name) {
    // Advisor tự sửa thông tin của mình — cập nhật lại topbar rồi render lại tab hiện tại
    document.getElementById('user-name').textContent = a.name;
    document.getElementById('dropdown-name').textContent = a.name;
    document.getElementById('user-avatar').textContent = mkInitials(a.name);
    renderAdvisor(_activeRoleTab || 'overview');
  } else {
    navToStaffAdvisorDetail(advisorId);
  }
}

function openAdvisorSelfEditModal() {
  if (!currentUser) return;
  closeUserMenu();
  // sheetData.advisors chỉ được nạp ở trang Staff — Advisor tự đăng nhập thì phải nạp trước khi mở form
  function findMe() {
    return sheetData.advisors.find(function(x){
      return (currentUser.advisorId && x.id === currentUser.advisorId) ||
             normName(x.name) === normName(currentUser.name) ||
             (x.email && normName(x.email) === normName(currentUser.email));
    });
  }
  var a = findMe();
  if (a) { openEditAdvisorModal(a.id); return; }
  toast('Đang tải hồ sơ...', '');
  loadAdvisorsFromSheet(function(){
    var b = findMe();
    if (!b) { toast('Không tìm thấy hồ sơ Advisor tương ứng', 'error'); return; }
    openEditAdvisorModal(b.id);
  });
}

  var totalRevenue = MOCK.advisees.reduce(function(s,ae){ return s + ae.paid; }, 0);
  html += '<div class="stat-cell"><div class="stat-num" style="' + (pendingReschedules.length?'color:var(--brand)':'') + '">' + pendingReschedules.length + '</div><div class="stat-label">🔔 Yêu cầu đổi lịch</div></div>';
  html += '<div class="stat-cell"><div class="stat-num">' + fmtMoney(totalRevenue) + '</div><div class="stat-label">Tổng doanh thu</div></div>';
  html += '</div>';

  html += '<div class="card"><div class="card-header"><div class="card-header-left">Danh sách Advisee</div></div>';
  if (MOCK.advisees.length === 0) {
    html += '<div class="empty-state"><div class="icon">🙋</div>Chưa có advisee nào</div>';
  } else {
    html += '<table class="bookings-table"><thead><tr><th>ADVISEE</th><th>GÓI · ADVISOR</th><th>TIẾN ĐỘ</th><th>TRẠNG THÁI</th><th></th></tr></thead><tbody>';
    MOCK.advisees.forEach(function(ae) {
      var pct = Math.round(ae.sessionsDone / ae.sessionsTotal * 100);
      var hasFeedback = ae.sessions.some(function(s){ return s.status === 'feedback'; });
      var hasUpcoming = ae.sessions.some(function(s){ return s.status === 'upcoming'; });
      var hasReschedule = pendingReschedules.some(function(r){ return r.aeId === ae.id; });
      var statusTag = hasFeedback
        ? '<span style="background:#FEF3C7;color:#92400E;font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px">Cần feedback</span>'

          : '<span style="background:var(--green-bg);color:var(--green);font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px">Hoàn thành</span>';
      if (hasReschedule) statusTag += ' <span style="background:var(--brand-light);color:var(--brand);font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px">🔔 Yêu cầu đổi lịch</span>';
      html += '<tr>';
      html += '<td><div style="display:flex;align-items:center;gap:10px">' + avatarCircle(ae.name, 34) + '<div><div style="font-weight:700">' + ae.name + '</div><div style="font-size:12px;color:var(--muted)">' + ae.email + '</div></div></div></td>';
      html += '<td><div style="font-weight:600;font-size:13px">Gói ' + ae.pkg + '</div><div style="font-size:12px;color:var(--muted)">' + ae.advisor + '</div></td>';

      html += '</tr>';
    });
    html += '</tbody></table>';
  }
  html += '</div>';
  return html;
}

  document.getElementById('eae-pkg').addEventListener('change', function(e){

function saveAdviseeEdit(aeId, fromAdvisorId) {
  var ae = MOCK.advisees.find(function(x){ return x.id === aeId; });
  if (!ae) return;

  var newName  = document.getElementById('eae-name').value.trim();
  var newEmail = document.getElementById('eae-email').value.trim();
  var newTotal = Number(document.getElementById('eae-total').value) || ae.sessionsTotal;
  var newDone  = Number(document.getElementById('eae-done').value);
  if (!newName || !newEmail) { toast('Vui lòng điền tên và email', 'error'); return; }
  if (newDone > newTotal) { toast('Số buổi đã dùng không thể lớn hơn tổng số buổi', 'error'); return; }

  ae.name          = newName;
  ae.email         = newEmail;
  ae.phone         = document.getElementById('eae-phone').value.trim();
  ae.contact       = document.getElementById('eae-contact').value.trim();
  ae.pkg           = document.getElementById('eae-pkg').value;
  ae.sessionsTotal = newTotal;
  ae.sessionsDone  = newDone;
  ae.paid          = Number(document.getElementById('eae-paid').value) || ae.paid;
  ae.expiry        = document.getElementById('eae-expiry').value || ae.expiry;

  toast('Đã lưu thông tin Advisee ✅', 'success');
  closeModal();
  navToStaffAdviseeDetail(aeId, fromAdvisorId || null);
}

  if (!isCp) html += '<div style="border:1.5px solid var(--border);border-radius:12px;padding:16px 18px;cursor:pointer;transition:border-color .15s" onmouseover="this.style.borderColor=\"var(--brand)\"" onmouseout="this.style.borderColor=\"var(--border)\"" onclick="openExtendModal(\'' + ae.id + '\')">' + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="font-size:18px">📅</span><div style="font-size:14px;font-weight:700">Gia hạn thời gian</div></div><div style="font-size:12.5px;color:var(--muted);margin-bottom:8px">Chọn số tuần cần thêm</div><div style="font-size:13px;font-weight:700;color:var(--brand)">100.000đ / tuần</div></div>';
  if (!(isCp && !ae.advisor)) html += ae.advisorUnlimited ? ('<div style="border:1.5px solid var(--brand);border-radius:12px;padding:16px 18px;cursor:pointer;transition:border-color .15s;background:var(--brand-light)" onclick="openPickAdvisorModal(\'' + ae.id + '\')">' + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="font-size:18px">🔄</span><div style="font-size:14px;font-weight:700">' + (ae.advisor ? 'Đổi advisor' : 'Chọn advisor') + '</div></div><div style="font-size:12.5px;color:var(--muted);margin-bottom:8px">Không giới hạn, đổi bất cứ lúc nào</div><div style="font-size:13px;font-weight:700;color:var(--brand)">Miễn phí</div></div>') : ('<div style="border:1.5px solid var(--border);border-radius:12px;padding:16px 18px;cursor:pointer;transition:border-color .15s" onmouseover="this.style.borderColor=\"var(--brand)\"" onmouseout="this.style.borderColor=\"var(--border)\"" onclick="openSwitchAdvisorModal(\'' + ae.id + '\')">' + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="font-size:18px">🔄</span><div style="font-size:14px;font-weight:700">Meet advisor khác</div></div><div style="font-size:12.5px;color:var(--muted);margin-bottom:8px">Đổi sang advisor mới, 1 lần</div><div style="font-size:13px;font-weight:700;color:var(--brand)">100.000đ</div></div>');
  if (!isCp) html += '<div style="border:1.5px solid var(--border);border-radius:12px;padding:16px 18px;cursor:pointer;transition:border-color .15s" onmouseover="this.style.borderColor=\"var(--brand)\"" onmouseout="this.style.borderColor=\"var(--border)\"" onclick="openUpgradePackageModal(\'' + ae.id + '\')">' + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="font-size:18px">⬆</span><div style="font-size:14px;font-weight:700">Nâng cấp gói</div></div><div style="font-size:12.5px;color:var(--muted);margin-bottom:8px">Giữ nguyên buổi/thời gian đã dùng</div><div style="font-size:13px;font-weight:700;color:var(--brand)">Chỉ trả chênh lệch</div></div>';
  html += '</div></div>';

  // Compact session list
  html += '<div class="card"><div class="card-header"><div class="card-header-left">Các buổi meeting</div></div>';
  ae.sessions.forEach(function(s) {
    var pd = safeParseYMD(s.date);
    var dateLabel = pd.valid ? (pd.dow + ' ' + pd.dd + '/' + pd.mm + '/' + pd.dateObj.getFullYear() + ' · ' + s.timeStart + (s.timeEnd ? '–' + s.timeEnd : '')) : 'Chưa xếp lịch';
    var statusCfg = { done:{bg:'var(--green-bg)',color:'var(--green)',label:'✓ Hoàn thành'}, feedback:{bg:'#FFF7ED',color:'#C2410C',label:'Cần feedback'}, upcoming:{bg:'#EFF6FF',color:'#1D4ED8',label:'Sắp tới'}, locked:{bg:'var(--bg)',color:'var(--muted)',label:'Đã khoá'} };
    var sc = statusCfg[s.status] || statusCfg.locked;
    var extraTag = '';
    if (s.status === 'upcoming' && !s.date) extraTag = '<span style="background:#DBEAFE;color:#1D4ED8;font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px">⏰ Cần chọn giờ meeting</span>';
    if (s.status === 'upcoming' && !s.prepInfo) extraTag = '<span style="background:#DBEAFE;color:#1D4ED8;font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px">Chưa gửi chuẩn bị</span>';
    if (s.status === 'feedback') extraTag = '<span style="background:#FEF3C7;color:#92400E;font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px">Cần feedback</span>';
    if (s.status === 'done' && !s.advisorNotes) extraTag = '<span style="font-size:11px;color:var(--muted);font-style:italic">⏳ Chờ nhận xét</span>';
    var indBg    = s.status==='done'?'var(--green-bg)':s.status==='upcoming'?'#EFF6FF':s.status==='feedback'?'#FFF7ED':'var(--bg)';
    var indColor = s.status==='done'?'var(--green)':s.status==='upcoming'?'#1D4ED8':s.status==='feedback'?'#C2410C':'var(--muted)';
    html += '<div style="display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;padding:14px 24px;border-top:1px solid var(--border)">';
    html += '<div style="width:32px;height:32px;border-radius:50%;background:'+indBg+';color:'+indColor+';display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0">'+(s.status==='done'?'✓':String(s.no))+'</div>';
    html += '<div style="flex:1;min-width:120px"><div style="font-weight:600;font-size:14px">Buổi ' + s.no + '</div><div style="font-size:12px;color:var(--muted);margin-top:2px">' + dateLabel + '</div></div>';
    html += '<span style="background:'+sc.bg+';color:'+sc.color+';font-size:12px;font-weight:700;padding:4px 12px;border-radius:100px">'+sc.label+'</span>';
    if (extraTag) html += extraTag;
    if (s.meetLink && s.status !== 'locked') html += '<a href="'+s.meetLink+'" target="_blank" class="detail-btn" style="font-size:12px;padding:6px 12px">🎥 Meet</a>';
    if (s.status === 'upcoming' && !s.date) html += '<button class="login-btn" onclick="openBookSessionModal(\'' + ae.id + '\',' + s.no + ')" style="width:auto;font-size:12px;padding:6px 14px">🗓 Đặt lịch</button>';
    if (s.status !== 'locked') html += '<button class="detail-btn" onclick="openAdviseeSessionModal('+s.no+')" style="font-size:12px;padding:6px 12px">Chi tiết</button>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}


// ═════════════════════════════════════════════════════════════
//  CHI TIẾT BUỔI MEETING — 1 cách biểu đạt chung cho Staff / Advisor / Advisee
//  Thông tin: 1 Loại · 2 Advisor · 3 Advisee · 4 Thời gian · 5 Trạng thái · 6 Meet
//  Nội dung : 7 Chuẩn bị của Advisee (xanh dương) · 8 Feedback của Advisee (xanh lá) · 9 Feedback của Advisor (tím)
// ═════════════════════════════════════════════════════════════
var MD_TONES_ = {
  blue:   { bg:'#F0F9FF', bd:'#BAE6FD', fg:'#0369A1' },
  green:  { bg:'#F0FDF4', bd:'#BBF7D0', fg:'#15803D' },
  purple: { bg:'#FAF5FF', bd:'#E9D5FF', fg:'#7C3AED' }
};
function mdStatus_(key) {
  var m = { done:['Đã hoàn thành','var(--green)'], feedback:['Đã diễn ra · chờ feedback','#C2410C'], upcoming:['Sắp tới','#1D4ED8'],
            locked:['Chưa mở khoá','var(--muted)'], cancelled:['Đã huỷ','#B91C1C'] }[key] || ['—','var(--muted)'];
  return '<span style="color:' + m[1] + ';font-weight:700">' + m[0] + '</span>';
}
function mdMeet_(url) {
  if (!url) return '<span style="color:var(--muted)">—</span>';
  var shown = String(url).replace(/^https?:\/\//, '').replace(/\/$/, '');
  return '<a href="' + escHtml(url) + '" target="_blank" rel="noopener">🎥 ' + escHtml(shown) + ' ↗</a>';
}
function escHtml(v) {
  return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// Advisor của 1 buổi = advisor tại thời điểm buổi đó được đặt/diễn ra (s.advisor, lưu ở tab Sessions).
// Không dùng ae.advisor (advisor HIỆN TẠI của gói) vì advisee có thể đã đổi advisor sau buổi này.
function sessionAdvisorName_(ae, s) { return (s && s.advisor) || (ae && ae.advisor) || ''; }
function mdAdvisorOf_(ae, s) {
  return escHtml(sessionAdvisorName_(ae, s));
}
// o: { type, advisor, advisee, time, timeAction, status, meet, extra:[[label, html]] } — tất cả là HTML đã escape
function mdInfo_(o) {
  var dash = '<span style="color:var(--muted)">—</span>';
  var rows = [
    ['Loại',       o.type    || dash],
    ['Advisor',    o.advisor || dash],
    ['Advisee',    o.advisee || dash],
    ['Thời gian',  (o.time || dash) + (o.timeAction ? '<span class="md-act">' + o.timeAction + '</span>' : '')],
    ['Trạng thái', o.status  || dash],
    ['Meet',       o.meet    || dash]
  ].concat(o.extra || []);
  return '<div class="md-info">' + rows.map(function (r) {
    return '<div class="md-l">' + r[0] + '</div><div class="md-v">' + r[1] + '</div>';
  }).join('') + '</div>';
}
// tone: 'blue' | 'green' | 'purple'. meta: chữ nhỏ bên phải tiêu đề (vd "Gửi lúc ...")
function mdPanel_(tone, title, inner, meta) {
  var t = MD_TONES_[tone];
  return '<div class="md-panel" style="--md-bg:' + t.bg + ';--md-bd:' + t.bd + ';--md-fg:' + t.fg + '">' +
    '<div class="md-panel-h"><div class="md-panel-t">' + title + '</div>' + (meta ? '<div class="md-panel-m">' + meta + '</div>' : '') + '</div>' + inner + '</div>';
}
function mdRows_(rows) {   // [[label, html]] — bỏ dòng rỗng
  return rows.filter(function (r) { return r[1]; }).map(function (r) {
    return '<div class="md-row"><div class="md-row-l">' + r[0] + '</div><div class="md-row-v">' + r[1] + '</div></div>';
  }).join('');
}
function mdEmpty_(text) { return '<div class="md-empty">' + text + '</div>'; }
function mdStars_(n) {
  n = Math.max(0, Math.min(5, Number(n) || 0));
  return '<div style="color:#F59E0B;font-size:16px;margin-bottom:6px">' + '★'.repeat(n) + '<span style="color:#D1D5DB">' + '☆'.repeat(5 - n) + '</span> <span style="font-size:12px;color:var(--muted)">(' + n + '/5)</span></div>';
}

function openAdviseeSessionModal(sessionNo) {
  var ae = MOCK.advisees.find(function(x){ return x.name === currentUser.name || x.email === currentUser.email; });
  if (!ae) return;
  var s = ae.sessions.find(function(x){ return x.no === sessionNo; });
  if (!s) return;
  commitRoute({ tab: 'my-bookings', s: sessionNo });
  var pd = safeParseYMD(s.date);
  var dateLabel = pd.valid ? (pd.dow + ' ' + pd.dd + '/' + pd.mm + '/' + pd.dateObj.getFullYear() + ' · ' + s.timeStart + (s.timeEnd ? '–' + s.timeEnd : '')) : 'Chưa xếp lịch';
  document.getElementById('modal-title').textContent = 'Buổi ' + sessionNo;
  var body = '';

  var _mdHead = body; body = '';
  if (s.status === 'upcoming' && !s.date) {
    body += '<button class="detail-btn" onclick="closeModal();openBookSessionModal(\'' + ae.id + '\',' + sessionNo + ')">🗓 Chọn giờ meeting</button>';
  } else if (s.status === 'upcoming' && s.date) {
    body += '<button class="detail-btn" onclick="closeModal();openRescheduleModal(\'' + ae.id + '\',' + sessionNo + ',\'advisee\')">🔄 Đổi giờ</button>';
  }
  var _mdAct = body;
  body = _mdHead + mdInfo_({ type: escHtml(ae.pkg || 'Cố vấn 1-1') + ' · buổi ' + sessionNo, advisor: mdAdvisorOf_(ae, s), advisee: escHtml(ae.name || ''), time: escHtml(dateLabel), timeAction: _mdAct, status: mdStatus_(s.status), meet: mdMeet_(s.meetLink) });

  // Chuẩn bị của Advisee (xanh dương)
  var _mdKeep = body; body = '';
  if (s.status === 'upcoming') {
    if (s.prepInfo) {
      body += '<div class="prep-panel-submitted">';
      body += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"><div style="font-size:12px;font-weight:700;color:#0369A1">✅ Đã gửi</div><button class="prep-edit-btn" onclick="closeModal();openPrepFormModal(' + sessionNo + ')">✎ Sửa</button></div>';
      if (s.prepInfo.cvLink)     body += '<div class="prep-submitted-row"><span class="prep-submitted-label">CV / Hồ sơ</span><span class="prep-submitted-val"><a href="' + s.prepInfo.cvLink + '" target="_blank">' + s.prepInfo.cvLink + '</a></span></div>';
      if (s.prepInfo.question)   body += '<div class="prep-submitted-row"><span class="prep-submitted-label">Câu hỏi</span><span class="prep-submitted-val">' + s.prepInfo.question + '</span></div>';
      if (s.prepInfo.otherLinks) body += '<div class="prep-submitted-row"><span class="prep-submitted-label">Links khác</span><span class="prep-submitted-val">' + s.prepInfo.otherLinks + '</span></div>';
      body += '</div>';
    } else {
      body += '<div class="prep-panel" style="border-radius:10px">';
      body += '<div class="prep-alert">📋 <div>Điền thông tin chuẩn bị để <strong>Advisor đọc trước buổi meeting</strong>.</div></div>';
      body += '<div class="prep-section-label">CV / Hồ sơ</div><input class="prep-input" id="m-prep-cv-' + sessionNo + '" placeholder="Link Google Drive, Notion..."/>';
      body += '<div class="prep-section-label">Câu hỏi cho Advisor <span style="color:var(--brand)">*</span></div><textarea class="prep-textarea" id="m-prep-q-' + sessionNo + '" rows="3" placeholder="VD: Em muốn hỏi về cách xây dựng portfolio..."></textarea>';
      body += '<div class="prep-section-label">Links khác</div><input class="prep-input" id="m-prep-links-' + sessionNo + '" placeholder="Portfolio, JD, kết quả test..."/>';
      body += '</div>';
    }
  } else {
    body += s.prepInfo ? renderPrepCard(s.prepInfo) : '<div class="prep-missing">Không có thông tin chuẩn bị.</div>';
  }

  var _secPrep = body; body = _mdKeep;

  // Feedback của Advisor (tím)
  var _secAdvFb = (s.status === 'done' || s.status === 'feedback') ? renderAdvisorNotesCard(s.advisorNotes, false, null, sessionNo) : '';

  // Feedback của Advisee (xanh lá)
  var _mdKeep2 = body; body = '';

  // Feedback form (status === feedback)
  if (s.status === 'feedback') {
    if (!adviseeStarState[sessionNo]) adviseeStarState[sessionNo] = { selected:0, hover:0 };
    var st = adviseeStarState[sessionNo];
    body += '<div>';
    body += '<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Đánh giá</div>';
    body += '<div id="m-stars-' + sessionNo + '" style="display:flex;gap:6px;margin-bottom:12px">';
    for (var star = 1; star <= 5; star++) {
      var isActive = star <= (st.hover || st.selected);
      body += '<span style="font-size:28px;cursor:pointer;color:' + (isActive?'#F59E0B':'#D1D5DB') + ';line-height:1" onmouseover="aeeHoverStarModal('+sessionNo+','+star+')" onmouseout="aeeHoverStarModal('+sessionNo+',0)" onclick="aeeSelectStarModal('+sessionNo+','+star+')">★</span>';
    }
    body += '</div>';
    body += '<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Ghi chú & góp ý</div>';
    body += '<textarea class="aee-feedback-textarea" id="m-fbtext-' + sessionNo + '" rows="3" placeholder="VD: Anh giải thích rất rõ, em muốn buổi sau thực hành nhiều hơn..."></textarea>';
    body += '</div>';
  }

  // Feedback đã gửi (done)
  if (s.status === 'done' && s.feedback) {
    body += '<div>';
    var stars2 = '';
    for (var i2=1;i2<=5;i2++) stars2 += '<span style="color:'+(i2<=s.feedback.rating?'#F59E0B':'#D1D5DB')+';font-size:16px">★</span>';
    body += '<div style="margin-bottom:6px">' + stars2 + '</div>';
    if (s.feedback.text) body += '<div style="font-size:13px;color:var(--text);line-height:1.65">' + s.feedback.text + '</div>';
    body += '</div>';
  }

  var _secAdvee = body; body = _mdKeep2;

  body += mdPanel_('blue', 'Chuẩn bị của Advisee', _secPrep || mdEmpty_('Chưa có thông tin chuẩn bị.'));
  body += mdPanel_('green', 'Feedback của Advisee', _secAdvee || mdEmpty_(s.status === 'done' ? 'Bạn chưa gửi feedback.' : 'Chưa tới lúc — sẽ có sau khi buổi hoàn thành.'));
  body += mdPanel_('purple', 'Feedback của Advisor', _secAdvFb || mdEmpty_('Chưa tới lúc — sẽ có sau khi buổi hoàn thành.'));

  document.getElementById('modal-body').innerHTML = body;
  var actions = '<button class="btn-secondary" onclick="closeModal()" style="width:auto;padding:10px 20px">Đóng</button>';
  if (s.status === 'upcoming' && !s.prepInfo) actions += '<button class="login-btn" onclick="submitPrepInfoModal('+sessionNo+')" style="width:auto;padding:10px 24px;background:#0369A1">Gửi chuẩn bị →</button>';
  if (s.status === 'feedback') actions += '<button class="login-btn" onclick="submitAdviseeFeedbackModal('+sessionNo+')" style="width:auto;padding:10px 24px;background:#15803D">Gửi feedback & mở khoá →</button>';
  document.getElementById('modal-actions').innerHTML = actions;
  document.getElementById('modal-overlay').classList.add('open');
}

//  ADVISEE ĐẶT LỊCH — calendar tuần/tháng, chọn giờ + phút, rồi xác nhận

var _bookSessionCtx = null; // { aeId, sessionNo, advisorName }
var _bk = { avail: {}, booked: {}, selDate: null, selM: null, step: 'pick' };

// ── Gói không giới hạn advisor: tự chọn / đổi advisor, miễn phí ──
function nextBookableSessionNo_(ae) {
  var s = (ae.sessions || []).find(function(x){ return x.status === 'upcoming' && !x.date; });
  return s ? s.no : null;
}
function applyAdvisorChange_(ae, newName) {
  var adv = (sheetData.advisors || []).find(function(a){ return normName(a.name) === normName(newName); }) || {};
  return apiPost({
    action: 'changeAdvisorFree', booking_id: ae.bookingId, advisee_email: ae.email,
    new_advisor_name: newName, new_advisor_id: adv.id || '', new_advisor_email: adv.email || '',
  }).then(function(res){
    if (!res || !res.success) { toast('Không đổi được advisor: ' + (res && res.error ? res.error : 'lỗi không xác định'), 'error'); return false; }
    // Chốt advisor cũ cho các buổi đã đặt/đã meet mà chưa có advisor riêng, để lịch sử không bị đổi theo advisor mới
    (ae.sessions || []).forEach(function(x){ if (!x.advisor && (x.date || x.status === 'done' || x.status === 'feedback')) x.advisor = ae.advisor || ''; });
    ae.advisor = newName; ae.advisorTitle = adv.title ? (adv.title + (adv.company ? ' · ' + adv.company : '')) : ae.advisorTitle;
    return true;
  }).catch(function(e){ toast('Lỗi kết nối: ' + e.message, 'error'); return false; });
}
function openPickAdvisorModal(aeId) {

  ensureAdvisorsLoaded().then(function(){
    var list = (sheetData.advisors || []).filter(function(a){ return a.active; });

    list.forEach(function(a){

      body += '<div style="display:flex;align-items:center;gap:12px;border:1.5px solid ' + (cur ? 'var(--brand)' : 'var(--border)') + ';border-radius:12px;padding:12px 16px;cursor:pointer" onclick="pickAdvisor(\'' + aeId + '\',\'' + String(a.name).replace(/'/g, "\\'") + '\')">' +
        avatarCircle(a.name, 38) +
        '<div style="flex:1"><div style="font-weight:700;font-size:13.5px">' + a.name + (cur ? ' <span style="font-size:11px;color:var(--brand)">(Đang chọn)</span>' : '') + '</div>' +
        '<div style="font-size:12px;color:var(--muted)">' + (a.title || '') + (a.company ? ' · ' + a.company : '') + '</div></div>' +
        '<div style="font-size:12px;color:var(--brand);font-weight:600">' + (cur ? 'Xem lịch →' : 'Chọn →') + '</div></div>';

}
function pickAdvisor(aeId, name) {

}

function openBookSessionModal(aeId, sessionNo) {
  var ae = MOCK.advisees.find(function(x){ return x.id === aeId; });
  if (!ae) return;

// Tải lịch trống của advisor đang chọn trong modal (đổi advisor → gọi lại hàm này)
function bkLoadSlots(jumpToFirst) {
  var ctx = _bookSessionCtx;
  apiGet('getSlots', { advisor: ctx.advisorName }).then(function(res) {
    var raw = avExpandRows((res && res.data) ? res.data : [], SC_STEP), today = ymd(new Date()), starts = {};   // khung rảnh A–B → các giờ bắt đầu
    _bk.avail = {}; _bk.booked = {};
    raw.forEach(function(s) {
      var d = slotDate(s), m = tmin(s.time_start);
      if (!d || m == null || d < today) return; // chỉ từ hôm nay trở đi
      var st = String(s.status || 'available').toLowerCase();
      if (st === 'booked') { (_bk.booked[d] = _bk.booked[d] || []).push(m); }
      else if (st === 'available') { (starts[d] = starts[d] || []).push({ slot_id: s.slot_id, m: m }); }
    });
    Object.keys(starts).forEach(function(d) {
      var nowM = minutesNowIfToday(d), bk = _bk.booked[d] || [];
      var list = starts[d].filter(function(x){ return x.m > nowM && bk.every(function(b){ return Math.abs(x.m - b) >= SC_DUR; }); });
      if (list.length) _bk.avail[d] = list.sort(function(a, b){ return a.m - b.m; });
    });
    // mở sẵn tuần có ngày trống gần nhất
    var first = Object.keys(_bk.avail).sort()[0];
    if (first) _cal.advisee.anchor = new Date(first + 'T00:00:00');
    renderBkBody();
  }).catch(function(err) {
    document.getElementById('modal-body').innerHTML =
      '<div class="empty-state"><div class="icon">⚠</div>Không tải được lịch trống của Advisor.<br><small style="color:var(--muted)">' + err.message + '</small></div>';
  });
}

function bkStarts(d) { return (_bk.avail[d] || []).map(function(x){ return x.m; }); }

function bkAdvisorSelectHtml() {
  if (!_bookSessionCtx || !_bookSessionCtx.advisorUnlimited) return '';
  var list = (sheetData.advisors || []).filter(function(a){ return a.active || normName(a.name) === normName(_bookSessionCtx.advisorName); });
  if (!list.length) return '';
  return '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--brand-light);border:1.5px solid #FECACA;border-radius:10px;padding:10px 14px;margin-bottom:12px">' +
    '<span class="form-label" style="margin:0">Advisor</span>' +
    '<select class="sc-sel" style="min-width:220px" onchange="bkSwitchAdvisor(this.value)">' +
    list.map(function(a){ return '<option value="' + String(a.name).replace(/"/g, '&quot;') + '"' + (normName(a.name) === normName(_bookSessionCtx.advisorName) ? ' selected' : '') + '>' + a.name + (a.title ? ' — ' + a.title : '') + '</option>'; }).join('') +
    '</select><span style="font-size:12px;color:var(--muted)">Gói Đồng Hành: đổi advisor miễn phí, không giới hạn</span></div>';

function bkSwitchAdvisor(name) {

function renderBkBody() {
  if (_bk.step === 'confirm') { renderBkConfirm(); return; }
  var hasAny = Object.keys(_bk.avail).length > 0;
  var html = bkAdvisorSelectHtml() + '<div style="font-size:13px;color:var(--muted);margin-bottom:6px;line-height:1.6">Chọn ngày có khung giờ trống của Advisor <b>' + _bookSessionCtx.advisorName + '</b>, sau đó chọn giờ và phút bắt đầu (buổi meeting 60 phút).</div>';
  if (!hasAny) {
    html += '<div class="empty-state"><div class="icon">📭</div>Advisor hiện chưa có giờ trống nào từ hôm nay trở đi. Vui lòng liên hệ đội LinkaJob để được hỗ trợ xếp lịch.</div>';
    document.getElementById('modal-body').innerHTML = html;
    document.getElementById('modal-actions').innerHTML = '<button class="btn-secondary" onclick="closeModal()" style="width:auto;padding:10px 20px">Đóng</button>';
    return;
  }
  html += renderCal('advisee', {
    onClick: 'bkPickDay', selected: _bk.selDate,
    cellFn: function(ds, view) {
      var rs = startsToRanges(bkStarts(ds));
      if (!rs.length) return { html: '', enabled: false };
      var max = view === 'week' ? 6 : 2, out = rs.slice(0, max).map(function(r){ return '<span class="sc-chip free">' + tstr(r[0]) + '–' + tstr(r[1]) + '</span>'; }).join('');
      if (rs.length > max) out += '<span class="sc-more">+' + (rs.length - max) + ' nữa</span>';
      return { html: '<div class="sc-chips">' + out + '</div>' };
    }
  });
  html += '<div id="bk-panel">' + bkPanelHtml() + '</div>';
  document.getElementById('modal-body').innerHTML = html;
  bkRenderActions();
}

function bkPanelHtml() {
  if (!_bk.selDate) return '<div style="font-size:13px;color:var(--muted);padding:4px 20px 16px">👆 Bấm vào một ngày có giờ trống để chọn giờ.</div>';
  var starts = bkStarts(_bk.selDate), hours = [], h = Math.floor(_bk.selM / 60);
  starts.forEach(function(m){ var x = Math.floor(m / 60); if (hours.indexOf(x) < 0) hours.push(x); });
  var mins = starts.filter(function(m){ return Math.floor(m / 60) === h; }).map(function(m){ return m % 60; });
  var rs = startsToRanges(starts).map(function(r){ return tstr(r[0]) + '–' + tstr(r[1]); }).join(', ');
  return '<div class="sc-pick">' +
    '<div style="font-weight:700;font-size:14px;margin-bottom:2px">' + dayLabel(_bk.selDate) + '/' + _bk.selDate.slice(0, 4) + '</div>' +
    '<div style="font-size:12.5px;color:var(--muted);margin-bottom:12px">Advisor rảnh: ' + rs + '</div>' +
    '<div class="sc-time-row"><span class="form-label" style="margin:0">Giờ bắt đầu</span>' +
    '<select class="sc-sel" onchange="bkHour(this.value)">' + hours.map(function(x){ return '<option value="' + x + '"' + (x === h ? ' selected' : '') + '>' + pad(x) + ' giờ</option>'; }).join('') + '</select>' +
    '<select class="sc-sel" onchange="bkMin(this.value)">' + mins.map(function(x){ return '<option value="' + x + '"' + (x === _bk.selM % 60 ? ' selected' : '') + '>' + pad(x) + ' phút</option>'; }).join('') + '</select></div>' +
    '<div style="margin-top:12px;font-size:14px">Buổi meeting: <b style="color:var(--brand)">' + tstr(_bk.selM) + ' – ' + tstr(_bk.selM + SC_DUR) + '</b> <span style="color:var(--muted);font-size:12.5px">(60 phút)</span></div></div>';
}

function bkHour(h) {
  var first = bkStarts(_bk.selDate).filter(function(m){ return Math.floor(m / 60) === +h; })[0];

// Bước cuối: nếu advisee vừa chọn advisor khác (gói không giới hạn advisor) → lưu đổi advisor trước, rồi mới đặt lịch
function confirmBookSession() {
  var ctx = _bookSessionCtx;
  var ae = MOCK.advisees.find(function(x){ return x.id === ctx.aeId; });
  if (ae && ctx.advisorUnlimited && normName(ae.advisor) !== normName(ctx.advisorName)) {
    var btn = document.getElementById('bk-confirm-btn');
    if (btn) { btn.innerHTML = '<span class="spinner"></span> Đang đặt lịch...'; btn.disabled = true; }
    applyAdvisorChange_(ae, ctx.advisorName).then(function(ok){
      if (!ok) { if (btn) { btn.innerHTML = 'Xác nhận đặt lịch'; btn.disabled = false; } return; }
      confirmBookSessionCore();
    });
    return;
  }
  confirmBookSessionCore();
}
function confirmBookSessionCore() {
  var ctx = _bookSessionCtx, d = _bk.selDate, m = _bk.selM;
  var slot = (_bk.avail[d] || []).filter(function(x){ return x.m === m; })[0];
  if (!slot) { toast('Vui lòng chọn lại giờ meeting', 'error'); bkBack(); return; }
  var ae = MOCK.advisees.find(function(x){ return x.id === ctx.aeId; });
  if (!ae) return;

  var btn = document.getElementById('bk-confirm-btn');
  if (btn) { btn.innerHTML = '<span class="spinner"></span> Đang đặt lịch...'; btn.disabled = true; }

  apiPost({
    action: 'bookSession', slot_id: slot.slot_id, start_time: tstr(m), booking_id: ae.bookingId,
    session_number: ctx.sessionNo, advisee_name: ae.name, advisor_name: ctx.advisorName,
  }).then(function(res) {
    if (!res || !res.success) {
      toast('Lỗi: ' + (res && res.error ? res.error : 'không đặt được lịch — khung giờ có thể vừa bị người khác chọn'), 'error');
      openBookSessionModal(ctx.aeId, ctx.sessionNo);
      return;
    }
    var s = ae.sessions.find(function(x){ return x.no === ctx.sessionNo; });
    var time = tstr(m);
    if (s) { s.advisor = ctx.advisorName; s.date = d; s.timeStart = time; s.timeEnd = tstr(m + SC_DUR); s.session_id = res.session_id; s.status = 'upcoming'; }
    toast('Đã đặt lịch buổi ' + ctx.sessionNo + ' thành công ✅', 'success');
    document.getElementById('main-content').innerHTML = renderMyBookings();
    showBookingSuccessNotice(ctx.sessionNo, d, time);
  }).catch(function(err) {
    toast('Lỗi kết nối: ' + err.message, 'error');
    if (btn) { btn.innerHTML = 'Xác nhận đặt lịch'; btn.disabled = false; }
  });
}

function submitAdviseeFeedbackModal(sessionNo) {
  var rating = (adviseeStarState[sessionNo]||{}).selected || 0;
  var text   = (document.getElementById('m-fbtext-' + sessionNo)||{}).value || '';
  if (!rating) { toast('Vui lòng chọn số sao', 'error'); return; }
  draftClear_(['m-fbtext-' + sessionNo]);
  var ae = MOCK.advisees.find(function(x){ return x.name === currentUser.name; });
  if (!ae) return;
  var s = ae.sessions.find(function(x){ return x.no === sessionNo; });
  if (!s) return;

  // FIX: chặn gửi lặp (tránh tạo nhiều dòng review trùng cho cùng 1 session_id)
  if (s.feedback || s._fbSubmitting) { closeModal(); return; }
  s._fbSubmitting = true;
  fbCacheSet(s.session_id, { rating: rating, text: text, createdAt: new Date().toISOString() });

  var feedbackSessionId = s.session_id || (ae.bookingId + '-' + sessionNo);

  // Lưu thật lên Sheet (tab AdvisorReviews) — feedback này sẽ hiển thị công khai
  // trên trang giới thiệu Advisor. Không chặn UI nếu lỗi mạng, chỉ báo toast.
  apiPost({
    action: 'submitAdviseeFeedback',
    session_id: feedbackSessionId,
    advisor_name: sessionAdvisorName_(ae, s),
    advisee_name: ae.name,
    rating: rating,
    text: text,
  }).then(function(res){
    if (!res || !res.success) toast('Đã lưu tạm — lỗi đồng bộ Sheet: ' + (res&&res.error||''), 'error');
  }).catch(function(err){ toast('Đã lưu tạm — lỗi kết nối: ' + err.message, 'error'); });

  s.status = 'done'; s.feedback = { rating:rating, text:text };
  ae.sessionsDone = Math.min(ae.sessionsDone + 1, ae.sessionsTotal);
  var next = ae.sessions.find(function(x){ return x.no === sessionNo+1 && x.status === 'locked'; });
  if (next) next.status = 'upcoming';

  adviseeStarState[sessionNo] = { selected:0, hover:0 };
  toast('Đã gửi feedback buổi ' + sessionNo + '! Buổi ' + (sessionNo+1) + ' đã mở khoá 🎉', 'success');
  closeModal();
  document.getElementById('main-content').innerHTML = renderMyBookings();
}

function submitAdviseeFeedback(sessionNo, session) {
  var rating = (adviseeStarState[sessionNo]||{}).selected || 0;
  var text = (document.getElementById('fbtext-' + sessionNo)||{}).value || '';
  var btn = document.getElementById('fbbtn-' + sessionNo);

  if (!rating) { toast('Vui lòng chọn số sao trước khi gửi', 'error'); return; }

  if (btn) { btn.innerHTML = '<span class="spinner"></span> Đang gửi...'; btn.disabled = true; }

  // Lưu vào mock data và cập nhật trạng thái buổi
  var ae = MOCK.advisees.find(function(x){ return x.name === currentUser.name; });
  if (ae) {
    var s = ae.sessions.find(function(x){ return x.no === sessionNo; });
    if (s) {
      s.status = 'done';
      s.feedback = { rating: rating, text: text };
      ae.sessionsDone = Math.min(ae.sessionsDone + 1, ae.sessionsTotal);
    }
    // Mở khoá buổi tiếp theo
    var next = ae.sessions.find(function(x){ return x.no === sessionNo + 1 && x.status === 'locked'; });
    if (next) next.status = 'upcoming';
  }

  setTimeout(function() {
    toast('Đã gửi feedback buổi ' + sessionNo + '! Buổi ' + (sessionNo+1) + ' đã mở khoá 🎉', 'success');
    adviseeStarState[sessionNo] = { selected:0, hover:0 };
    renderAdvisee('my-bookings');
    document.getElementById('main-content').innerHTML = renderMyBookings();
  }, 800);
}

// Bước 1: kiểm tra + hiện màn hình xác nhận (nháp vẫn được giữ nếu quay lại sửa)
var _pendingNotes = null;
function escHtmlConfirm_(t) {
  return String(t || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function submitAdvisorNotes(aeId, sessionNo) {
  var summary     = (document.getElementById('an-summary-'  + aeId + '-' + sessionNo)||{}).value || '';
  var feedback    = (document.getElementById('an-feedback-' + aeId + '-' + sessionNo)||{}).value || '';
  var actionItems = (document.getElementById('an-actions-'  + aeId + '-' + sessionNo)||{}).value || '';

  if (!summary.trim() || !feedback.trim()) { toast('Vui lòng điền Nội dung và Nhận xét trước khi gửi', 'error'); return; }

  var ae0 = MOCK.advisees.find(function(x){ return x.id === aeId; });
  if (!ae0) return;
  var inlineForm = !!document.getElementById('anote-form-' + aeId + '-' + sessionNo);
  _pendingNotes = { aeId: aeId, sessionNo: sessionNo, summary: summary, feedback: feedback, actionItems: actionItems, inline: inlineForm };

  function row(label, val, empty) {
    return '<div style="font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 4px">' + label + '</div>' +
      '<div style="font-size:13.5px;line-height:1.65;white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:10px 12px;' + (val.trim() ? '' : 'color:var(--muted);font-style:italic') + '">' +
      (val.trim() ? escHtmlConfirm_(val.trim()) : empty) + '</div>';
  }
  var body = '<div style="background:#FFFBEB;border:1px solid #FDE68A;border-radius:10px;padding:10px 12px;font-size:13px;color:#92400E;line-height:1.6">' +
    '⚠️ Vui lòng kiểm tra lại thông tin. Sau khi gửi, <b>' + escHtmlConfirm_(ae0.name) + '</b> và Staff sẽ xem được nhận xét này.</div>';
  body += row('Nội dung đã trao đổi', summary, '');
  body += row('Nhận xét & Góp ý cho Advisee', feedback, '');
  body += row('Việc cần làm trước buổi sau', actionItems, '(Không có)');

  document.getElementById('modal-title').textContent = 'Xác nhận gửi nhận xét · Buổi ' + sessionNo;
  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal-actions').innerHTML =
    '<button class="btn-secondary" onclick="cancelConfirmAdvisorNotes()" style="width:auto;padding:10px 20px">← Quay lại sửa</button>' +
    '<button class="login-btn" id="anote-confirm-btn" onclick="confirmSubmitAdvisorNotes()" style="width:auto;padding:10px 24px;background:#7C3AED">Xác nhận gửi ✓</button>';
  document.getElementById('modal-overlay').classList.add('open');
}
function cancelConfirmAdvisorNotes() {
  var p = _pendingNotes; _pendingNotes = null;
  if (!p) { closeModal(); return; }
  if (p.inline) { closeModal(); } else { openSessionDetailModal(p.aeId, p.sessionNo); }
}

// Bước 2: gửi thật sau khi Advisor xác nhận
function confirmSubmitAdvisorNotes() {
  var p = _pendingNotes;
  if (!p) return;
  var btn = document.getElementById('anote-confirm-btn');
  if (btn) { if (btn.disabled) return; btn.disabled = true; }
  _pendingNotes = null;
  var aeId = p.aeId, sessionNo = p.sessionNo, summary = p.summary, feedback = p.feedback, actionItems = p.actionItems;

  var ae = MOCK.advisees.find(function(x){ return x.id === aeId; });
  if (!ae) return;
  var s = ae.sessions.find(function(x){ return x.no === sessionNo; });
  if (!s) return;

  draftClear_(['an-summary-'+aeId+'-'+sessionNo,'an-feedback-'+aeId+'-'+sessionNo,'an-actions-'+aeId+'-'+sessionNo]);
  var notesSessionId = s.session_id || (ae.bookingId + '-' + sessionNo);

  // Lưu thật lên Sheet (tab AdvisorNotes) — KHÔNG public, chỉ Advisee & Staff xem được.
  apiPost({
    action: 'submitAdvisorNotes',
    session_id: notesSessionId,
    advisor_name: sessionAdvisorName_(ae, s),
    advisee_name: ae.name,
    summary: summary.trim(),
    feedback: feedback.trim(),
    action_items: actionItems.trim(),
  }).then(function(res){
    if (!res || !res.success) toast('Đã lưu tạm — lỗi đồng bộ Sheet: ' + (res&&res.error||''), 'error');
  }).catch(function(err){ toast('Đã lưu tạm — lỗi kết nối: ' + err.message, 'error'); });

  var now = new Date();
  s.advisorNotes = {
    summary: summary.trim(),
    feedback: feedback.trim(),
    actionItems: actionItems.trim(),
    submittedAt: pad(now.getDate()) + '/' + pad(now.getMonth()+1) + '/' + now.getFullYear() + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes())
  };

  toast('Đã gửi nhận xét buổi ' + sessionNo + ' ✅', 'success');
  closeModal();
  navToAdviseeDetail(aeId);
}

function openAdvisorNotesEdit(aeId, sessionNo) {
  var ae = MOCK.advisees.find(function(x){ return x.id === aeId; });
  if (ae) {
    var s = ae.sessions.find(function(x){ return x.no === sessionNo; });
    if (s) {
      var n = s.advisorNotes;
      if (n) {
        var k = aeId + '-' + sessionNo;
        if (!draftGet_('an-summary-' + k))  draftSet_('an-summary-' + k,  n.summary || '');
        if (!draftGet_('an-feedback-' + k)) draftSet_('an-feedback-' + k, n.feedback || '');
        if (!draftGet_('an-actions-' + k))  draftSet_('an-actions-' + k,  n.actionItems || '');
      }
      s.advisorNotes = null;
    }
  }
  openSessionDetailModal(aeId, sessionNo);
}

// ── Modal chi tiết từng buổi meeting ──
function openSessionDetailModal(aeId, sessionNo) {
  var ae = MOCK.advisees.find(function(x){ return x.id === aeId; });
  if (!ae) return;
  var s = ae.sessions.find(function(x){ return x.no === sessionNo; });
  if (!s) return;
  commitRoute({ tab: 'overview', ae: aeId, s: sessionNo });

  var pd = safeParseYMD(s.date);
  var dateLabel = pd.valid ? (pd.dow + ' ' + pd.dd + '/' + pd.mm + '/' + pd.dateObj.getFullYear() + ' · ' + s.timeStart + (s.timeEnd ? '–' + s.timeEnd : '')) : 'Chưa xếp lịch';

  document.getElementById('modal-title').textContent = ae.name + ' · Buổi ' + sessionNo;

  var body = '';

  var _mdHead = body; body = '';
  if (s.status === 'upcoming') body += '<button class="detail-btn" onclick="closeModal();openRescheduleModal(\'' + ae.id + '\',' + sessionNo + ',\'advisor\')">🔄 Đổi giờ</button>';
  var _mdAct = body;
  body = _mdHead + mdInfo_({ type: escHtml(ae.pkg || 'Cố vấn 1-1') + ' · buổi ' + sessionNo, advisor: mdAdvisorOf_(ae, s), advisee: escHtml(ae.name || ''), time: escHtml(dateLabel), timeAction: _mdAct, status: mdStatus_(s.status), meet: mdMeet_(s.meetLink) });

  // Chuẩn bị của Advisee (xanh dương)
  var _secPrep = renderPrepCard(s.prepInfo);

  // Feedback của Advisee (xanh lá)
  var _secAdvee = '';
  if (s.feedback) {
    _secAdvee = mdStars_(s.feedback.rating) + (s.feedback.text ? '<div style="font-size:13px;line-height:1.65;white-space:pre-line;word-break:break-word">' + s.feedback.text + '</div>' : '');
  }

  // Feedback của Advisor (tím) — đã có hoặc form điền mới
  var _mdKeep = body; body = '';
  if (s.advisorNotes) {
    body += renderAdvisorNotesCard(s.advisorNotes, false, null, s.no);
    body += '<div style="margin-top:8px;text-align:right"><button class="anote-edit-btn" style="font-size:12px" onclick="openAdvisorNotesEdit(\'' + aeId + '\',' + sessionNo + ')">✎ Sửa nhận xét</button></div>';
  } else if (s.status === 'done' || s.status === 'feedback') {
    // Form nhận xét inline trong modal
    body += '<div>';
    body += '<div style="font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Nội dung đã trao đổi <span style="color:var(--brand)">*</span></div>';
    body += '<textarea class="anote-input" id="an-summary-' + aeId + '-' + sessionNo + '" rows="3" placeholder="Tóm tắt nội dung chính đã thảo luận..."></textarea>';
    body += '<div style="font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 6px">Nhận xét & Góp ý <span style="color:var(--brand)">*</span></div>';
    body += '<textarea class="anote-input" id="an-feedback-' + aeId + '-' + sessionNo + '" rows="3" placeholder="Điểm mạnh, điểm cần cải thiện..."></textarea>';
    body += '<div style="font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 6px">Việc cần làm trước buổi sau</div>';
    body += '<textarea class="anote-input" id="an-actions-' + aeId + '-' + sessionNo + '" rows="2" placeholder="1. Cập nhật CV...\n2. Đọc case study..."></textarea>';
    body += '</div>';
  } else {
    body += '<div class="anote-missing">Buổi chưa diễn ra.</div>';
  }

  var _secAdvFb = body; body = _mdKeep;

function submitRescheduleRequest(aeId, sessionNo, requestedBy) {
  var ae = MOCK.advisees.find(function(x){ return x.id === aeId; });
  if (!ae) return;
  var s = ae.sessions.find(function(x){ return x.no === sessionNo; });
  if (!s || !s.date || !s.timeStart) { toast('Buổi này chưa có lịch cụ thể — không thể yêu cầu đổi giờ', 'error'); return; }

  var reason = document.getElementById('rs-reason').value.trim();
  var d1 = document.getElementById('rs-date1').value, t1 = document.getElementById('rs-time1').value;
  var d2 = document.getElementById('rs-date2').value, t2 = document.getElementById('rs-time2').value;
  if (!reason || !d1 || !t1 || !d2 || !t2) { toast('Vui lòng điền đầy đủ lý do và 2 khung giờ đề xuất', 'error'); return; }

  var btn = document.querySelector('#modal-actions .login-btn');
  if (btn) { btn.innerHTML = '<span class="spinner"></span> Đang gửi...'; btn.disabled = true; }

  apiPost({
    action: 'submitRescheduleRequest',
    session_id: s.session_id,
    requested_by: requestedBy, // 'advisor' hoặc 'advisee'
    reason: reason,
    option1_date: d1, option1_time: t1, option2_date: d2, option2_time: t2,
  }).then(function(res){
    if (!res || !res.success) {
      toast('Lỗi: ' + (res && res.error ? res.error : 'không gửi được, thử lại'), 'error');
      if (btn) { btn.innerHTML = 'Gửi yêu cầu đổi giờ →'; btn.disabled = false; }
      return;
    }
    toast('Đã gửi yêu cầu đổi giờ — Staff sẽ xác nhận sớm ✅', 'success');
    closeModal();
  }).catch(function(err){
    toast('Lỗi kết nối: ' + err.message, 'error');
    if (btn) { btn.innerHTML = 'Gửi yêu cầu đổi giờ →'; btn.disabled = false; }
  });
}

function loadRescheduleRequestsPage() {
  var c = document.getElementById('main-content');
  c.innerHTML = pageHeader('🔔 Yêu cầu đổi lịch', 'Advisor/Advisee đề xuất đổi giờ meeting — cần Staff xác nhận') + skeletonRows(3);

  // Backend chỉ lưu session_id trong RescheduleRequests — cần ghép thêm Sessions
  // để lấy tên advisee/advisor/số buổi hiển thị.
  Promise.all([
    apiGet('getRescheduleRequests', {}),
    apiGet('getSessions', {}),
  ]).then(function(results){
    var reqs = (results[0] && results[0].data) ? results[0].data : [];
    var allSessions = (results[1] && results[1].data) ? results[1].data : [];
    var sessById = {};
    allSessions.forEach(function(s){ sessById[s.session_id] = s; });
    reqs.forEach(function(r){
      var s = sessById[r.session_id];
      r._ae_name = s ? s.advisee_name : '';
      r._advisor_name = s ? s.advisor_name : '';
      r._session_no = s ? s.session_number : '';
    });
    window._rescheduleRequests = reqs;
    c.innerHTML = renderRescheduleRequestsPage(reqs);
  }).catch(function(err){
    c.innerHTML = pageHeader('🔔 Yêu cầu đổi lịch', 'Advisor/Advisee đề xuất đổi giờ meeting — cần Staff xác nhận') +
      '<div class="card"><div class="empty-state"><div class="icon">⚠</div>Không tải được danh sách yêu cầu.<br><small style="color:var(--muted)">' + err.message + '</small></div></div>';
  });

function renderRescheduleRequestsPage(reqs) {
  reqs = reqs || window._rescheduleRequests || [];
  var html = pageHeader('🔔 Yêu cầu đổi lịch', 'Advisor/Advisee đề xuất đổi giờ meeting — cần Staff xác nhận');
  var pending = reqs.filter(function(r){ return String(r.status||'').trim().toLowerCase() === 'pending'; });
  var resolved = reqs.filter(function(r){ return String(r.status||'').trim().toLowerCase() !== 'pending'; });

  html += '<div class="card" style="margin-bottom:16px"><div class="card-header"><div class="card-header-left">Đang chờ xác nhận (' + pending.length + ')</div><button class="refresh-btn" onclick="loadRescheduleRequestsPage()">↻</button></div>';
  if (pending.length === 0) {
    html += '<div class="empty-state"><div class="icon">✅</div>Không có yêu cầu đổi lịch nào đang chờ</div>';
  } else {
    pending.forEach(function(r){
      var aeName = r._ae_name || '(không rõ)';
      html += '<div style="padding:16px 24px;border-top:1px solid var(--border)">';
      html += '<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">' + avatarCircle(aeName, 36);
      html += '<div style="flex:1"><div style="font-weight:700;font-size:14px">' + aeName + (r._session_no ? ' · Buổi ' + r._session_no : '') + '</div>';
      html += '<div style="font-size:12px;color:var(--muted)">' + (r._advisor_name ? 'Advisor: ' + r._advisor_name + ' · ' : '') + 'Đề xuất bởi: ' + (r.requested_by==='advisee'?'Advisee':'Advisor') + ' · ' + r.created_at + '</div></div>';
      html += '<button class="update-btn" style="border-color:var(--brand);color:var(--brand)" onclick="rejectReschedule(\'' + r.request_id + '\')">Từ chối</button>';
      html += '</div>';
      html += '<div style="font-size:13px;color:var(--text);background:var(--bg);border-radius:8px;padding:10px 12px;margin-bottom:10px"><b>Lý do:</b> ' + r.reason + '</div>';
      html += '<div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Chọn 1 khung giờ để xác nhận</div>';
      html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">';
      html += '<button class="detail-btn" style="padding:12px" onclick="confirmReschedule(\'' + r.request_id + '\',\'' + r.option1_date + '\',\'' + r.option1_time + '\')">📅 ' + fmtDateStr(r.option1_date) + ' · ' + r.option1_time + '</button>';
      html += '<button class="detail-btn" style="padding:12px" onclick="confirmReschedule(\'' + r.request_id + '\',\'' + r.option2_date + '\',\'' + r.option2_time + '\')">📅 ' + fmtDateStr(r.option2_date) + ' · ' + r.option2_time + '</button>';
      html += '</div></div>';
    });
  }
  html += '</div>';

  if (resolved.length > 0) {
    html += '<div class="card"><div class="card-header"><div class="card-header-left">Đã xử lý</div></div>';
    resolved.forEach(function(r){
      var st = String(r.status||'').trim().toLowerCase();
      var aeName = r._ae_name || '(không rõ)';
      var tag = st === 'confirmed' ? '<span class="badge badge-confirmed">✓ Đã xác nhận</span>' : '<span class="badge badge-cancelled">Đã từ chối</span>';
      html += '<div style="display:flex;align-items:center;gap:12px;padding:14px 24px;border-top:1px solid var(--border)">' + avatarCircle(aeName, 32);
      html += '<div style="flex:1"><div style="font-weight:600;font-size:13px">' + aeName + (r._session_no ? ' · Buổi ' + r._session_no : '') + '</div><div style="font-size:12px;color:var(--muted)">' + r.reason + '</div></div>' + tag + '</div>';
    });
    html += '</div>';
  }
  return html;
}

// ════════════════════════════════════════════════════════════
//  LƯU NHÁP TỰ ĐỘNG — nhận xét Advisor / feedback Advisee / thông tin chuẩn bị
//  Lỡ nhấp ra ngoài modal (hoặc bấm Đóng, reload) thì mở lại vẫn còn nội dung đã gõ.
//  Nháp tự xoá sau khi gửi thành công.
// ════════════════════════════════════════════════════════════
var DRAFT_SELECTOR = '[id^="an-summary-"],[id^="an-feedback-"],[id^="an-actions-"],[id^="m-fbtext-"],[id^="m-prep-"]';
function draftKey_(id) {
  var who = (typeof currentUser !== 'undefined' && currentUser) ? (currentUser.email || currentUser.name || '') : '';
  return 'draft:' + who + ':' + id;
}
function draftSet_(id, val) {
  try { if (val && val.trim()) localStorage.setItem(draftKey_(id), val); else localStorage.removeItem(draftKey_(id)); } catch (e) {}
}
function draftGet_(id) { try { return localStorage.getItem(draftKey_(id)) || ''; } catch (e) { return ''; } }
function draftClear_(ids) { try { (ids || []).forEach(function(id){ localStorage.removeItem(draftKey_(id)); }); } catch (e) {} }

// Ghi nháp mỗi khi gõ
document.addEventListener('input', function(e) {
  var el = e.target;
  if (el && el.id && el.matches && el.matches(DRAFT_SELECTOR)) draftSet_(el.id, el.value);
});

// Khôi phục nháp mỗi khi form được render lại
function draftRestore_(root) {
  if (!root || !root.querySelectorAll) return;
  var list = root.matches && root.matches(DRAFT_SELECTOR) ? [root] : [];
  list = list.concat([].slice.call(root.querySelectorAll(DRAFT_SELECTOR)));
  var restored = false;
  list.forEach(function(el) {
    if (el.dataset.draftRestored || el.value) return;
    el.dataset.draftRestored = '1';
    var d = draftGet_(el.id);
    if (d) { el.value = d; restored = true; }
  });
  if (restored) toast('Đã khôi phục nội dung bạn đang viết dở ✍️', 'success');
}
new MutationObserver(function(muts) {
  muts.forEach(function(m) { [].forEach.call(m.addedNodes, function(n) { if (n.nodeType === 1) draftRestore_(n); }); });
}).observe(document.body, { childList: true, subtree: true });
draftRestore_(document.body);


const AV_COLORS = [['#D0E8FF','#2475B0'],['#FFD6D0','#C0392B'],['#D0F0E8','#1A7A5E'],['#EDE9FE','#6D28D9'],['#FEF3C7','#92400E'],['#FCE7F3','#9D174D']];
const colorCache = {};
function avatarCircle(name, size) {
  size = size || 38;
  if (!name) name = '?';
  if (!colorCache[name]) colorCache[name] = AV_COLORS[name.charCodeAt(0) % AV_COLORS.length];
  const c = colorCache[name];
  const ini = name.split(' ').filter(Boolean).map(function(w){ return w[0]; }).join('').slice(0,2).toUpperCase();
  return '<div class="av-circle" style="width:' + size + 'px;height:' + size + 'px;background:' + c[0] + ';color:' + c[1] + ';font-size:' + (size*0.33) + 'px;flex-shrink:0">' + ini + '</div>';
}

function statusBadge(s) {
  const map = {pending_payment:'badge-pending',confirmed:'badge-confirmed',completed:'badge-completed',cancelled:'badge-cancelled'};
  const lbl = {pending_payment:'Chờ thanh toán',confirmed:'Đã xác nhận',completed:'Hoàn thành',cancelled:'Đã hủy'};
  return '<span class="badge ' + (map[s]||'badge-pending') + '">' + (lbl[s]||s||'—') + '</span>';
}
function statusLabel(s) { return {pending_payment:'Chờ thanh toán',confirmed:'Đã xác nhận',completed:'Hoàn thành',cancelled:'Đã hủy'}[s] || s; }

function sessionItemHTML(b) {

  if (b.meet_link) html += '<a href="' + b.meet_link + '" target="_blank" class="detail-btn">Meet</a>';
  html += '</div>';

}

function skeletonRows(n) {
  let s = '<div class="card">';
  for (let i=0;i<n;i++) {
    s += '<div class="skel-row"><div class="skeleton" style="width:38px;height:38px;border-radius:50%;flex-shrink:0"></div><div style="flex:1"><div class="skeleton" style="height:14px;width:55%;margin-bottom:8px;border-radius:4px"></div><div class="skeleton" style="height:12px;width:38%;border-radius:4px"></div></div></div>';
  }
  s += '</div>';
  return s;
}

function getMondayOfWeek(date, offset) {
  offset = offset || 0;

//  #tab=overview&ae=<id>&s=2        Modal buổi 2 của advisee đó (Advisor)

var _route = null, _baseRoute = null, _modalPushed = false, _routeLock = 0, _routeSeq = 0, _clearTimer = null;

function commitStaffRoute(nav, view, replace) {

  if (nav) p.set('nav', nav);
  if (view) p.set('v', view);

    if (!kind || !id) { navTo(nav, { noRoute: true }); return true; }

}
function parseHash() {

    tab = (saved && ids.indexOf(saved) > -1) ? saved : ids[0];

    if (tab === 'overview' && r.ae) { out.ae = r.ae; if (validS) out.s = r.s; }
  } else if (tab === 'my-bookings' && validS) {
    out.s = r.s;

}

// Ghi route mới lên URL (gọi từ các hàm điều hướng khi NGƯỜI DÙNG thao tác)
function commitRoute(r) {
  if (!isRoutedRole() || _routeLock) return;
  clearTimeout(_clearTimer);
  r = { tab: r.tab || '', ae: r.ae || '', s: r.s ? String(r.s) : '' };
  var h = buildHash(r), prev = _route;
  if (location.hash === h) { _route = r; return; }

  if (prev && prev.s && !r.s) {            // rời khỏi modal
    var wasPushed = _modalPushed, baseHash = buildHash(_baseRoute);
    _route = r; _modalPushed = false;
    if (wasPushed && h === baseHash) history.back();

    return;
  }
  if (prev && prev.s && r.s) {             // đổi sang buổi khác khi modal đang mở
    _route = r; history.replaceState(null, '', h); return;
  }
  if (r.s) {                               // mở modal
    _baseRoute = prev ? { tab: prev.tab, ae: prev.ae, s: '' } : { tab: r.tab, ae: '', s: '' };
    _modalPushed = true;
  }
  _route = r;
  history.pushState(null, '', h);
}

function scheduleRouteClear() {
  if (!isRoutedRole() || _routeLock || !_route || !_route.s) return;

  _clearTimer = setTimeout(function(){
    if (_route && _route.s) commitRoute(_baseRoute || { tab: _route.tab, ae: _route.ae });
  }, 0);
}

// Đọc URL và dựng lại đúng màn hình (mở link, F5, nút Back/Forward)
function applyRoute(initial) {

  var had = !!_route && !initial;
  if (had && r.tab === _route.tab && r.ae === _route.ae && r.s === _route.s) return;
  var onlyModalChanged = had && r.tab === _route.tab && r.ae === _route.ae;

  var h = buildHash(r);
  if (location.hash !== h) history.replaceState(null, '', h);
  // Điều hướng bằng Back/Forward tới một URL có buổi: entry ngay trước đó chính là trang nền, nên khi đóng modal có thể quay lại bằng history.back()
  _route = r; _modalPushed = !initial && !!r.s; _baseRoute = { tab: r.tab, ae: r.ae, s: '' };
  clearTimeout(_clearTimer);

  var p;
  withRouteLock(function(){ p = renderRouteBase(r, seq); });
  p.then(function(){ if (seq === _routeSeq && r.s) openRouteSession(r); });
}

function renderRouteBase(r, seq) {
  if (currentUser.role === 'Advisor' && r.ae) {
    document.querySelectorAll('.role-tab').forEach(function(el){ el.classList.remove('active'); });
    var tabEl = document.getElementById('rt-' + r.tab);

      if (seq !== _routeSeq) return;
      withRouteLock(function(){ navToAdviseeDetail(r.ae); });
    });
  }
  return Promise.resolve(switchRoleTab(r.tab));
}

function openRouteSession(r) {
  var no = Number(r.s);

    if (currentUser.role === 'Advisor') { openSessionDetailModal(r.ae, no); return; }
    var activeAe = MOCK.advisees.find(function(ae){ return ae.email === currentUser.email && !isAdviseeExpired(ae); });

  });
}

  function injectCss() {

  }

  // ── lịch tháng dùng chung ──
  function monthWeeks(ym) {
    var y = +ym.slice(0, 4), m = +ym.slice(5, 7) - 1;
    var first = new Date(y, m, 1), start = new Date(y, m, 1 - ((first.getDay() + 6) % 7)), weeks = [];
    for (var w = 0; w < 6; w++) {
      var row = [];
      for (var d = 0; d < 7; d++) row.push(ymd(new Date(start.getFullYear(), start.getMonth(), start.getDate() + w * 7 + d)));
      if (w >= 4 && row[0].slice(0, 7) > ym) break;   // hàng cuối hoàn toàn thuộc tháng sau → bỏ
      weeks.push(row);
    }
    return weeks;
  }
  function addMonth(ym, k) { var y = +ym.slice(0, 4), m = +ym.slice(5, 7) - 1 + k; var d = new Date(y, m, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
  // o: { month, selected, nav(dir)->js, today()->js, cell(ds)->{html,enabled}, day(ds)->js }
  function calHtml(o) {
    var today = ymd(new Date());
    var h = '<div class="ljs-nav"><div class="ljs-navl"><button type="button" class="ljs-ib" aria-label="Tháng trước" onclick="' + o.nav(-1) + '">‹</button>' +
      '<span class="ljs-nl">Tháng ' + (+o.month.slice(5, 7)) + ' ' + o.month.slice(0, 4) + '</span>' +
      '<button type="button" class="ljs-ib" aria-label="Tháng sau" onclick="' + o.nav(1) + '">›</button></div>' +
      '<button type="button" class="ljs-ghost" onclick="' + o.nav(0) + '">Hôm nay</button></div><div class="ljs-grid">';
    WD_HDR.forEach(function (w) { h += '<div class="ljs-wd">' + w + '</div>'; });
    monthWeeks(o.month).forEach(function (week) {
      week.forEach(function (ds) {
        var c = o.cell(ds) || {}, other = ds.slice(0, 7) !== o.month;
        var cls = 'ljs-cell' + (c.enabled ? ' on' : '') + (other ? ' other' : '') + (ds < today ? ' past' : '') + (ds === today ? ' today' : '') + (o.selected === ds ? ' sel' : '');
        h += '<button type="button" class="' + cls + '"' + (c.enabled ? ' onclick="' + o.day(ds) + '"' : ' tabindex="-1"') + ' aria-label="' + esc(dayFull(ds)) + '">' +
          '<span class="ljs-dn">' + parse(ds).getDate() + '</span><span class="ljs-cb">' + (c.html || '') + '</span></button>';
      });
    });

  }
  function stepMonth(cur, dir) { return dir === 0 ? ymd(new Date()).slice(0, 7) : addMonth(cur, dir); }

  /* ═════════════════════════════ ĐẶT LỊCH ═════════════════════════════ */
  // opts: { key, slots:{ 'YYYY-MM-DD':[{m, ...}] }, sel:{date,m}|null, onSelect(date,m) (date=null khi bỏ chọn), dur, note(html), emptyHtml }
  var PK = {};
  var picker = {

      if (st.day && !(o.slots[st.day] || []).length) st.day = null;
      render(st);
    },
    reset: function (key) { delete PK[safeKey(key)]; },

    _month: function (key, dir) { var st = PK[key]; if (!st) return; st.month = stepMonth(st.month, dir); render(st); }

  function render(st) {
    var o = st.o, host = st.host;
    if (!inDom(host)) { var again = document.getElementById(host.id); if (again) host = st.host = again; else return; }
    var key = st.key, dur = o.dur || MEET, dates = st.dates, slots = o.slots || {};
    if (!dates.length) { host.innerHTML = '<div class="ljs">' + (o.emptyHtml || '<div class="ljs-hint">📭 Advisor hiện chưa có giờ trống nào từ hôm nay trở đi.<br>Vui lòng liên hệ đội LinkaJob để được hỗ trợ xếp lịch.</div>') + '</div>'; return; }
    var cal = calHtml({
      month: st.month, selected: st.day,
      nav: function (d) { return "LJS.picker._month('" + key + "'," + d + ")"; },
      day: function (ds) { return "LJS.picker._day('" + key + "','" + ds + "')"; },
