    html += '<div class="empty-state"><div class="icon">📭</div>Chưa có khách nào đăng ký từ website</div>';
  } else {
    sessions.forEach(function(s, idx){
      var lead = parseConsultNotes(s.notes);
      var name = lead.name || s.advisee_name || 'Khách hàng';
      var assignedTo = (s.assigned_staff || '').trim();
      html += '<div style="display:flex;align-items:center;gap:14px;padding:16px 24px;border-top:1px solid var(--border);flex-wrap:wrap">';
      html += avatarCircle(name, 40);
      html += '<div style="flex:1;min-width:200px">';
      html += '<div style="font-weight:700;font-size:14px">' + name + (lead.service ? ' <span style="font-weight:400;color:var(--muted);font-size:12px">· ' + lead.service + '</span>' : '') + '</div>';
      html += '<div style="font-size:12px;color:var(--muted)">' + (lead.phone||'—') + (lead.email ? ' · ' + lead.email : '') + '</div>';
      if (lead.question) html += '<div style="font-size:12px;color:var(--muted);margin-top:2px;font-style:italic">"' + lead.question + '"</div>';
      html += '</div>';
      html += '<div class="session-time"><strong>' + (s.scheduled_date ? fmtDateStr(s.scheduled_date) : '—') + '</strong>' + (s.scheduled_time||'') + '</div>';
      if (s.meet_link) html += '<a href="' + s.meet_link + '" target="_blank" class="detail-btn">🎥 Meet</a>';
      if (assignedTo) {
        html += '<span class="badge badge-confirmed">✓ ' + assignedTo + '</span>';
      } else {
        html += '<button class="update-btn" style="border-color:var(--green);color:var(--green)" onclick="autoAssignReg(' + idx + ')">🎯 Tự động</button>';

      }

    });
  }
  html += '</div>';
  return html;
}

function autoAssignReg(idx) {

  if (!best) { toast('Không còn Sale trống — tất cả đã đầy tải hoặc nghỉ (theo SOP mục 4)', 'error'); return; }
  assignRegToStaff(idx, best.name);

function assignCandidateRowHtml(st, idx, load, limit, full) {

    (full ? '' : 'onmouseover="this.style.borderColor=\'var(--brand)\'" onmouseout="this.style.borderColor=\'var(--border)\'" onclick="assignRegToStaff(' + idx + ',\'' + st.name + '\')"') + '>' +

function openAssignRegModal(idx) {
  var s = (window._newRegSessions||[])[idx];

  var lead = parseConsultNotes(s.notes);
  var saleStaff  = MOCK.staffList.filter(function(st){ return st.role === 'Sale' && st.active; });

  document.getElementById('modal-title').textContent = 'Phân công — ' + (lead.name || s.advisee_name);
  var body = '<div style="font-size:13px;color:var(--muted);margin-bottom:14px">Chọn người phụ trách liên hệ và tư vấn cho khách này. Lượt tư vấn sẽ xuất hiện trong tab tương ứng của người được chọn.</div>';

function loadMeetingCalendarAsync() {
  _calendarContext = 'meetings';
  var mc = document.getElementById('main-content');
  mc.innerHTML = skeletonRows(3);

  apiGet('getSessions', {}).then(function(res){
    var sessions = (res && res.data) ? res.data : [];

      meetingsByDate[d].push({
        type: type,

  });
}

function renderMeetingMonthCalendar(meetingsByDate) {
  const { year, month, weeks } = getCalendarMatrix(calMonthOffset);
  const monthLabel = ['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'][month] + ' ' + year;
  const today = new Date();
  const MAX_VISIBLE = 3;
  const typeColor = { 'Cố vấn 1-1': '#1D4ED8', 'Tư vấn miễn phí': '#F4451A', 'Khoá học': '#7C3AED' };

  let html = '<div class="card"><div class="card-header"><div class="card-header-left">Lịch meeting</div>' +
    '<button class="refresh-btn" onclick="loadMeetingCalendarAsync()">↻ Làm mới</button></div>';
  html += '<div class="cal-nav"><div class="cal-nav-left"><button onclick="changeCalMonth(-1)">‹</button><span class="cal-nav-label">' + monthLabel + '</span><button onclick="changeCalMonth(1)">›</button></div>';
  html += '<button class="cal-today-btn" onclick="goToCalToday()">Hôm nay</button></div>';

  html += '<div class="cal-grid">';
  DAYS_VI_FULL.forEach(function(d){ html += '<div class="cal-weekday-hdr">' + d + '</div>'; });

  weeks.forEach(function(week){
    week.forEach(function(d){
      const dateStr = ymd(d);
      const isOther = d.getMonth() !== month;
      const isToday = isSameDate(d, today);
      const dayMeetings = (meetingsByDate[dateStr] || []).slice().sort(function(a,b){ return (a.time||'').localeCompare(b.time||''); });

      let cls = 'cal-cell cal-cell-google' + (isOther?' other-month':'') + (isToday?' today':'');
      html += '<div class="' + cls + '">';
      html += '<div class="cal-daynum" onclick="openStaffDayModal(\'' + dateStr + '\')">' + d.getDate() + '</div>';
      html += '<div class="cal-event-list">';
      dayMeetings.slice(0, MAX_VISIBLE).forEach(function(m){
        const color = typeColor[m.type] || 'var(--muted)';
        const label = (m.time ? m.time + ' ' : '') + (m.advisee || m.type);
        html += '<div class="cal-event-pill" style="color:' + color + '" onclick="openStaffDayModal(\'' + dateStr + '\')" title="' + String(label).replace(/"/g,'') + '">';
        html += '<span class="cal-event-dot" style="background:' + color + '"></span>' + label;
        html += '</div>';
      });
      if (dayMeetings.length > MAX_VISIBLE) {
        html += '<div class="cal-event-more" onclick="openStaffDayModal(\'' + dateStr + '\')">+' + (dayMeetings.length - MAX_VISIBLE) + ' more</div>';
      }
      html += '</div></div>';
    });
  });
  html += '</div></div>';
  return html;
}

function openStaffDayModal(dateStr) {
  const dateObj = new Date(dateStr + 'T00:00:00');
  const dow = DAYS_VI[dateObj.getDay()];
  document.getElementById('modal-title').textContent = dow + ' ' + dateObj.getDate() + '/' + (dateObj.getMonth()+1);

  const list = (window._meetingsByDate && window._meetingsByDate[dateStr]) || [];
  let html = '';
  if (list.length === 0) {
    html = '<div class="empty-state" style="padding:24px 0"><div class="icon">📭</div>Không có buổi meeting nào ngày này</div>';
  } else {
    list.slice().sort(function(a,b){ return (a.time||'').localeCompare(b.time||''); }).forEach(function(m){
      html += '<div class="day-meeting-item">' + avatarCircle(m.advisee, 34) +
        '<div style="flex:1"><div style="font-weight:600;font-size:14px">' + (m.advisee||'—') + ' · ' + m.type + '</div>' +
        '<div style="font-size:12px;color:var(--muted)">' + (m.advisor||'') + ' · ' + (m.time||'') + '</div></div>';
      if (m.meet_link) html += '<a href="' + m.meet_link + '" target="_blank" class="detail-btn" style="margin-right:6px">🎥 Meet</a>';
      html += '</div>';
    });
  }
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal-actions').innerHTML = '<button class="login-btn" onclick="closeModal()" style="width:auto;padding:10px 24px">Đóng</button>';
  document.getElementById('modal-overlay').classList.add('open');
}

function renderBookedSessions() {
  // Lấy danh sách advisee đang được match với advisor này (từ MOCK.advisees)
  const myAdvisees = MOCK.advisees.filter(function(ae){ return normName(ae.advisor) === normName(currentUser.name); });

  let html = '<div class="card"><div class="card-header"><div class="card-header-left">Buổi đã book & Chuẩn bị meeting</div><button class="refresh-btn" onclick="loadDashboard(\'Advisor\',\'booked\')">↻ Làm mới</button></div>';

  if (myAdvisees.length === 0) {
    html += '<div class="empty-state"><div class="icon">📭</div>Chưa có advisee nào</div></div>';
    return html;
  }

  myAdvisees.forEach(function(ae) {
    html += '<div style="border-top:1px solid var(--border);padding:18px 24px">';
    // Advisee header
    html += '<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">';
    html += avatarCircle(ae.name, 38);
    html += '<div style="flex:1"><div style="font-weight:700;font-size:14px">' + ae.name + '</div>';
    html += '<div style="font-size:12px;color:var(--muted)">Gói ' + ae.pkg + ' · ' + ae.bookingId + '</div></div>';
    html += '<span style="font-size:12px;font-weight:700;color:var(--brand)">' + ae.sessionsDone + '/' + ae.sessionsTotal + ' buổi</span>';
    html += '</div>';

    // Danh sách sessions
    ae.sessions.forEach(function(s) {
      var pd = safeParseYMD(s.date);
      var dateLabel = pd.valid ? (pd.dow + ' ' + pd.dd + '/' + pd.mm + ' · ' + s.timeStart + (s.timeEnd ? '–' + s.timeEnd : '')) : 'Chưa xếp lịch';

      // Status color
      var statusColor = {done:'var(--green)', feedback:'#C2410C', upcoming:'#1D4ED8', locked:'#9CA3AF'}[s.status] || '#9CA3AF';
      var statusLabel = {done:'✓ Hoàn thành', feedback:'Cần feedback', upcoming:'Sắp tới', locked:'Đã khoá'}[s.status] || s.status;

      html += '<div style="border:1.5px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden">';
      // Session row
      html += '<div style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:' + (s.status==='upcoming'?'#F0F9FF':'var(--white)') + '">';
      html += '<div style="font-size:12px;font-weight:700;color:var(--muted);min-width:52px">Buổi ' + s.no + '</div>';
      html += '<div style="flex:1;font-size:13px;color:var(--text)">' + dateLabel + '</div>';
      html += '<span style="font-size:12px;font-weight:700;color:' + statusColor + '">' + statusLabel + '</span>';
      if (s.meetLink && s.status === 'upcoming') html += '<a href="' + s.meetLink + '" target="_blank" class="detail-btn" style="font-size:12px;padding:5px 10px">🎥 Meet</a>';
      html += '</div>';

      // Prep info + Advisor notes
      if (s.status !== 'locked') {
        html += '<div style="padding:12px 16px;border-top:1px solid var(--border);background:#FAFAF8;display:flex;flex-direction:column;gap:10px">';
        html += renderPrepCard(s.prepInfo);

        // Với buổi đã qua — hiện form nhận xét hoặc notes đã điền
        if (s.status === 'done' || s.status === 'feedback') {
          if (s.advisorNotes) {
            html += renderAdvisorNotesCard(s.advisorNotes, true, ae.id, s.no);
          } else {
            html += renderAdvisorNotesForm(ae.id, s.no);
          }
        }
        html += '</div>';
      }
      html += '</div>'; // end session card
    });

    html += '</div>'; // end advisee block
  });

  html += '</div>';
  return html;
}

function renderStaff(tab) {
  const c = document.getElementById('main-content');
  if      (tab === 'lj-newreg')         loadNewRegistrationsPage();
  else if (tab === 'lj-revenue')        c.innerHTML = renderRevenuePage();
  else if (tab === 'lj-report')         c.innerHTML = renderReportPage();
  else if (tab === 'linkajob-calendar' || tab === 'lj-meetings') c.innerHTML = renderMeetingCalendar();
  else if (tab === 'lj-products')       c.innerHTML = renderProductsPage();
  else if (tab === 'stf-list')          c.innerHTML = renderStaffListPage();
  else if (tab === 'stf-schedule')      c.innerHTML = renderStaffSchedulePage();
  else if (tab === 'advisor-mod')       c.innerHTML = renderAdvisorModule();
  else if (tab === 'adv-new')           c.innerHTML = renderAdvisorNewForm();
  else if (tab === 'advisee-mod')       c.innerHTML = renderAdviseeModule();
  else if (tab === 'course-mod')        c.innerHTML = renderCourseModule();
  else if (tab === 'aee-reschedule')    loadRescheduleRequestsPage();
  else c.innerHTML = renderRevenuePage();
}

const ROLE_COLORS = {
  'Sale':        ['#DBEAFE','#1D4ED8'],
  'Operations':  ['#D1FAE5','#065F46'],
  'Marketing':   ['#EDE9FE','#6D28D9'],

function roleBadge(role) {
  const c = ROLE_COLORS[role] || ['#F3F4F6','#374151'];
  return '<span style="background:' + c[0] + ';color:' + c[1] + ';font-size:11px;font-weight:700;padding:2px 8px;border-radius:100px">' + role + '</span>';
}

function renderStaffListPage() {
  let html = pageHeader('Nhân viên', 'Quản lý nhân sự LinkaJob');

  // KPI nhanh
  const active = MOCK.staffList.filter(function(s){ return s.active; });
  const saleCount = active.filter(function(s){ return s.role === 'Sale'; }).length;
  html += '<div class="stats-row" style="grid-template-columns:repeat(3,1fr);margin-bottom:20px">';
  html += '<div class="stat-cell"><div class="stat-num">' + active.length + '</div><div class="stat-label">Nhân viên đang hoạt động</div></div>';
  html += '<div class="stat-cell"><div class="stat-num">' + saleCount + '</div><div class="stat-label">Sale đang hoạt động</div></div>';
  html += '<div class="stat-cell"><div class="stat-num">' + (MOCK.staffList.length - active.length) + '</div><div class="stat-label">Tạm nghỉ / Nghỉ việc</div></div>';
  html += '</div>';

  // Bảng danh sách
  html += '<div class="card">';
  html += '<div class="card-header"><div class="card-header-left">Danh sách nhân viên</div>';
  html += '<button class="submit-btn" style="padding:8px 16px;font-size:13px" onclick="openAddStaffModal()">+ Thêm nhân viên</button>';
  html += '</div>';
  html += '<table class="bookings-table"><thead><tr><th>HỌ TÊN</th><th>VỊ TRÍ</th><th>EMAIL / SĐT</th><th>TẢI LEAD</th><th>NGÀY VÀO</th><th>TRẠNG THÁI</th><th></th></tr></thead><tbody>';
  MOCK.staffList.forEach(function(s, i){
    html += '<tr>';
    html += '<td><div style="display:flex;align-items:center;gap:10px">' + avatarCircle(s.name,32) + '<div><div style="font-weight:600">' + s.name + '</div><div style="font-size:12px;color:var(--muted)">' + s.note + '</div></div></div></td>';
    html += '<td>' + roleBadge(s.role) + '</td>';
    html += '<td><div style="font-size:13px">' + s.email + '</div><div style="font-size:12px;color:var(--muted)">' + s.phone + '</div></td>';
    if (s.role === 'Sale') {
      var load = getStaffLeadLoad(s.name), limit = s.leadLimit || 30;
      var full = load >= limit;
      html += '<td><span style="font-size:13px;font-weight:700;' + (full?'color:var(--brand)':'') + '">' + load + '/' + limit + '</span>' + (full?' <span style="font-size:11px;color:var(--brand)">Đầy tải</span>':'') + '</td>';
    } else {
      html += '<td style="color:var(--muted);font-size:13px">—</td>';
    }
    html += '<td style="font-size:13px">' + s.joinDate + '</td>';
    html += '<td>' + (s.active ? '<span class="badge badge-confirmed">Đang làm</span>' : '<span class="badge badge-cancelled">Tạm nghỉ</span>') + '</td>';
    html += '<td style="display:flex;gap:6px">';
    html += '<button class="update-btn" onclick="navToStaffMemberDetail(\'' + s.id + '\')">Chi tiết →</button>';
    if (s.role === 'Sale') html += '<button class="update-btn" style="border-color:#6D28D9;color:#6D28D9" onclick="navTo(\'stf-schedule\')">📅 Lịch</button>';
    html += '</td></tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

function updateExtendPrice() {
  var weeks = Math.max(1, Number(document.getElementById('extend-weeks').value) || 1);
  document.getElementById('extend-price').textContent = (weeks * 100000).toLocaleString('vi-VN') + 'đ';
}
function confirmExtend(aeId) {
  var ae = MOCK.advisees.find(function(x){ return x.id === aeId; });
  var weeks = Math.max(1, Number(document.getElementById('extend-weeks').value) || 1);
  var btn = document.getElementById('extend-submit-btn');
  btn.innerHTML = '<span class="spinner"></span>'; btn.disabled = true;
  apiPost({
    action: 'renewBooking', booking_id: aeId, weeks: weeks,
    advisee_name: ae ? ae.name : currentUser.name, advisee_email: ae ? ae.email : currentUser.email, advisee_phone: ae ? ae.phone : '',
  }).then(function(res){
    if (!res || !res.success) { toast('Lỗi: ' + (res && res.error), 'error'); btn.innerHTML = 'Tạo mã thanh toán'; btn.disabled = false; return; }
    window.location.href = res.payment_url;
  }).catch(function(e){ toast('Lỗi kết nối: ' + e.message, 'error'); btn.innerHTML = 'Tạo mã thanh toán'; btn.disabled = false; });
}

function openUpgradePackageModal(aeId) {
  var ae = MOCK.advisees.find(function(x){ return x.id === aeId; });
  document.getElementById('modal-title').textContent = '⬆ Nâng cấp gói';
  document.getElementById('modal-body').innerHTML = '<div class="empty-state">Đang tải danh sách gói...</div>';
  document.getElementById('modal-actions').innerHTML = '<button class="btn-secondary" onclick="closeModal()" style="width:auto;padding:10px 20px">Đóng</button>';
  document.getElementById('modal-overlay').classList.add('open');

  apiGet('getPackages', { only_active: 1 }).then(function(res){
    var pkgs = (res && res.data) ? res.data : [];
    var oldPkg = pkgs.find(function(p){ return p.name === ae.pkg; });
    var oldPrice = oldPkg ? Number(oldPkg.price) || 0 : 0;
    var candidates = pkgs.filter(function(p){ return p.name !== ae.pkg && (Number(p.price) || 0) > oldPrice; });

    var html = '<div style="font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:14px">' +
      'Gói hiện tại: <strong>' + ae.pkg + '</strong> — đã dùng <strong>' + ae.sessionsDone + '/' + ae.sessionsTotal + '</strong> buổi, hết hạn <strong>' + fmtDateVN(ae.expiry) + '</strong>.<br>' +
      'Buổi đã dùng và thời gian đã học sẽ được <strong>giữ nguyên</strong>, không tính lại từ đầu.</div>';

    if (candidates.length === 0) {
      html += '<div class="empty-state">Không có gói nào cao hơn gói hiện tại để nâng cấp.</div>';
    } else {
      html += '<div style="display:flex;flex-direction:column;gap:10px">';
      candidates.forEach(function(p){
        var fee = Math.round((Number(p.price) || 0) - oldPrice);
        var startDate = new Date((ae.registeredAt || ae.expiry) + 'T00:00:00');
        var previewExpiry = new Date(startDate.getTime() + (Number(p.days) || 0) * 86400000);
        var previewExpiryStr = previewExpiry.getDate() + '/' + (previewExpiry.getMonth() + 1) + '/' + previewExpiry.getFullYear();
        html += '<div style="border:1.5px solid var(--border);border-radius:12px;padding:14px 16px;cursor:pointer" onmouseover="this.style.borderColor=\'var(--brand)\'" onmouseout="this.style.borderColor=\'var(--border)\'" onclick="confirmUpgrade(\'' + aeId + '\',\'' + p.name + '\',' + fee + ')">' +
          '<div style="font-weight:700;font-size:14px;margin-bottom:4px">' + p.name + '</div>' +
          '<div style="font-size:12.5px;color:var(--muted);margin-bottom:8px">Sau nâng cấp: <strong>' + ae.sessionsDone + '/' + (Number(p.sessions) || 0) + '</strong> buổi · hết hạn <strong>' + previewExpiryStr + '</strong></div>' +
          '<div style="font-size:13px;font-weight:700;color:var(--brand)">Phí chênh lệch: ' + fee.toLocaleString('vi-VN') + 'đ</div>' +
        '</div>';
      });
      html += '</div>';
    }

// Tải lịch trống THẬT từ Sheet (AvailableSlots) cho 1 nhân viên, thay vì chỉ đọc MOCK.saleSlots trong bộ nhớ.
// Toàn bộ slot tư vấn miễn phí nằm chung dưới identity STAFF_SLOT_IDENTITY (khớp với widget public),
// nên phải lọc thêm theo created_by để biết slot nào của đúng nhân viên đang xem.
function loadStaffScheduleTabAsync() {
  var s = MOCK.staffList.find(function(x){ return x.id === _staffDetailId; });
  if (!s) return;

  apiGet('getSlots', { advisor: STAFF_SLOT_IDENTITY }).then(function(res){
    var allSlots = (res && res.data) ? res.data : [];
    // Nhận diện slot của nhân viên này bằng created_by, fallback theo advisor_email
    // nếu Sheet chưa lưu/trả cột created_by (đây chính là nguyên nhân bug "0 slot").
    var mySlots = allSlots.filter(function(rs){
      var byCreator = (rs.created_by || '') === s.name;
      var byEmail = !rs.created_by && rs.advisor_email && s.email && rs.advisor_email === s.email;
      return byCreator || byEmail;
    });

    // Merge thêm — KHÔNG xoá sạch mảng local trước, để slot vừa gửi (optimistic)
    // không bị biến mất nếu response từ Sheet thiếu/trễ.
    mySlots.forEach(function(rs){
      var d = String(rs.date || '').slice(0, 10);
      var t = rs.time_start;
      var existing = MOCK.saleSlots.find(function(sl){ return sl.staff === s.name && sl.date === d && sl.time === t; });
      var status = rs.status === 'booked' ? 'booked' : 'available';
      var client = rs.status === 'booked' ? (rs.booking_id || 'Đã đặt') : '';
      if (existing) {
        existing.status = status; existing.client = client; existing.slot_id = rs.slot_id;
      } else {
        MOCK.saleSlots.push({ staff: s.name, date: d, time: t, status: status, client: client, note: 'Tư vấn miễn phí', slot_id: rs.slot_id });
      }
    });

    if (_staffDetailTab === 'schedule') {
      document.getElementById('main-content').innerHTML = renderStaffMemberDetail(_staffDetailId, 'schedule', _staffDetailSelfView);
    }
  }).catch(function(err){
    // Lỗi mạng: giữ nguyên dữ liệu local đã có (không xoá), chỉ báo lỗi nhẹ
    console.warn('Không đồng bộ được lịch từ Sheet:', err.message);
  });
}

function handleConsultResultChange(cid, value) {
  var c = MOCK.consultations.find(function(x){ return x.id === cid; });
  if (!c) return;
  var newResult = value === '— Chưa có —' ? '' : value;
  c.result = newResult;

  if (newResult === 'Đăng ký') {
    // Nếu khách đã tự đăng ký trên web trùng tên/email → tự động tính doanh thu
    // cho đúng Sale phụ trách lượt tư vấn này (không tạo trùng hồ sơ Advisee).
    var existing = MOCK.advisees.find(function(ae){ return ae.email === c.email || ae.name === c.name; });
    if (existing) {
      toast('Khách đã có hồ sơ Advisee (trùng thông tin) — đã ghi nhận doanh thu cho ' + c.staff + ' ✅', 'success');
      refreshStaffTab();
      return;

// Trạng thái "độ mới" của lead — chỉ 2 mức theo yêu cầu:
// - Chưa liên hệ: "Lead mới — liên hệ trong 1 tiếng"
// - Quá 3 ngày mà vẫn chưa chốt được lịch: "Lead quá hạn"
function getLeadFreshness(c) {
  var anchor = (c.log && c.log[0]) ? parseVNDateTime(c.log[0].time) : new Date();
  var now = new Date();
  var days = anchor ? Math.floor((now - anchor) / 86400000) : 0;
  if (days > 3) {
    return { label: '⚠ Lead quá hạn — quá 3 ngày chưa chốt lịch', bg: '#FEE2E2', color: '#B91C1C' };
  }
  return { label: '🆕 Lead mới — liên hệ trong 1 tiếng', bg: '#DBEAFE', color: '#1D4ED8' };
}

function generateMeetForConsult(cid) {
  var c = MOCK.consultations.find(function(x){ return x.id === cid; });

  var d = document.getElementById('cv-newdate').value;
  var t = document.getElementById('cv-newtime').value;
  if (!d || !t) { toast('Chọn ngày và giờ trước khi tạo Meet', 'error'); return; }

  var btn = document.getElementById('cv-genmeet-btn');
  var linkInput = document.getElementById('cv-newlink');
  var oldLabel = btn.textContent;
  btn.textContent = '⏳ Đang tạo...';
  btn.disabled = true;

  var staffObj = MOCK.staffList.find(function(x){ return x.name === c.staff; });
  var staffEmail = staffObj ? staffObj.email : '';

  apiPost({
    action: 'createMeetLink',
    date: d, time: t, duration_minutes: 20,
    title: 'Tư vấn LinkaJob — ' + c.name,
    guest_name: c.name,
    guests: [c.email, staffEmail].filter(Boolean),
  }).then(function(res){
    btn.disabled = false;
    if (res && res.success && res.meetLink) {
      linkInput.value = res.meetLink;
      btn.textContent = '✓ Đã tạo';
      toast('Đã tạo Google Meet tự động ✅', 'success');
    } else {
      btn.textContent = oldLabel;
      toast('Không tạo được Meet tự động — dán link tay vào ô bên cạnh nhé', 'error');
    }
  }).catch(function(err){
    btn.disabled = false;
    btn.textContent = oldLabel;
    toast('Lỗi kết nối: ' + err.message + ' — dán link tay vào ô bên cạnh nhé', 'error');
  });
}

function renderStaffCalendarMonth(staffName) {
  var byDate = window._staffCalByDate || {};
  var base = new Date(); base.setDate(1); base.setMonth(base.getMonth() + staffCalMonthOffset);
  var year = base.getFullYear(), month = base.getMonth();
  var firstOfMonth = new Date(year, month, 1);
  var startDay = firstOfMonth.getDay();
  var gridStart = new Date(firstOfMonth);
  gridStart.setDate(gridStart.getDate() - (startDay === 0 ? 6 : startDay - 1));

  var monthLabel = ['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'][month] + ' ' + year;
  var today = new Date();

  var html = '<div class="card"><div class="cal-nav"><div class="cal-nav-left">' +
    '<button onclick="changeStaffCalMonth(-1)">‹</button><span class="cal-nav-label">' + monthLabel + '</span><button onclick="changeStaffCalMonth(1)">›</button>' +
    '</div><button class="cal-today-btn" onclick="goToStaffCalToday()">Hôm nay</button></div>';

  html += '<div class="cal-grid">';
  DAYS_VI_FULL.forEach(function(d){ html += '<div class="cal-weekday-hdr">' + d + '</div>'; });

  var cursor = new Date(gridStart);
  for (var w = 0; w < 6; w++) {
    for (var d = 0; d < 7; d++) {
      var dateStr = ymd(cursor);
      var isOther = cursor.getMonth() !== month;
      var isToday = ymd(cursor) === ymd(today);
      var counts = byDate[dateStr] || { available: 0, booked: 0 };
      html += '<div class="cal-cell' + (isOther?' other-month':'') + (isToday?' today':'') + '" onclick="openStaffSlotDayModal(\'' + dateStr + '\')">';
      html += '<div class="cal-daynum">' + cursor.getDate() + '</div><div class="cal-add">+</div>';
      html += '<div class="cal-badges">';
      if (counts.available > 0) html += '<span class="cal-badge slot">' + counts.available + ' trống</span>';
      if (counts.booked > 0) html += '<span class="cal-badge meeting">' + counts.booked + ' đã đặt</span>';
      html += '</div></div>';
      cursor.setDate(cursor.getDate() + 1);
    }
  }
  html += '</div></div>';
  return html;
}

// ── Tab 3: Chăm sóc khách hàng ──
// ── Tab: KPI cá nhân (theo mục 5.1 SOP) ──
// Doanh thu quy đổi cho 1 Sale, dựa trên các consultation đã "Đăng ký ..."
// (paid lấy từ hồ sơ Advisee tương ứng theo tên).
function getStaffRevenueStats(staffName) {
  var mine = MOCK.consultations.filter(function(c){ return c.staff === staffName; });
  var now = new Date();
  var weekAgo = new Date(now); weekAgo.setDate(now.getDate() - 7);
  var monthAgo = new Date(now); monthAgo.setDate(now.getDate() - 30);

  var occurred = mine.filter(function(c){ return c.date && new Date(c.date + 'T' + (c.time||'00:00')) <= now; });
  var converted = occurred.filter(function(c){ return c.result && c.result.indexOf('Đăng ký') === 0; });

  var weekRevenue = 0, monthRevenue = 0;
  converted.forEach(function(c){
    var ae = MOCK.advisees.find(function(x){ return x.name === c.name; });
    var paid = ae ? ae.paid : 0;
    var d = new Date(c.date + 'T' + (c.time||'00:00'));
    if (d >= weekAgo) weekRevenue += paid;
    if (d >= monthAgo) monthRevenue += paid;
  });

  var conversionRate = occurred.length ? Math.round(converted.length / occurred.length * 100) : 0;

  return {
    weekRevenue: weekRevenue, monthRevenue: monthRevenue,
    occurredCount: occurred.length, convertedCount: converted.length,
    conversionRate: conversionRate,
  };
}

function renderStaffKpiTab(s) {
  var stats = getStaffRevenueStats(s.name);
  var html = '';

  // ── 2 KPI chính ──
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">';

  // KPI 1: Doanh thu tuần
  var weekTarget = 7000000;
  var weekPct = Math.min(100, Math.round(stats.weekRevenue / weekTarget * 100));
  var weekPass = stats.weekRevenue >= weekTarget;
  html += '<div class="card"><div style="padding:20px 24px">';
  html += '<div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">🎯 Doanh thu tuần này</div>';
  html += '<div style="font-size:26px;font-weight:800;color:' + (weekPass?'var(--green)':'var(--text)') + ';margin-bottom:4px">' + fmtMoney(stats.weekRevenue) + '</div>';
  html += '<div style="font-size:12.5px;color:var(--muted);margin-bottom:12px">Mục tiêu: ' + fmtMoney(weekTarget) + '/tuần</div>';
  html += '<div style="height:10px;background:var(--bg);border-radius:100px;overflow:hidden"><div style="height:100%;width:' + weekPct + '%;background:' + (weekPass?'var(--green)':'var(--brand)') + ';border-radius:100px;transition:width .4s"></div></div>';
  html += '<div style="margin-top:8px;font-size:12.5px;font-weight:700;color:' + (weekPass?'var(--green)':'var(--brand)') + '">' + (weekPass ? '✅ Đã đạt mục tiêu tuần!' : weekPct + '% mục tiêu') + '</div>';
  html += '</div></div>';

  // KPI 2: Tỷ lệ chuyển đổi
  var convPass = stats.conversionRate >= 60;
  html += '<div class="card"><div style="padding:20px 24px">';
  html += '<div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">🎯 Tỷ lệ chuyển đổi</div>';
  html += '<div style="font-size:26px;font-weight:800;color:' + (convPass?'var(--green)':'var(--text)') + ';margin-bottom:4px">' + stats.conversionRate + '%</div>';
  html += '<div style="font-size:12.5px;color:var(--muted);margin-bottom:12px">' + stats.convertedCount + '/' + stats.occurredCount + ' buổi tư vấn đã đăng ký · Mục tiêu ≥ 60%</div>';
  html += '<div style="height:10px;background:var(--bg);border-radius:100px;overflow:hidden"><div style="height:100%;width:' + Math.min(100,stats.conversionRate) + '%;background:' + (convPass?'var(--green)':'#F59E0B') + ';border-radius:100px;transition:width .4s"></div></div>';
  html += '<div style="margin-top:8px;font-size:12.5px;font-weight:700;color:' + (convPass?'var(--green)':'#92400E') + '">' + (convPass ? '✅ Đã đạt mục tiêu chuyển đổi!' : 'Cần thêm ' + (60-stats.conversionRate) + '% để đạt mục tiêu') + '</div>';
  html += '</div></div>';

  html += '</div>';

  // ── Bảng thưởng theo doanh thu tháng — dạng "qua màn" ──
  var tiers = [
    { threshold: 30000000, bonus: 1000000,  label: 'Cấp 1', icon: '🥉' },
    { threshold: 45000000, bonus: 3000000,  label: 'Cấp 2', icon: '🥈' },
    { threshold: 60000000, bonus: 5000000,  label: 'Cấp 3', icon: '🥇' },
    { threshold: Infinity, bonus: null,     label: 'Cấp 4', icon: '👑', percentBonus: 0.10 },
  ];
  var monthRevenue = stats.monthRevenue;
  var maxFiniteTier = 60000000;
  var progressCap = Math.max(monthRevenue, 1);
  var overallPct = Math.min(100, Math.round(monthRevenue / maxFiniteTier * 100));

  html += '<div class="card"><div class="card-header"><div class="card-header-left">🏆 Thưởng doanh thu tháng — ' + fmtMoney(monthRevenue) + ' / tháng</div></div>';
  html += '<div style="padding:28px 24px 32px">';

  // Thanh path kiểu game với các mốc
  html += '<div style="position:relative;padding:0 20px">';
  html += '<div style="position:absolute;top:27px;left:20px;right:20px;height:6px;background:var(--bg);border-radius:100px;overflow:hidden;z-index:0">';
  html += '<div style="height:100%;width:' + overallPct + '%;background:linear-gradient(90deg,#F59E0B,var(--brand));border-radius:100px;transition:width .5s"></div>';
  html += '</div>';

  html += '<div style="display:flex;justify-content:space-between;position:relative;z-index:1">';
  tiers.forEach(function(tier, i){
    var achieved = monthRevenue >= tier.threshold || (tier.threshold === Infinity && monthRevenue >= maxFiniteTier);
    var isCurrentTarget = !achieved && (i === 0 || monthRevenue >= tiers[i-1].threshold);
    var circleColor = achieved ? 'var(--brand)' : '#E5E7EB';
    var circleTextColor = achieved ? '#fff' : '#9CA3AF';
    var bonusLabel = tier.percentBonus ? '10% doanh thu' : fmtMoney(tier.bonus);
    var thresholdLabel = tier.threshold === Infinity ? '> ' + fmtMoney(maxFiniteTier) : fmtMoney(tier.threshold);

    html += '<div style="display:flex;flex-direction:column;align-items:center;gap:8px;width:23%;text-align:center">';
    html += '<div style="width:56px;height:56px;border-radius:50%;background:' + circleColor + ';color:' + circleTextColor + ';display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:' + (isCurrentTarget?'0 0 0 4px var(--brand-light)':'none') + ';transition:all .3s">' + (achieved ? '✓' : tier.icon) + '</div>';
    html += '<div style="font-size:12px;font-weight:800;color:' + (achieved?'var(--brand)':'var(--muted)') + '">' + tier.label + '</div>';
    html += '<div style="font-size:11px;color:var(--muted)">' + thresholdLabel + '</div>';
    html += '<div style="font-size:12px;font-weight:700;color:' + (achieved?'var(--green)':'var(--text)') + '">🎁 ' + bonusLabel + '</div>';
    if (isCurrentTarget) html += '<div style="font-size:10.5px;color:var(--brand);font-weight:700">← Đang hướng tới</div>';
    html += '</div>';
  });
  html += '</div></div>';

  // Thưởng thực nhận tháng này
  var earnedBonus = 0, earnedLabel = 'Chưa đạt mốc thưởng nào';
  for (var i = tiers.length - 1; i >= 0; i--) {
    if (tiers[i].threshold === Infinity) {
      if (monthRevenue > maxFiniteTier) { earnedBonus = Math.round(monthRevenue * tiers[i].percentBonus); earnedLabel = '10% doanh thu tháng (Cấp 4)'; break; }
    } else if (monthRevenue >= tiers[i].threshold) {
      earnedBonus = tiers[i].bonus; earnedLabel = tiers[i].label; break;
    }
  }
  html += '<div style="margin-top:24px;background:var(--brand-light);border-radius:14px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">';
  html += '<div><div style="font-size:12px;font-weight:700;color:var(--brand);text-transform:uppercase;letter-spacing:.05em">Thưởng tháng này</div><div style="font-size:13px;color:var(--muted);margin-top:2px">' + earnedLabel + '</div></div>';
  html += '<div style="font-size:26px;font-weight:800;color:var(--brand)">' + fmtMoney(earnedBonus) + '</div>';
  html += '</div>';

  html += '</div></div>';

  html += '<div class="card"><div style="padding:16px 24px;font-size:12.5px;color:var(--muted);line-height:1.7">💡 Doanh thu tháng được tính từ các buổi tư vấn của bạn có kết quả "Đăng ký..." trong 30 ngày gần nhất. KPI không đạt 2 tháng liên tiếp ở cùng 1 chỉ số → lên kế hoạch đào tạo lại, không mặc định là kỷ luật.</div></div>';

  return html;
}

      var delayNotices = [];

// Chỉ cần 1 lần gọi vào pool chung STAFF_SLOT_IDENTITY, sau đó tách theo created_by cho từng người.
function loadStaffSchedulePageAsync() {
  var mc = document.getElementById('main-content');
  mc.innerHTML = skeletonRows(3);
  var saleStaff = MOCK.staffList.filter(function(s){ return s.role === 'Sale' && s.active; });
  var saleNames = saleStaff.map(function(s){ return s.name; });

  Promise.all([
    apiGet('getSlots', { advisor: STAFF_SLOT_IDENTITY }).catch(function(){ return null; }),
    apiGet('getSessions', { advisor: 'LinkaJob Team' }).catch(function(){ return null; })
  ]).then(function(results){
    var slotRes = results[0], sessRes = results[1];

    var allSlots = (slotRes && slotRes.data) ? slotRes.data : [];
    MOCK.saleSlots = MOCK.saleSlots.filter(function(sl){ return saleNames.indexOf(sl.staff) === -1; });
    allSlots.forEach(function(rs){
      var owner = rs.created_by || '';
      if (saleNames.indexOf(owner) === -1) return;
      MOCK.saleSlots.push({
        staff: owner,
        date: String(rs.date || '').slice(0, 10),
        time: rs.time_start,
        status: rs.status === 'booked' ? 'booked' : 'available',
        client: rs.status === 'booked' ? (rs.booking_id || 'Đã đặt') : '',
        note: 'Tư vấn miễn phí',
        slot_id: rs.slot_id,
      });
    });

    var sessions = (sessRes && sessRes.data) ? sessRes.data : [];
    sessions.sort(function(a,b){
      return extractSessionTimestamp(b.session_id) > extractSessionTimestamp(a.session_id) ? 1 : -1;
    });
    window._newRegSessions = sessions;

    mc.innerHTML = renderNewRegistrationsList(sessions) + renderStaffSchedulePage();
  }).catch(function(err){
    toast('Không tải được dữ liệu: ' + err.message, 'error');
    mc.innerHTML = renderStaffSchedulePage();
  });
}

var _saleModalStaffName = null;

function openSaleScheduleModal(staffName) {

  document.getElementById('modal-title').textContent = '📅 Thêm lịch trống — ' + staffName;

  var modalBox = document.querySelector('.modal');

function renderSaleScheduleModalBody() {
  const staffName = _saleModalStaffName;
  const existingKeys = {};
  MOCK.saleSlots.forEach(function(sl){
    if (sl.staff === staffName) existingKeys[sl.date + '_' + sl.time] = sl.status;
  });

  // Đếm số slot đã chọn/đã có mỗi ngày để hiện chấm trên tab ngày
  function countForDay(d) {
    const dateStr = ymd(d);
    let n = 0;
    ['09:00','10:00','11:00','14:00','15:00','16:00','17:00','19:00','20:00'].forEach(function(t){
      const key = dateStr + '_' + t;
      if (selectedSaleSlots.has(key) || existingKeys[key] === 'available') n++;
    });
    return n;
  }

  let html = '<div style="font-size:13px;color:var(--muted);margin-bottom:14px">Chọn ngày rồi bấm giờ trống cho <b>' + staffName + '</b>. Mỗi buổi 20 phút tư vấn miễn phí.</div>';

  // Thanh chọn ngày
  html += '<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;border-bottom:1.5px solid var(--border)">';
  _saleModalDays.forEach(function(d, i){
    const dow = DAYS_VI[d.getDay()];
    const active = i === _saleModalDayIdx;
    const cnt = countForDay(d);
    html += '<button onclick="switchSaleModalDay(' + i + ')" style="flex-shrink:0;min-width:56px;padding:8px 6px;border-radius:10px;border:1.5px solid ' + (active?'var(--brand)':'var(--border)') + ';background:' + (active?'var(--brand)':'var(--white)') + ';color:' + (active?'#fff':'var(--text)') + ';cursor:pointer;text-align:center;font-family:inherit">';
    html += '<div style="font-size:11px;font-weight:600">' + dow + '</div><div style="font-size:13px;font-weight:700">' + d.getDate() + '/' + (d.getMonth()+1) + '</div>';
    if (cnt > 0) html += '<div style="font-size:9px;margin-top:2px;' + (active?'color:#fff':'color:var(--brand)') + '">' + cnt + ' slot</div>';
    html += '</button>';
  });
  html += '</div>';

  // Giờ trong ngày đang chọn
  const curDay = _saleModalDays[_saleModalDayIdx];
  const dateStr = ymd(curDay);
  const dow = DAYS_VI[curDay.getDay()];
  html += '<div style="font-size:13px;font-weight:700;margin-bottom:10px">' + dow + ' ' + curDay.getDate() + '/' + (curDay.getMonth()+1) + ' — chọn giờ trống</div>';
  html += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px" id="sale-slot-grid">';
  ['09:00','10:00','11:00','14:00','15:00','16:00','17:00','19:00','20:00'].forEach(function(t){
    const key = dateStr + '_' + t;
    const exist = existingKeys[key];
    let cls = 'day-time-chip';
    let disabled = '';
    let label = '<b>' + t + '</b>';
    if (exist === 'booked') { cls += ' booked'; disabled = 'disabled'; label += '<br><span style="font-size:9px">Đã đặt</span>'; }
    else if (selectedSaleSlots.has(key) || exist === 'available') { cls += ' selected'; label += '<br><span style="font-size:9px">' + (exist==='available'?'Đã có':'Mới chọn') + '</span>'; }
    html += '<button class="' + cls + '" data-key="' + key + '" ' + disabled + ' onclick="toggleSaleSlot(this,\'' + key + '\')" style="padding:12px 4px;font-size:13px;line-height:1.4">' + label + '</button>';
  });
  html += '</div>';

  html += '<div style="font-size:12px;color:var(--muted);margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">Tổng đã chọn (tất cả các ngày): <span id="sale-sel-count" style="color:var(--brand);font-weight:700">' + selectedSaleSlots.size + '</span> slot</div>';

  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal-body').style.maxHeight = '65vh';
  document.getElementById('modal-body').style.overflowY = 'auto';
  document.getElementById('modal-actions').innerHTML =
    '<button class="btn-secondary" onclick="closeModal()" style="width:auto;padding:10px 20px">Huỷ</button>' +
    '<button class="login-btn" id="sale-send-btn" onclick="saveSaleSlots(\'' + staffName + '\')" style="width:auto;padding:10px 24px">Lưu lịch trống (' + selectedSaleSlots.size + ')</button>';
}

function switchSaleModalDay(idx) {
  _saleModalDayIdx = idx;

function toggleSaleSlot(btn, key) {
  if (btn.classList.contains('booked')) return;
  if (selectedSaleSlots.has(key)) selectedSaleSlots.delete(key);
  else selectedSaleSlots.add(key);
  renderSaleScheduleModalBody();
}

function saveSaleSlots(staffName) {
  if (selectedSaleSlots.size === 0) { toast('Chưa chọn giờ nào!', 'error'); return; }
  var st = MOCK.staffList.find(function(x){ return x.name === staffName; });
  var btn = document.getElementById('sale-send-btn');
  if (btn) { btn.innerHTML = '<span class="spinner"></span> Đang lưu...'; btn.disabled = true; }

  var slotsToAdd = Array.from(selectedSaleSlots); // ["2026-07-20_09:00", ...]

  apiPost({
    action: 'addSlots',
    advisor: STAFF_SLOT_IDENTITY,
    advisor_email: st ? st.email : '',
    created_by: staffName,
    slots: slotsToAdd,
    duration_minutes: 20,
  }).then(function(res){
    if (res && res.success) {
      // ── Optimistic update: hiện ngay trên UI, không đợi fetch lại Sheet ──
      slotsToAdd.forEach(function(key){
        var parts = key.split('_');
        var d = parts[0], t = parts[1];
        var already = MOCK.saleSlots.some(function(sl){ return sl.staff === staffName && sl.date === d && sl.time === t; });
        if (!already) {
          MOCK.saleSlots.push({ staff: staffName, date: d, time: t, status: 'available', client: '', note: 'Tư vấn miễn phí', slot_id: null });
        }
      });

      toast('Đã lưu ' + slotsToAdd.length + ' slot cho ' + staffName + ' ✅', 'success');
      selectedSaleSlots.clear();
      closeModal();
      if (_staffDetailId) document.getElementById('main-content').innerHTML = renderStaffMemberDetail(_staffDetailId, 'schedule', _staffDetailSelfView);
      else navTo('stf-schedule');

      // Đồng bộ nền với Sheet (không xoá dữ liệu local nếu Sheet thiếu cột created_by)
      if (_staffDetailId) loadStaffScheduleTabAsync();
    } else {
      toast('Lỗi: ' + (res && res.error ? res.error : 'không lưu được lên Sheet'), 'error');
      if (btn) { btn.innerHTML = 'Lưu lịch trống đã chọn'; btn.disabled = false; }
    }
  }).catch(function(err){
    toast('Lỗi kết nối: ' + err.message, 'error');
    if (btn) { btn.innerHTML = 'Lưu lịch trống đã chọn'; btn.disabled = false; }
  });
}

function deleteSaleSlot(i) {
  var sl = MOCK.saleSlots[i];
  if (!sl) return;

  if (!sl.slot_id) {
    MOCK.saleSlots.splice(i, 1);
    toast('Đã xoá slot (chỉ ở local, chưa từng lưu lên Sheet)', 'success');
    navTo('stf-schedule');
    return;
  }

  toast('Đang xoá trên Sheet...', '');
  apiPost({ action: 'deleteSlot', slot_id: sl.slot_id }).then(function(res){
    if (res && res.success) toast('Đã xoá slot ✅', 'success');
    else toast('Lỗi: ' + (res && res.error ? res.error : 'không xoá được'), 'error');
    loadStaffSchedulePageAsync();
  }).catch(function(err){
    toast('Lỗi kết nối: ' + err.message, 'error');
  });
}

function saveNewAdvisor() {
  var name = document.getElementById('na-name').value.trim();
  var title = document.getElementById('na-title').value.trim();
  var email = document.getElementById('na-email').value.trim();
  var phone = document.getElementById('na-phone').value.trim();
  if (!name || !title || !email || !phone) { toast('Vui lòng điền đầy đủ các trường bắt buộc (*)', 'error'); return; }

  var supportItems = [];
  for (var i = 0; i < 3; i++) {
    var t = document.getElementById('na-si-title-' + i).value.trim();
    if (t) supportItems.push({ icon: document.getElementById('na-si-icon-' + i).value.trim() || '✦', title: t, desc: document.getElementById('na-si-desc-' + i).value.trim() });
  }

  var experience = [];
  document.querySelectorAll('#na-exp-list .ea-exp-row').forEach(function(row){
    var t = row.querySelector('.ea-exp-title').value.trim();
    if (!t) return;
    experience.push({
      title: t,
      company: row.querySelector('.ea-exp-company').value.trim(),
      type: row.querySelector('.ea-exp-type').value,
      location: row.querySelector('.ea-exp-location').value.trim(),
      dateRange: row.querySelector('.ea-exp-daterange').value.trim(),
      desc: row.querySelector('.ea-exp-desc').value.trim(),
    });
  });

  var products = Array.from(document.querySelectorAll('.na-pkg-cb:checked')).map(function(cb){ return cb.value; });

  apiPost({
    action: 'registerAdvisor',
    name: name, role: title,
    company: document.getElementById('na-company').value.trim(),
    industry: document.getElementById('na-tags').value.trim(),
    email: email, phone: phone,
    bio: document.getElementById('na-bio').value.trim(),
    experience: experience,
  }).then(function(res){
    if (res && res.success) {
      toast('Đã thêm ' + name + ' — cần vào Sheet đổi is_active = TRUE để hiện trên web ✅', 'success');
      navTo('adv-list');
    } else {
      toast('Lỗi khi lưu lên Sheet: ' + (res && res.error), 'error');
    }
  }).catch(function(err){
    toast('Lỗi kết nối: ' + err.message, 'error');
  });
}

function toggleAdvisorActive(advisorId) {
  var a = sheetData.advisors.find(function(x){ return x.id === advisorId; });
  if (!a) return;
  a.active = !a.active;
  apiPost({ action: 'updateAdvisor', advisor_id: advisorId, is_active: a.active }).then(function(res){
    if (res && res.success) toast((a.active ? '✅ Đã hiện trên web' : '🔕 Đã ẩn khỏi web') + ' (đã đồng bộ Sheet)', 'success');
    else { a.active = !a.active; toast('Lỗi khi lưu Sheet: ' + (res && res.error), 'error'); }
    navToStaffAdvisorDetail(advisorId);
  }).catch(function(err){
    a.active = !a.active;
    toast('Lỗi kết nối: ' + err.message, 'error');
    navToStaffAdvisorDetail(advisorId);
  });
}

  return '<div class="ea-exp-row" data-idx="' + idx + '" style="background:var(--white);border:1.5px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;position:relative">' +
    '<button type="button" onclick="this.closest(\'.ea-exp-row\').remove()" style="position:absolute;top:8px;right:8px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1">×</button>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">' +
      '<input class="form-input ea-exp-title" placeholder="Chức danh" value="' + (ex.title||'') + '">' +
      '<input class="form-input ea-exp-company" placeholder="Công ty" value="' + (ex.company||'') + '">' +
    '</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">' +
      '<select class="form-select ea-exp-type">' +
        ['Full-time','Part-time','Freelance','Internship','Contract'].map(function(t){ return '<option' + (ex.type===t?' selected':'') + '>' + t + '</option>'; }).join('') +
      '</select>' +
      '<input class="form-input ea-exp-location" placeholder="Địa điểm (VD: TP.HCM · On-site)" value="' + (ex.location||'') + '">' +
    '</div>' +
    '<input class="form-input ea-exp-daterange" placeholder="Thời gian (VD: Tháng 3/2024 - Hiện tại · 5 tháng)" value="' + (ex.dateRange||'') + '" style="margin-bottom:8px">' +
    '<textarea class="form-textarea ea-exp-desc" rows="2" placeholder="Mô tả (không bắt buộc)">' + (ex.desc||'') + '</textarea>' +
    '</div>';
}

function addExperienceRow(containerId) {
  var container = document.getElementById(containerId || 'ea-exp-list');
  container.insertAdjacentHTML('beforeend', eaExpRowHtml(_eaExpIdx++));
}

function openEditAdvisorModal(advisorId) {
  var a = sheetData.advisors.find(function(x){ return x.id === advisorId; });
  if (!a) return;
  _eaExpIdx = 0;
  var si = a.supportItems || [];
  document.getElementById('modal-title').textContent = '✏️ Chỉnh sửa — ' + a.name;

  var body = '<div style="display:flex;flex-direction:column;gap:14px">';

  // ── 1. Thông tin cơ bản ──
  body += '<div class="ea-section"><div class="ea-section-title">👤 Thông tin cơ bản</div>' +
    '<div style="margin-bottom:12px"><div class="form-label">Họ và tên</div><input class="form-input" id="ea-name" value="' + a.name + '" style="margin-top:6px"></div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">' +
    '<div><div class="form-label">Chức danh hiện tại</div><input class="form-input" id="ea-title" value="' + a.title + '" style="margin-top:6px"></div>' +
    '<div><div class="form-label">Công ty hiện tại</div><input class="form-input" id="ea-company" value="' + (a.company||'') + '" style="margin-top:6px"></div>' +
    '</div>' +
    '<div><div class="form-label">Tags (phân cách bằng dấu phẩy — VD: FMCG, Marketing)</div><input class="form-input" id="ea-tags" value="' + (a.tags||[]).join(', ') + '" style="margin-top:6px"></div>' +
    '</div>';

  // ── 2. Liên hệ ──
  body += '<div class="ea-section"><div class="ea-section-title">📞 Liên hệ <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)">(chỉ Staff xem)</span></div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">' +
    '<div><div class="form-label">Email</div><input class="form-input" id="ea-email" type="email" value="' + a.email + '" style="margin-top:6px"></div>' +
    '<div><div class="form-label">SĐT</div><input class="form-input" id="ea-phone" value="' + a.phone + '" style="margin-top:6px"></div>' +
    '</div>' +
    '<div><div class="form-label">LinkedIn / Liên hệ</div><input class="form-input" id="ea-contact" value="' + (a.contact||'') + '" style="margin-top:6px"></div>' +
    '</div>';

  // ── 3. Nội dung public ──
  body += '<div class="ea-section"><div class="ea-section-title">🌐 Nội dung hiển thị công khai</div>' +
    '<div style="margin-bottom:12px"><div class="form-label">Giới thiệu</div><textarea class="form-textarea" id="ea-bio" rows="3" style="margin-top:6px">' + (a.bio||'') + '</textarea></div>' +
    '<div><div class="form-label">Lời nhắn</div><textarea class="form-textarea" id="ea-message" rows="2" style="margin-top:6px">' + (a.message||'') + '</textarea></div>' +
    '</div>';

  // ── 4. Mình có thể hỗ trợ bạn ──
  body += '<div class="ea-section"><div class="ea-section-title">🤝 Mình có thể hỗ trợ bạn <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)">(3 mục trên web)</span></div>';
  for (var i = 0; i < 3; i++) {
    var item = si[i] || {};
    body += '<div style="background:var(--white);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px">' +
      '<div style="display:grid;grid-template-columns:50px 1fr;gap:8px;margin-bottom:8px">' +
      '<input class="form-input" id="ea-si-icon-' + i + '" placeholder="📄" value="' + (item.icon||'') + '" style="text-align:center">' +
      '<input class="form-input" id="ea-si-title-' + i + '" placeholder="Tiêu đề mục ' + (i+1) + '" value="' + (item.title||'') + '">' +
      '</div>' +
      '<input class="form-input" id="ea-si-desc-' + i + '" placeholder="Mô tả ngắn" value="' + (item.desc||'') + '">' +
      '</div>';
  }
  body += '</div>';

  // ── 5. Kinh nghiệm làm việc ──
  body += '<div class="ea-section"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">' +
    '<div class="ea-section-title" style="margin-bottom:0">💼 Kinh nghiệm làm việc</div>' +
    '<button type="button" class="update-btn" onclick="addExperienceRow(\'ea-exp-list\')">+ Thêm kinh nghiệm</button></div>' +
    '<div id="ea-exp-list">' + (a.experience||[]).map(function(ex){ var h = eaExpRowHtml(_eaExpIdx, ex); _eaExpIdx++; return h; }).join('') + '</div>' +
    '</div>';

  // ── 6. Sản phẩm áp dụng ──
  var currentPkgs = a.products || [];
  body += '<div class="ea-section"><div class="ea-section-title">📦 Sản phẩm áp dụng</div>';
  Object.keys(PACKAGES).forEach(function(p){
    var checked = currentPkgs.indexOf(p) > -1;
    body += '<label style="display:flex;align-items:center;gap:10px;background:var(--white);border:1.5px solid ' + (checked?'var(--brand)':'var(--border)') + ';border-radius:10px;padding:9px 14px;cursor:pointer;margin-bottom:6px">' +
      '<input type="checkbox" class="ea-pkg-cb" value="' + p + '" ' + (checked?'checked':'') + '>' +
      '<div style="flex:1"><span style="font-size:13px;font-weight:600">' + p + '</span> <span style="font-size:12px;color:var(--muted)">— ' + fmtMoney(PACKAGES[p].price) + ' · ' + PACKAGES[p].sessions + ' buổi</span></div>' +
      '</label>';
  });
  body += '</div>';

  // ── 7. Feedback hiển thị trên web ──
  var realFeedbacksEdit = [];
  MOCK.advisees.filter(function(ae){ return ae.advisor === a.name; }).forEach(function(ae){
    ae.sessions.forEach(function(s){
      if (s.feedback) realFeedbacksEdit.push({ key: ae.id + '-' + s.no, from: ae.name, rating: s.feedback.rating, text: s.feedback.text });
    });
  });
  a.hiddenFeedback = a.hiddenFeedback || [];
  if (realFeedbacksEdit.length > 0) {
    body += '<div class="ea-section"><div class="ea-section-title">⭐ Feedback hiển thị trên web</div>';
    realFeedbacksEdit.forEach(function(f){
      var checked = a.hiddenFeedback.indexOf(f.key) === -1;
      body += '<label style="display:flex;align-items:flex-start;gap:10px;background:var(--white);border:1.5px solid var(--border);border-radius:10px;padding:9px 14px;cursor:pointer;margin-bottom:6px">' +
        '<input type="checkbox" class="ea-fb-cb" value="' + f.key + '" ' + (checked?'checked':'') + ' style="margin-top:2px">' +
        '<div style="flex:1;font-size:12.5px"><span style="color:#F59E0B">' + '★'.repeat(f.rating) + '☆'.repeat(5-f.rating) + '</span> "' + f.text + '" <span style="color:var(--muted)">— ' + f.from + '</span></div>' +
        '</label>';
    });
    body += '</div>';
  }

  body += '</div>';

  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal-body').style.maxHeight = '65vh';
  document.getElementById('modal-body').style.overflowY = 'auto';
  var modalBox = document.querySelector('.modal');
  if (modalBox) modalBox.style.maxWidth = '640px';
  document.getElementById('modal-actions').innerHTML =
    '<button class="btn-secondary" onclick="closeModal()" style="width:auto;padding:10px 20px">Huỷ</button>' +
    '<button class="login-btn" onclick="saveAdvisorEdit(\'' + advisorId + '\')" style="width:auto;padding:10px 24px">Lưu thay đổi</button>';
  document.getElementById('modal-overlay').classList.add('open');
}

function saveAdvisorEdit(advisorId) {
  var a = sheetData.advisors.find(function(x){ return x.id === advisorId; });
  if (!a) return;
  a.name    = document.getElementById('ea-name').value.trim()    || a.name;
  a.title   = document.getElementById('ea-title').value.trim()   || a.title;
  a.company = document.getElementById('ea-company').value.trim();
  a.tags    = document.getElementById('ea-tags').value.split(',').map(function(t){ return t.trim(); }).filter(Boolean);
  a.email   = document.getElementById('ea-email').value.trim()   || a.email;
  a.phone   = document.getElementById('ea-phone').value.trim()   || a.phone;
  a.contact = document.getElementById('ea-contact').value.trim();
  a.bio     = document.getElementById('ea-bio').value.trim()     || a.bio;
  a.message = document.getElementById('ea-message').value.trim() || a.message;

  a.supportItems = [];
  for (var i = 0; i < 3; i++) {
    var iconEl = document.getElementById('ea-si-icon-' + i);
    var titleEl = document.getElementById('ea-si-title-' + i);
    var descEl = document.getElementById('ea-si-desc-' + i);
    if (titleEl && titleEl.value.trim()) {
      a.supportItems.push({ icon: iconEl.value.trim() || '✦', title: titleEl.value.trim(), desc: descEl.value.trim() });
    }
  }

  a.experience = [];
  document.querySelectorAll('#ea-exp-list .ea-exp-row').forEach(function(row){
    var title = row.querySelector('.ea-exp-title').value.trim();
    if (!title) return;
    a.experience.push({
      title: title,
      company: row.querySelector('.ea-exp-company').value.trim(),
      type: row.querySelector('.ea-exp-type').value,
      location: row.querySelector('.ea-exp-location').value.trim(),
      dateRange: row.querySelector('.ea-exp-daterange').value.trim(),
      desc: row.querySelector('.ea-exp-desc').value.trim(),
    });
  });

  a.products = Array.from(document.querySelectorAll('.ea-pkg-cb:checked')).map(function(cb){ return cb.value; });

  var uncheckedFb = Array.from(document.querySelectorAll('.ea-fb-cb')).filter(function(cb){ return !cb.checked; }).map(function(cb){ return cb.value; });
  if (document.querySelector('.ea-fb-cb')) a.hiddenFeedback = uncheckedFb;

  apiPost({
    action: 'updateAdvisor',
    advisor_id: advisorId,
    name: a.name, role: a.title, company: a.company,
    industry: (a.tags||[]).join(', '),
    email: a.email, phone: a.phone, zalo_id: a.contact,
    bio: a.bio, message: a.message,
    experience: a.experience, products: a.products, feedbacks: a.feedbacks,
  }).then(function(res){
    if (res && res.success) toast('Đã lưu & đồng bộ lên Sheet ✅', 'success');
    else toast('Lỗi khi lưu lên Sheet: ' + (res && res.error), 'error');
  }).catch(function(err){ toast('Lỗi kết nối: ' + err.message, 'error'); });
  closeModal();

  if (currentUser && currentUser.role === 'Advisor' && currentUser.name === a.name) {
    // Advisor tự sửa thông tin của mình — cập nhật lại topbar rồi render lại tab hiện tại
    document.getElementById('user-name').textContent = a.name;
    document.getElementById('dropdown-name').textContent = a.name;
    document.getElementById('user-avatar').textContent = mkInitials(a.name);
    renderAdvisor(_activeRoleTab || 'overview');
  } else {
    navToStaffAdvisorDetail(advisorId);
  }
}

function openAdvisorSelfEditModal() {
  if (!currentUser) return;
  closeUserMenu();
  // sheetData.advisors chỉ được nạp ở trang Staff — Advisor tự đăng nhập thì phải nạp trước khi mở form
  function findMe() {
    return sheetData.advisors.find(function(x){
      return (currentUser.advisorId && x.id === currentUser.advisorId) ||
             normName(x.name) === normName(currentUser.name) ||
             (x.email && normName(x.email) === normName(currentUser.email));
    });
  }
  var a = findMe();
  if (a) { openEditAdvisorModal(a.id); return; }
  toast('Đang tải hồ sơ...', '');
  loadAdvisorsFromSheet(function(){
    var b = findMe();
    if (!b) { toast('Không tìm thấy hồ sơ Advisor tương ứng', 'error'); return; }
    openEditAdvisorModal(b.id);
  });
}

function renderAdviseeModule() {
  var html = '';
  var pendingReschedules = MOCK.rescheduleRequests.filter(function(r){ return r.status === 'pending'; });

  // KPI
  html += '<div class="stats-row" style="margin-bottom:20px">';
  html += '<div class="stat-cell"><div class="stat-num">' + MOCK.advisees.length + '</div><div class="stat-label">Tổng advisee</div></div>';
  var needFb = MOCK.advisees.filter(function(ae){ return ae.sessions.some(function(s){ return s.status==='feedback'; }); }).length;
  var totalRevenue = MOCK.advisees.reduce(function(s,ae){ return s + ae.paid; }, 0);
  html += '<div class="stat-cell"><div class="stat-num" style="' + (pendingReschedules.length?'color:var(--brand)':'') + '">' + pendingReschedules.length + '</div><div class="stat-label">🔔 Yêu cầu đổi lịch</div></div>';
  html += '<div class="stat-cell"><div class="stat-num">' + fmtMoney(totalRevenue) + '</div><div class="stat-label">Tổng doanh thu</div></div>';
  html += '</div>';

  html += '<div class="card"><div class="card-header"><div class="card-header-left">Danh sách Advisee</div></div>';
  if (MOCK.advisees.length === 0) {
    html += '<div class="empty-state"><div class="icon">🙋</div>Chưa có advisee nào</div>';
  } else {
    html += '<table class="bookings-table"><thead><tr><th>ADVISEE</th><th>GÓI · ADVISOR</th><th>TIẾN ĐỘ</th><th>TRẠNG THÁI</th><th></th></tr></thead><tbody>';
    MOCK.advisees.forEach(function(ae) {
      var pct = Math.round(ae.sessionsDone / ae.sessionsTotal * 100);
      var hasFeedback = ae.sessions.some(function(s){ return s.status === 'feedback'; });
      var hasUpcoming = ae.sessions.some(function(s){ return s.status === 'upcoming'; });
      var hasReschedule = pendingReschedules.some(function(r){ return r.aeId === ae.id; });
      var statusTag = hasFeedback
        ? '<span style="background:#FEF3C7;color:#92400E;font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px">Cần feedback</span>'
        : hasUpcoming
          ? '<span style="background:#EFF6FF;color:#1D4ED8;font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px">Sắp tới</span>'
          : '<span style="background:var(--green-bg);color:var(--green);font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px">Hoàn thành</span>';
      if (hasReschedule) statusTag += ' <span style="background:var(--brand-light);color:var(--brand);font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px">🔔 Yêu cầu đổi lịch</span>';
      html += '<tr>';
      html += '<td><div style="display:flex;align-items:center;gap:10px">' + avatarCircle(ae.name, 34) + '<div><div style="font-weight:700">' + ae.name + '</div><div style="font-size:12px;color:var(--muted)">' + ae.email + '</div></div></div></td>';
      html += '<td><div style="font-weight:600;font-size:13px">Gói ' + ae.pkg + '</div><div style="font-size:12px;color:var(--muted)">' + ae.advisor + '</div></td>';
      html += '<td><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;height:6px;background:var(--bg);border-radius:100px;overflow:hidden;min-width:60px"><div style="height:100%;width:' + pct + '%;background:var(--green);border-radius:100px"></div></div><span style="font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap">' + ae.sessionsDone + '/' + ae.sessionsTotal + '</span></div></td>';
      html += '<td>' + statusTag + '</td>';
      html += '<td><button class="detail-btn" onclick="navToStaffAdviseeDetail(\'' + ae.id + '\',null)">Xem chi tiết →</button></td>';
      html += '</tr>';
    });
    html += '</tbody></table>';
  }
  html += '</div>';
  return html;
}

function navToStaffAdviseeDetail(aeId, fromAdvisorId) {
  commitStaffRoute(activeNavId || 'aee-list', 'advisee:' + aeId + ':' + (fromAdvisorId || ''));
  var c = document.getElementById('main-content');
  c.innerHTML = renderStaffAdviseeDetail(aeId, fromAdvisorId);
}

function renderStaffAdviseeDetail(aeId, fromAdvisorId) {
  var ae = MOCK.advisees.find(function(x){ return x.id === aeId; });
  if (!ae) return '';

  var html = '';
  // Breadcrumb + Edit button
  html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">';
  html += '<div style="display:flex;align-items:center;gap:8px;font-size:13px">';
  if (fromAdvisorId === 'staffcare') {
    html += '<button onclick="switchStaffDetailTab(\'care\')" style="background:none;border:none;color:var(--brand);cursor:pointer;font-family:inherit;font-size:13px;padding:0">← Chăm sóc khách hàng</button>';
  } else if (fromAdvisorId) {
    var adv = sheetData.advisors.find(function(x){ return x.id === fromAdvisorId; });
    html += '<button onclick="navToStaffAdvisorDetail(\'' + fromAdvisorId + '\')" style="background:none;border:none;color:var(--brand);cursor:pointer;font-family:inherit;font-size:13px;padding:0">← ' + (adv?adv.name:'Advisor') + '</button>';
  } else {
    html += '<button onclick="navTo(\'aee-list\')" style="background:none;border:none;color:var(--brand);cursor:pointer;font-family:inherit;font-size:13px;padding:0">← Danh sách Advisee</button>';
  }
  html += '<span style="color:var(--border)">›</span><span style="color:var(--muted)">' + ae.name + '</span>';
  html += '</div>';
  html += '<button class="submit-btn" style="padding:8px 16px;font-size:13px;gap:6px" onclick="openEditAdviseeModal(\'' + ae.id + '\',\'' + (fromAdvisorId||'') + '\')">✏️ Chỉnh sửa thông tin</button>';
  html += '</div>';

  // Advisee profile card (full info for Staff)
  var pkg = PACKAGES[ae.pkg] || {};
  html += '<div class="card" style="margin-bottom:16px"><div style="padding:22px 24px">';
  html += '<div style="display:flex;gap:16px;align-items:flex-start;margin-bottom:16px">';
  html += avatarCircle(ae.name, 52);
  html += '<div style="flex:1">';
  html += '<div style="font-size:18px;font-weight:800;margin-bottom:2px">' + ae.name + '</div>';
  html += '<div style="font-size:13px;color:var(--muted);margin-bottom:10px">' + ae.email + ' · ' + ae.phone + '</div>';
  html += '<div style="display:flex;gap:8px;flex-wrap:wrap">';
  html += '<span style="background:var(--brand-light);color:var(--brand);font-size:12px;font-weight:700;padding:4px 12px;border-radius:100px">Gói ' + ae.pkg + '</span>';
  html += '<span style="background:var(--bg);color:var(--muted);font-size:12px;padding:4px 12px;border-radius:100px">' + ae.bookingId + '</span>';
  html += '<span style="background:var(--green-bg);color:var(--green);font-size:12px;font-weight:700;padding:4px 12px;border-radius:100px">' + ae.sessionsDone + '/' + ae.sessionsTotal + ' buổi</span>';
  html += '</div></div>';
  html += '<div style="text-align:right;min-width:100px">';
  html += '<div style="font-size:22px;font-weight:800;color:var(--brand)">' + fmtMoney(ae.paid) + '</div>';
  html += '<div style="font-size:11px;color:var(--muted)">đã thanh toán</div>';
  html += '<div style="font-size:12px;color:var(--muted);margin-top:6px">Hết hạn ' + ae.expiry + '</div>';
  html += '</div></div>';
  // Extra info row
  html += '<div style="display:flex;gap:24px;padding-top:14px;border-top:1px solid var(--border);font-size:13px">';
  html += '<div><span style="color:var(--muted)">Advisor: </span><b>' + ae.advisor + '</b> <button class="update-btn" style="margin-left:6px;font-size:11px" onclick="toast(\'Mở form đổi Advisor (demo)\',\'success\')">Đổi</button></div>';
  html += '<div><span style="color:var(--muted)">Đăng ký: </span><b>' + ae.registeredAt + '</b></div>';
  html += '<div><span style="color:var(--muted)">Liên hệ: </span><b>' + ae.contact + '</b></div>';

  // Session list — same compact format, same modal
  html += '<div class="card"><div class="card-header"><div class="card-header-left">Các buổi meeting</div></div>';
  ae.sessions.forEach(function(s) {
    var pd = safeParseYMD(s.date);

    var sc = {done:{bg:'var(--green-bg)',color:'var(--green)',label:'✓ Hoàn thành'},feedback:{bg:'#FFF7ED',color:'#C2410C',label:'Cần feedback'},upcoming:{bg:'#EFF6FF',color:'#1D4ED8',label:'Sắp tới'},locked:{bg:'var(--bg)',color:'var(--muted)',label:'Đã khoá'}}[s.status]||{bg:'var(--bg)',color:'var(--muted)',label:'—'};
    var needNote = (s.status==='done'||s.status==='feedback') && !s.advisorNotes;
    html += '<div style="display:flex;align-items:center;gap:14px;padding:14px 24px;border-top:1px solid var(--border)">';
    html += '<div style="width:32px;height:32px;border-radius:50%;background:' + sc.bg + ';color:' + sc.color + ';display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0">' + (s.status==='done'?'✓':String(s.no)) + '</div>';
    html += '<div style="flex:1"><div style="font-weight:600;font-size:14px">Buổi ' + s.no + '</div><div style="font-size:12px;color:var(--muted);margin-top:2px">' + dateLabel + '</div></div>';
    html += '<span style="background:' + sc.bg + ';color:' + sc.color + ';font-size:12px;font-weight:700;padding:4px 12px;border-radius:100px">' + sc.label + '</span>';
    if (needNote) html += '<span style="background:#FEF3C7;color:#92400E;font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px">Cần nhận xét</span>';
    if (s.meetLink && s.status !== 'locked') html += '<a href="' + s.meetLink + '" target="_blank" class="detail-btn" style="font-size:12px;padding:6px 12px">🎥 Meet</a>';
    if (s.status !== 'locked') html += '<button class="detail-btn" onclick="openSessionDetailModal(\'' + ae.id + '\',' + s.no + ')" style="font-size:12px;padding:6px 12px">Chi tiết</button>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function saveAdviseeEdit(aeId, fromAdvisorId) {
  var ae = MOCK.advisees.find(function(x){ return x.id === aeId; });
  if (!ae) return;

  var newName  = document.getElementById('eae-name').value.trim();
  var newEmail = document.getElementById('eae-email').value.trim();
  var newTotal = Number(document.getElementById('eae-total').value) || ae.sessionsTotal;
  var newDone  = Number(document.getElementById('eae-done').value);
  if (!newName || !newEmail) { toast('Vui lòng điền tên và email', 'error'); return; }
  if (newDone > newTotal) { toast('Số buổi đã dùng không thể lớn hơn tổng số buổi', 'error'); return; }

  ae.name          = newName;
  ae.email         = newEmail;
  ae.phone         = document.getElementById('eae-phone').value.trim();
  ae.contact       = document.getElementById('eae-contact').value.trim();
  ae.pkg           = document.getElementById('eae-pkg').value;
  ae.sessionsTotal = newTotal;
  ae.sessionsDone  = newDone;
  ae.paid          = Number(document.getElementById('eae-paid').value) || ae.paid;
  ae.expiry        = document.getElementById('eae-expiry').value || ae.expiry;

  toast('Đã lưu thông tin Advisee ✅', 'success');
  closeModal();
  navToStaffAdviseeDetail(aeId, fromAdvisorId || null);
}
