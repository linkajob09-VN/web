function openAdviseeSessionModal(sessionNo) {
  var ae = MOCK.advisees.find(function(x){ return x.name === currentUser.name || x.email === currentUser.email; });
  if (!ae) return;
  var s = ae.sessions.find(function(x){ return x.no === sessionNo; });
  if (!s) return;
  commitRoute({ tab: 'my-bookings', s: sessionNo });
  var pd = safeParseYMD(s.date);
  var dateLabel = pd.valid ? (pd.dow + ' ' + pd.dd + '/' + pd.mm + '/' + pd.dateObj.getFullYear() + ' · ' + s.timeStart + (s.timeEnd ? '–' + s.timeEnd : '')) : 'Chưa xếp lịch';
  document.getElementById('modal-title').textContent = 'Buổi ' + sessionNo;
  var body = '';

  // Header — 1 khối duy nhất, gộp cả 2 trường hợp: chưa có lịch (chọn giờ) / đã có lịch (đổi giờ)
  body += '<div style="display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:10px;padding:12px 16px;margin-bottom:16px;flex-wrap:wrap;gap:8px">';
  body += '<div><div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px">Thời gian</div><div style="font-size:14px;font-weight:600">' + dateLabel + '</div></div>';
  body += '<div style="display:flex;gap:8px">';
  if (s.meetLink) body += '<a href="' + s.meetLink + '" target="_blank" class="detail-btn">🎥 Vào Meet</a>';
  if (s.status === 'upcoming' && !s.date) {
    body += '<button class="detail-btn" onclick="closeModal();openBookSessionModal(\'' + ae.id + '\',' + sessionNo + ')">🗓 Chọn giờ meeting</button>';
  } else if (s.status === 'upcoming' && s.date) {
    body += '<button class="detail-btn" onclick="closeModal();openRescheduleModal(\'' + ae.id + '\',' + sessionNo + ',\'advisee\')">🔄 Đổi giờ</button>';
  }
  body += '</div></div>';

  // Chuẩn bị
  body += '<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px">Chuẩn bị của bạn</div>';
  if (s.status === 'upcoming') {
    if (s.prepInfo) {
      body += '<div class="prep-panel-submitted" style="border-radius:10px;border:1.5px solid #BBF7D0">';
      body += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"><div style="font-size:12px;font-weight:700;color:#065F46">✅ Đã gửi</div><button class="prep-edit-btn" onclick="closeModal();openPrepFormModal(' + sessionNo + ')">✎ Sửa</button></div>';
      if (s.prepInfo.cvLink)     body += '<div class="prep-submitted-row"><span class="prep-submitted-label">CV / Hồ sơ</span><span class="prep-submitted-val"><a href="' + s.prepInfo.cvLink + '" target="_blank">' + s.prepInfo.cvLink + '</a></span></div>';
      if (s.prepInfo.question)   body += '<div class="prep-submitted-row"><span class="prep-submitted-label">Câu hỏi</span><span class="prep-submitted-val">' + s.prepInfo.question + '</span></div>';
      if (s.prepInfo.otherLinks) body += '<div class="prep-submitted-row"><span class="prep-submitted-label">Links khác</span><span class="prep-submitted-val">' + s.prepInfo.otherLinks + '</span></div>';
      body += '</div>';
    } else {
      body += '<div class="prep-panel" style="border-radius:10px">';
      body += '<div class="prep-alert">📋 <div>Điền thông tin chuẩn bị để <strong>Advisor đọc trước buổi meeting</strong>.</div></div>';
      body += '<div class="prep-section-label">CV / Hồ sơ</div><input class="prep-input" id="m-prep-cv-' + sessionNo + '" placeholder="Link Google Drive, Notion..."/>';
      body += '<div class="prep-section-label">Câu hỏi cho Advisor <span style="color:var(--brand)">*</span></div><textarea class="prep-textarea" id="m-prep-q-' + sessionNo + '" rows="3" placeholder="VD: Em muốn hỏi về cách xây dựng portfolio..."></textarea>';
      body += '<div class="prep-section-label">Links khác</div><input class="prep-input" id="m-prep-links-' + sessionNo + '" placeholder="Portfolio, JD, kết quả test..."/>';
      body += '</div>';
    }
  } else {
    body += s.prepInfo ? renderPrepCard(s.prepInfo) : '<div class="prep-missing">Không có thông tin chuẩn bị.</div>';
  }

  // Nhận xét Advisor
  if (s.status === 'done' || s.status === 'feedback') {
    body += '<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:16px 0 8px">Nhận xét từ Advisor</div>';
    body += renderAdvisorNotesCard(s.advisorNotes, false, null, sessionNo);
  }

  // Feedback form (status === feedback)
  if (s.status === 'feedback') {
    if (!adviseeStarState[sessionNo]) adviseeStarState[sessionNo] = { selected:0, hover:0 };
    var st = adviseeStarState[sessionNo];
    body += '<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:16px 0 8px">Feedback của bạn cho Advisor</div>';
    body += '<div style="background:#FFF7ED;border:1.5px solid #FED7AA;border-radius:10px;padding:14px">';
    body += '<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Đánh giá</div>';
    body += '<div id="m-stars-' + sessionNo + '" style="display:flex;gap:6px;margin-bottom:12px">';
    for (var star = 1; star <= 5; star++) {
      var isActive = star <= (st.hover || st.selected);
      body += '<span style="font-size:28px;cursor:pointer;color:' + (isActive?'#F59E0B':'#D1D5DB') + ';line-height:1" onmouseover="aeeHoverStarModal('+sessionNo+','+star+')" onmouseout="aeeHoverStarModal('+sessionNo+',0)" onclick="aeeSelectStarModal('+sessionNo+','+star+')">★</span>';
    }
    body += '</div>';
    body += '<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Ghi chú & góp ý</div>';
    body += '<textarea class="aee-feedback-textarea" id="m-fbtext-' + sessionNo + '" rows="3" placeholder="VD: Anh giải thích rất rõ, em muốn buổi sau thực hành nhiều hơn..."></textarea>';
    body += '</div>';
  }

  // Feedback đã gửi (done)
  if (s.status === 'done' && s.feedback) {
    body += '<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:16px 0 8px">Feedback của bạn</div>';
    body += '<div style="background:#FFF7ED;border:1.5px solid #FED7AA;border-radius:10px;padding:12px 14px">';
    var stars2 = '';
    for (var i2=1;i2<=5;i2++) stars2 += '<span style="color:'+(i2<=s.feedback.rating?'#F59E0B':'#D1D5DB')+';font-size:16px">★</span>';
    body += '<div style="margin-bottom:6px">' + stars2 + '</div>';
    if (s.feedback.text) body += '<div style="font-size:13px;color:var(--text);line-height:1.65">' + s.feedback.text + '</div>';
    body += '</div>';
  }

  document.getElementById('modal-body').innerHTML = body;
  var actions = '<button class="btn-secondary" onclick="closeModal()" style="width:auto;padding:10px 20px">Đóng</button>';
  if (s.status === 'upcoming' && !s.prepInfo) actions += '<button class="login-btn" onclick="submitPrepInfoModal('+sessionNo+')" style="width:auto;padding:10px 24px">Gửi chuẩn bị →</button>';
  if (s.status === 'feedback') actions += '<button class="login-btn" onclick="submitAdviseeFeedbackModal('+sessionNo+')" style="width:auto;padding:10px 24px;background:#C2410C">Gửi feedback & mở khoá →</button>';
  document.getElementById('modal-actions').innerHTML = actions;
  document.getElementById('modal-overlay').classList.add('open');
}

// ════════════════════════════════════════════════════════════
//  ADVISEE ĐẶT LỊCH — calendar tuần/tháng, chọn giờ + phút, rồi xác nhận
//  Chỉ hiện hôm nay & tương lai; ẩn giờ đã qua và giờ đè lên buổi đã được đặt.
// ════════════════════════════════════════════════════════════
var _bookSessionCtx = null; // { aeId, sessionNo, advisorName }
var _bk = { avail: {}, booked: {}, selDate: null, selM: null, step: 'pick' };

function openBookSessionModal(aeId, sessionNo) {
  var ae = MOCK.advisees.find(function(x){ return x.id === aeId; });
  if (!ae) return;
  _bookSessionCtx = { aeId: aeId, sessionNo: sessionNo, advisorName: ae.advisor };
  _bk = { avail: {}, booked: {}, selDate: null, selM: null, step: 'pick' };
  _cal.advisee = { view: 'week', anchor: new Date() };
  _calRerender.advisee = renderBkBody;

  document.getElementById('modal-title').textContent = 'Chọn giờ meeting — Buổi ' + sessionNo;
  document.getElementById('modal-body').innerHTML = skeletonRows(2);
  document.getElementById('modal-actions').innerHTML = '<button class="btn-secondary" onclick="closeModal()" style="width:auto;padding:10px 20px">Đóng</button>';
  var box = document.querySelector('.modal'); if (box) box.style.maxWidth = '780px';
  document.getElementById('modal-overlay').classList.add('open');

  apiGet('getSlots', { advisor: ae.advisor }).then(function(res) {
    var raw = (res && res.data) ? res.data : [], today = ymd(new Date()), starts = {};
    raw.forEach(function(s) {
      var d = slotDate(s), m = tmin(s.time_start);
      if (!d || m == null || d < today) return; // chỉ từ hôm nay trở đi
      var st = String(s.status || 'available').toLowerCase();
      if (st === 'booked') { (_bk.booked[d] = _bk.booked[d] || []).push(m); }
      else if (st === 'available') { (starts[d] = starts[d] || []).push({ slot_id: s.slot_id, m: m }); }
    });
    Object.keys(starts).forEach(function(d) {
      var nowM = minutesNowIfToday(d), bk = _bk.booked[d] || [];
      var list = starts[d].filter(function(x){ return x.m > nowM && bk.every(function(b){ return Math.abs(x.m - b) >= SC_DUR; }); });
      if (list.length) _bk.avail[d] = list.sort(function(a, b){ return a.m - b.m; });
    });
    // mở sẵn tuần có ngày trống gần nhất
    var first = Object.keys(_bk.avail).sort()[0];
    if (first) _cal.advisee.anchor = new Date(first + 'T00:00:00');
    renderBkBody();
  }).catch(function(err) {
    document.getElementById('modal-body').innerHTML =
      '<div class="empty-state"><div class="icon">⚠</div>Không tải được lịch trống của Advisor.<br><small style="color:var(--muted)">' + err.message + '</small></div>';
  });
}

function bkStarts(d) { return (_bk.avail[d] || []).map(function(x){ return x.m; }); }

function renderBkBody() {
  if (_bk.step === 'confirm') { renderBkConfirm(); return; }
  var hasAny = Object.keys(_bk.avail).length > 0;
  var html = '<div style="font-size:13px;color:var(--muted);margin-bottom:6px;line-height:1.6">Chọn ngày có khung giờ trống của Advisor <b>' + _bookSessionCtx.advisorName + '</b>, sau đó chọn giờ và phút bắt đầu (buổi meeting 60 phút).</div>';
  if (!hasAny) {
    html += '<div class="empty-state"><div class="icon">📭</div>Advisor hiện chưa có giờ trống nào từ hôm nay trở đi. Vui lòng liên hệ đội LinkaJob để được hỗ trợ xếp lịch.</div>';
    document.getElementById('modal-body').innerHTML = html;
    document.getElementById('modal-actions').innerHTML = '<button class="btn-secondary" onclick="closeModal()" style="width:auto;padding:10px 20px">Đóng</button>';
    return;
  }
  html += renderCal('advisee', {
    onClick: 'bkPickDay', selected: _bk.selDate,
    cellFn: function(ds, view) {
      var rs = startsToRanges(bkStarts(ds));
      if (!rs.length) return { html: '', enabled: false };
      var max = view === 'week' ? 6 : 2, out = rs.slice(0, max).map(function(r){ return '<span class="sc-chip free">' + tstr(r[0]) + '–' + tstr(r[1]) + '</span>'; }).join('');
      if (rs.length > max) out += '<span class="sc-more">+' + (rs.length - max) + ' nữa</span>';
      return { html: '<div class="sc-chips">' + out + '</div>' };
    }
  });
  html += '<div id="bk-panel">' + bkPanelHtml() + '</div>';
  document.getElementById('modal-body').innerHTML = html;
  bkRenderActions();
}

function bkPanelHtml() {
  if (!_bk.selDate) return '<div style="font-size:13px;color:var(--muted);padding:4px 20px 16px">👆 Bấm vào một ngày có giờ trống để chọn giờ.</div>';
  var starts = bkStarts(_bk.selDate), hours = [], h = Math.floor(_bk.selM / 60);
  starts.forEach(function(m){ var x = Math.floor(m / 60); if (hours.indexOf(x) < 0) hours.push(x); });
  var mins = starts.filter(function(m){ return Math.floor(m / 60) === h; }).map(function(m){ return m % 60; });
  var rs = startsToRanges(starts).map(function(r){ return tstr(r[0]) + '–' + tstr(r[1]); }).join(', ');
  return '<div class="sc-pick">' +
    '<div style="font-weight:700;font-size:14px;margin-bottom:2px">' + dayLabel(_bk.selDate) + '/' + _bk.selDate.slice(0, 4) + '</div>' +
    '<div style="font-size:12.5px;color:var(--muted);margin-bottom:12px">Advisor rảnh: ' + rs + '</div>' +
    '<div class="sc-time-row"><span class="form-label" style="margin:0">Giờ bắt đầu</span>' +
    '<select class="sc-sel" onchange="bkHour(this.value)">' + hours.map(function(x){ return '<option value="' + x + '"' + (x === h ? ' selected' : '') + '>' + pad(x) + ' giờ</option>'; }).join('') + '</select>' +
    '<select class="sc-sel" onchange="bkMin(this.value)">' + mins.map(function(x){ return '<option value="' + x + '"' + (x === _bk.selM % 60 ? ' selected' : '') + '>' + pad(x) + ' phút</option>'; }).join('') + '</select></div>' +
    '<div style="margin-top:12px;font-size:14px">Buổi meeting: <b style="color:var(--brand)">' + tstr(_bk.selM) + ' – ' + tstr(_bk.selM + SC_DUR) + '</b> <span style="color:var(--muted);font-size:12.5px">(60 phút)</span></div></div>';
}

function bkPickDay(d) {
  _bk.selDate = d;
  _bk.selM = bkStarts(d)[0];
  renderBkBody();
  var p = document.getElementById('bk-panel'); if (p && p.scrollIntoView) p.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function bkHour(h) {
  var first = bkStarts(_bk.selDate).filter(function(m){ return Math.floor(m / 60) === +h; })[0];
  if (first != null) _bk.selM = first;
  document.getElementById('bk-panel').innerHTML = bkPanelHtml();
}
function bkMin(mm) { _bk.selM = Math.floor(_bk.selM / 60) * 60 + (+mm); document.getElementById('bk-panel').innerHTML = bkPanelHtml(); }

function bkRenderActions() {
  var a = '<button class="btn-secondary" onclick="closeModal()" style="width:auto;padding:10px 20px">Đóng</button>';
  if (_bk.selDate && _bk.selM != null) {
    a += '<button class="login-btn" onclick="bkGoConfirm()" style="width:auto;padding:10px 24px">Tiếp tục →</button>';
  } else {
    a += '<button class="login-btn" disabled style="width:auto;padding:10px 24px;opacity:.5;cursor:not-allowed">Chọn ngày & giờ</button>';
  }
  document.getElementById('modal-actions').innerHTML = a;
}
function bkGoConfirm() { _bk.step = 'confirm'; renderBkConfirm(); }
function bkBack() { _bk.step = 'pick'; renderBkBody(); }

function renderBkConfirm() {
  var d = _bk.selDate;
  document.getElementById('modal-title').textContent = 'Xác nhận đặt lịch — Buổi ' + _bookSessionCtx.sessionNo;
  document.getElementById('modal-body').innerHTML =
    '<div style="border:1.5px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:12px">' +
      '<div style="font-size:12px;color:var(--muted);margin-bottom:2px">Advisor</div><div style="font-weight:700;margin-bottom:10px">' + _bookSessionCtx.advisorName + '</div>' +
      '<div style="font-size:12px;color:var(--muted);margin-bottom:2px">Thời gian</div>' +
      '<div style="font-weight:700;font-size:16px">' + dayLabel(d) + '/' + d.slice(0, 4) + ' · <span style="color:var(--brand)">' + tstr(_bk.selM) + ' – ' + tstr(_bk.selM + SC_DUR) + '</span></div>' +
      '<div style="font-size:12.5px;color:var(--muted);margin-top:2px">Thời lượng 60 phút</div></div>' +
    '<div style="background:#FFF7ED;border:1.5px solid #FED7AA;border-radius:10px;padding:12px 16px;font-size:13px;line-height:1.65;color:#9A3412">' +
      '⚠ Sau khi đặt, bạn cần hoàn thành <b>form câu hỏi gửi Advisor trước giờ hẹn 2 tiếng</b>. Nếu chưa nhận được thông tin, team LinkaJob sẽ xoá lịch meeting và bạn sẽ mất 1 buổi.</div>';
  document.getElementById('modal-actions').innerHTML =
    '<button class="btn-secondary" onclick="bkBack()" style="width:auto;padding:10px 20px">← Quay lại</button>' +
    '<button class="login-btn" id="bk-confirm-btn" onclick="confirmBookSession()" style="width:auto;padding:10px 24px">Xác nhận đặt lịch</button>';
}

// Bước cuối: gửi request đặt lịch thật
function confirmBookSession() {
  var ctx = _bookSessionCtx, d = _bk.selDate, m = _bk.selM;
  var slot = (_bk.avail[d] || []).filter(function(x){ return x.m === m; })[0];
  if (!slot) { toast('Vui lòng chọn lại giờ meeting', 'error'); bkBack(); return; }
  var ae = MOCK.advisees.find(function(x){ return x.id === ctx.aeId; });
  if (!ae) return;

  var btn = document.getElementById('bk-confirm-btn');
  if (btn) { btn.innerHTML = '<span class="spinner"></span> Đang đặt lịch...'; btn.disabled = true; }

  apiPost({
    action: 'bookSession', slot_id: slot.slot_id, booking_id: ae.bookingId,
    session_number: ctx.sessionNo, advisee_name: ae.name,
  }).then(function(res) {
    if (!res || !res.success) {
      toast('Lỗi: ' + (res && res.error ? res.error : 'không đặt được lịch — khung giờ có thể vừa bị người khác chọn'), 'error');
      openBookSessionModal(ctx.aeId, ctx.sessionNo);
      return;
    }
    var s = ae.sessions.find(function(x){ return x.no === ctx.sessionNo; });
    var time = tstr(m);
    if (s) { s.date = d; s.timeStart = time; s.timeEnd = tstr(m + SC_DUR); s.session_id = res.session_id; s.status = 'upcoming'; }
    toast('Đã đặt lịch buổi ' + ctx.sessionNo + ' thành công ✅', 'success');
    document.getElementById('main-content').innerHTML = renderMyBookings();
    showBookingSuccessNotice(ctx.sessionNo, d, time);
  }).catch(function(err) {
    toast('Lỗi kết nối: ' + err.message, 'error');
    if (btn) { btn.innerHTML = 'Xác nhận đặt lịch'; btn.disabled = false; }
  });
}

// Thông báo sau khi advisee đặt lịch xong: chờ advisor xác nhận + nhắc điền form trước 2 tiếng
function showBookingSuccessNotice(sessionNo, dateStr, time) {
  var d = String(dateStr || '').split('-').reverse().join('/');
  var _mb = document.querySelector('.modal'); if (_mb) _mb.style.maxWidth = '';
  document.getElementById('modal-title').textContent = 'Đặt lịch thành công';
  document.getElementById('modal-body').innerHTML =
    '<div style="text-align:center;padding:4px 0 14px">' +
      '<div style="font-size:44px;margin-bottom:8px">✅</div>' +
      '<div style="font-size:16px;font-weight:800;margin-bottom:4px">Bạn đã đặt lịch buổi ' + sessionNo + ' thành công!</div>' +
      '<div style="font-size:13.5px;color:var(--muted)">' + d + ' · ' + time + ' — đang chờ Advisor xác nhận</div>' +
    '</div>' +
    '<div style="background:var(--green-bg);border-radius:10px;padding:12px 16px;font-size:13.5px;line-height:1.65;margin-bottom:10px">' +
      '🎥 Link meeting sẽ hiển thị trên dashboard và được gửi qua email của bạn.' +
    '</div>' +
    '<div style="background:#FFF7ED;border:1.5px solid #FED7AA;border-radius:10px;padding:12px 16px;font-size:13.5px;line-height:1.65;color:#9A3412">' +
      '⚠ Vui lòng hoàn thành <b>form câu hỏi gửi đến Advisor trước giờ hẹn 2 tiếng</b>. ' +
      'Nếu chưa hoàn thành, team LinkaJob sẽ huỷ buổi meeting và bạn sẽ bị mất 1 buổi.' +
    '</div>';
  document.getElementById('modal-actions').innerHTML =
    '<button class="btn-secondary" onclick="closeModal()" style="width:auto;padding:10px 20px">Gửi câu hỏi sau</button>' +
    '<button class="login-btn" onclick="openAdviseeSessionModal(' + sessionNo + ')" style="width:auto;padding:10px 24px">Điền câu hỏi luôn →</button>';
  document.getElementById('modal-overlay').classList.add('open');
}

function aeeHoverStarModal(sessionNo, val) {
  if (!adviseeStarState[sessionNo]) adviseeStarState[sessionNo] = { selected:0, hover:0 };
  adviseeStarState[sessionNo].hover = val;
  var container = document.getElementById('m-stars-' + sessionNo);
  if (!container) return;
  container.querySelectorAll('span').forEach(function(el, i){ el.style.color = (i < (val || adviseeStarState[sessionNo].selected)) ? '#F59E0B' : '#D1D5DB'; });
}
function aeeSelectStarModal(sessionNo, val) {
  if (!adviseeStarState[sessionNo]) adviseeStarState[sessionNo] = { selected:0, hover:0 };
  adviseeStarState[sessionNo].selected = val;
  aeeHoverStarModal(sessionNo, val);
}

function submitPrepInfoModal(sessionNo) {
  var cv    = (document.getElementById('m-prep-cv-'    + sessionNo)||{}).value || '';
  var q     = (document.getElementById('m-prep-q-'     + sessionNo)||{}).value || '';
  var links = (document.getElementById('m-prep-links-' + sessionNo)||{}).value || '';
  if (!q.trim()) { toast('Vui lòng điền câu hỏi cho Advisor', 'error'); return; }
  var ae = MOCK.advisees.find(function(x){ return x.name === currentUser.name || x.email === currentUser.email; });
  if (!ae) return;
  var s = ae.sessions.find(function(x){ return x.no === sessionNo; });
  if (!s) return;
  if (!s.date || !s.timeStart) { toast('Buổi này chưa có lịch cụ thể — không thể gửi chuẩn bị', 'error'); return; }

  var btn = document.querySelector('#modal-actions .login-btn');
  if (btn) { btn.innerHTML = '<span class="spinner"></span> Đang gửi...'; btn.disabled = true; }

  apiPost({
    action: 'submitPrepInfo',
    session_id: s.session_id,
    cv_link: cv.trim(),
    question: q.trim(),
    other_links: links.trim(),
  }).then(function(res){
    if (!res || !res.success) {
      toast('Lỗi: ' + (res && res.error ? res.error : 'không gửi được, thử lại'), 'error');
      if (btn) { btn.innerHTML = 'Gửi chuẩn bị →'; btn.disabled = false; }
      return;
    }
    s.prepInfo = { cvLink: cv.trim(), question: q.trim(), otherLinks: links.trim(), submittedAt: res.submitted_at || '' };
    toast('Đã gửi thông tin chuẩn bị buổi ' + sessionNo + ' ✅', 'success');
    closeModal();
    document.getElementById('main-content').innerHTML = renderMyBookings();
  }).catch(function(err){
    toast('Lỗi kết nối: ' + err.message, 'error');
    if (btn) { btn.innerHTML = 'Gửi chuẩn bị →'; btn.disabled = false; }
  });
}

function submitAdviseeFeedbackModal(sessionNo) {
  var rating = (adviseeStarState[sessionNo]||{}).selected || 0;
  var text   = (document.getElementById('m-fbtext-' + sessionNo)||{}).value || '';
  if (!rating) { toast('Vui lòng chọn số sao', 'error'); return; }
  var ae = MOCK.advisees.find(function(x){ return x.name === currentUser.name; });
  if (!ae) return;
  var s = ae.sessions.find(function(x){ return x.no === sessionNo; });
  if (!s) return;

  var feedbackSessionId = s.session_id || (ae.bookingId + '-' + sessionNo);

  // Lưu thật lên Sheet (tab AdvisorReviews) — feedback này sẽ hiển thị công khai
  // trên trang giới thiệu Advisor. Không chặn UI nếu lỗi mạng, chỉ báo toast.
  apiPost({
    action: 'submitAdviseeFeedback',
    session_id: feedbackSessionId,
    advisor_name: ae.advisor,
    advisee_name: ae.name,
    rating: rating,
    text: text,
  }).then(function(res){
    if (!res || !res.success) toast('Đã lưu tạm — lỗi đồng bộ Sheet: ' + (res&&res.error||''), 'error');
  }).catch(function(err){ toast('Đã lưu tạm — lỗi kết nối: ' + err.message, 'error'); });

  s.status = 'done'; s.feedback = { rating:rating, text:text };
  ae.sessionsDone = Math.min(ae.sessionsDone + 1, ae.sessionsTotal);
  var next = ae.sessions.find(function(x){ return x.no === sessionNo+1 && x.status === 'locked'; });
  if (next) next.status = 'upcoming';

  adviseeStarState[sessionNo] = { selected:0, hover:0 };
  toast('Đã gửi feedback buổi ' + sessionNo + '! Buổi ' + (sessionNo+1) + ' đã mở khoá 🎉', 'success');
  closeModal();
  document.getElementById('main-content').innerHTML = renderMyBookings();
}

function openPrepFormModal(sessionNo) {
  var ae = MOCK.advisees.find(function(x){ return x.name === currentUser.name; });
  if (ae) { var s = ae.sessions.find(function(x){ return x.no === sessionNo; }); if (s) s.prepInfo = null; }
  openAdviseeSessionModal(sessionNo);
}


function aeeHoverStar(sessionNo, val) {
  if (!adviseeStarState[sessionNo]) adviseeStarState[sessionNo] = { selected:0, hover:0 };
  adviseeStarState[sessionNo].hover = val;
  refreshStars(sessionNo);
}

function aeeSelectStar(sessionNo, val) {
  if (!adviseeStarState[sessionNo]) adviseeStarState[sessionNo] = { selected:0, hover:0 };
  adviseeStarState[sessionNo].selected = val;
  refreshStars(sessionNo);
  var btn = document.getElementById('fbbtn-' + sessionNo);
  if (btn) btn.disabled = false;
}

function refreshStars(sessionNo) {
  var st = adviseeStarState[sessionNo];
  var container = document.getElementById('stars-' + sessionNo);
  if (!container) return;
  var stars = container.querySelectorAll('.aee-star');
  stars.forEach(function(el, i) {
    el.classList.toggle('active', i < (st.hover || st.selected));
  });
}

function submitAdviseeFeedback(sessionNo, session) {
  var rating = (adviseeStarState[sessionNo]||{}).selected || 0;
  var text = (document.getElementById('fbtext-' + sessionNo)||{}).value || '';
  var btn = document.getElementById('fbbtn-' + sessionNo);

  if (!rating) { toast('Vui lòng chọn số sao trước khi gửi', 'error'); return; }

  if (btn) { btn.innerHTML = '<span class="spinner"></span> Đang gửi...'; btn.disabled = true; }

  // Lưu vào mock data và cập nhật trạng thái buổi
  var ae = MOCK.advisees.find(function(x){ return x.name === currentUser.name; });
  if (ae) {
    var s = ae.sessions.find(function(x){ return x.no === sessionNo; });
    if (s) {
      s.status = 'done';
      s.feedback = { rating: rating, text: text };
      ae.sessionsDone = Math.min(ae.sessionsDone + 1, ae.sessionsTotal);
    }
    // Mở khoá buổi tiếp theo
    var next = ae.sessions.find(function(x){ return x.no === sessionNo + 1 && x.status === 'locked'; });
    if (next) next.status = 'upcoming';
  }

  setTimeout(function() {
    toast('Đã gửi feedback buổi ' + sessionNo + '! Buổi ' + (sessionNo+1) + ' đã mở khoá 🎉', 'success');
    adviseeStarState[sessionNo] = { selected:0, hover:0 };
    renderAdvisee('my-bookings');
    document.getElementById('main-content').innerHTML = renderMyBookings();
  }, 800);
}

function submitAdvisorNotes(aeId, sessionNo) {
  var summary     = (document.getElementById('an-summary-'  + aeId + '-' + sessionNo)||{}).value || '';
  var feedback    = (document.getElementById('an-feedback-' + aeId + '-' + sessionNo)||{}).value || '';
  var actionItems = (document.getElementById('an-actions-'  + aeId + '-' + sessionNo)||{}).value || '';

  if (!summary.trim() || !feedback.trim()) { toast('Vui lòng điền Nội dung và Nhận xét trước khi gửi', 'error'); return; }

  var ae = MOCK.advisees.find(function(x){ return x.id === aeId; });
  if (!ae) return;
  var s = ae.sessions.find(function(x){ return x.no === sessionNo; });
  if (!s) return;

  var notesSessionId = s.session_id || (ae.bookingId + '-' + sessionNo);

  // Lưu thật lên Sheet (tab AdvisorNotes) — KHÔNG public, chỉ Advisee & Staff xem được.
  apiPost({
    action: 'submitAdvisorNotes',
    session_id: notesSessionId,
    advisor_name: ae.advisor,
    advisee_name: ae.name,
    summary: summary.trim(),
    feedback: feedback.trim(),
    action_items: actionItems.trim(),
  }).then(function(res){
    if (!res || !res.success) toast('Đã lưu tạm — lỗi đồng bộ Sheet: ' + (res&&res.error||''), 'error');
  }).catch(function(err){ toast('Đã lưu tạm — lỗi kết nối: ' + err.message, 'error'); });

  var now = new Date();
  s.advisorNotes = {
    summary: summary.trim(),
    feedback: feedback.trim(),
    actionItems: actionItems.trim(),
    submittedAt: pad(now.getDate()) + '/' + pad(now.getMonth()+1) + '/' + now.getFullYear() + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes())
  };

  toast('Đã gửi nhận xét buổi ' + sessionNo + ' ✅', 'success');
  closeModal();
  navToAdviseeDetail(aeId);
}

function openAdvisorNotesEdit(aeId, sessionNo) {
  var ae = MOCK.advisees.find(function(x){ return x.id === aeId; });
  if (ae) { var s = ae.sessions.find(function(x){ return x.no === sessionNo; }); if (s) s.advisorNotes = null; }
  openSessionDetailModal(aeId, sessionNo);
}

function renderAdviseeDetailForAdvisor(aeId) {
  var ae = MOCK.advisees.find(function(x){ return x.id === aeId; });

  var pkg = PACKAGES[ae.pkg] || {};
  var html = '';

  // ── Breadcrumb ──
  html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:20px;font-size:13px">';
  html += '<button onclick="loadDashboard(\'Advisor\',\'overview\')" style="background:none;border:none;color:var(--brand);cursor:pointer;font-size:13px;font-family:inherit;padding:0">← Tổng quan</button>';
  html += '<span style="color:var(--border)">›</span>';
  html += '<span style="color:var(--muted)">' + ae.name + '</span>';
  html += '</div>';

  // ── Advisee info card ──
  html += '<div class="card" style="margin-bottom:16px"><div style="padding:20px 24px;display:flex;gap:16px;align-items:flex-start">';
  html += avatarCircle(ae.name, 52);
  html += '<div style="flex:1"><div style="font-size:18px;font-weight:800;margin-bottom:3px">' + ae.name + '</div>';
  html += '<div style="font-size:13px;color:var(--muted);margin-bottom:12px">' + ae.email + ' · ' + ae.phone + '</div>';
  html += '<div style="display:flex;gap:10px;flex-wrap:wrap">';
  html += '<span style="background:var(--brand-light);color:var(--brand);font-size:12px;font-weight:700;padding:4px 12px;border-radius:100px">Gói ' + ae.pkg + '</span>';
  html += '<span style="background:var(--bg);color:var(--muted);font-size:12px;font-weight:600;padding:4px 12px;border-radius:100px">' + ae.bookingId + '</span>';
  html += '<span style="background:var(--green-bg);color:var(--green);font-size:12px;font-weight:700;padding:4px 12px;border-radius:100px">' + ae.sessionsDone + '/' + ae.sessionsTotal + ' buổi</span>';
  html += '<span style="background:#F3F4F6;color:var(--muted);font-size:12px;font-weight:600;padding:4px 12px;border-radius:100px">Hết hạn ' + ae.expiry + '</span>';
  html += '</div></div>';
  // Progress bar
  html += '<div style="text-align:right;min-width:80px"><div style="font-size:24px;font-weight:800;color:var(--brand)">' + Math.round(ae.sessionsDone/ae.sessionsTotal*100) + '%</div><div style="font-size:11px;color:var(--muted)">hoàn thành</div></div>';
  html += '</div></div>';

  // ── Danh sách buổi meeting ──
  html += '<div class="card"><div class="card-header"><div class="card-header-left">Các buổi meeting</div></div>';
  ae.sessions.forEach(function(s) {
    var pd = safeParseYMD(s.date);
    var dateLabel = pd.valid ? (pd.dow + ' ' + pd.dd + '/' + pd.mm + '/' + pd.dateObj.getFullYear() + ' · ' + s.timeStart + (s.timeEnd ? '–' + s.timeEnd : '')) : 'Chưa xếp lịch';

    var statusCfg = {
      done     : { bg:'var(--green-bg)',  color:'var(--green)',  label:'✓ Hoàn thành' },
      feedback : { bg:'#FFF7ED',          color:'#C2410C',       label:'Cần feedback' },
      upcoming : { bg:'#EFF6FF',          color:'#1D4ED8',       label:'Sắp tới' },
      locked   : { bg:'var(--bg)',        color:'var(--muted)',  label:'Đã khoá' },
    };
    var sc = statusCfg[s.status] || statusCfg.locked;

    var needNote = (s.status === 'done' || s.status === 'feedback') && !s.advisorNotes;

    html += '<div style="display:flex;align-items:center;gap:14px;padding:14px 24px;border-top:1px solid var(--border)">';
    // Số buổi
    html += '<div style="width:32px;height:32px;border-radius:50%;background:' + sc.bg + ';color:' + sc.color + ';display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0">' + s.no + '</div>';
    // Info
    html += '<div style="flex:1"><div style="font-weight:600;font-size:14px">Buổi ' + s.no + '</div>';
    html += '<div style="font-size:12px;color:var(--muted);margin-top:2px">' + dateLabel + '</div></div>';
    // Tags
    html += '<span style="background:' + sc.bg + ';color:' + sc.color + ';font-size:12px;font-weight:700;padding:4px 12px;border-radius:100px">' + sc.label + '</span>';
    if (needNote) html += '<span style="background:#FEF3C7;color:#92400E;font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px">Cần nhận xét</span>';
    // Meet link
    if (s.meetLink && s.status !== 'locked') html += '<a href="' + s.meetLink + '" target="_blank" class="detail-btn" style="font-size:12px;padding:6px 12px">🎥 Meet</a>';
    // Chi tiết
    if (s.status !== 'locked') {
      html += '<button class="detail-btn" onclick="openSessionDetailModal(\'' + aeId + '\',' + s.no + ')" style="font-size:12px;padding:6px 12px">Chi tiết</button>';
    }
    html += '</div>';
  });
  html += '</div>';
  return html;
}

// ── Modal chi tiết từng buổi meeting ──
function openSessionDetailModal(aeId, sessionNo) {
  var ae = MOCK.advisees.find(function(x){ return x.id === aeId; });
  if (!ae) return;
  var s = ae.sessions.find(function(x){ return x.no === sessionNo; });
  if (!s) return;
  commitRoute({ tab: 'overview', ae: aeId, s: sessionNo });

  var pd = safeParseYMD(s.date);
  var dateLabel = pd.valid ? (pd.dow + ' ' + pd.dd + '/' + pd.mm + '/' + pd.dateObj.getFullYear() + ' · ' + s.timeStart + (s.timeEnd ? '–' + s.timeEnd : '')) : 'Chưa xếp lịch';

  document.getElementById('modal-title').textContent = ae.name + ' · Buổi ' + sessionNo;

  var body = '';

  // Thời gian + link Meet
  body += '<div style="display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:10px;padding:12px 16px;margin-bottom:16px;flex-wrap:wrap;gap:8px">';
  body += '<div><div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px">Thời gian</div><div style="font-size:14px;font-weight:600">' + dateLabel + '</div></div>';
  body += '<div style="display:flex;gap:8px">';
  if (s.meetLink) body += '<a href="' + s.meetLink + '" target="_blank" class="detail-btn">🎥 Vào Meet</a>';
  if (s.status === 'upcoming') body += '<button class="detail-btn" onclick="closeModal();openRescheduleModal(\'' + ae.id + '\',' + sessionNo + ',\'advisor\')">🔄 Đổi giờ</button>';
  body += '</div></div>';

  // Prep info từ Advisee
  body += '<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px">Chuẩn bị của Advisee</div>';
  body += renderPrepCard(s.prepInfo);

  // Feedback của Advisee cho Advisor (nếu có)
  if (s.feedback) {
    body += '<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:14px 0 8px">3 điều bạn học/nhận được sau buổi cố vấn</div>';
    body += '<div style="background:#FFF7ED;border:1.5px solid #FED7AA;border-radius:10px;padding:12px 14px">';
    var stars = '';
    for (var i=1;i<=5;i++) stars += '<span style="color:' + (i<=s.feedback.rating?'#F59E0B':'#D1D5DB') + ';font-size:15px">★</span>';
    body += '<div style="margin-bottom:6px">' + stars + '</div>';
    if (s.feedback.text) body += '<div style="font-size:13px;color:var(--text);line-height:1.65">' + s.feedback.text + '</div>';
    body += '</div>';
  }

  // Advisor notes — đã có hoặc form điền mới
  body += '<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:14px 0 8px">Nhận xét của Advisor</div>';
  if (s.advisorNotes) {
    body += renderAdvisorNotesCard(s.advisorNotes, false, null, s.no);
    body += '<div style="margin-top:8px;text-align:right"><button class="anote-edit-btn" style="font-size:12px" onclick="openAdvisorNotesEdit(\'' + aeId + '\',' + sessionNo + ')">✎ Sửa nhận xét</button></div>';
  } else if (s.status === 'done' || s.status === 'feedback') {
    // Form nhận xét inline trong modal
    body += '<div style="background:#FAF5FF;border:1.5px solid #E9D5FF;border-radius:10px;padding:14px">';
    body += '<div style="font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Nội dung đã trao đổi <span style="color:var(--brand)">*</span></div>';
    body += '<textarea class="anote-input" id="an-summary-' + aeId + '-' + sessionNo + '" rows="3" placeholder="Tóm tắt nội dung chính đã thảo luận..."></textarea>';
    body += '<div style="font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 6px">Nhận xét & Góp ý <span style="color:var(--brand)">*</span></div>';
    body += '<textarea class="anote-input" id="an-feedback-' + aeId + '-' + sessionNo + '" rows="3" placeholder="Điểm mạnh, điểm cần cải thiện..."></textarea>';
    body += '<div style="font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 6px">Việc cần làm trước buổi sau</div>';
    body += '<textarea class="anote-input" id="an-actions-' + aeId + '-' + sessionNo + '" rows="2" placeholder="1. Cập nhật CV...\n2. Đọc case study..."></textarea>';
    body += '</div>';
  } else {
    body += '<div class="anote-missing">Buổi chưa diễn ra.</div>';
  }

  document.getElementById('modal-body').innerHTML = body;

  // Actions
  var actions = '<button class="btn-secondary" onclick="closeModal()" style="width:auto;padding:10px 20px">Đóng</button>';
  if (!s.advisorNotes && (s.status === 'done' || s.status === 'feedback')) {
    actions += '<button class="login-btn" onclick="submitAdvisorNotes(\'' + aeId + '\',' + sessionNo + ')" style="width:auto;padding:10px 24px;background:#7C3AED">Gửi nhận xét →</button>';
  }
  document.getElementById('modal-actions').innerHTML = actions;
  document.getElementById('modal-overlay').classList.add('open');
}

function openRescheduleModal(aeId, sessionNo, requestedBy) {
  var ae = MOCK.advisees.find(function(x){ return x.id === aeId; });
  if (!ae) return;
  var s = ae.sessions.find(function(x){ return x.no === sessionNo; });

  document.getElementById('modal-title').textContent = '🔄 Đổi giờ meeting — Buổi ' + sessionNo;

  body += '<div class="form-label" style="margin-bottom:6px">Lý do <span style="color:var(--brand)">*</span></div>';

  body += '<div class="form-label" style="margin-bottom:6px">Đề xuất khung giờ 1 <span style="color:var(--brand)">*</span></div>';
  body += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">';
  body += '<input class="form-input" type="date" id="rs-date1"><input class="form-input" type="time" id="rs-time1">';
  body += '</div>';
  body += '<div class="form-label" style="margin-bottom:6px">Đề xuất khung giờ 2 <span style="color:var(--brand)">*</span></div>';
  body += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">';
  body += '<input class="form-input" type="date" id="rs-date2"><input class="form-input" type="time" id="rs-time2">';
  body += '</div>';

  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal-actions').innerHTML =
    '<button class="btn-secondary" onclick="closeModal()" style="width:auto;padding:10px 20px">Huỷ</button>' +
    '<button class="login-btn" onclick="submitRescheduleRequest(\'' + aeId + '\',' + sessionNo + ',\'' + requestedBy + '\')" style="width:auto;padding:10px 24px">Gửi yêu cầu đổi giờ →</button>';

function submitRescheduleRequest(aeId, sessionNo, requestedBy) {
  var ae = MOCK.advisees.find(function(x){ return x.id === aeId; });
  if (!ae) return;
  var s = ae.sessions.find(function(x){ return x.no === sessionNo; });
  if (!s || !s.date || !s.timeStart) { toast('Buổi này chưa có lịch cụ thể — không thể yêu cầu đổi giờ', 'error'); return; }

  var reason = document.getElementById('rs-reason').value.trim();
  var d1 = document.getElementById('rs-date1').value, t1 = document.getElementById('rs-time1').value;
  var d2 = document.getElementById('rs-date2').value, t2 = document.getElementById('rs-time2').value;
  if (!reason || !d1 || !t1 || !d2 || !t2) { toast('Vui lòng điền đầy đủ lý do và 2 khung giờ đề xuất', 'error'); return; }

  var btn = document.querySelector('#modal-actions .login-btn');
  if (btn) { btn.innerHTML = '<span class="spinner"></span> Đang gửi...'; btn.disabled = true; }

  apiPost({
    action: 'submitRescheduleRequest',
    session_id: s.session_id,
    requested_by: requestedBy, // 'advisor' hoặc 'advisee'
    reason: reason,
    option1_date: d1, option1_time: t1, option2_date: d2, option2_time: t2,
  }).then(function(res){
    if (!res || !res.success) {
      toast('Lỗi: ' + (res && res.error ? res.error : 'không gửi được, thử lại'), 'error');
      if (btn) { btn.innerHTML = 'Gửi yêu cầu đổi giờ →'; btn.disabled = false; }
      return;
    }
    toast('Đã gửi yêu cầu đổi giờ — Staff sẽ xác nhận sớm ✅', 'success');
    closeModal();
  }).catch(function(err){
    toast('Lỗi kết nối: ' + err.message, 'error');
    if (btn) { btn.innerHTML = 'Gửi yêu cầu đổi giờ →'; btn.disabled = false; }
  });
}

function loadRescheduleRequestsPage() {

function renderRescheduleRequestsPage(reqs) {
  reqs = reqs || window._rescheduleRequests || [];

    html += '<div class="empty-state"><div class="icon">✅</div>Không có yêu cầu đổi lịch nào đang chờ</div>';
  } else {
    pending.forEach(function(r){
      var aeName = r._ae_name || '(không rõ)';
      html += '<div style="padding:16px 24px;border-top:1px solid var(--border)">';
      html += '<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">' + avatarCircle(aeName, 36);
      html += '<div style="flex:1"><div style="font-weight:700;font-size:14px">' + aeName + (r._session_no ? ' · Buổi ' + r._session_no : '') + '</div>';

      html += '<div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Chọn 1 khung giờ để xác nhận</div>';
      html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">';

      html += '</div></div>';
    });
  }
  html += '</div>';

  if (resolved.length > 0) {
    html += '<div class="card"><div class="card-header"><div class="card-header-left">Đã xử lý</div></div>';
    resolved.forEach(function(r){
      var st = String(r.status||'').trim().toLowerCase();
      var aeName = r._ae_name || '(không rõ)';
      var tag = st === 'confirmed' ? '<span class="badge badge-confirmed">✓ Đã xác nhận</span>' : '<span class="badge badge-cancelled">Đã từ chối</span>';
      html += '<div style="display:flex;align-items:center;gap:12px;padding:14px 24px;border-top:1px solid var(--border)">' + avatarCircle(aeName, 32);

    });
    html += '</div>';
  }
  return html;

// ════════════════════════════════════════════════════════════
//  ROUTER (hash URL) cho Advisor/Advisee
//  #tab=overview                    Tổng quan
//  #tab=overview&ae=<id>            Trang chi tiết 1 advisee (Advisor)
//  #tab=overview&ae=<id>&s=2        Modal buổi 2 của advisee đó (Advisor)
//  #tab=my-bookings&s=2             Modal buổi 2 (Advisee)
//  Mở modal = pushState (nút Back đóng modal). Staff không dùng router.
// ════════════════════════════════════════════════════════════
var _route = null, _baseRoute = null, _modalPushed = false, _routeLock = 0, _routeSeq = 0, _clearTimer = null;

// ── Router # cho Staff (Admin có sidebar): #nav=<id>[&v=advisor:<id>|advisee:<id>:<from>|staff:<id>] ──
var _staffRouteLock = 0;
function isStaffRouted() { return !!currentUser && currentUser.role === 'Staff' && currentUser.subRole === 'Admin'; }
function commitStaffRoute(nav, view, replace) {
  if (!isStaffRouted() || _staffRouteLock) return;
  var p = new URLSearchParams();
  if (nav) p.set('nav', nav);
  if (view) p.set('v', view);
  var h = '#' + p.toString();
  if (location.hash === h) return;
  if (replace) history.replaceState(null, '', h); else history.pushState(null, '', h);
}
function groupOfNav(id) {
  var defs = SIDEBAR_DEF.Staff || [];
  for (var i = 0; i < defs.length; i++) {
    if ((defs[i].children || []).some(function(c){ return c.id === id; })) return defs[i].id;
  }
  return null;
}
// Đọc # và dựng lại đúng trang. Trả về false nếu # trống/không hợp lệ.
function applyStaffRoute() {
  var p = new URLSearchParams(location.hash.replace(/^#\/?/, ''));
  var nav = p.get('nav'), view = p.get('v') || '';
  if (!nav || !ROUTE_MAP[nav]) return false;
  var g = groupOfNav(nav);
  if (g && openGroupId !== g) { if (openGroupId) closeNavGroup(openGroupId); openNavGroup(g); }
  var parts = view.split(':'), kind = parts[0], id = parts[1] || '';
  _staffRouteLock++;
  try {
    if (!kind || !id) { navTo(nav, { noRoute: true }); return true; }
    navTo(nav, { noRoute: true, noRender: true });
  } finally { _staffRouteLock--; }

  function lockRun(fn) { _staffRouteLock++; try { fn(); } finally { _staffRouteLock--; } }
  if (kind === 'staff') {
    lockRun(function(){ navToStaffMemberDetail(id); });
  } else if (kind === 'advisor') {
    loadAdvisorsFromSheet(function(){ lockRun(function(){ navToStaffAdvisorDetail(id); }); });
  } else if (kind === 'advisee') {
    var from = parts[2] && parts[2] !== 'staffcare' ? parts[2] : '';
    if (from) loadAdvisorsFromSheet(function(){ lockRun(function(){ navToStaffAdviseeDetail(id, from); }); });
    else lockRun(function(){ navToStaffAdviseeDetail(id, null); });
  } else {
    lockRun(function(){ navTo(nav, { noRoute: true }); });
  }
  return true;
}

function isRoutedRole() { return !!currentUser && (currentUser.role === 'Advisor' || currentUser.role === 'Advisee'); }
function withRouteLock(fn) { _routeLock++; try { fn(); } finally { _routeLock--; } }

function buildHash(r) {
  var p = new URLSearchParams();
  if (r && r.tab) p.set('tab', r.tab);
  if (r && r.ae) p.set('ae', r.ae);
  if (r && r.s) p.set('s', r.s);
  return '#' + p.toString();
}
function parseHash() {
  var p = new URLSearchParams(location.hash.replace(/^#\/?/, ''));
  return { tab: p.get('tab') || '', ae: p.get('ae') || '', s: p.get('s') || '' };
}

// Chỉ giữ lại phần hợp lệ với vai trò đang đăng nhập (link của người khác/cũ không làm vỡ trang)
function normalizeRoute(r) {
  var ids = window._roleTabIds || [];
  var tab = ids.indexOf(r.tab) > -1 ? r.tab : '';
  if (!tab) {
    var saved = null;
    try { saved = localStorage.getItem('linkajob_last_tab'); } catch (e) {}
    tab = (saved && ids.indexOf(saved) > -1) ? saved : ids[0];
  }
  var out = { tab: tab, ae: '', s: '' };
  var validS = /^\d+$/.test(r.s);
  if (currentUser.role === 'Advisor') {
    if (tab === 'overview' && r.ae) { out.ae = r.ae; if (validS) out.s = r.s; }
  } else if (tab === 'my-bookings' && validS) {
    out.s = r.s;
  }
  return out;
}

// Ghi route mới lên URL (gọi từ các hàm điều hướng khi NGƯỜI DÙNG thao tác)
function commitRoute(r) {
  if (!isRoutedRole() || _routeLock) return;
  clearTimeout(_clearTimer);
  r = { tab: r.tab || '', ae: r.ae || '', s: r.s ? String(r.s) : '' };
  var h = buildHash(r), prev = _route;
  if (location.hash === h) { _route = r; return; }

  if (prev && prev.s && !r.s) {            // rời khỏi modal
    var wasPushed = _modalPushed, baseHash = buildHash(_baseRoute);
    _route = r; _modalPushed = false;
    if (wasPushed && h === baseHash) history.back();
    else history.replaceState(null, '', h);
    return;
  }
  if (prev && prev.s && r.s) {             // đổi sang buổi khác khi modal đang mở
    _route = r; history.replaceState(null, '', h); return;
  }
  if (r.s) {                               // mở modal
    _baseRoute = prev ? { tab: prev.tab, ae: prev.ae, s: '' } : { tab: r.tab, ae: '', s: '' };
    _modalPushed = true;
  }
  _route = r;
  history.pushState(null, '', h);
}

// Đóng modal bằng ×/Đóng/click nền thì URL quay về trang nền
function scheduleRouteClear() {
  if (!isRoutedRole() || _routeLock || !_route || !_route.s) return;
  clearTimeout(_clearTimer);
  // setTimeout 0: nếu ngay sau đó code mở modal/trang khác thì commitRoute sẽ huỷ bước này
  _clearTimer = setTimeout(function(){
    if (_route && _route.s) commitRoute(_baseRoute || { tab: _route.tab, ae: _route.ae });
  }, 0);
}

// Đọc URL và dựng lại đúng màn hình (mở link, F5, nút Back/Forward)
function applyRoute(initial) {
  if (!isRoutedRole()) return;
  var r = normalizeRoute(parseHash());
  var had = !!_route && !initial;
  if (had && r.tab === _route.tab && r.ae === _route.ae && r.s === _route.s) return;
  var onlyModalChanged = had && r.tab === _route.tab && r.ae === _route.ae;

  var h = buildHash(r);
  if (location.hash !== h) history.replaceState(null, '', h);
  // Điều hướng bằng Back/Forward tới một URL có buổi: entry ngay trước đó chính là trang nền, nên khi đóng modal có thể quay lại bằng history.back()
  _route = r; _modalPushed = !initial && !!r.s; _baseRoute = { tab: r.tab, ae: r.ae, s: '' };
  clearTimeout(_clearTimer);
  hideModal();
  var seq = ++_routeSeq;

  if (onlyModalChanged) { if (r.s) openRouteSession(r); return; }
  var p;
  withRouteLock(function(){ p = renderRouteBase(r, seq); });
  p.then(function(){ if (seq === _routeSeq && r.s) openRouteSession(r); });
}

function renderRouteBase(r, seq) {
  if (currentUser.role === 'Advisor' && r.ae) {
    document.querySelectorAll('.role-tab').forEach(function(el){ el.classList.remove('active'); });
    var tabEl = document.getElementById('rt-' + r.tab);
    if (tabEl) tabEl.classList.add('active');
    _activeRoleTab = r.tab;
    var c = document.getElementById('main-content');
    c.className = 'content narrow';
    c.innerHTML = skeletonRows(3);
    return loadAdvisorRealDataAsync().then(function(){
      if (seq !== _routeSeq) return;
      withRouteLock(function(){ navToAdviseeDetail(r.ae); });
    });
  }
  return Promise.resolve(switchRoleTab(r.tab));
}

function openRouteSession(r) {
  var no = Number(r.s);
  withRouteLock(function(){
    if (currentUser.role === 'Advisor') { openSessionDetailModal(r.ae, no); return; }
    var activeAe = MOCK.advisees.find(function(ae){ return ae.email === currentUser.email && !isAdviseeExpired(ae); });
    if (activeAe) openAdviseeSessionModal(no);
  });
}

window.addEventListener('popstate', function(){
  if (isStaffRouted()) { if (!applyStaffRoute()) navTo('lj-newreg', { replace: true }); return; }
  applyRoute(false);
});

document.getElementById('login-password').addEventListener('keydown', function(e){ if (e.key === 'Enter') doLogin(); });

// Nếu đã có phiên đăng nhập hợp lệ trong localStorage, vào thẳng dashboard
// thay vì hiện lại màn hình đăng nhập mỗi khi F5/mở lại trình duyệt.
tryRestoreSession();
</script>
