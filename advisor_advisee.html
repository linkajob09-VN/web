    var subRole = currentUser && currentUser.subRole;

    if (subRole === 'Admin') {
      tabbar.className  = 'role-tabbar';        // hide tabbar
      sidebar.className = 'sidebar';             // show sidebar
      buildSidebar(role);
      return;
    }

    if (!subRole) {
      // Chưa cấu hình quyền cho tài khoản này — chặn lại thay vì mặc định Admin (fail-closed)
      sidebar.className = 'sidebar hidden';
      tabbar.className  = 'role-tabbar';
      var errMc = document.getElementById('main-content');
      errMc.className = 'content';
      errMc.innerHTML = '<div class="card"><div class="empty-state"><div class="icon">⚠</div>' +
        'Tài khoản này chưa được cấu hình quyền truy cập (subRole).<br>Vui lòng liên hệ Admin để gán vai trò phù hợp.</div></div>';
      return;
    }

    // Sale / CourseManager / AdvisorManager — chỉ thấy đúng phạm vi việc của mình
    tabbar.className  = 'role-tabbar';
    sidebar.className = 'sidebar hidden';
    var mc = document.getElementById('main-content');
    mc.className = 'content';
    if (subRole === 'Sale') loadSaleSelfDashboard();
    else if (subRole === 'CourseManager') mc.innerHTML = renderCourseManagerDashboard();
    else if (subRole === 'AdvisorManager') mc.innerHTML = renderAdvisorManagerDashboard();
    else mc.innerHTML = '<div class="empty-state">Chưa cấu hình quyền cho vai trò này</div>';
    return;
  }

  // Advisor & Advisee — no sidebar, use tab bar
  if ((role === 'Advisee' || role === 'Advisor') && !window._coursesChecked) {
    window._coursesChecked = true;
    // Advisee: chỉ hiện "Khoá học" khi đã đăng ký khoá. Advisor: chỉ khi được phân công dạy.
    var courseReq = role === 'Advisee'
      ? apiGet('getMyCourseEnrollments', { email: currentUser.email })
      : apiGet('getInstructorCourses', { advisor: currentUser.name });
    // Advisee: tải thêm danh sách tài liệu luyện tập + cho biết tài khoản này có dùng dịch vụ LinkaJob (booking) hay chỉ mua tài liệu
    var docReq = role === 'Advisee'
      ? apiGet('getMyDocuments', { email: currentUser.email }).catch(function(){ return null; })
      : Promise.resolve(null);
    window._hasBookings = true; window._myDocs = null;
    Promise.all([courseReq.catch(function(){ return null; }), docReq]).then(function(rs){
      var res = rs[0], dres = rs[1];
      window._hasCourses = !!(res && res.data && res.data.length > 0);
      if (dres && dres.success) { window._myDocs = dres.data || []; window._hasBookings = !!dres.has_bookings; }
    }).then(function(){ if (currentUser && currentUser.role === role) buildTabBar(role); });
    return;
  }
  sidebar.className = 'sidebar hidden';
  tabbar.className  = 'role-tabbar show';

  var TABS = {
    Advisor: [
      { id:'overview',  icon:'📊', label:'Tổng quan'       },
      { id:'schedule',  icon:'📅', label:'Gửi lịch trống'  },
    ],
    Advisee: [
      { id:'my-bookings', icon:'📋', label:'Cố vấn 1:1' },
    ],
  };

  var tabs = (TABS[role] || []).slice();
  // Advisee chỉ mua tài liệu (chưa có booking, chưa học khoá nào): ẩn "Cố vấn 1:1", chỉ còn "Tài liệu luyện tập"
  if (role === 'Advisee' && window._myDocs && !window._hasBookings && !window._hasCourses) tabs = [];
  // Advisee: chỉ mở thêm section "Khoá học" khi đã đăng ký ít nhất 1 khoá
  if (window._hasCourses) {
    if (role === 'Advisee') tabs.unshift({ id:'courses', icon:'🎓', label:'Khoá học' });
    if (role === 'Advisor') tabs.push({ id:'my-courses', icon:'🎓', label:'Khoá học' });
  }
  // Advisee: luôn có nút "Tài liệu luyện tập" (xem danh sách, đã mua thì hiện nút Sử dụng)
  if (role === 'Advisee' && window._myDocs) tabs.push({ id:'documents', icon:'📚', label:'Tài liệu luyện tập' });
  var html = '';
  tabs.forEach(function(t) {
    html += '<div class="role-tab" id="rt-' + t.id + '" onclick="switchRoleTab(\'' + t.id + '\')">';
    html += '<span class="tab-icon">' + t.icon + '</span>' + t.label;
    html += '</div>';
  });
  tabbar.innerHTML = html;

  // Router đọc URL (#tab=...&ae=...&s=...) để mở đúng trang/buổi; nếu URL trống thì dùng tab lần trước
  window._roleTabIds = tabs.map(function(t){ return t.id; });
  if (tabs.length) applyRoute(true);
}

var _activeRoleTab = null;
function switchRoleTab(tabId) {
  // Remove active from all tabs
  document.querySelectorAll('.role-tab').forEach(function(el){ el.classList.remove('active'); });
  var el = document.getElementById('rt-' + tabId);
  if (el) el.classList.add('active');
  _activeRoleTab = tabId;
  try { localStorage.setItem('linkajob_last_tab', tabId); } catch (e) {}
  commitRoute({ tab: tabId });

  // Render content (reuse loadLegacyTab flow)
  var role = currentUser ? currentUser.role : '';
  return Promise.resolve(role === 'Advisor' ? renderAdvisor(tabId) : renderAdvisee(tabId));
}

// Giữ lại để không lỗi switchTab (legacy)
function switchTab(tabId) { switchRoleTab(tabId); }


  // ── Tải dữ liệu THẬT từ Sheet cho Advisor đang đăng nhập, ghi đè vào
//    MOCK.advisees (chỉ phần của advisor này) để tái dùng toàn bộ các
//    hàm render sẵn có (renderAdvisorOverview, v.v.) không cần viết lại. ──
function loadAdvisorRealDataAsync() {
  return Promise.all([
    apiGet('getBookings', { advisor: currentUser.name }),
    apiGet('getSessions', {}), // lấy hết, tự lọc theo booking_id ở dưới — tránh phụ thuộc backend lọc đúng tên advisor
    apiGet('getSlots', { advisor: currentUser.name }),
  ]).then(function(results){
    var bookings = (results[0] && results[0].data) ? results[0].data : [];
    var sessions = (results[1] && results[1].data) ? results[1].data : [];
    var slots    = (results[2] && results[2].data) ? results[2].data : [];

    var realAdvisees = bookings
      .filter(function(b){ return b.status === 'confirmed'; })
      .map(function(b){ return buildAdviseeFromBooking(b, sessions); });

    MOCK.advisees = MOCK.advisees.filter(function(ae){ return normName(ae.advisor) !== normName(currentUser.name); });
    MOCK.advisees = MOCK.advisees.concat(realAdvisees);

    // Nạp slot thật cho tab "Gửi lịch trống" (renderSchedulePicker/openAdvisorDayModal đọc từ đây)
    sheetData.slots = slots;
  }).catch(function(err){
    console.warn('Không tải được dữ liệu advisee thật:', err.message);
  });
}

// ── Cờ của gói (lấy từ tab Packages): sessions_unlimited / advisor_unlimited ──
//    Gói "Đồng Hành" bật cả 2 cờ → số buổi không giới hạn + được tự đổi advisor.
var _pkgFlagsCache = null;
function loadPkgFlags() {
  if (_pkgFlagsCache) return Promise.resolve(_pkgFlagsCache);
  var T = function(v){ return v === true || String(v).toUpperCase() === 'TRUE'; };
  return apiGet('getPackages', {}).then(function(res){
    var map = {};
    ((res && res.data) || []).forEach(function(p){
      map[p.name] = { sessionsUnlimited: T(p.sessions_unlimited), advisorUnlimited: T(p.advisor_unlimited) };
    });
    _pkgFlagsCache = map;
    return map;
  }).catch(function(){ return {}; });
}
function ensureAdvisorsLoaded() {
  if (advisorsLoaded && sheetData.advisors && sheetData.advisors.length) return Promise.resolve();
  return new Promise(function(resolve){ loadAdvisorsFromSheet(resolve); });
}

// ── Tương tự, cho Advisee đang đăng nhập ──
function loadAdviseeRealDataAsync() {
  return apiGet('getBookings', { advisee_email: currentUser.email }).then(function(res){
    var bookings = (res && res.data) ? res.data : [];
    var confirmed = bookings.filter(function(b){ return b.status === 'confirmed'; });
    if (confirmed.length === 0) { MOCK.advisees = MOCK.advisees.filter(function(ae){ return ae.email !== currentUser.email; }); return; }

    // Sessions không có cột advisee_email, nên lấy hết rồi lọc theo booking_id ở client
    return Promise.all([apiGet('getSessions', {}), loadPkgFlags()]).then(function(rr){
      var sesRes = rr[0], pkgFlags = rr[1] || {};
      var allSessions = (sesRes && sesRes.data) ? sesRes.data : [];
      var bookingIds = confirmed.map(function(b){ return b.booking_id; });
      var mySessions = allSessions.filter(function(s){ return bookingIds.indexOf(s.booking_id) > -1; });

      // Booking mới nhất trước (created_at dạng chuỗi 'yyyy-MM-dd HH:mm...'; fallback theo booking_id LJ-yyyymmdd-xxxx)
      var sortKey = function(b){ return String(b.created_at || '') + '|' + String(b.booking_id || ''); };
      confirmed.sort(function(a, b){ var x = sortKey(a), y = sortKey(b); return x < y ? 1 : (x > y ? -1 : 0); });

      var realAdvisees = confirmed.map(function(b){ return buildAdviseeFromBooking(b, mySessions, pkgFlags[b.package_name]); });
      // Gói còn hạn lên trước, gói hết hạn xuống sau (sort ổn định → vẫn giữ thứ tự mới → cũ)
      realAdvisees.sort(function(a, b){ return (isAdviseeExpired(a) ? 1 : 0) - (isAdviseeExpired(b) ? 1 : 0); });

      // Đặt booking của người đăng nhập lên ĐẦU mảng để mọi MOCK.advisees.find(...) phía Advisee
      // (theo name/email) trả về đúng gói hiện tại, không bị kẹt ở gói cũ đã hết hạn.
      var others = MOCK.advisees.filter(function(ae){ return ae.email !== currentUser.email; });
      MOCK.advisees = realAdvisees.concat(others);
    });
  }).catch(function(err){
    console.warn('Không tải được dữ liệu booking thật:', err.message);
  });
}

// ── Ghép 1 dòng Booking + các dòng Sessions liên quan thành 1 object
//    "advisee" đúng shape mà renderAdvisorOverview / renderMyBookings đang cần ──
// Sheet đôi khi trả về ngày/giờ dạng locale (VD "8/7/2026", "8:00:00 PM") thay vì
// chuỗi chuẩn ("2026-08-07", "20:00") tuỳ luồng backend ghi vào. Chuẩn hoá cả 2 kiểu
// về đúng "yyyy-MM-dd" / "HH:mm" để new Date() luôn parse được.
function normSheetDate(v) {
  if (!v) return '';
  if (v instanceof Date && !isNaN(v)) {
    return v.getFullYear() + '-' + String(v.getMonth()+1).padStart(2,'0') + '-' + String(v.getDate()).padStart(2,'0');
  }
  v = String(v).trim();
  if (!v) return '';
  if (/^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0, 10);
  var m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(v);
  if (m) {
    // Ưu tiên đọc theo kiểu VN (DD/MM/YYYY) khi phần đầu > 12 (chắc chắn là ngày, không thể là tháng)
    var p1 = Number(m[1]), p2 = Number(m[2]), yyyy = m[3];
    var dd, mm;
    if (p1 > 12) { dd = p1; mm = p2; } else { dd = p2; mm = p1; }
    return yyyy + '-' + String(mm).padStart(2,'0') + '-' + String(dd).padStart(2,'0');
  }
  var d = new Date(v);
  return !isNaN(d) ? (d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0')) : '';
}
function normSheetTime(v) {
  if (!v) return '';
  if (v instanceof Date && !isNaN(v)) {
    return String(v.getHours()).padStart(2,'0') + ':' + String(v.getMinutes()).padStart(2,'0');
  }
  v = String(v).trim();
  if (!v) return '';
  if (/^\d{1,2}:\d{2}$/.test(v)) return v.length === 4 ? '0'+v : v;
  var m1 = /^(\d{1,2}):(\d{2}):\d{2}$/.exec(v);
  if (m1) return (m1[1].length<2?'0':'') + m1[1] + ':' + m1[2];
  var m2 = /^(\d{1,2}):(\d{2})(:\d{2})?\s*(AM|PM)$/i.exec(v);
  if (m2) {
    var h = Number(m2[1]) % 12;
    if (/pm/i.test(m2[4])) h += 12;
    return (h<10?'0':'') + h + ':' + m2[2];
  }
  return '';
}

// Trả về {dow, dd, mm, valid} — dùng thay cho `new Date(s.date+'T00:00:00')` rải rác khắp nơi,
// để không nơi nào còn in ra "undefined NaN/NaN" khi date parse lỗi.
function safeParseYMD(dateStr) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(dateStr||''));
  if (!m) return { valid: false };
  var d = new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));
  if (isNaN(d)) return { valid: false };
  return { valid: true, dow: ['CN','T2','T3','T4','T5','T6','T7'][d.getDay()], dd: d.getDate(), mm: d.getMonth()+1, dateObj: d };
}

// ── Cache feedback advisee đã gửi theo session_id (localStorage) — lưới an toàn:
// nếu backend getSessions chưa trả feedback_* thì dashboard vẫn hiện feedback đã gửi,
// buổi vẫn 'done' và buổi kế tiếp vẫn mở khoá, advisee không phải điền lại.
function fbCacheGet(sid) {
  if (!sid) return null;
  try { var r = localStorage.getItem('linkajob_fb_' + sid); return r ? JSON.parse(r) : null; } catch (e) { return null; }
}
function fbCacheSet(sid, obj) {
  if (!sid) return;
  try { localStorage.setItem('linkajob_fb_' + sid, JSON.stringify(obj)); } catch (e) {}
}

function buildAdviseeFromBooking(b, allSessions, pkgFlag) {
  var mySessions = allSessions.filter(function(s){ return s.booking_id === b.booking_id; });
  var sessionsTotal = Number(b.sessions_total) || 0;
  var sessionsUnlimited = !!(pkgFlag && pkgFlag.sessionsUnlimited);
  var advisorUnlimited = !!(pkgFlag && pkgFlag.advisorUnlimited) || b.package_name === CP_PKG_NAME;
  if (sessionsUnlimited) {
    // Không giới hạn buổi: hiện các buổi đã có + đúng 1 buổi kế tiếp để đặt
    var maxNo = 0;
    mySessions.forEach(function(s){ maxNo = Math.max(maxNo, Number(s.session_number) || 0); });
    sessionsTotal = maxNo + 1;
  }
  var today = new Date();

  var sessions = [];
  for (var no = 1; no <= sessionsTotal; no++) {
    var row = mySessions.find(function(s){ return Number(s.session_number) === no; });

    if (!row) {
      // Chưa từng có dòng Session cho buổi này — chỉ buổi 1 mở sẵn, còn lại khoá
      // (mọi gói: buổi kế tiếp mở ngay khi buổi trước đã hoàn thành, kể cả buổi đã book ở web cũ)
      var prevDone = no === 1 || (sessions[no - 2] && sessions[no - 2].status === 'done');
      sessions.push({
        no: no, date: null, timeStart: null, timeEnd: null,
        status: prevDone ? 'upcoming' : 'locked',
        lockedReason: prevDone ? undefined : 'Hoàn thành buổi trước để mở khoá',
        feedback: null, meetLink: '', prepInfo: null, advisorNotes: null, session_id: null,
      });
      continue;
    }

    var schedDate = normSheetDate(row.scheduled_date);
    var schedTime = normSheetTime(row.scheduled_time);

    var timeEnd = '';
    if (schedTime) {
      var parts = schedTime.split(':');
      var mins = (Number(parts[0])||0) * 60 + (Number(parts[1])||0) + (Number(row.duration_minutes) || 20);
      timeEnd = (Math.floor(mins/60)%24 < 10 ? '0':'') + (Math.floor(mins/60)%24) + ':' + (mins%60 < 10 ? '0':'') + (mins%60);
    }

    // FIX: feedback đã lưu ở AdvisorReviews (feedback_rating/feedback_text) => buổi coi như đã hoàn thành,
    // kể cả khi cột status của tab Sessions chưa được backend đổi sang 'completed'.
    // Trước đây chỉ dựa vào row.status === 'completed' nên reload trang là buổi quay lại 'Cần feedback',
    // buổi kế tiếp không mở khoá được để book.
    var cachedFb = fbCacheGet(row.session_id);
    var hasSavedFeedback = !!(row.feedback_rating || row.feedback_text || cachedFb);
    var status;
    if (row.status === 'completed' || hasSavedFeedback) status = 'done';
    else {
      var sessDate = schedDate ? new Date(schedDate + 'T' + (schedTime||'00:00')) : null;
      status = (sessDate && sessDate < today) ? 'feedback' : 'upcoming';
    }

    // Backend (action getSessions) đã ghép sẵn prep_cv_link/prep_question/prep_other_links/prep_submitted_at
    // từ tab SessionPrep vào từng dòng session — chỉ cần đọc lại ra prepInfo ở đây.
    var prepInfo = row.prep_question
      ? { cvLink: row.prep_cv_link || '', question: row.prep_question || '', otherLinks: row.prep_other_links || '', submittedAt: row.prep_submitted_at || '' }
      : null;

    // FIX: backend cũng đã ghép sẵn feedback_rating/feedback_text/feedback_created_at
    // (từ AdvisorReviews) và advisor_note_summary/advisor_note_feedback/advisor_note_action_items
    // /advisor_note_created_at (từ AdvisorNotes) vào từng dòng session — trước đây bị bỏ qua,
    // luôn gán null nên load lại trang là mất hết feedback/nhận xét đã gửi, hiện lại form trống
    // bắt gửi lại. Nay đọc đúng ra để hiển thị lại dữ liệu đã lưu, cả 2 chiều advisor/advisee.
    var feedbackObj = (row.feedback_rating || row.feedback_text)
      ? { rating: Number(row.feedback_rating) || 0, text: row.feedback_text || '', createdAt: row.feedback_created_at || '' }
      : (cachedFb ? { rating: Number(cachedFb.rating) || 0, text: cachedFb.text || '', createdAt: cachedFb.createdAt || '' } : null);
    var advisorNotesObj = row.advisor_note_summary
      ? { summary: row.advisor_note_summary || '', feedback: row.advisor_note_feedback || '', actionItems: row.advisor_note_action_items || '', submittedAt: row.advisor_note_created_at || '' }
      : null;

    sessions.push({
      no: no, date: schedDate || null, timeStart: schedTime || null, timeEnd: timeEnd,
      status: status, feedback: feedbackObj, meetLink: row.meet_link || '', prepInfo: prepInfo, advisorNotes: advisorNotesObj,
      session_id: row.session_id,
      advisor: row.advisor_name || '',
    });
  }

  var sessionsDone = sessions.filter(function(s){ return s.status === 'done'; }).length;

  return {
    id: b.booking_id,
    name: b.advisee_name, email: b.advisee_email, phone: b.advisee_phone,
    pkg: b.package_name, bookingId: b.booking_id,
    advisorTitle: '', sessionsTotal: sessionsTotal, sessionsDone: sessionsDone,
    progress: sessionsUnlimited ? (sessionsDone + ' buổi') : (sessionsDone + '/' + sessionsTotal),
    sessionsUnlimited: sessionsUnlimited, advisorUnlimited: advisorUnlimited,
    paid: Number(b.package_price) || 0,
    registeredAt: b.created_at ? String(b.created_at).slice(0,10) : '',
    expiry: (b.expiry_date || b.expiry) ? String(b.expiry_date || b.expiry).slice(0,10) : '',
    advisor: b.advisor_name, sessions: sessions,
  };
}
  

function isAdviseeExpired(ae){
  if (!ae || !ae.expiry) return false;
  var expiryDate = new Date(ae.expiry + 'T00:00:00');
  var today = new Date(); today.setHours(0,0,0,0);
  return expiryDate < today;
}

function renderAdvisor(tab) {
  var c = document.getElementById('main-content');
  c.className = 'content narrow';
  c.innerHTML = skeletonRows(3);
  // Tab "Khoá học tôi dạy" là sản phẩm riêng (module Khoá học), tách khỏi
  // dữ liệu booking 1-1 — không cần loadAdvisorRealDataAsync.
  if (tab === 'my-courses') { loadInstructorCoursesAsync(c); return Promise.resolve(); }
  return loadAdvisorRealDataAsync().then(function(){
    if (tab === 'overview') c.innerHTML = renderAdvisorOverview();
    else if (tab === 'schedule') c.innerHTML = renderSchedulePicker();
    else c.innerHTML = renderAdvisorOverview();
  });
}

function renderAdvisee(tab) {
  var c = document.getElementById('main-content');
  c.className = 'content narrow';
  c.innerHTML = skeletonRows(3);
  // Tab "Khoá học" là sản phẩm riêng (học viên có thể chưa từng đặt lịch
  // advisor nào) — không bị chặn bởi gói booking 1-1 hết hạn.
  if (tab === 'courses') { loadMyCoursesAsync(c); return Promise.resolve(); }
  // Tab "Tài liệu luyện tập": sản phẩm riêng, không phụ thuộc gói booking 1-1
  if (tab === 'documents') { loadMyDocumentsAsync(c); return Promise.resolve(); }
  return loadAdviseeRealDataAsync().then(function(){
    var myAe = MOCK.advisees.filter(function(ae){ return ae.email === currentUser.email; });
    var activeAe = myAe.find(function(ae){ return !isAdviseeExpired(ae); });
    if (myAe.length && !activeAe) {
      // Gói đã hết hạn — KHÔNG mở trang advisee (my-bookings/new-booking),
      // chỉ hiện thông báo + lối gia hạn/nâng cấp ngay khi vừa đăng nhập.
      c.innerHTML = renderAdviseeExpiredNotice(myAe[0]); // myAe[0] = gói mới nhất (đã sắp xếp)
      return;
    }
    c.innerHTML = renderMyBookings();
  });
}

function renderAdviseeExpiredNotice(ae) {
  if (ae.pkg === CP_PKG_NAME) {
    return '<div class="card" style="max-width:520px;margin:60px auto;text-align:center;padding:40px 32px"><div style="font-size:48px;margin-bottom:16px">⏰</div>' +
      '<div style="font-size:18px;font-weight:800;margin-bottom:8px">Quyền lợi cố vấn 1-1 của khoá học đã hết hạn</div>' +
      '<div style="font-size:13.5px;color:var(--muted);line-height:1.7">Hết hạn ngày <strong>' + fmtDateVN(ae.expiry) + '</strong> (đã đặt ' + ae.sessionsDone + '/' + ae.sessionsTotal + ' buổi). Cần thêm thời gian? Vui lòng liên hệ LinkaJob để được hỗ trợ.</div></div>';
  }
  return '<div class="card" style="max-width:520px;margin:60px auto;text-align:center;padding:40px 32px">' +
    '<div style="font-size:48px;margin-bottom:16px">⏰</div>' +
    '<div style="font-size:18px;font-weight:800;margin-bottom:8px">Gói cố vấn của bạn đã hết hạn</div>' +
    '<div style="font-size:13.5px;color:var(--muted);line-height:1.7;margin-bottom:20px">' +
      'Gói <strong>' + (ae.pkg || '') + '</strong> hết hạn ngày <strong>' + fmtDateVN(ae.expiry) + '</strong> (đã dùng ' + ae.sessionsDone + '/' + ae.sessionsTotal + ' buổi). ' +
      'Gia hạn hoặc nâng cấp để tiếp tục sử dụng.' +
    '</div>' +
    '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">' +
      '<button class="login-btn" style="width:auto;padding:12px 24px" onclick="openExtendModal(\'' + ae.id + '\')">📅 Gia hạn ngay</button>' +
      '<button class="btn-secondary" style="width:auto;padding:12px 24px" onclick="openUpgradePackageModal(\'' + ae.id + '\')">⬆ Nâng cấp gói</button>' +
    '</div></div>';
}
function fmtDateVN(ymd) {
  if (!ymd) return '';
  var p = ymd.split('-');
  return p.length === 3 ? (p[2] + '/' + p[1] + '/' + p[0]) : ymd;
}

// ── Advisee: tab "Khoá học" — danh sách khoá đang học + bài tập để nộp.
//    Sản phẩm riêng với booking 1-1 advisor, dùng chung tài khoản đăng
//    nhập (role Advisee) nhưng dữ liệu lấy từ module Khoá học trên Sheet. ──
// ── Tab "Tài liệu luyện tập": liệt kê mọi tài liệu LinkaJob đang bán.
//    Đã mua + còn hạn → nút "Sử dụng" (mở landing page của tài liệu); chưa mua → "Xem chi tiết". ──
function ljDeviceId() {
  try {
    var d = localStorage.getItem('lj_dev');
    if (!d || !/^[0-9a-f-]{36}$/i.test(d)) {
      d = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
        : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
            var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16);
          });
      localStorage.setItem('lj_dev', d);
    }
    return d;
  } catch (e) { return ''; }
}
var APT_PRACTICE_URL = 'https://linkajob09-vn.github.io/web/luyen-aptitude.html';
function openAptitudePractice() {
  var w = window.open('', '_blank');
  if (w) { w.opener = null; w.document.write('<p style="font-family:sans-serif;padding:24px">Đang mở tài liệu…</p>'); }
  apiGet('aptitudeTicket', { token: (currentUser && currentUser.token) || '', device: ljDeviceId(), label: navigator.userAgent.slice(0, 120) }).then(function(res){
    if (res && res.ok && res.ticket) { var u = APT_PRACTICE_URL + '#t=' + res.ticket; if (w) w.location.href = u; else location.href = u; return; }
    if (w) w.close();
    toast((res && res.message) || 'Không mở được tài liệu.', 'error');
    if (res && res.code === 'auth') setTimeout(doLogout, 1500);
  }).catch(function(){ if (w) w.close(); toast('Lỗi kết nối, vui lòng thử lại.', 'error'); });
}
function loadMyDocumentsAsync(c) {
  function esc(v){ return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function render(list) {
    if (!list.length) { c.innerHTML = '<div class="card"><div class="empty-state"><div class="icon">📚</div>Chưa có tài liệu nào.</div></div>'; return; }
    var html = '<div style="font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:12px">Tài liệu luyện tập</div>';
    list.forEach(function(d){
      var owned = !!d.owned, expired = !!d.expired;
      var url = String(d.landing_url || '#');
      var isApt = owned && d.doc_id === 'aptitude';
      if (owned && url.indexOf('#') === -1) url += (url.indexOf('?') > -1 ? '&' : '?') + 'email=' + encodeURIComponent(currentUser.email);
      html += '<div class="card" style="margin-bottom:14px;padding:20px;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap">' +
        '<div style="flex:1;min-width:220px"><div style="font-size:16px;font-weight:800">' + esc(d.name) + '</div>' +
        '<div style="font-size:13px;color:var(--muted);margin-top:4px;line-height:1.6">' + esc(d.description) + '</div>' +
        '<div style="font-size:12.5px;margin-top:8px">' +
          (owned ? '<span class="badge badge-confirmed">Đã mua</span> <span style="color:var(--muted)">Dùng được đến ' + esc(fmtDateVN(String(d.expires_at || '').slice(0,10))) + '</span>'
                 : expired ? '<span style="color:#B91C1C;font-weight:600">Đã hết hạn ' + esc(fmtDateVN(String(d.expires_at || '').slice(0,10))) + '</span>'
                 : '<span style="color:var(--muted)">Chưa mua' + (d.price ? ' · ' + Number(d.price).toLocaleString('vi-VN') + 'đ' : '') + '</span>') +
        '</div></div>' +
        '<a href="' + (isApt ? '#' : esc(url)) + '"' + (isApt ? ' onclick="openAptitudePractice();return false"' : ' target="_blank" rel="noopener"') + ' class="login-btn" style="width:auto;padding:10px 22px;text-decoration:none;display:inline-block">' +
          (owned ? 'Sử dụng' : expired ? 'Mua lại' : 'Xem chi tiết') + '</a></div>';
    });
    c.innerHTML = html;
  }
  if (window._myDocs) { render(window._myDocs); return; }
  apiGet('getMyDocuments', { email: currentUser.email }).then(function(res){
    window._myDocs = (res && res.data) ? res.data : [];
    render(window._myDocs);
  }).catch(function(e){ c.innerHTML = '<div class="empty-state">Lỗi tải tài liệu: ' + esc(e.message) + '</div>'; });
}

// ════════════════════════════════════════════════════════════
//  ADVISEE — TRANG KHOÁ HỌC (cổng học viên)
//  Dữ liệu từ action getMyCoursePortal (CoursePortal.gs): Zoom, Zalo, slide, lịch học từng buổi,
//  bài tập về nhà, "3 điều học được / 3 điều cần cải thiện" và quyền lợi 2 buổi cố vấn 1-1.
//  Backend chưa cập nhật (hoặc phiên chưa có token) → tự rơi về giao diện cũ loadMyCoursesLegacyAsync.
// ════════════════════════════════════════════════════════════
var _cpData = [];
function cpEsc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function cpUrl(s) { s = String(s || '').trim(); return /^https?:\/\//i.test(s) ? s : ''; }
function cpDateLabel(ds) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(ds || '')) return '';
  var d = new Date(ds + 'T00:00:00');
  return DAYS_VI[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1) + (d.getFullYear() !== new Date().getFullYear() ? '/' + d.getFullYear() : '');
}
function cpChip(icon, label, url, emptyText, main) {
  var u = cpUrl(url);
  return u ? '<a class="cp-chip' + (main ? ' main' : '') + '" href="' + cpEsc(u) + '" target="_blank" rel="noopener">' + icon + ' ' + label + '</a>'
           : '<span class="cp-chip off">' + icon + ' ' + label + ' · ' + emptyText + '</span>';
}
function cpAuthFail(res) {
  if (res && res.code === 'auth') { toast(res.error || 'Phiên đăng nhập đã hết hạn', 'error'); setTimeout(doLogout, 1500); return true; }
  return false;
}

function loadMyCoursesAsync(c) {
  if (!currentUser || !currentUser.token) { loadMyCoursesLegacyAsync(c); return; }
  apiGet('getMyCoursePortal', { token: currentUser.token }).then(function(res){
    if (cpAuthFail(res)) return;
    if (!res || !res.success) { loadMyCoursesLegacyAsync(c); return; }
    _cpData = res.data || [];
    if (!_cpData.length) { c.innerHTML = '<div class="card"><div class="empty-state"><div class="icon">🎓</div>Bạn chưa đăng ký khoá học nào.</div></div>'; return; }
    c.innerHTML = _cpData.map(cpCourseHtml).join('');
  }).catch(function(){ loadMyCoursesLegacyAsync(c); });
}

function cpCourseHtml(en, ei) {
  var today = ymd(new Date());
  var h = '<div class="cp-card">';
  // 1) Tiêu đề + khai giảng + giảng viên
  var started = en.start_date && en.start_date <= today;
  var sub = [];
  if (en.start_date) sub.push((started ? 'Khai giảng ' : 'Khai giảng ') + cpDateLabel(en.start_date));
  if (en.instructor_advisor) sub.push('Giảng viên: ' + cpEsc(en.instructor_advisor));
  if (en.schedule_note) sub.push('🗓 ' + cpEsc(en.schedule_note));
  h += '<div class="cp-head"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">' +
    '<div class="cp-title">' + cpEsc(en.course_name) + (en.season_no ? ' — Mùa ' + cpEsc(en.season_no) : '') + '</div>' +
    (en.status ? '<span class="badge badge-confirmed" style="flex-shrink:0">' + cpEsc(en.status) + '</span>' : '') + '</div>' +
    (sub.length ? '<div class="cp-sub">' + sub.join(' · ') + '</div>' : '') + '</div>';
  // 2) Zoom / Zalo / Slide chung
  h += '<div class="cp-links">' + cpChip('🎥', 'Vào lớp Zoom', en.zoom_link, 'sẽ cập nhật', true) + cpChip('💬', 'Nhóm Zalo', en.zalo_link, 'sẽ cập nhật') + cpChip('📑', 'Tất cả slide', en.slide_link, 'sẽ cập nhật') + '</div>';
  // 3) Quyền lợi 2 buổi cố vấn 1-1
  h += cpOneOnOneHtml(en.one_on_one, today);
  // 4) Lịch học & từng buổi
  var ls = en.lessons || [];
  var nextIdx = -1, openIdx = -1;
  for (var i = 0; i < ls.length; i++) { if (ls[i].date && ls[i].date >= today) { nextIdx = i; break; } }
  for (var j = ls.length - 1; j >= 0; j--) { if (ls[j].date && ls[j].date <= today && !cpHasRefl(ls[j])) { openIdx = j; break; } }
  h += '<div class="cp-sec"><div class="cp-sec-t"><span>Lịch học &amp; phản hồi từng buổi</span><span style="text-transform:none;letter-spacing:0;font-weight:500">' + ls.length + ' buổi</span></div>';
  if (!ls.length) h += '<div class="cp-empty">Lịch học và slide từng buổi sẽ được cập nhật tại đây trước ngày khai giảng.</div>';
  ls.forEach(function(l, li){ h += cpLessonHtml(ei, li, l, today, li === nextIdx, li === openIdx); });
  h += '</div>';
  // 5) Bài tập về nhà
  var hwRest = cpHwHtml(en, ei, today, true);
  if (hwRest) h += '<div class="cp-sec"><div class="cp-sec-t"><span>' + (cpHasLinkedHw(en) ? 'Bài tập chung' : 'Bài tập về nhà') + '</span></div>' + hwRest + '</div>';
  return h + '</div>';
}

function cpOneOnOneHtml(o, today) {
  if (!o) return '';
  var days = null;
  if (o.expiry) days = Math.ceil((new Date(o.expiry + 'T00:00:00') - new Date(today + 'T00:00:00')) / 86400000);
  var expired = days !== null && days < 0;
  var left = Math.max(0, (o.total || 0) - (o.used || 0));
  var line = 'Đã đặt ' + (o.used || 0) + '/' + o.total + ' buổi · Advisor: ' + (o.advisor_name ? cpEsc(o.advisor_name) : 'chưa chọn — chọn bất kỳ advisor nào của LinkaJob') +
    (o.expiry ? ' · ' + (expired ? '<b style="color:#B91C1C">Đã hết hạn ' + fmtDateVN(o.expiry) + '</b>' : 'dùng đến ' + fmtDateVN(o.expiry) + ' (còn ' + days + ' ngày)') : '');
  var cta = expired ? 'Xem các buổi 1-1 →' : (left === 0 ? 'Xem các buổi 1-1 →' : (o.used ? 'Đặt buổi tiếp theo →' : 'Chọn advisor & đặt lịch →'));
  return '<div class="cp-one"><div class="cp-one-ic">🤝</div><div class="cp-one-body"><div class="cp-one-t">' + o.total + ' buổi cố vấn 1-1 dành riêng cho học viên khoá học</div>' +
    '<div class="cp-one-s">' + line + '</div></div>' +
    '<button class="login-btn" style="width:auto;padding:11px 20px;font-size:14px" onclick="switchRoleTab(\'my-bookings\')">' + cta + '</button></div>';
}

function cpHasRefl(l) {
  var r = l.reflection;
  return !!(r && (r.learned || []).concat(r.improve || []).some(function(x){ return String(x || '').trim(); }));
}
function cpReflBadge(l, future) {
  if (future) return '';
  return cpHasRefl(l) ? '<span class="badge badge-confirmed">✓ Đã phản hồi</span>' : '<span class="badge badge-pending">Chưa phản hồi</span>';
}

function cpLessonHtml(ei, li, l, today, isNext, isOpen) {
  var future = !!l.date && l.date > today, isToday = l.date === today, done = !!l.date && l.date < today;
  var when = [cpDateLabel(l.date), l.time_start ? (l.time_start + (l.time_end ? '–' + l.time_end : '')) : ''].filter(Boolean).join(' · ') || 'Chưa có lịch';
  var stBadge = !l.date ? '' : isToday ? '<span class="badge badge-pending">Hôm nay</span>' : future ? '<span class="badge" style="background:#EFF6FF;color:#1D4ED8">' + (isNext ? 'Buổi kế tiếp' : 'Sắp tới') + '</span>' : '';
  var id = 'cp-l-' + ei + '-' + li;
  var h = '<div class="cp-lesson' + (isNext ? ' next' : '') + (done ? ' done' : '') + (isOpen ? ' open' : '') + '" id="' + id + '">' +
    '<div class="cp-lrow" onclick="document.getElementById(\'' + id + '\').classList.toggle(\'open\')">' +
      '<div class="cp-no">' + (done && cpHasRefl(l) ? '✓' : (l.lesson_no || (li + 1))) + '</div>' +
      '<div class="cp-lmain"><div class="cp-ltitle">' + cpEsc(l.title || ('Buổi ' + (l.lesson_no || (li + 1)))) + '</div><div class="cp-lmeta">' + cpEsc(when) + '</div></div>' +
      '<div class="cp-lright">' + stBadge + '<span id="cp-rb-' + ei + '-' + li + '">' + cpReflBadge(l, future || !l.date) + '</span><span class="cp-caret">▼</span></div>' +
    '</div><div class="cp-lbody">';
  var docs = (l.documents && l.documents.length) ? l.documents : (cpUrl(l.slide_link) ? [{ name: 'Slide buổi này', url: l.slide_link }] : []);
  var links = docs.length ? docs.map(function(d){ return cpChip('📑', cpEsc(d.name || 'Tài liệu'), d.url, ''); }).join('') : cpChip('📑', 'Tài liệu buổi này', '', 'chưa có');
  links += (cpUrl(l.recording_link) ? cpChip('▶️', 'Xem lại bản ghi', l.recording_link, '') : '');
  h += '<div class="cp-llinks">' + links + '</div>';
  if (l.note) h += '<div class="cp-note">' + cpEsc(l.note) + '</div>';
  var lessonHw = cpLessonHwHtml(ei, l, today);
  if (lessonHw) h += '<div class="cp-col-t" style="margin:12px 0 6px">📝 Bài tập của buổi này</div>' + lessonHw;
  if (future || !l.date) {
    h += '<div class="cp-lock">🔒 Bạn sẽ ghi được “3 điều học được” và “3 điều cần cải thiện” sau khi buổi học diễn ra.</div>';
  } else {
    var r = l.reflection || { learned: [], improve: [] };
    var col = function(key, title, vals, ph) {
      var s = '<div><div class="cp-col-t">' + title + '</div>';
      for (var k = 0; k < 3; k++) s += '<textarea class="cp-ta" rows="2" maxlength="500" id="cp-' + ei + '-' + li + '-' + key + k + '" placeholder="' + ph + ' ' + (k + 1) + '">' + cpEsc((vals || [])[k] || '') + '</textarea>';
      return s + '</div>';
    };
    h += '<div class="cp-cols">' + col('L', '✨ 3 điều bạn học được', r.learned, 'Điều học được') + col('I', '🎯 3 điều cần cải thiện', r.improve, 'Điều cần cải thiện') + '</div>' +
      '<div class="cp-save"><span class="cp-saved" id="cp-st-' + ei + '-' + li + '">' + (r.updated_at ? 'Đã lưu · ' + cpEsc(String(r.updated_at).slice(0, 16).replace('T', ' ')) : '') + '</span>' +
      '<button class="login-btn" id="cp-btn-' + ei + '-' + li + '" style="width:auto;padding:10px 22px;font-size:14px" onclick="cpSaveRefl(' + ei + ',' + li + ')">Lưu phản hồi</button></div>';
  }
  return h + '</div></div>';
}

function cpSaveRefl(ei, li) {
  var en = _cpData[ei], l = en && en.lessons[li];
  if (!l) return;
  var get = function(key, k) { var el = document.getElementById('cp-' + ei + '-' + li + '-' + key + k); return el ? el.value.trim() : ''; };
  var learned = [get('L', 0), get('L', 1), get('L', 2)], improve = [get('I', 0), get('I', 1), get('I', 2)];
  if (!learned.concat(improve).some(Boolean)) { toast('Hãy điền ít nhất 1 ý', 'error'); return; }
  var btn = document.getElementById('cp-btn-' + ei + '-' + li);
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  apiPost({ action: 'saveCourseReflection', token: (currentUser && currentUser.token) || '', enrollment_id: en.enrollment_id, lesson_id: l.lesson_id, learned: learned, improve: improve }).then(function(res){
    btn.disabled = false; btn.textContent = 'Lưu phản hồi';
    if (cpAuthFail(res)) return;
    if (!res || !res.success) { toast((res && res.error) || 'Không lưu được, thử lại nhé', 'error'); return; }
    l.reflection = { learned: learned, improve: improve, updated_at: res.updated_at };
    var rb = document.getElementById('cp-rb-' + ei + '-' + li); if (rb) rb.innerHTML = cpReflBadge(l, false);
    var st = document.getElementById('cp-st-' + ei + '-' + li); if (st) st.textContent = 'Đã lưu · ' + res.updated_at;
    toast('Đã lưu phản hồi ✅', 'success');
  }).catch(function(e){ btn.disabled = false; btn.textContent = 'Lưu phản hồi'; toast('Lỗi kết nối: ' + e.message, 'error'); });
}

function cpAsgLesson(a) { return String(a.lesson_id || a.course_session_id || '').trim(); }
function cpLessonKey(l) { return String(l.lesson_id || l.course_session_id || '').trim(); }
function cpLessonKeys(en) {
  var m = {};
  (en.lessons || []).forEach(function(l){ var k = cpLessonKey(l); if (k) m[k] = true; });
  return m;
}
function cpHasLinkedHw(en) {
  var keys = cpLessonKeys(en);
  return (en.assignments || []).some(function(a){ var k = cpAsgLesson(a); return k && keys[k]; });
}
function cpHwItemHtml(en, ei, ai, today) {
  var a = en.assignments[ai];
  var sub = a.submission, late = !sub && a.due_date && a.due_date < today;
  var left = '<div><b style="font-size:14px">' + cpEsc(a.title) + '</b><div style="font-size:12.5px;color:var(--muted);margin-top:2px">' +
    (a.due_date ? 'Hạn nộp ' + fmtDateVN(a.due_date) : 'Chưa đặt hạn nộp') + (late ? ' · <b style="color:#B91C1C">Quá hạn</b>' : '') +
    (cpUrl(a.problem_link) ? ' · <a href="' + cpEsc(cpUrl(a.problem_link)) + '" target="_blank" rel="noopener" style="color:var(--brand)">Xem đề bài</a>' : '') + '</div></div>';
  var right = sub
    ? '<div class="cp-hw-r">✅ Đã nộp' + (sub.feedback ? ' · <b style="color:var(--brand)">Đã có nhận xét</b>' : ' · Đang chờ nhận xét') + (sub.feedback ? '<div style="color:var(--text);margin-top:4px;white-space:pre-wrap">' + cpEsc(sub.feedback) + '</div>' : '') + '</div>'
    : '<button class="btn-secondary" style="width:auto;padding:8px 16px;font-size:13px" onclick="cpOpenSubmit(' + ei + ',' + ai + ')">Nộp bài</button>';
  return '<div class="cp-hw">' + left + right + '</div>';
}
// Bài tập gắn với 1 buổi học → hiện ngay trong buổi đó
function cpLessonHwHtml(ei, l, today) {
  var en = _cpData[ei], k = cpLessonKey(l);
  if (!en || !k) return '';
  var out = '';
  (en.assignments || []).forEach(function(a, ai){ if (cpAsgLesson(a) === k) out += cpHwItemHtml(en, ei, ai, today); });
  return out;
}
// onlyUnlinked = true: chỉ các bài chưa gắn buổi nào (hiện ở mục "Bài tập" cuối trang)
function cpHwHtml(en, ei, today, onlyUnlinked) {
  var as = en.assignments || [];
  if (!as.length) return '<div class="cp-empty">Chưa có bài tập nào.</div>';
  var keys = cpLessonKeys(en), out = '';
  as.forEach(function(a, ai){
    var k = cpAsgLesson(a);
    if (onlyUnlinked && k && keys[k]) return;
    out += cpHwItemHtml(en, ei, ai, today);
  });
  return out;
}
function cpOpenSubmit(ei, ai) {
  var en = _cpData[ei], a = en && en.assignments[ai];
  if (a) openSubmitAssignmentModal(en.enrollment_id, a.assignment_id);
}

// Giao diện cũ (dự phòng khi backend chưa có getMyCoursePortal)
function loadMyCoursesLegacyAsync(c) {
  apiGet('getMyCourseEnrollments', { email: currentUser.email }).then(function(res){
    var list = (res && res.data) ? res.data : [];
    if (list.length === 0) {
      c.innerHTML = '<div class="card"><div class="empty-state"><div class="icon">🎓</div>Bạn chưa đăng ký khoá học nào.</div></div>';
      return;
    }
    var html = '';
    list.forEach(function(en){
      html += '<div class="card" style="margin-bottom:16px;padding:20px">';
      html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">' +
        '<div><div style="font-size:16px;font-weight:800">' + en.course_name + ' — Mùa ' + en.season_no + '</div>' +
        '<div style="font-size:12.5px;color:var(--muted);margin-top:3px">Giảng viên: ' + (en.instructor_advisor || 'Chưa phân công') + '</div></div>' +
        '<span class="badge">' + (en.status || '') + '</span></div>';
      html += '<div style="display:flex;gap:16px;font-size:13px;margin-bottom:14px">' +
        (en.class_link ? '<a href="' + en.class_link + '" target="_blank" style="color:var(--brand)">🔗 Link lớp học</a>' : '<span style="color:var(--muted)">Chưa có link lớp học</span>') +
        (en.slide_link ? '<a href="' + en.slide_link + '" target="_blank" style="color:var(--brand)">📑 Tài liệu slide</a>' : '') +
      '</div>';
      html += '<div style="font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:8px">Bài tập</div>';
      if (!en.assignments || en.assignments.length === 0) {
        html += '<div style="font-size:13px;color:var(--muted)">Chưa có bài tập nào.</div>';
      } else {
        en.assignments.forEach(function(a){
          var sub = a.submission;
          html += '<div style="border-top:1px solid var(--border);padding:10px 0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">';
          html += '<div><b style="font-size:13.5px">' + a.title + '</b><div style="font-size:12px;color:var(--muted)">Hạn nộp ' + fmtDateVN(a.due_date) + (a.problem_link ? ' · <a href="' + a.problem_link + '" target="_blank" style="color:var(--brand)">Xem đề bài</a>' : '') + '</div></div>';
          if (sub) {
            html += '<div style="font-size:12.5px;text-align:right">✅ Đã nộp' + (sub.feedback ? ' · Đã có nhận xét' : ' · Đang chờ nhận xét') + (sub.feedback ? '<div style="color:var(--muted);max-width:260px">' + sub.feedback + '</div>' : '') + '</div>';
          } else {
            html += '<button class="btn-secondary" style="width:auto;padding:7px 14px;font-size:12.5px" onclick="openSubmitAssignmentModal(\'' + en.enrollment_id + '\',\'' + a.assignment_id + '\')">Nộp bài</button>';
          }
          html += '</div>';
        });
      }
      html += '</div>';
    });
    c.innerHTML = html;
  }).catch(function(e){ c.innerHTML = '<div class="empty-state">Lỗi tải khoá học: ' + e.message + '</div>'; });
}

function openSubmitAssignmentModal(enrollmentId, assignmentId) {
  document.getElementById('modal-title').textContent = 'Nộp bài tập';
  document.getElementById('modal-body').innerHTML = '<div class="modal-field"><div class="form-label">Link bài làm (Google Drive/Docs...)</div><input class="form-input" id="cm-sub-link-ae" placeholder="https://drive.google.com/..."></div>';
  document.getElementById('modal-actions').innerHTML = '<button class="btn-secondary" onclick="closeModal()" style="width:auto;padding:10px 20px">Huỷ</button> <button class="login-btn" id="sub-submit-btn" onclick="submitMyAssignment(\'' + enrollmentId + '\',\'' + assignmentId + '\')" style="width:auto;padding:10px 24px">Nộp bài</button>';
  document.getElementById('modal-overlay').classList.add('open');
}
function submitMyAssignment(enrollmentId, assignmentId) {
  var link = v('cm-sub-link-ae');
  if (!link) { toast('Vui lòng nhập link bài làm', 'error'); return; }
  var btn = document.getElementById('sub-submit-btn');
  btn.innerHTML = '<span class="spinner"></span>'; btn.disabled = true;
  apiPost({ action: 'logCourseSubmission', assignment_id: assignmentId, enrollment_id: enrollmentId, file_link: link }).then(function(res){
    if (!res || !res.success) { toast('Lỗi: ' + (res && res.error), 'error'); btn.innerHTML = 'Nộp bài'; btn.disabled = false; return; }
    closeModal();
    toast('Đã nộp bài ✅', 'success');
    renderAdvisee('courses');
  }).catch(function(e){ toast('Lỗi kết nối: ' + e.message, 'error'); btn.innerHTML = 'Nộp bài'; btn.disabled = false; });
}

// ── Advisor: tab "Khoá học" — mùa học mình là giảng viên phụ trách (gán ở dashboard → Cài đặt mùa).
//    Bấm "Quản lý khoá" để: xem học viên, thêm tài liệu từng buổi, tạo/sửa bài tập, viết nhận xét bài nộp. ──
var _isCtx = { el: null, seasonId: '', data: null, tab: 'stu', addIdx: -1, list: [] };

function loadInstructorCoursesAsync(c) {
  _isCtx.el = c;
  c.innerHTML = '<div class="empty-state">Đang tải...</div>';
  apiGet('getInstructorCourses', { advisor: currentUser.name }).then(function(res){
    var list = (res && res.data) ? res.data : [];
    _isCtx.list = list;
    if (list.length === 0) {
      c.innerHTML = '<div class="card"><div class="empty-state"><div class="icon">🎓</div>Bạn chưa được phân công làm giảng viên khoá học nào.</div></div>';
      return;
    }
    var html = '';
    list.forEach(function(s){
      html += '<div class="card" style="margin-bottom:12px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">' +
        '<div><div style="font-weight:800;font-size:14.5px">' + cpEsc(s.course_name) + ' — Mùa ' + cpEsc(s.season_no) + '</div>' +
        '<div style="font-size:12.5px;color:var(--muted);margin-top:3px">' + cpEsc(s.enrolled_count) + ' học viên · <span class="badge">' + cpEsc(s.status) + '</span></div></div>' +
        '<button class="login-btn" style="width:auto;padding:10px 20px;font-size:13.5px" onclick="isOpenSeason(\'' + cpEsc(s.season_id) + '\')">Quản lý khoá</button></div>';
    });
    c.innerHTML = html;
  }).catch(function(e){ c.innerHTML = '<div class="empty-state">Lỗi tải khoá học: ' + cpEsc(e.message) + '</div>'; });
}

function isOpenSeason(seasonId) {
  _isCtx.seasonId = seasonId; _isCtx.tab = 'stu'; _isCtx.addIdx = -1;
  isReload();
}
function isReload() {
  var c = _isCtx.el; if (!c) return;
  c.innerHTML = '<div class="empty-state">Đang tải...</div>';
  apiGet('getInstructorSeason', { token: (currentUser && currentUser.token) || '', season_id: _isCtx.seasonId }).then(function(res){
    if (cpAuthFail(res)) return;
    if (!res || !res.success) { c.innerHTML = '<div class="empty-state">' + cpEsc((res && res.error) || 'Không tải được khoá học') + '</div><div style="text-align:center"><button class="btn-secondary" style="width:auto;padding:9px 18px" onclick="loadInstructorCoursesAsync(_isCtx.el)">← Quay lại</button></div>'; return; }
    _isCtx.data = res.data; isRender();
  }).catch(function(e){ c.innerHTML = '<div class="empty-state">Lỗi kết nối: ' + cpEsc(e.message) + '</div>'; });
}
function isSessionLabel(ses, i) {
  return 'Buổi ' + (i + 1) + (ses.topic ? ' · ' + cpEsc(ses.topic) : '') + (ses.date ? ' (' + fmtDateVN(ses.date) + ')' : '');
}
function isPendingCount() {
  var d = _isCtx.data, n = 0;
  d.students.forEach(function(st){ Object.keys(st.submissions).forEach(function(k){ if (!st.submissions[k].feedback) n++; }); });
  return n;
}
function isRender() {
  var c = _isCtx.el, d = _isCtx.data, se = d.season, tab = _isCtx.tab;
  var h = '<div style="margin-bottom:12px"><button class="btn-secondary" style="width:auto;padding:8px 16px;font-size:13px" onclick="loadInstructorCoursesAsync(_isCtx.el)">← Danh sách khoá</button></div>';
  h += '<div class="card" style="padding:18px 22px;margin-bottom:14px"><div style="font-weight:800;font-size:16px">' + cpEsc(se.course_name) + ' — Mùa ' + cpEsc(se.season_no) + '</div>' +
    '<div style="font-size:12.5px;color:var(--muted);margin-top:4px">' + (se.start_date ? 'Khai giảng ' + fmtDateVN(se.start_date) + ' · ' : '') + 'Giảng viên: ' + cpEsc((se.instructors || []).join(', ')) +
    (cpUrl(se.class_link) ? ' · <a href="' + cpEsc(se.class_link) + '" target="_blank" rel="noopener" style="color:var(--brand)">Link lớp học</a>' : '') + '</div></div>';
  var pend = isPendingCount();
  var tabs = [['stu', 'Học viên (' + d.students.length + ')'], ['content', 'Nội dung khoá'], ['hw', 'Bài tập'], ['fb', 'Nhận xét' + (pend ? ' (' + pend + ' chờ)' : '')]];
  h += '<div class="card"><div style="display:flex;gap:6px;padding:12px 16px 0;border-bottom:1px solid var(--border);overflow-x:auto">';
  tabs.forEach(function(t){
    h += '<div onclick="_isCtx.tab=\'' + t[0] + '\';_isCtx.addIdx=-1;isRender()" style="padding:10px 12px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;border-bottom:2px solid ' + (tab === t[0] ? 'var(--brand)' : 'transparent') + ';color:' + (tab === t[0] ? 'var(--brand)' : 'var(--muted)') + '">' + t[1] + '</div>';
  });
  h += '</div><div style="padding:16px 20px 20px">';
  h += tab === 'content' ? isContentHtml() : tab === 'hw' ? isHwHtml() : tab === 'fb' ? isFbHtml() : isStudentsHtml();
  h += '</div></div>';
  c.innerHTML = h;
}

// ── Tab Học viên (không có học phí) ──
function isStudentsHtml() {
  var d = _isCtx.data;
  if (!d.students.length) return '<div class="cp-empty">Chưa có học viên nào.</div>';
  var h = '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px"><thead><tr style="text-align:left;color:var(--muted);font-size:12px"><th style="padding:8px 6px">HỌC VIÊN</th><th style="padding:8px 6px">SĐT</th><th style="padding:8px 6px">BÀI ĐÃ NỘP</th></tr></thead><tbody>';
  d.students.forEach(function(st){
    h += '<tr style="border-top:1px solid var(--border)"><td style="padding:10px 6px"><b>' + cpEsc(st.name) + '</b><div style="font-size:12px;color:var(--muted)">' + cpEsc(st.email) + '</div></td><td style="padding:10px 6px">' + cpEsc(st.phone) + '</td><td style="padding:10px 6px">' + Object.keys(st.submissions).length + ' / ' + d.assignments.length + '</td></tr>';
  });
  return h + '</tbody></table></div>';
}

// ── Tab Nội dung khoá: tài liệu cho từng buổi ──
function isContentHtml() {
  var d = _isCtx.data;
  if (!d.sessions.length) return '<div class="cp-empty">Chưa có buổi học nào. Lịch từng buổi do nhân viên tạo trên dashboard.</div>';
  var h = '<div style="font-size:12.5px;color:var(--muted);margin-bottom:12px">Thêm tài liệu cho từng buổi — học viên sẽ thấy ngay trong buổi tương ứng.</div>';
  d.sessions.forEach(function(ses, i){
    h += '<div style="border:1.5px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><b style="font-size:14px">' + isSessionLabel(ses, i) + '</b>' +
      '<button class="btn-secondary" style="width:auto;padding:7px 14px;font-size:12.5px" onclick="_isCtx.addIdx=' + (_isCtx.addIdx === i ? -1 : i) + ';isRender()">+ Thêm tài liệu</button></div>';
    var docs = ses.documents || [];
    if (!docs.length) h += '<div class="cp-empty" style="margin-top:8px">Chưa có tài liệu</div>';
    docs.forEach(function(doc, j){
      h += '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border);font-size:13.5px">' +
        '<a href="' + cpEsc(cpUrl(doc.url)) + '" target="_blank" rel="noopener" style="color:var(--brand);word-break:break-all">📑 ' + cpEsc(doc.name || 'Tài liệu') + '</a>' +
        '<button class="btn-secondary" style="width:auto;padding:5px 12px;font-size:12px" onclick="isRemoveDoc(' + i + ',' + j + ')">Xoá</button></div>';
    });
    if (_isCtx.addIdx === i) {
      h += '<div style="display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:10px;margin-top:6px">' +
        '<input class="form-input" id="is-dn" placeholder="Tên tài liệu" style="flex:1;min-width:150px;margin:0">' +
        '<input class="form-input" id="is-du" placeholder="Link (Drive, Notion...)" style="flex:2;min-width:200px;margin:0">' +
        '<button class="login-btn" id="is-doc-btn" style="width:auto;padding:9px 20px;font-size:13px" onclick="isAddDoc(' + i + ')">Lưu</button></div>';
    }
    h += '</div>';
  });
  return h;
}
function isSaveDocs(i, docs, btn, okMsg) {
  var ses = _isCtx.data.sessions[i];
  apiPost({ action: 'saveSessionDocs', token: (currentUser && currentUser.token) || '', course_session_id: ses.course_session_id, documents: docs }).then(function(res){
    if (cpAuthFail(res)) return;
    if (!res || !res.success) { toast((res && res.error) || 'Không lưu được', 'error'); if (btn) { btn.disabled = false; btn.textContent = 'Lưu'; } return; }
    ses.documents = res.documents || docs; _isCtx.addIdx = -1; isRender(); toast(okMsg, 'success');
  }).catch(function(e){ toast('Lỗi kết nối: ' + e.message, 'error'); if (btn) { btn.disabled = false; btn.textContent = 'Lưu'; } });
}
function isAddDoc(i) {
  var name = v('is-dn'), url = v('is-du');
  if (!/^https?:\/\//i.test(url)) { toast('Link phải bắt đầu bằng http:// hoặc https://', 'error'); return; }
  var btn = document.getElementById('is-doc-btn'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  var docs = (_isCtx.data.sessions[i].documents || []).slice();
  docs.push({ name: name || 'Tài liệu', url: url });
  isSaveDocs(i, docs, btn, 'Đã thêm tài liệu ✅');
}
function isRemoveDoc(i, j) {
  if (!confirm('Xoá tài liệu này khỏi buổi học?')) return;
  var docs = (_isCtx.data.sessions[i].documents || []).slice();
  docs.splice(j, 1);
  isSaveDocs(i, docs, null, 'Đã xoá tài liệu');
}

// ── Tab Bài tập ──
function isHwHtml() {
  var d = _isCtx.data;
  var h = '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap"><div style="font-size:12.5px;color:var(--muted)">Bài tập tạo ở đây sẽ hiện ngay cho học viên, trong buổi được chọn.</div>' +
    '<button class="login-btn" style="width:auto;padding:9px 18px;font-size:13px" onclick="isOpenHwModal(\'\')">+ Thêm bài tập</button></div>';
  if (!d.assignments.length) return h + '<div class="cp-empty">Chưa có bài tập nào.</div>';
  d.assignments.forEach(function(a){
    var si = d.sessions.findIndex(function(x){ return x.course_session_id === a.course_session_id; });
    var nSub = d.students.filter(function(st){ return st.submissions[a.assignment_id]; }).length;
    h += '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--border);padding:12px 0">' +
      '<div><b style="font-size:14px">' + cpEsc(a.title) + '</b><div style="font-size:12.5px;color:var(--muted);margin-top:2px">' +
      (si > -1 ? isSessionLabel(d.sessions[si], si) : 'Chưa gắn buổi nào') + ' · ' + (a.due_date ? 'Hạn ' + fmtDateVN(a.due_date) : 'Chưa đặt hạn') + ' · ' + nSub + '/' + d.students.length + ' đã nộp' +
      (cpUrl(a.problem_link) ? ' · <a href="' + cpEsc(a.problem_link) + '" target="_blank" rel="noopener" style="color:var(--brand)">Đề bài</a>' : '') + '</div></div>' +
      '<div style="white-space:nowrap"><button class="btn-secondary" style="width:auto;padding:6px 14px;font-size:12.5px" onclick="isOpenHwModal(\'' + cpEsc(a.assignment_id) + '\')">Chỉnh sửa</button> ' +
      '<button class="btn-secondary" style="width:auto;padding:6px 14px;font-size:12.5px" onclick="isDeleteHw(\'' + cpEsc(a.assignment_id) + '\')">Xoá</button></div></div>';
  });
  return h;
}
function isOpenHwModal(aid) {
  var d = _isCtx.data;
  var a = aid ? d.assignments.filter(function(x){ return x.assignment_id === aid; })[0] : { title: '', problem_link: '', due_date: '', course_session_id: '' };
  if (!a) return;
  document.getElementById('modal-title').textContent = aid ? 'Chỉnh sửa bài tập' : 'Thêm bài tập';
  var opts = '<option value="">Không gắn buổi nào</option>' + d.sessions.map(function(ses, i){
    return '<option value="' + cpEsc(ses.course_session_id) + '"' + (ses.course_session_id === a.course_session_id ? ' selected' : '') + '>' + isSessionLabel(ses, i) + '</option>';
  }).join('');
  document.getElementById('modal-body').innerHTML =
    '<div class="modal-field"><div class="form-label">Tên bài tập</div><input class="form-input" id="is-hw-title" value="' + cpEsc(a.title) + '" placeholder="VD: Viết CV"></div>' +
    '<div class="modal-field"><div class="form-label">Thuộc buổi học</div><select class="form-input" id="is-hw-ses">' + opts + '</select></div>' +
    '<div class="modal-field"><div class="form-label">Link đề bài (nếu có)</div><input class="form-input" id="is-hw-link" value="' + cpEsc(a.problem_link) + '" placeholder="https://..."></div>' +
    '<div class="modal-field"><div class="form-label">Hạn nộp</div><input class="form-input" type="date" id="is-hw-due" value="' + cpEsc(a.due_date) + '"></div>';
  document.getElementById('modal-actions').innerHTML = '<button class="btn-secondary" onclick="closeModal()" style="width:auto;padding:10px 20px">Huỷ</button> <button class="login-btn" id="is-hw-save" style="width:auto;padding:10px 24px" onclick="isSaveHw(\'' + cpEsc(aid) + '\')">Lưu</button>';
  document.getElementById('modal-overlay').classList.add('open');
}
function isSaveHw(aid) {
  var title = v('is-hw-title');
  if (!title) { toast('Vui lòng nhập tên bài tập', 'error'); return; }
  var link = v('is-hw-link');
  if (link && !/^https?:\/\//i.test(link)) { toast('Link đề bài phải bắt đầu bằng http:// hoặc https://', 'error'); return; }
  var btn = document.getElementById('is-hw-save'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  apiPost({ action: 'saveInstructorAssignment', token: (currentUser && currentUser.token) || '', season_id: _isCtx.seasonId, assignment_id: aid, title: title, problem_link: link, due_date: v('is-hw-due'), course_session_id: v('is-hw-ses') }).then(function(res){
    if (cpAuthFail(res)) return;
    if (!res || !res.success) { toast((res && res.error) || 'Không lưu được', 'error'); btn.disabled = false; btn.textContent = 'Lưu'; return; }
    closeModal(); toast('Đã lưu bài tập ✅', 'success'); isReload();
  }).catch(function(e){ toast('Lỗi kết nối: ' + e.message, 'error'); btn.disabled = false; btn.textContent = 'Lưu'; });
}
function isDeleteHw(aid) {
  if (!confirm('Xoá bài tập này?')) return;
  apiPost({ action: 'deleteInstructorAssignment', token: (currentUser && currentUser.token) || '', assignment_id: aid }).then(function(res){
    if (cpAuthFail(res)) return;
    if (!res || !res.success) { toast((res && res.error) || 'Không xoá được', 'error'); return; }
    toast('Đã xoá bài tập', 'success'); isReload();
  }).catch(function(e){ toast('Lỗi kết nối: ' + e.message, 'error'); });
}

// ── Tab Nhận xét: chỉ nhận xét, không chấm điểm số ──
function isFbHtml() {
  var d = _isCtx.data;
  if (!d.assignments.length) return '<div class="cp-empty">Chưa có bài tập nào.</div>';
  var h = '';
  d.assignments.forEach(function(a, ai){
    h += '<div style="margin-bottom:18px"><div style="font-weight:700;font-size:14px;margin-bottom:8px">' + cpEsc(a.title) + '</div>';
    var any = false;
    d.students.forEach(function(st, si){
      var sub = st.submissions[a.assignment_id];
      if (!sub) return;
      any = true;
      var id = 'is-fb-' + ai + '-' + si;

// ════════════════════════════════════════════════════════════
//  MONTH CALENDAR (kiểu Amelia) — dùng chung cho Advisor + Staff
// ════════════════════════════════════════════════════════════
let calMonthOffset = 0; // số tháng lệch so với tháng hiện tại
var _calendarContext = null; // 'advisor-schedule' | 'meetings'

function getCalendarMatrix(monthOffset) {
  const base = new Date();
  base.setDate(1);
  base.setMonth(base.getMonth() + monthOffset);
  const year = base.getFullYear(), month = base.getMonth();

  const firstOfMonth = new Date(year, month, 1);
  const startDay = firstOfMonth.getDay(); // 0=CN
  const gridStart = new Date(firstOfMonth);
  gridStart.setDate(gridStart.getDate() - (startDay === 0 ? 6 : startDay - 1)); // bắt đầu từ T2

  const weeks = [];
  let cursor = new Date(gridStart);
  for (let w = 0; w < 6; w++) {
    const week = [];
    for (let d = 0; d < 7; d++) {
      week.push(new Date(cursor));
      cursor.setDate(cursor.getDate() + 1);
    }
    weeks.push(week);
  }
  return { year, month, weeks };
}

function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function isSameDate(a,b) { return ymd(a) === ymd(b); }

function renderMonthCalendar(opts) {
  // opts: { title, onCellClick(dateStr), countFn(dateStr) -> {slot, meeting} }
  const { year, month, weeks } = getCalendarMatrix(calMonthOffset);
  const monthLabel = ['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'][month] + ' ' + year;
  const today = new Date();

  let html = '<div class="card"><div class="card-header"><div class="card-header-left">' + opts.title + '</div></div>';
  html += '<div class="cal-nav"><div class="cal-nav-left"><button onclick="changeCalMonth(-1)">‹</button><span class="cal-nav-label">' + monthLabel + '</span><button onclick="changeCalMonth(1)">›</button></div>';
  html += '<button class="cal-today-btn" onclick="goToCalToday()">Hôm nay</button></div>';

  html += '<div class="cal-grid">';
  DAYS_VI_FULL.forEach(function(d){ html += '<div class="cal-weekday-hdr">' + d + '</div>'; });

  weeks.forEach(function(week){
    week.forEach(function(d){
      const dateStr = ymd(d);
      const isOther = d.getMonth() !== month;
      const isToday = isSameDate(d, today);
      const counts = opts.countFn(dateStr);

      const isPast = dateStr < ymd(today);
      let cls = 'cal-cell' + (isOther?' other-month':'') + (isToday?' today':'') + (isPast?' past':'');
      html += '<div class="' + cls + '"' + (isPast ? '' : ' onclick="' + opts.onCellClick + '(\'' + dateStr + '\')"') + '>';
      html += '<div class="cal-daynum">' + d.getDate() + '</div>';
      html += '<div class="cal-add">+</div>';
      html += '<div class="cal-badges">';
      if (counts.slot > 0) html += '<span class="cal-badge slot">' + counts.slot + ' slot trống</span>';
      if (counts.meeting > 0) html += '<span class="cal-badge meeting">' + counts.meeting + ' buổi</span>';
      html += '</div></div>';
    });
  });
  html += '</div></div>';
  return html;
}

const DAYS_VI_FULL = ['T2','T3','T4','T5','T6','T7','CN'];
// Lưu ý: getCalendarMatrix() build tuần bắt đầu từ Thứ 2, nên header tương ứng T2→CN


// ════════════════════════════════════════════════════════════
//  LỊCH TRỐNG (Advisor) — calendar tuần/tháng, chọn khoảng giờ từ–đến
//  Mỗi buổi meeting = 60 phút. Khoảng giờ rảnh được tách thành các "giờ bắt đầu"
//  cách nhau 15 phút (VD rảnh 08:00–12:00 → advisee đặt được 08:00, 08:15 … 11:00)
//  để advisee có thể chọn cả giờ lẻ như 08:30.
// ════════════════════════════════════════════════════════════
var SC_STEP = 15, SC_DUR = 60;
var _calRerender = {};
var _cal = { advisor: { view: 'week', anchor: new Date() }, advisee: { view: 'week', anchor: new Date() } };
var _schDraft = []; // [{ date:'YYYY-MM-DD', from:minutes, to:minutes }] — đã chọn nhưng chưa gửi

function tmin(t) { var m = /(\d{1,2}):(\d{2})/.exec(String(t || '')); return m ? (+m[1]) * 60 + (+m[2]) : null; }
function tstr(m) { return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
function slotDate(s) { return String(s.date || '').slice(0, 10); }
function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
function calMonday(d) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function minutesNowIfToday(dateStr) { var n = new Date(); return dateStr === ymd(n) ? n.getHours() * 60 + n.getMinutes() : -1; }
function dayLabel(dateStr) { var d = new Date(dateStr + 'T00:00:00'); return DAYS_VI[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1); }

// Mỗi start phủ [s, s+60). Gộp các khoảng chồng/liền nhau thành khoảng rảnh liên tục.
function startsToRanges(starts) {
  var out = [];
  starts.slice().sort(function(a, b){ return a - b; }).forEach(function(s) {
    var e = s + SC_DUR;
    if (out.length && s <= out[out.length - 1][1]) out[out.length - 1][1] = Math.max(out[out.length - 1][1], e);
    else out.push([s, e]);
  });
  return out;
}
// Giờ bắt đầu hợp lệ = còn ở tương lai và không đè lên buổi đã được đặt (±60 phút)
function validStarts(starts, booked, minToday) {
  return starts.filter(function(s){ return s > minToday && booked.every(function(b){ return Math.abs(s - b) >= SC_DUR; }); }).sort(function(a, b){ return a - b; });
}

// ── Calendar dùng chung ──
function calDays(key) {
  var st = _cal[key], a = st.anchor, days = [], i;
  if (st.view === 'week') { var m = calMonday(a); for (i = 0; i < 7; i++) days.push(addDays(m, i)); }
  else {
    var first = new Date(a.getFullYear(), a.getMonth(), 1), last = new Date(a.getFullYear(), a.getMonth() + 1, 0);
    for (var d = calMonday(first), end = addDays(calMonday(last), 6); d <= end; d = addDays(d, 1)) days.push(d);
  }
  return days;
}
function calLabel(key) {
  var st = _cal[key];
  if (st.view === 'month') return 'Tháng ' + (st.anchor.getMonth() + 1) + ' ' + st.anchor.getFullYear();
  var days = calDays(key), a = days[0], b = days[6];
  return a.getDate() + '/' + (a.getMonth() + 1) + ' – ' + b.getDate() + '/' + (b.getMonth() + 1) + '/' + b.getFullYear();
}
function calNav(key, dir) {
  var st = _cal[key];
  st.anchor = st.view === 'week' ? addDays(st.anchor, 7 * dir) : new Date(st.anchor.getFullYear(), st.anchor.getMonth() + dir, 1);
  _calRerender[key]();
}
function calSetView(key, v) { _cal[key].view = v; _calRerender[key](); }
function calToday(key) { _cal[key].anchor = new Date(); _calRerender[key](); }

// cfg: { title, hint, topHtml, onClick, cellFn(dateStr, view) -> { html, enabled }, selected }
function renderCal(key, cfg) {
  var st = _cal[key], view = st.view, today = ymd(new Date());
  var html = '';
  if (cfg.title) html += '<div class="card-header"><div class="card-header-left">' + cfg.title + '</div></div>';
  if (cfg.hint) html += '<div style="padding:12px 20px 0;font-size:13px;color:var(--muted);line-height:1.6">' + cfg.hint + '</div>';
  html += '<div class="sc-toolbar"><div class="sc-nav"><button onclick="calNav(\'' + key + '\',-1)">‹</button><span class="sc-label">' + calLabel(key) + '</span><button onclick="calNav(\'' + key + '\',1)">›</button>' +
    '<button class="sc-today" onclick="calToday(\'' + key + '\')">Hôm nay</button></div>' +
    '<div class="sc-seg"><button class="' + (view === 'week' ? 'on' : '') + '" onclick="calSetView(\'' + key + '\',\'week\')">Tuần</button>' +
    '<button class="' + (view === 'month' ? 'on' : '') + '" onclick="calSetView(\'' + key + '\',\'month\')">Tháng</button></div></div>';
  if (cfg.topHtml) html += cfg.topHtml;
  html += '<div class="sc-grid ' + view + '">';
  ['T2','T3','T4','T5','T6','T7','CN'].forEach(function(d){ html += '<div class="sc-hdr">' + d + '</div>'; });
  calDays(key).forEach(function(d) {
    var ds = ymd(d), isPast = ds < today, other = view === 'month' && d.getMonth() !== st.anchor.getMonth();
    var cell = cfg.cellFn(ds, view) || { html: '', enabled: true };
    var enabled = !isPast && cell.enabled !== false;
    var cls = 'sc-cell' + (ds === today ? ' today' : '') + (other ? ' other' : '') + (isPast ? ' past' : (enabled ? '' : ' off')) + (cfg.selected === ds ? ' sel' : '');
    html += '<div class="' + cls + '"' + (enabled ? ' onclick="' + cfg.onClick + '(\'' + ds + '\')"' : '') + '>' +
      '<div><span class="sc-dnum">' + d.getDate() + (view === 'month' && d.getDate() === 1 ? '/' + (d.getMonth() + 1) : '') + '</span><span class="sc-dow"> ' + DAYS_VI[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1) + '</span></div>' +
      (cell.html || '') + '</div>';
  });
  return html + '</div>';
}

// ── Advisor: tab "Gửi lịch trống" ──
function schDayInfo(dateStr) {
  var starts = [], booked = [];
  sheetData.slots.forEach(function(s) {
    if (normName(s.advisor_name) !== normName(currentUser.name) || slotDate(s) !== dateStr) return;
    var m = tmin(s.time_start); if (m == null) return;
    if (s.status === 'booked') booked.push(m); else if (s.status === 'available' || !s.status) starts.push(m);
  });
  return { ranges: startsToRanges(validStarts(starts, booked, minutesNowIfToday(dateStr))), booked: booked.sort(function(a, b){ return a - b; }) };
}

// ════════════════════════════════════════════════════════════
//  LỊCH TRỐNG ADVISOR — KHOẢNG GIỜ A → B + LẶP LẠI HÀNG TUẦN
//  (dùng chung dashboard.html và advisor_advisee.html)
//  • Advisor gửi lịch 1 lần ("T2, T4 từ 09:00 đến 17:00"), hệ thống tự áp dụng cho các tuần tiếp theo.
//  • Khi bận: "Nghỉ ngày này", "Sửa giờ" hoặc xoá lịch cố định. Không hiện số slot, chỉ hiện khoảng giờ.
//  • Advisee chọn được giờ + phút bất kỳ trong khoảng, mỗi meeting 60 phút (backend cắt khung khi đặt).
//  Backend: Availability.gs (action getAvailabilityRules / saveAvailabilityRule / deleteAvailabilityRule)
// ════════════════════════════════════════════════════════════
var AV_STEP = 15, AV_MEET = 60;
var AV_DOW_SHORT = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];
var AV_DOW_FULL = ['Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy', 'Chủ nhật'];
var _av = { rules: [], slots: [], rulesErr: '', loading: false, ctx: null };

function avPad(n) { return (n < 10 ? '0' : '') + n; }
function avMin(t) { var m = /(\d{1,2}):(\d{2})/.exec(String(t || '')); return m ? (+m[1]) * 60 + (+m[2]) : null; }
function avStr(m) { return avPad(Math.floor(m / 60)) + ':' + avPad(m % 60); }
function avYmd(d) { return d.getFullYear() + '-' + avPad(d.getMonth() + 1) + '-' + avPad(d.getDate()); }
function avNorm(s) { return String(s || '').trim().replace(/\s+/g, ' ').toLowerCase(); }
function avEsc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function avDateLabel(ds) { var d = new Date(ds + 'T00:00:00'); return AV_DOW_FULL[(d.getDay() + 6) % 7] + ' ' + d.getDate() + '/' + (d.getMonth() + 1); }
function avDateFull(ds) { return avDateLabel(ds) + '/' + ds.slice(0, 4); }
function avNowMin(ds) { var n = new Date(); return ds === avYmd(n) ? n.getHours() * 60 + n.getMinutes() : -1; }

// Khung rảnh dài hơn 60 phút → tách thành các "giờ bắt đầu" (mỗi 15 phút) để giao diện đặt lịch chọn được từng giờ/phút.
// Các dòng của cùng 1 khung dùng chung slot_id; khi đặt, gửi kèm start_time để backend cắt khung.
function avExpandRows(rows, step) {
  step = step || AV_STEP;
  var out = [];
  (rows || []).forEach(function (s) {
    var st = String(s.status || 'available').toLowerCase();
    var a = avMin(s.time_start), b = avMin(s.time_end);
    if (st !== 'available' || a == null || b == null || b - a <= AV_MEET) { out.push(s); return; }
    for (var m = a; m + AV_MEET <= b; m += step) {
      var c = {};
      for (var k in s) c[k] = s[k];
      c.time_start = avStr(m); c.time_end = avStr(m + AV_MEET); c._window = true;
      out.push(c);
    }
  });
  return out;
}

// [from,to) trừ các khoảng busy, chỉ giữ mảnh >= 60 phút
function avSubtract(from, to, busy) {
  var pieces = [[from, to]];
  busy.forEach(function (b) {
    var next = [];
    pieces.forEach(function (p) {
      if (b[1] <= p[0] || b[0] >= p[1]) { next.push(p); return; }
      if (b[0] > p[0]) next.push([p[0], b[0]]);
      if (b[1] < p[1]) next.push([b[1], p[1]]);
    });
    pieces = next;
  });
  return pieces.filter(function (p) { return p[1] - p[0] >= AV_MEET; });
}

// Gom dòng AvailableSlots của Advisor thành: { 'YYYY-MM-DD': { free:[{a,b,ids}], booked:[[a,b]], avail:[{id,a,b}] } }
function avBuildModel(rows, advisorName) {
  var today = avYmd(new Date()), by = {};
  (rows || []).forEach(function (s) {
    if (avNorm(s.advisor_name) !== avNorm(advisorName)) return;
    var d = String(s.date || '').slice(0, 10);
    if (!d || d < today) return;
    var a = avMin(s.time_start);
    if (a == null) return;
    var b = avMin(s.time_end);
    if (b == null || b <= a) b = a + AV_MEET;
    b = Math.max(b, a + AV_MEET);
    var st = String(s.status || 'available').toLowerCase();
    var o = by[d] = by[d] || { avail: [], booked: [], free: [] };
    if (st === 'booked') o.booked.push([a, a + AV_MEET]);
    else if (st === 'available') o.avail.push({ id: s.slot_id, a: a, b: b });
  });
  Object.keys(by).forEach(function (d) {
    var o = by[d], merged = [];
    o.booked.sort(function (x, y) { return x[0] - y[0]; });
    o.avail.slice().sort(function (x, y) { return x.a - y.a; }).forEach(function (r) {
      var last = merged[merged.length - 1];
      if (last && r.a <= last.b) { last.b = Math.max(last.b, r.b); last.ids.push(r.id); }
      else merged.push({ a: r.a, b: r.b, ids: [r.id] });
    });
    merged.forEach(function (m) {
      avSubtract(m.a, m.b, o.booked).forEach(function (p) { o.free.push({ a: p[0], b: p[1], ids: m.ids }); });
    });
  });
  return by;
}

// opts: {} thêm mới | {rule:id} sửa lịch cố định | {date} sửa khoảng giờ của 1 ngày
function avOpenAdd(opts) {

    if (!r) return;
    ruleId = r.rule_id; dows = [r.dow]; from = r.time_start; to = r.time_end; title = 'Sửa lịch cố định';
  } else if (opts.date) {
    var model = avBuildModel(_av.slots, currentUser.name), o = model[opts.date];
    if (!o || !o.free.length) return;
    mode = 'single'; date = opts.date; from = avStr(o.free[0].a); to = avStr(o.free[0].b);
    replaceIds = o.free[0].ids.slice(); title = avDateLabel(opts.date) + ' · sửa khung giờ';
    if (o.free.length > 1) {
      // nhiều khung trong ngày: cho sửa khung đầu tiên, các khung khác giữ nguyên
    }
  } else {
    var tmr = new Date(Date.now() + 86400000);
    date = avYmd(tmr);
    dows = [(tmr.getDay() + 6) % 7 + 1];
  }
  _av.ctx = { mode: mode, ruleId: ruleId, replaceIds: replaceIds, lockMode: !!(opts.rule || opts.date), editFrom: opts.date ? from : '', editTo: opts.date ? to : '' };

  var body = '';
  if (!opts.rule && !opts.date) {
    body += '<div class="av-modes">' +
      '<label><input type="radio" name="av-mode" value="weekly" checked onchange="avSetMode(\'weekly\')"> 🔁 Lặp lại hàng tuần <span style="font-weight:400;color:var(--muted)">(khuyến nghị)</span></label>' +
      '<label><input type="radio" name="av-mode" value="single" onchange="avSetMode(\'single\')"> Chỉ một ngày</label></div>';
  }
  body += '<div id="av-weekly" style="' + (mode === 'weekly' ? '' : 'display:none') + '"><div class="form-label" style="margin-bottom:4px">Các ngày rảnh trong tuần <span style="color:var(--brand)">*</span></div><div class="av-dows">';
  for (var i = 1; i <= 7; i++) {
    body += '<label class="av-dowchip"><input type="checkbox" class="av-dow" value="' + i + '"' + (dows.indexOf(i) > -1 ? ' checked' : '') + (opts.rule ? ' disabled' : '') + '> ' + AV_DOW_SHORT[i - 1] + '</label>';
  }
  body += '</div></div>';
  body += '<div id="av-single" style="' + (mode === 'single' ? '' : 'display:none') + '"><div class="form-label" style="margin-bottom:4px">Ngày <span style="color:var(--brand)">*</span></div>' +
    '<input class="form-input" type="date" id="av-date" value="' + date + '" min="' + avYmd(new Date()) + '"' + (opts.date ? ' disabled' : '') + '></div>';
  body += '<div class="av-fields"><div><div class="av-sub">Rảnh từ</div><input class="form-input" type="time" id="av-from" step="900" value="' + from + '"></div>' +
    '<div><div class="av-sub">Đến</div><input class="form-input" type="time" id="av-to" step="900" value="' + to + '"></div></div>' +
    '<div style="font-size:12px;color:var(--muted);margin-top:12px;line-height:1.65">Khoảng giờ tối thiểu 60 phút. VD rảnh 09:00 – 17:00 thì advisee đặt được bất kỳ giờ bắt đầu nào từ 09:00 đến 16:00 (kể cả 09:30, 10:15…), mỗi meeting 60 phút.' +
    (mode === 'weekly' ? '<br>Lịch cố định tự áp dụng cho các tuần tiếp theo (luôn giữ sẵn 8 tuần phía trước), bạn không cần gửi lại.' : '') + '</div>';

  document.getElementById('modal-title').textContent = title;
