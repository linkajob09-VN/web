    act += '<button class="btn-secondary" style="width:auto;padding:10px 14px;white-space:nowrap" onclick="openDayReschedule(' + idx + ')">📅 Đổi giờ</button>';
  }
  act += '<button class="login-btn" onclick="openStaffDayModal(\'' + (window._dayListDate || '') + '\')" style="width:auto;padding:10px 16px;white-space:nowrap">← Quay lại ngày</button>';
  document.getElementById('modal-actions').innerHTML = act;
  document.getElementById('modal-overlay').classList.add('open');
}
function openCancelMeeting(idx) {
  var m = window._dayList && window._dayList[idx];
  if (!m) return;
  window._cancelCtx = m;
  var isLead = String(m.session_id || '').indexOf('lead-') === 0;
  document.getElementById('modal-title').textContent = 'Huỷ buổi — ' + (m.advisee || '');
  document.getElementById('modal-body').innerHTML =
    '<div style="font-size:13px;color:var(--muted);margin-bottom:12px">' + escHtml(m.type) + ' · <b>' + escHtml(m.date || '') + ' ' + escHtml(m.time || '') + '</b> · Advisor: ' + escHtml(m.advisor || '—') + '</div>' +
    '<div class="form-label" style="margin-bottom:6px">Lý do huỷ (bắt buộc)</div>' +
    '<textarea class="form-input" id="cx-reason" rows="3" placeholder="VD: Advisor bận đột xuất, advisee xin huỷ..."></textarea>' +
    '<label style="display:flex;gap:8px;align-items:center;font-size:13px;margin-top:12px"><input type="checkbox" id="cx-notify" checked> Gửi email báo advisee &amp; advisor (kèm lý do)</label>' +
    '<div style="font-size:12px;color:var(--muted);margin-top:8px">' + (isLead
      ? 'Ngày/giờ đã chốt của khách sẽ được xoá — khách quay lại danh sách "chưa đặt lịch".'
      : 'Buổi sẽ chuyển sang "Đã huỷ", slot của Advisor được mở lại, sự kiện Google Calendar bị xoá. Buổi này <b>không bị trừ</b> khỏi gói của advisee.') + '</div>';
  document.getElementById('modal-actions').innerHTML =
    '<button class="btn-secondary" onclick="closeModal()" style="width:auto;padding:10px 20px">Không huỷ</button>' +
    '<button class="login-btn" id="cx-save" onclick="saveCancelMeeting_()" style="width:auto;padding:10px 24px;background:#B91C1C">Xác nhận huỷ buổi</button>';
  document.getElementById('modal-overlay').classList.add('open');
}
function saveCancelMeeting_() {
  var m = window._cancelCtx; if (!m) return;
  var reason = document.getElementById('cx-reason').value.trim();
  if (!reason) { toast('Vui lòng nhập lý do huỷ', 'error'); return; }
  var isLead = String(m.session_id || '').indexOf('lead-') === 0;
  var btn = document.getElementById('cx-save'); btn.disabled = true; btn.textContent = 'Đang huỷ...';
  apiPost({ action: 'cancelMeeting', session_id: isLead ? '' : m.session_id, lead_id: isLead ? String(m.session_id).slice(5) : '',
            reason: reason, notify: document.getElementById('cx-notify').checked, changed_by: currentUser.email }).then(function(res){
    if (!res || !res.success) { toast((res && res.error) || 'Không huỷ được buổi', 'error'); btn.disabled = false; btn.textContent = 'Xác nhận huỷ buổi'; return; }
    var extra = res.emails_sent ? ' Đã gửi email cho ' + res.emails_sent + ' người.' : '';
    if (res.calendar && String(res.calendar).indexOf('error') > -1) extra += ' (Chưa xoá được sự kiện Calendar.)';
    toast('Đã huỷ buổi ✅' + extra, 'success');
    closeModal();
    loadMeetingCalendarAsync();
  }).catch(function(e){ toast('Lỗi: ' + e.message, 'error'); btn.disabled = false; btn.textContent = 'Xác nhận huỷ buổi'; });
}

function renderBookedSessions() {
  // Lấy danh sách advisee đang được match với advisor này (từ MOCK.advisees)
  const myAdvisees = MOCK.advisees.filter(function(ae){ return ae.advisor === currentUser.name; });

  let html = '<div class="card"><div class="card-header"><div class="card-header-left">Buổi đã book & Chuẩn bị meeting</div><button class="refresh-btn" onclick="loadDashboard(\'Advisor\',\'booked\')">↻ Làm mới</button></div>';

  if (myAdvisees.length === 0) {
    html += '<div class="empty-state"><div class="icon">📭</div>Chưa có advisee nào</div></div>';
    return html;
  }

  myAdvisees.forEach(function(ae) {
    html += '<div style="border-top:1px solid var(--border);padding:18px 24px">';
    // Advisee header
    html += '<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">';
    html += avatarCircle(ae.name, 38);
    html += '<div style="flex:1"><div style="font-weight:700;font-size:14px">' + ae.name + '</div>';
    html += '<div style="font-size:12px;color:var(--muted)">Gói ' + ae.pkg + ' · ' + ae.bookingId + '</div></div>';
    html += '<span style="font-size:12px;font-weight:700;color:var(--brand)">' + ae.sessionsDone + '/' + ae.sessionsTotal + ' buổi</span>';
    html += '</div>';

    // Danh sách sessions
    ae.sessions.forEach(function(s) {
      var d = s.date ? new Date(s.date + 'T00:00:00') : null;
      var dow = d ? ['CN','T2','T3','T4','T5','T6','T7'][d.getDay()] : '';
      var dateLabel = d ? dow + ' ' + d.getDate() + '/' + (d.getMonth()+1) + ' · ' + s.timeStart + '–' + s.timeEnd : 'Chưa xếp lịch';

      // Status color
      var statusColor = {done:'var(--green)', feedback:'#C2410C', upcoming:'#1D4ED8', locked:'#9CA3AF'}[s.status] || '#9CA3AF';
      var statusLabel = {done:'✓ Hoàn thành', feedback:'Cần feedback', upcoming:'Sắp tới', locked:'Đã khoá'}[s.status] || s.status;

      html += '<div style="border:1.5px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden">';
      // Session row
      html += '<div style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:' + (s.status==='upcoming'?'#F0F9FF':'var(--white)') + '">';
      html += '<div style="font-size:12px;font-weight:700;color:var(--muted);min-width:52px">Buổi ' + s.no + '</div>';
      html += '<div style="flex:1;font-size:13px;color:var(--text)">' + dateLabel + '</div>';
      html += '<span style="font-size:12px;font-weight:700;color:' + statusColor + '">' + statusLabel + '</span>';
      if (s.meetLink && s.status === 'upcoming') html += '<a href="' + s.meetLink + '" target="_blank" class="detail-btn" style="font-size:12px;padding:5px 10px">🎥 Meet</a>';
      html += '</div>';

      // Prep info + Advisor notes
      if (s.status !== 'locked') {
        html += '<div style="padding:12px 16px;border-top:1px solid var(--border);background:#FAFAF8;display:flex;flex-direction:column;gap:10px">';
        html += renderPrepCard(s.prepInfo);

        // Với buổi đã qua — hiện form nhận xét hoặc notes đã điền
        if (s.status === 'done' || s.status === 'feedback') {
          if (s.advisorNotes) {
            html += renderAdvisorNotesCard(s.advisorNotes, true, ae.id, s.no);
          } else {
            html += renderAdvisorNotesForm(ae.id, s.no);
          }
        }
        html += '</div>';
      }
      html += '</div>'; // end session card
    });

    html += '</div>'; // end advisee block
  });

  html += '</div>';
  return html;
}

function fmtMoney(n) { return (n||0).toLocaleString('vi-VN') + 'đ'; }

// ── Hiển thị: chuẩn hoá SĐT Việt Nam (84985926902 / 985926902 → 0985 926 902). Chỉ đổi cách hiển thị, không đổi dữ liệu gốc.
function fmtPhoneVN(p) {
  var raw = String(p == null ? '' : p).trim();
  if (!raw) return '';
  var d = raw.replace(/\D/g, '');
  if (d.indexOf('84') === 0 && d.length === 11) d = '0' + d.slice(2);
  else if (d.length === 9 && d.charAt(0) !== '0') d = '0' + d;
  if (/^0\d{9}$/.test(d)) return d.slice(0, 4) + ' ' + d.slice(4, 7) + ' ' + d.slice(7);
  return raw;
}
// ── Hiển thị: ô email chứa link (vd link CV Drive) thì hiện thành nút link gọn thay vì URL dài
// Hồ sơ cũ có link nằm nhầm trong ô email: hiển thị sang ô CV để Staff bấm Lưu là tự chuyển đúng chỗ
function leadEmailIsLink(c) { return /^https?:\/\//i.test(String((c && c.email) || '').trim()); }
function leadEmailForInput(c) { return leadEmailIsLink(c) ? '' : (c.email || ''); }
function leadCvForInput(c) { var p = c.profile || {}; return p.cvLink || (leadEmailIsLink(c) ? String(c.email).trim() : ''); }
function leadQuestion(o) { return String((o && o.profile && o.profile.question) || '').trim(); }
function leadQuestionHtml(o) {
  var q = leadQuestion(o);
  if (!q) return '';
  return '<div class="lead-q" title="' + escHtml(q) + '">' + escHtml(q) + '</div>';
}
function cvLinkLine(o) {
  var link = (o && (o.cvLink || (o.profile && o.profile.cvLink))) || '';
  var u = safeHttpUrl(link);
  if (!u || String(o.email || '').trim() === String(link).trim()) return '';
  return '<div style="font-size:12px"><a href="' + u + '" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:var(--brand);font-weight:600;text-decoration:none">📎 Link hồ sơ / CV</a></div>';
}
function fmtContactEmail(v, emptyText) {
  var e = String(v == null ? '' : v).trim();
  if (!e) return emptyText || '';
  if (/^https?:\/\//i.test(e)) {
    return '<a href="' + e.replace(/"/g, '%22').replace(/</g, '%3C') + '" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:var(--brand);font-weight:600;text-decoration:none">📎 Link hồ sơ / CV</a>';
  }
  return e.replace(/&/g, '&amp;').replace(/</g, '&lt;');
}
// ── % tiến độ an toàn khi tổng buổi = 0 (tránh NaN%)
function pctOf(done, total) { return total > 0 ? Math.round(done / total * 100) : 0; }

// Giá gói cho phép nhập chữ tự do (VD: "Theo thoả thuận") giống ô Nhóm/Tên mục —
// chỉ format tiền tệ khi giá trị thực sự là số nguyên, còn lại hiển thị nguyên văn.
function fmtPkgPrice(v) {
  if (v === '' || v === null || v === undefined || v === 0 || v === '0') return 'Liên hệ';
  var s = String(v).trim();
  if (/^\d+$/.test(s)) return fmtMoney(Number(s));
  return s;
}
// Nội bộ vẫn lưu "days" (đúng contract của backend/Sheet hiện có) để tính
// hạn hết gói cho khách — nhưng admin chỉ thấy/gõ 1 ô CHỮ TỰ DO duy nhất
// (VD "3 ngày", "1 tháng", "Đến khi có Offer"), không ép đơn vị. parseDays
// FromLabel bóc số + từ khoá đơn vị ra để tính ngày; không đoán được thì
// dùng mốc rất dài (fallback) vì hạn hiển thị thật đã nằm ở duration_label.
function parseDaysFromLabel(text) {
  var s = String(text || '').trim().toLowerCase();
  var m = s.match(/(\d+(\.\d+)?)/);
  var num = m ? parseFloat(m[1]) : null;
  if (num === null) return 3650; // VD "Đến khi có Offer" — không có số, coi như không giới hạn thực tế
  if (s.indexOf('năm') !== -1) return Math.round(num * 365);
  if (s.indexOf('tháng') !== -1) return Math.round(num * 30);
  if (s.indexOf('tuần') !== -1) return Math.round(num * 7);
  return Math.round(num); // mặc định: ngày
}
function fmtPkgDuration(days) {
  days = Number(days) || 0;
  if (days <= 0) return '';
  if (days < 14) return days + ' ngày';
  var halfMonths = Math.round(days / 30 * 2);
  var months = halfMonths / 2;
  return (months % 1 === 0 ? String(months) : months.toFixed(1)) + ' tháng';
}
// ── 4 chủ đề hỗ trợ cố định — mỗi dòng nội dung hỗ trợ chọn đúng 1 trong
//    số này, để người đọc dễ nhận diện benefit theo nhóm, và admin không
//    cần tự nghĩ tên nhóm mỗi lần thêm gói mới. ──
var FEATURE_THEMES = ['Định hướng', 'Sửa CV', 'Luyện phỏng vấn', 'Khác'];
function normalizeFeatureTheme(label) {
  var s = String(label || '').toLowerCase();
  if (FEATURE_THEMES.indexOf(String(label || '').trim()) !== -1) return String(label).trim();
  if (s.indexOf('định hướng') !== -1) return 'Định hướng';
  if (s.indexOf('cv') !== -1) return 'Sửa CV';
  if (s.indexOf('phỏng vấn') !== -1) return 'Luyện phỏng vấn';
  return 'Khác';
}

function staffMatchesEntity(staffObj, entity, idField, nameField) {

// MOCK.consultations (không xoá sạch, để không mất optimistic update đang chờ lưu).
function loadStaffLeadsAsync() {
  var s = sheetData.staffList.find(function(x){ return x.id === _staffDetailId; });
  if (!s) return;

  apiGet('getLeads', { staff: s.name }).then(function(res){
    var rows = (res && res.data) ? res.data : [];
    rows.forEach(function(r){
      if (!r.lead_id) return;
      var existing = MOCK.consultations.find(function(c){ return c.id === r.lead_id; });
      var obj = existing || { id: r.lead_id, log: [] };
  obj.createdAt = r.created_at || obj.createdAt || '';
  obj.updatedAt = r.updated_at || obj.updatedAt || '';
  obj.cvLink = r.cv_link || obj.cvLink || '';
      obj.staff = r.staff || s.name;
      obj.name = r.name || ''; obj.phone = r.phone || ''; obj.email = r.email || '';
      obj.source = r.source || ''; obj.consultAbout = r.consult_about || '';
      obj.date = r.date ? String(r.date).slice(0,10) : '';
      obj.time = fmtHHMM(r.time);
      obj.meetLink = r.meet_link || '';
      obj.status = r.status || 'Chưa liên hệ';
      obj.result = r.result || '';
      obj.nextStep = r.next_step || '';
      obj.nextStepDeadline = r.next_step_deadline ? String(r.next_step_deadline).slice(0,10) : '';
      obj.contactedDate = r.contacted_date ? String(r.contacted_date).slice(0,10) : '';
      obj.contactedTime = fmtHHMM(r.contacted_time);
      obj.profile = {
        education: r.education || '', experience: r.experience || '',
        desire: r.desire || '', barrier: r.barrier || '', followUp: r.follow_up || '',
        customerType: r.customer_type || '', region: r.region || '',
        studentYear: r.student_year || '', experienceYears: r.experience_years || '',
        interestedDept: r.interested_dept || '', interestedLevel: r.interested_level || '',
        sourceChannel: r.source_channel || '',
      };
      if (!existing) MOCK.consultations.push(obj);
    });

    if (_staffDetailTab === 'consult' || _staffDetailTab === 'leads') {
      document.getElementById('main-content').innerHTML = renderStaffMemberDetail(_staffDetailId, _staffDetailTab, _staffDetailSelfView);
    }
  }).catch(function(err){
    console.warn('Không tải được leads từ Sheet:', err.message);
    if (_staffDetailTab === 'consult' || _staffDetailTab === 'leads') {
      document.getElementById('main-content').innerHTML = renderStaffMemberDetail(_staffDetailId, _staffDetailTab, _staffDetailSelfView);
    }
  });
}

// Ghi 1 lead (tạo mới nếu chưa có id, cập nhật nếu đã có) lên Sheet.
// Optimistic: UI đã cập nhật trước khi gọi hàm này, chỉ cần đồng bộ nền.
// Hàng đợi lưu theo từng lead — nếu Sale sửa 2 trường liên tiếp thật nhanh (vd chọn
// ngày giờ liên hệ rồi đổi status ngay sau đó), 2 lệnh lưu SẼ chạy thành 2 request
// mạng riêng biệt, không đảm bảo tới server đúng thứ tự đã bấm. Request nào server
// XỬ LÝ XONG SAU sẽ ghi đè, dù nó được gửi TRƯỚC — dẫn đến 1 trong 2 thay đổi bị mất
// (đây chính là lỗi "chọn giờ liên hệ nhưng status không đổi" / "đổi status nhưng
// giờ liên hệ không lưu"). Để tránh, mỗi lead có 1 hàng đợi riêng: lệnh lưu sau luôn
// đợi lệnh lưu trước của CÙNG lead đó xong rồi mới gửi lên server.
var _leadSaveChain = {};
// staff_id của nhân viên theo tên (để cột staff_id trong Leads luôn khớp cột staff khi gán / đổi Sale hoặc Admin)
function leadStaffIdByName_(name) {
  var n = String(name || '').trim().toLowerCase();
  if (!n) return '';
  var st = (sheetData.staffList || []).filter(function(x){ return String(x.name || '').trim().toLowerCase() === n; })[0];
  return st ? (st.id || '') : '';
}

function persistLead(c) {
  autoBookedStatus_(c);
  var isNew = !c.id;
  var key = c.id || ('__new__' + (c._tmpKey || (c._tmpKey = Math.random())));
  var prevChain = _leadSaveChain[key] || Promise.resolve();

  var chained = prevChain.then(function(){
    return apiPost({
      action: 'saveLead',
      lead_id: c.id || '',
      staff: c.staff || '', staff_id: leadStaffIdByName_(c.staff), name: c.name || '', phone: c.phone || '', email: c.email || '',
      source: c.source || '', consult_about: c.consultAbout || '',
      date: c.date || '', time: c.time || '', meet_link: c.meetLink || '',
      status: c.status || '', result: c.result || '',
      next_step: c.nextStep || '', next_step_deadline: c.nextStepDeadline || '',
      contacted_date: c.contactedDate || '', contacted_time: c.contactedTime || '',
      education: (c.profile && c.profile.education) || '',
      experience: (c.profile && c.profile.experience) || '',
      desire: (c.profile && c.profile.desire) || '',
      barrier: (c.profile && c.profile.barrier) || '',
      follow_up: (c.profile && c.profile.followUp) || '',
      // MỚI (fix — các field này trước đây bị "Lưu hồ sơ" set vào c.profile nhưng
      // KHÔNG được gửi lên Sheet ở persistLead(), nên sửa xong tưởng đã lưu mà
      // tải lại trang là mất y nguyên. Nay gửi đầy đủ.
      customer_type: (c.profile && c.profile.customerType) || '',
      region: (c.profile && c.profile.region) || '',
      student_year: (c.profile && c.profile.studentYear) || '',
      experience_years: (c.profile && c.profile.experienceYears) || '',
      interested_dept: (c.profile && c.profile.interestedDept) || '',
      interested_level: (c.profile && c.profile.interestedLevel) || '',
      source_channel: (c.profile && c.profile.sourceChannel) || '',
      // MỚI: 2 field khách điền ở widget "Đăng ký tư vấn" nhưng trước đây
      // chưa từng được đọc/hiện/lưu ở trang chi tiết lead.
      question: (c.profile && c.profile.question) || '',
      cv_link: (c.profile && c.profile.cvLink) || '',
      session_id: c.sessionId || '',
    }).then(function(res){
      if (res && res.success && isNew && res.lead_id) c.id = res.lead_id;
      if (!res || !res.success) console.warn('Lưu lead lên Sheet thất bại:', res && res.error);
      return res;
    }).catch(function(err){ console.warn('Lỗi kết nối khi lưu lead:', err.message); });
  });

  // Luôn giữ chain sống dù lần lưu trước lỗi, để các lần lưu sau không bị kẹt mãi mãi
  _leadSaveChain[key] = chained.catch(function(){});
  return chained;
}

// Ghi 1 dòng nhật ký cho lead lên Sheet (tab LeadLogs).
function persistLeadLog(leadId, entry) {
  if (!leadId) return; // lead chưa có id thật (chưa lưu xong) — bỏ qua, log vẫn còn trong bộ nhớ tạm
  apiPost({ action: 'addLeadLog', lead_id: leadId, time_label: entry.time, text: entry.text, user: entry.user || '' })
    .catch(function(err){ console.warn('Lỗi lưu nhật ký:', err.message); });
}

// Tải lịch trống THẬT từ Sheet (AvailableSlots) cho 1 nhân viên, thay vì chỉ đọc MOCK.saleSlots trong bộ nhớ.
// Toàn bộ slot tư vấn miễn phí nằm chung dưới identity STAFF_SLOT_IDENTITY (khớp với widget public),
// nên phải lọc thêm theo created_by để biết slot nào của đúng nhân viên đang xem.
function loadStaffScheduleTabAsync() {
  var s = sheetData.staffList.find(function(x){ return x.id === _staffDetailId; });
  if (!s) return;

  apiGet('getSlots', { advisor: STAFF_SLOT_IDENTITY }).then(function(res){
    var allSlots = (res && res.data) ? res.data : [];
    // Nhận diện slot của nhân viên này bằng created_by, fallback theo advisor_email
    // nếu Sheet chưa lưu/trả cột created_by (đây chính là nguyên nhân bug "0 slot").
    var mySlots = allSlots.filter(function(rs){
      var byCreator = (rs.created_by || '') === s.name;
      var byEmail = !rs.created_by && rs.advisor_email && s.email && rs.advisor_email === s.email;
      return byCreator || byEmail;
    });

    // Merge thêm — KHÔNG xoá sạch mảng local trước, để slot vừa gửi (optimistic)
    // không bị biến mất nếu response từ Sheet thiếu/trễ.
    mySlots.forEach(function(rs){
      var d = String(rs.date || '').slice(0, 10);
      var t = rs.time_start;
      var existing = MOCK.saleSlots.find(function(sl){ return sl.staff === s.name && sl.date === d && sl.time === t; });
      var status = rs.status === 'booked' ? 'booked' : 'available';
      var client = rs.status === 'booked' ? (rs.booking_id || 'Đã đặt') : '';
      if (existing) {
        existing.status = status; existing.client = client; existing.slot_id = rs.slot_id;
      } else {
        MOCK.saleSlots.push({ staff: s.name, date: d, time: t, status: status, client: client, note: 'Tư vấn miễn phí', slot_id: rs.slot_id });
      }
    });

    if (_staffDetailTab === 'schedule') {
      document.getElementById('main-content').innerHTML = renderStaffMemberDetail(_staffDetailId, 'schedule', _staffDetailSelfView);
    }
  }).catch(function(err){
    // Lỗi mạng: giữ nguyên dữ liệu local đã có (không xoá), chỉ báo lỗi nhẹ
    console.warn('Không đồng bộ được lịch từ Sheet:', err.message);
  });
}

function renderStaffMemberDetail(staffId, tab, selfView) {
  var s = sheetData.staffList.find(function(x){ return x.id === staffId; });
  if (!s) return '<div class="empty-state">Không tìm thấy nhân viên</div>';
  tab = tab || 'consult';

  var html = '';
  if (selfView) {
    html += '<div style="margin-bottom:20px;font-size:13px;color:var(--muted)">Dashboard cá nhân — theo dõi khối lượng công việc của bạn tại LinkaJob</div>';
  } else {
    // Breadcrumb
    html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:20px;font-size:13px">';
    html += '<button onclick="navTo(\'stf-list\')" style="background:none;border:none;color:var(--brand);cursor:pointer;font-family:inherit;font-size:13px;padding:0">← Danh sách nhân viên</button>';
    html += '<span style="color:var(--border)">›</span><span style="color:var(--muted)">' + s.name + '</span>';
    html += '</div>';
  }

  // Hero card
  html += '<div class="card" style="margin-bottom:16px"><div style="padding:20px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap">';
  html += avatarCircle(s.name, 52);
  html += '<div style="flex:1;min-width:200px">';
  html += '<div style="font-size:18px;font-weight:800;margin-bottom:3px">' + s.name + '</div>';
  html += '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' + roleBadge(s.role) + (s.active ? '<span class="badge badge-confirmed">Đang làm</span>' : '<span class="badge badge-cancelled">Tạm nghỉ</span>') + '</div>';
  html += '</div>';
  html += '<div style="font-size:13px;color:var(--muted);text-align:right;line-height:1.8">' + s.email + '<br>' + s.phone + '</div>';
  html += '</div></div>';

  // Local tab switcher (giống role-tabbar của Advisor)
  var leadCount = MOCK.consultations.filter(function(c){ return c.staff === s.name && !c.date && !isHiddenOnDashboard(c) && !isRegisteredResult(c.result); }).length;
  var TABS = [
    { id:'consult', icon:'📞', label:'Lịch tư vấn' },
    { id:'leads', icon:'⚠', label:'Khách chưa đặt lịch', badge: leadCount },
    { id:'care', icon:'💬', label:'Chăm sóc khách hàng' },
    { id:'kpi', icon:'📊', label:'KPI cá nhân' },
  ];
  if (selfView) {
    // Flow cho Sale: Hôm nay → Khách mới → Khách đã mua (nhắc hạn) → Lịch & đổi lịch → KPI
    var sdOk = _saleData && _saleData.loadedFor === s.id;
    var remindN = adviseesOfSale_(s).filter(function(ae){ return expiryAlert_(ae).red; }).length;
    var pendN = sdOk ? pendingReschedules(_saleData.reqs).length : 0;
    var todayBadge = (sdOk ? pendN : 0) + remindN + leadCount;
    TABS = [
      { id:'today', icon:'🏠', label:'Hôm nay', badge: todayBadge },
      { id:'consult', icon:'📞', label:'Khách đăng ký tư vấn' },
      { id:'leads', icon:'⚠', label:'Chưa đặt lịch', badge: leadCount },
      { id:'care', icon:'💳', label:'Khách đã mua', badge: remindN },
      { id:'meetings', icon:'📅', label:'Lịch & đổi lịch', badge: pendN },
      { id:'kpi', icon:'📊', label:'KPI cá nhân' },
    ];
  }
  html += '<div style="display:flex;gap:6px;border-bottom:1.5px solid var(--border);margin-bottom:20px;flex-wrap:wrap">';
  TABS.forEach(function(t){
    var active = t.id === tab;
    html += '<div onclick="switchStaffDetailTab(\'' + t.id + '\')" style="padding:11px 18px;font-size:13.5px;font-weight:600;cursor:pointer;color:' + (active?'var(--brand)':'var(--muted)') + ';border-bottom:2.5px solid ' + (active?'var(--brand)':'transparent') + ';display:flex;align-items:center;gap:6px">' + t.icon + ' ' + t.label;
    if (t.badge) html += '<span style="background:#FEF3C7;color:#92400E;font-size:11px;font-weight:700;padding:1px 7px;border-radius:100px">' + t.badge + '</span>';
    html += '</div>';
  });
  html += '</div>';

  var bodyHtml;
  if (tab === 'today') bodyHtml = renderSaleToday(s);
  else if (tab === 'meetings') bodyHtml = renderSaleMeetings(s);
  else if (tab === 'leads') bodyHtml = renderStaffLeadsTab(s);
  else if (tab === 'schedule') bodyHtml = renderStaffScheduleTab(s);
  else if (tab === 'care') bodyHtml = renderStaffCareTab(s);
  else if (tab === 'kpi') bodyHtml = renderStaffKpiTab(s);
  else bodyHtml = renderStaffConsultTab(s);

  // Sale có menu trái: chỉ hiện tiêu đề trang + nội dung (không lặp thẻ hồ sơ + thanh tab)
  if (selfView && _saleSidebarMode) {
    var ttl = SALE_TAB_TITLES[tab] || [tab, ''];
    return pageHeader(ttl[0], ttl[1]) + bodyHtml;
  }
  return html + bodyHtml;
}

// ── Bảng dùng chung cho mọi danh sách khách/lịch tư vấn — cấu trúc cột GIỐNG HỆT
// bảng "Danh sách đăng ký" ở trang "Khách đăng ký tư vấn mới": KHÁCH HÀNG | TRẠNG
// THÁI TƯ VẤN | (cột giữa tuỳ nơi gọi) | DỊCH VỤ QUAN TÂM | KẾT QUẢ | NV PHỤ TRÁCH.
// opts.middleLabel: tiêu đề cột giữa. opts.middleHtml(c): nội dung cột giữa.
function renderConsultMasterTable(list, containerId, opts) {
  if (list.length === 0) {
    return '<div class="empty-state"><div class="icon">📭</div>Chưa có buổi nào</div>';
  }
  list = sortList_('lead', list);
  var saleStaff = sheetData.staffList.filter(function(st){ return isSaleLike_(st) && st.active; });

  var html = '<div style="overflow-x:auto"><table class="bookings-table lead-table"><thead><tr>' +
    '<th>KHÁCH HÀNG</th><th>TRẠNG THÁI TƯ VẤN</th><th>' + opts.middleLabel + '</th><th>DỊCH VỤ QUAN TÂM</th><th>KẾT QUẢ</th><th>NV PHỤ TRÁCH</th>' +
    '</tr></thead><tbody' + (containerId ? ' id="' + containerId + '"' : '') + '>';

  list.forEach(function(c){
    var searchKey = (c.name + ' ' + (c.phone||'') + ' ' + fmtPhoneVN(c.phone) + ' ' + (c.email||'')).toLowerCase().replace(/"/g,'');
    html += '<tr data-search="' + searchKey + '"' + skAttrs_('lead', c) + '>';

    // Cột 1 — tên/SĐT/email, bấm vào mở chi tiết
    html += '<td style="min-width:150px"><div style="cursor:pointer" onclick="navToConsultationDetail(\'' + c.id + '\')">' +
      '<div style="font-weight:700;font-size:13.5px">' + (c.name || 'Khách hàng') + '</div>' +
      '<div style="font-size:12px;color:var(--muted)">' + (fmtPhoneVN(c.phone)||'—') + '</div>' +
      '<div style="font-size:12px;color:var(--muted)">' + fmtContactEmail(c.email,'') + '</div>' + cvLinkLine(c) +
      '</div></td>';

    // Cột 2 — trạng thái tư vấn (dropdown, sửa trực tiếp)
    html += '<td><select class="form-select lead-select" onclick="event.stopPropagation()" onchange="updateLeadStatusInline(\'' + c.id + '\', this.value)">' +
      CONSULT_STATUS.map(function(s){ return '<option value="' + s + '"' + (c.status===s?' selected':'') + '>' + s + '</option>'; }).join('') + extraStatusOption(c.status) +
      '</select></td>';

    // Cột 3 — tuỳ nơi gọi (thời gian/link hoặc next step)
    html += '<td style="min-width:170px">' + opts.middleHtml(c) + '</td>';

    // Cột 4 — dịch vụ quan tâm (chỉ hiển thị)
    html += '<td style="font-size:12.5px">' + escHtml(c.consultAbout || '—') + leadQuestionHtml(c) + '</td>';

    // Cột 5 — kết quả (dropdown, sửa trực tiếp)
    html += '<td><select class="form-select lead-select" onclick="event.stopPropagation()" onchange="handleConsultResultChange(\'' + c.id + '\', this.value)">' +
      resultOptionsHtml(c.result) +
      '</select></td>';

    // Cột 6 — NV phụ trách (dropdown, sửa trực tiếp)
    html += '<td><select class="form-select lead-select" onclick="event.stopPropagation()" onchange="assignRegToStaff(\'' + c.id + '\', this.value)">' +
      '<option value=""' + (!c.staff?' selected':'') + '>— Chưa gán —</option>' +
      saleStaff.map(function(st){ return '<option value="' + st.name + '"' + (c.staff===st.name?' selected':'') + '>' + st.name + '</option>'; }).join('') +
      '</select></td>';

    html += '</tr>';
  });

  html += '</tbody></table></div>';
  return html;
}

// ── Tab 1: Lịch tư vấn cần tham gia ──
function renderStaffConsultTab(s) {
  var mine = MOCK.consultations.filter(function(c){ return c.staff === s.name && !!c.date && !isHiddenOnDashboard(c); });
  var now = new Date();

  var upcoming = mine.filter(function(c){ return new Date(c.date + 'T' + (c.time||'00:00')) >= now; })
    .sort(function(a,b){ return (a.date+a.time).localeCompare(b.date+b.time); });
  var past = mine.filter(function(c){ return new Date(c.date + 'T' + (c.time||'00:00')) < now; })
    .sort(function(a,b){ return (b.date+b.time).localeCompare(a.date+a.time); });

  var html = '';
  html += '<div class="card"><div class="card-header"><div class="card-header-left">📅 Lịch tư vấn sắp tới (' + upcoming.length + ')</div></div>';
  if (upcoming.length > 0) html += '<div style="padding:0 20px">' + searchSortHtml_('consult-upcoming-tbody', 'Tìm theo tên, email, SĐT...', 'lead') + '</div>';
  html += renderConsultMasterTable(upcoming, 'consult-upcoming-tbody', { middleLabel: 'THỜI GIAN / LINK', middleHtml: consultTimeLinkCellHtml });
  html += '</div>';

  html += '<div class="card"><div class="card-header"><div class="card-header-left">✅ Khách hàng đã tư vấn (' + past.length + ')</div></div>';
  if (past.length > 0) html += '<div style="padding:0 20px">' + searchSortHtml_('consult-past-tbody', 'Tìm theo tên, email, SĐT...', 'lead') + '</div>';
  html += renderConsultMasterTable(past, 'consult-past-tbody', { middleLabel: 'NEXT STEP', middleHtml: consultNextStepCellHtml });
  html += '</div>';

  return html;
}

// Xử lý khi Sale chọn Kết quả cho 1 buổi tư vấn
function handleConsultResultChange(cid, value) {
  var c = MOCK.consultations.find(function(x){ return x.id === cid; });
  if (!c) return;
  var newResult = value === '— Chưa có —' ? '' : value;
  c.result = newResult;
  persistLead(c);

  if (isRegisteredResult(newResult)) {
    // Nếu khách đã tự đăng ký trên web trùng tên/email → tự động tính doanh thu
    // cho đúng Sale phụ trách lượt tư vấn này (không tạo trùng hồ sơ Advisee).
    var existing = MOCK.advisees.find(function(ae){ return ae.email === c.email || ae.name === c.name; });
    if (existing) {
      toast('Khách đã có hồ sơ Advisee (trùng thông tin) — đã ghi nhận doanh thu cho ' + c.staff + ' ✅', 'success');
      refreshStaffTab();
      return;
    }
    openCreateAdviseeFromConsultModal(cid);
    return;
  }

  toast('Đã lưu kết quả', 'success');
  refreshStaffTab();
}

function refreshStaffTab() {
  if (_staffDetailId) document.getElementById('main-content').innerHTML = renderStaffMemberDetail(_staffDetailId, _staffDetailTab, _staffDetailSelfView);
}

function confirmCreateAdviseeFromConsult(cid) {
  var c = MOCK.consultations.find(function(x){ return x.id === cid; });
  if (!c) return;
  var pkgName = document.getElementById('ca-pkg').value;
  var advisorName = document.getElementById('ca-advisor').value;
  var regDate = document.getElementById('ca-date').value;
  var paid = Number(document.getElementById('ca-paid').value) || PACKAGES[pkgName].price;
  var pkg = PACKAGES[pkgName];

  var expiry = new Date(regDate + 'T00:00:00');
  expiry.setDate(expiry.getDate() + pkg.days);

  var sessions = [];
  for (var i = 1; i <= pkg.sessions; i++) {
    sessions.push({ no: i, date: null, timeStart: null, timeEnd: null, status: i === 1 ? 'upcoming' : 'locked', lockedReason: i === 1 ? undefined : 'Hoàn thành buổi trước để mở khoá', feedback: null, meetLink: '', prepInfo: null, advisorNotes: null });
  }

  MOCK.advisees.push({
    id: 'adv-ee' + Date.now(),
    name: c.name, email: c.email, phone: c.phone, contact: '',
    pkg: pkgName, bookingId: 'LJ-' + regDate.replace(/-/g,'') + '-' + String(Date.now()).slice(-4),
    advisorTitle: '', progress: '0/' + pkg.sessions, sessionsTotal: pkg.sessions, sessionsDone: 0,
    paid: paid, registeredAt: regDate, expiry: ymd(expiry), advisor: advisorName,
    sessions: sessions,
  });

  c.status = 'Đã tư vấn xong';
  c.convertedToAdvisee = true;
  persistLead(c);

  toast('Đã tạo hồ sơ Advisee cho ' + c.name + ' — doanh thu ghi nhận cho ' + c.staff + ' ✅', 'success');
  closeModal();
  refreshStaffTab();
}

function renderStaffLeadsTab(s) {
  var leads = MOCK.consultations.filter(function(c){ return c.staff === s.name && !c.date && !isHiddenOnDashboard(c) && !isRegisteredResult(c.result); });

// Trạng thái "độ mới" của lead — chỉ 2 mức theo yêu cầu:
// - Chưa liên hệ: "Lead mới — liên hệ trong 1 tiếng"
// - Quá 3 ngày mà vẫn chưa chốt được lịch: "Lead quá hạn"
function getLeadFreshness(c) {
  var anchor = getLeadAnchor(c) || new Date();
  var now = new Date();
  var days = anchor ? Math.floor((now - anchor) / 86400000) : 0;
  if (days > 3) {
    return { label: '⚠ Lead quá hạn — quá 3 ngày chưa chốt lịch', bg: '#FEE2E2', color: '#B91C1C' };
  }
  return { label: '🆕 Lead mới — liên hệ trong 1 tiếng', bg: '#DBEAFE', color: '#1D4ED8' };
}

// field: 'contactedDate' | 'contactedTime'
function updateLeadContactedInline(cid, field, value) {
  var c = MOCK.consultations.find(function(x){ return x.id === cid; });
  if (!c) return;
  c[field] = value;
  toast('Đã lưu thời gian liên hệ', 'success');
  persistLead(c);
}

// Lưu ngay khi đổi Status tư vấn trên list, không cần vào trang chi tiết
function updateLeadStatusInline(cid, newStatus) {
  var c = MOCK.consultations.find(function(x){ return x.id === cid; });
  if (!c) return;
  c.status = newStatus;
  toast(newStatus === 'Đã đóng' && !c.result ? 'Đã đóng lead. Nhớ chọn lý do ở cột Kết quả nhé' : 'Đã cập nhật status cho ' + c.name, newStatus === 'Đã đóng' && !c.result ? 'info' : 'success');
  persistLead(c);
  // re-render đúng tab đang xem (leads) để badge/SLA cập nhật lại
  if (_staffDetailId) document.getElementById('main-content').innerHTML = renderStaffMemberDetail(_staffDetailId, 'leads', _staffDetailSelfView);
}

function updateLeadResultInline(cid, newResult) {
  var c = MOCK.consultations.find(function(x){ return x.id === cid; });
  if (!c) return;
  c.result = newResult === '— Chưa có —' ? '' : newResult;
  toast('Đã cập nhật kết quả cho ' + c.name, 'success');
  persistLead(c);
}

// field: 'nextStep' | 'nextStepDeadline' | 'noteBlock'
function updateLeadNoteInline(cid, field, value) {
  var c = MOCK.consultations.find(function(x){ return x.id === cid; });
  if (!c) return;
  if (field === 'nextStep') c.nextStep = value.trim();
  else if (field === 'nextStepDeadline') c.nextStepDeadline = value;
  else if (field === 'noteBlock') {
    // Ghi đè khối note nhanh vào profile.desire để không phá cấu trúc log gốc
    c.profile = c.profile || {};
    c.profile.followUp = value.trim();
  }
  toast('Đã lưu', 'success');
  persistLead(c);
}

// TRẠNG THÁI = Sale đang ở bước nào với khách (theo thứ tự quy trình).
// Giá trị cũ 'Tạm đóng' / 'Không phù hợp' không còn trong danh sách chọn (lý do nằm ở cột Kết quả),
// nhưng dữ liệu cũ vẫn hiển thị đúng nhờ extraStatusOption() và vẫn tính là đã đóng (SLA_TERMINAL).
const CONSULT_STATUS = ['Chưa liên hệ','Đang liên hệ','Gọi điện','Đã chốt lịch','Không tham gia tư vấn','Đã tư vấn xong','Đang follow-up','Đã đóng'];
// Lead đã có lịch meeting mà status còn ở giai đoạn liên hệ → tự chuyển sang 'Đã chốt lịch'
const STATUS_AUTO_BOOKED_FROM = ['', 'Chưa liên hệ', 'Đang liên hệ', 'Gọi điện'];
function autoBookedStatus_(c) { if (c && c.date && STATUS_AUTO_BOOKED_FROM.indexOf(String(c.status || '')) > -1) c.status = 'Đã chốt lịch'; return c; }
// Trạng thái ngoài danh sách chọn tay (vd 'Đã chuyển đổi thành khách hàng') vẫn phải hiển thị đúng
function extraStatusOption(cur) {
  var v = String(cur || '').trim();
  return (v && CONSULT_STATUS.indexOf(v) === -1) ? '<option value="' + escHtml(v) + '" selected disabled>' + escHtml(v) + '</option>' : '';
}

// 'Đã đóng' = quá Ngày 3 mà khách chưa chốt được lịch (theo SOP mục 3.2)
// 'Tạm đóng' = quá Ngày 3 sau meeting mà khách không phản hồi thanh toán
// KẾT QUẢ = khách đăng ký gì, hoặc vì sao chưa đăng ký.
// Muốn thêm/sửa lựa chọn, chỉ cần sửa 2 mảng dưới đây.
const RESULT_REGISTERED = ['Đăng ký - Cố vấn 1-1','Đăng ký - Khoá học'];
const RESULT_NOT_REGISTERED = ['Giá cao / ngoài ngân sách','Cần thêm thời gian cân nhắc','Chưa phù hợp nhu cầu','Chọn đơn vị khác','Không phản hồi','Từ chối khác'];
const CONSULT_RESULT = [''].concat(RESULT_REGISTERED, RESULT_NOT_REGISTERED);
// Mọi kết quả bắt đầu bằng 'Đăng ký' (kể cả giá trị cũ 'Đăng ký') đều là đã đăng ký
function isRegisteredResult(r) { return String(r == null ? '' : r).trim().indexOf('Đăng ký') === 0; }
// Dropdown Kết quả có nhóm; giá trị cũ (vd 'Cân nhắc thêm', 'Từ chối') vẫn hiện đúng, chỉ không chọn lại được
function resultOptionsHtml(cur) {
  cur = String(cur == null ? '' : cur).trim();
  var known = CONSULT_RESULT.indexOf(cur) > -1;
  function opt(v) { return '<option value="' + escHtml(v) + '"' + (v === cur ? ' selected' : '') + '>' + escHtml(v) + '</option>'; }
  return '<option value=""' + (cur === '' ? ' selected' : '') + '>— Chưa có —</option>' +
    '<optgroup label="Đã đăng ký">' + RESULT_REGISTERED.map(opt).join('') + '</optgroup>' +
    '<optgroup label="Chưa đăng ký (lý do)">' + RESULT_NOT_REGISTERED.map(opt).join('') + '</optgroup>' +
    (cur && !known ? '<optgroup label="Giá trị cũ"><option value="' + escHtml(cur) + '" selected disabled>' + escHtml(cur) + '</option></optgroup>' : '');
}

// Tư vấn dịch vụ — đúng field "quan tâm dịch vụ" khách chọn ở widget đăng ký tư vấn,
// staff có thể sửa lại trong lúc tư vấn nếu nhu cầu khách thay đổi.
const CONSULT_ABOUT_OPTIONS = ['Cố vấn 1-1','Khoá học','Cả 2'];

// dữ liệu vẫn còn nguyên trong Sheet ("Excel"), chỉ ẩn ở giao diện.
var HIDDEN_ON_DASHBOARD_STATUS = ['Đã đóng','Tạm đóng'];
function isHiddenOnDashboard(c){
  return HIDDEN_ON_DASHBOARD_STATUS.indexOf(c.status) > -1;

function navToConsultationDetail(cid) {
  document.getElementById('main-content').innerHTML = renderConsultationDetail(cid);
  var c = MOCK.consultations.find(function(x){ return x.id === cid; });
  if (!c || !c.id) return;
  apiGet('getLeadLogs', { lead_id: c.id }).then(function(res){
    var rows = (res && res.data) ? res.data : [];

    c.log = rows.map(function(r){ return { time: r.time_label, text: r.text, user: r.user || '' }; });

// Đổi lịch tư vấn từ trang chi tiết khách: ghi lý do, cập nhật Sheet/Calendar và gửi email cho khách
function openConsultReschedule(cid) {
  var c = MOCK.consultations.find(function(x){ return x.id === cid; });
  if (!c) return;
  showRescheduleModal_({ sessionId: c.sessionId || '', leadId: c.id, who: c.name || '', kind: 'Tư vấn miễn phí', date: c.date || '', time: c.time || '' }, function(){
    apiGet('getLeads', {}).then(function(res){
      var row = ((res && res.data) || []).filter(function(r){ return r.lead_id === cid; })[0];
      if (row) mergeLeadRow(row);
      navToConsultationDetail(cid);
    }).catch(function(){ navToConsultationDetail(cid); });
  });
}

function generateMeetForConsult(cid) {
  var c = MOCK.consultations.find(function(x){ return x.id === cid; });
  if (!c) return;
  var d = document.getElementById('cv-date').value;
  var t = document.getElementById('cv-time').value;
  if (!d || !t) { toast('Chọn ngày và giờ trước khi tạo Meet', 'error'); return; }

  var btn = document.getElementById('cv-genmeet-btn');
  var linkInput = document.getElementById('cv-meetlink');
  var oldLabel = btn.textContent;
  btn.textContent = '⏳ Đang tạo...';
  btn.disabled = true;

  var staffObj = sheetData.staffList.find(function(x){ return x.name === c.staff; });
  var staffEmail = staffObj ? staffObj.email : '';

  apiPost({
    action: 'createMeetLink',
    date: d, time: t, duration_minutes: 20,
    title: 'Tư vấn LinkaJob — ' + c.name,
    guest_name: c.name,
    guests: [c.email, staffEmail].filter(Boolean),
  }).then(function(res){
    btn.disabled = false;
    if (res && res.success && res.meetLink) {
      linkInput.value = res.meetLink;
      btn.textContent = '✓ Đã tạo';

function renderStaffScheduleTab(s) {

  window._staffCalStaffName = s.name;

function renderStaffCalendarMonth(staffName) {
  var byDate = window._staffCalByDate || {};
  var base = new Date(); base.setDate(1); base.setMonth(base.getMonth() + staffCalMonthOffset);
  var year = base.getFullYear(), month = base.getMonth();
  var firstOfMonth = new Date(year, month, 1);
  var startDay = firstOfMonth.getDay();
  var gridStart = new Date(firstOfMonth);
  gridStart.setDate(gridStart.getDate() - (startDay === 0 ? 6 : startDay - 1));

  var monthLabel = ['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'][month] + ' ' + year;
  var today = new Date();

  var html = '<div class="card"><div class="cal-nav"><div class="cal-nav-left">' +
    '<button onclick="changeStaffCalMonth(-1)">‹</button><span class="cal-nav-label">' + monthLabel + '</span><button onclick="changeStaffCalMonth(1)">›</button>' +
    '</div><button class="cal-today-btn" onclick="goToStaffCalToday()">Hôm nay</button></div>';

  html += '<div class="cal-grid">';
  DAYS_VI_FULL.forEach(function(d){ html += '<div class="cal-weekday-hdr">' + d + '</div>'; });

  var cursor = new Date(gridStart);
  for (var w = 0; w < 6; w++) {

      var isOther = cursor.getMonth() !== month;
      var isToday = ymd(cursor) === ymd(today);
      var counts = byDate[dateStr] || { available: 0, booked: 0 };
      html += '<div class="cal-cell' + (isOther?' other-month':'') + (isToday?' today':'') + '" onclick="openStaffSlotDayModal(\'' + dateStr + '\')">';
      html += '<div class="cal-daynum">' + cursor.getDate() + '</div><div class="cal-add">+</div>';
      html += '<div class="cal-badges">';

      if (counts.booked > 0) html += '<span class="cal-badge meeting">' + counts.booked + ' đã đặt</span>';
      html += '</div></div>';
      cursor.setDate(cursor.getDate() + 1);

// ── Tab: KPI cá nhân (theo mục 5.1 SOP) ──
// Doanh thu quy đổi cho 1 Sale, dựa trên các consultation đã "Đăng ký ..."
// (paid lấy từ hồ sơ Advisee tương ứng theo tên).
function getStaffRevenueStats(staffName) {
  var mine = MOCK.consultations.filter(function(c){ return c.staff === staffName; });
  var now = new Date();
  var weekAgo = new Date(now); weekAgo.setDate(now.getDate() - 7);
  var monthAgo = new Date(now); monthAgo.setDate(now.getDate() - 30);

  var occurred = mine.filter(function(c){ return c.date && new Date(c.date + 'T' + (c.time||'00:00')) <= now; });
  var converted = occurred.filter(function(c){ return c.result && c.result.indexOf('Đăng ký') === 0; });

  var weekRevenue = 0, monthRevenue = 0;
  converted.forEach(function(c){
    var ae = MOCK.advisees.find(function(x){ return x.name === c.name; });
    var paid = ae ? ae.paid : 0;
    var d = new Date(c.date + 'T' + (c.time||'00:00'));
    if (d >= weekAgo) weekRevenue += paid;
    if (d >= monthAgo) monthRevenue += paid;
  });

  var conversionRate = occurred.length ? Math.round(converted.length / occurred.length * 100) : 0;

  return {
    weekRevenue: weekRevenue, monthRevenue: monthRevenue,
    occurredCount: occurred.length, convertedCount: converted.length,
    conversionRate: conversionRate,
  };
}

  html += '</div></div>';

  html += '</div>';

  // ── Bảng thưởng theo doanh thu tháng — dạng "qua màn" ──
  var tiers = [
    { threshold: 30000000, bonus: 1000000,  label: 'Cấp 1', icon: '🥉' },
    { threshold: 45000000, bonus: 3000000,  label: 'Cấp 2', icon: '🥈' },
    { threshold: 60000000, bonus: 5000000,  label: 'Cấp 3', icon: '🥇' },
    { threshold: Infinity, bonus: null,     label: 'Cấp 4', icon: '👑', percentBonus: 0.10 },
  ];
  var monthRevenue = stats.monthRevenue;
  var maxFiniteTier = 60000000;
  var progressCap = Math.max(monthRevenue, 1);
  var overallPct = Math.min(100, Math.round(monthRevenue / maxFiniteTier * 100));

    var bonusLabel = tier.percentBonus ? '10% doanh thu' : fmtMoney(tier.bonus);

    html += '<div style="display:flex;flex-direction:column;align-items:center;gap:8px;width:23%;text-align:center">';
    html += '<div style="width:56px;height:56px;border-radius:50%;background:' + circleColor + ';color:' + circleTextColor + ';display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:' + (isCurrentTarget?'0 0 0 4px var(--brand-light)':'none') + ';transition:all .3s">' + (achieved ? '✓' : tier.icon) + '</div>';
    html += '<div style="font-size:12px;font-weight:800;color:' + (achieved?'var(--brand)':'var(--muted)') + '">' + tier.label + '</div>';
    html += '<div style="font-size:11px;color:var(--muted)">' + thresholdLabel + '</div>';

  html += '</div></div>';

  // Thưởng thực nhận tháng này
  var earnedBonus = 0, earnedLabel = 'Chưa đạt mốc thưởng nào';
  for (var i = tiers.length - 1; i >= 0; i--) {
    if (tiers[i].threshold === Infinity) {
      if (monthRevenue > maxFiniteTier) { earnedBonus = Math.round(monthRevenue * tiers[i].percentBonus); earnedLabel = '10% doanh thu tháng (Cấp 4)'; break; }
    } else if (monthRevenue >= tiers[i].threshold) {

  html += '</div>';

  html += '</div></div>';

  html += '<div class="card"><div style="padding:16px 24px;font-size:12.5px;color:var(--muted);line-height:1.7">💡 Doanh thu tháng được tính từ các buổi tư vấn của bạn có kết quả "Đăng ký..." trong 30 ngày gần nhất. KPI không đạt 2 tháng liên tiếp ở cùng 1 chỉ số → lên kế hoạch đào tạo lại, không mặc định là kỷ luật.</div></div>';

// Dò trùng khách theo email / SĐT / tên (không phân biệt hoa-thường, khoảng trắng) —
// dùng để gộp thông tin khi 1 lead "Đăng ký" trùng với 1 advisee đã có booking thật.
function normContact(v){ return String(v||'').trim().toLowerCase(); }
function findMatchingAdvisee(lead){
  var lEmail = normContact(lead.email), lPhone = normContact(lead.phone), lName = normContact(lead.name);
  return MOCK.advisees.find(function(ae){
    if (lEmail && normContact(ae.email) === lEmail) return true;
    if (lPhone && normContact(ae.phone) === lPhone) return true;
    if (lName && normContact(ae.name) === lName) return true;
    return false;
  });
}

function renderStaffCareTab(s) {
  // Lead đã "Đăng ký" của đúng staff này — tách 2 nhóm: đã khớp advisee thật / chưa có booking
  var registeredLeads = MOCK.consultations.filter(function(c){ return c.staff === s.name && isRegisteredResult(c.result); });
  var pendingBookingLeads = [];
  registeredLeads.forEach(function(lead){
    var match = findMatchingAdvisee(lead);
    if (!match) pendingBookingLeads.push(lead);
    // Nếu match tồn tại, thông tin của lead coi như đã được "chăm sóc" qua đúng hồ sơ advisee đó —
    // không tạo dòng riêng để tránh trùng lặp hiển thị.
  });

  var _myAdv = adviseesOfSale_(s);
  var html = '<div class="card"><div class="card-header"><div class="card-header-left">Khách hàng cần chăm sóc (' + _myAdv.length + ')</div>';
  html += '<span style="font-size:12px;color:var(--muted)">Khách do ' + escHtml(s.name) + ' phụ trách (khách từng tư vấn giữ nguyên Sale; khách mới chia đều)</span></div>';

  if (_myAdv.length === 0) {
    html += '<div class="empty-state"><div class="icon">🙋</div>Chưa có khách hàng nào</div>';
  } else {
    html += '<div style="padding:16px 24px 0">' + searchSortHtml_('care-list', 'Tìm theo tên, email, SĐT, advisor...', 'ae') + '</div>';
    html += '<div id="care-list">';
    sortList_('ae', _myAdv).forEach(function(ae){
      var pct = pctOf(ae.sessionsDone, ae.sessionsTotal);
      var today = new Date(); today.setHours(0,0,0,0);
      var exC = expiryAlert_(ae);
      var expiryTag = exC.badge + (exC.hint ? '<div style="font-size:11.5px;color:' + (exC.red ? '#B91C1C' : 'var(--muted)') + ';margin-top:4px">' + exC.hint + '</div>' : '');

      // ── Notification: lịch meeting vừa đổi giờ ──
      var rescheduleNotices = MOCK.rescheduleRequests.filter(function(r){ return r.aeId === ae.id && r.status === 'confirmed'; });

      // ── Notification: Advisor chậm gửi feedback (nhận xét) sau buổi ──
      var delayNotices = [];
      ae.sessions.forEach(function(sess){
        if (sess.status === 'done' && !sess.advisorNotes && sess.date) {
          var daysSince = Math.floor((today - new Date(sess.date + 'T00:00:00')) / 86400000);
          if (daysSince >= 2) delayNotices.push({ no: sess.no, days: daysSince });
        }
      });

      html += '<div data-search="' + (ae.name + ' ' + ae.email + ' ' + ae.phone + ' ' + ae.advisor).toLowerCase().replace(/"/g,'') + '"' + skAttrs_('ae', ae) + ' style="padding:16px 24px;border-top:1px solid var(--border)">';
      html += '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">';
      html += avatarCircle(ae.name, 40);
      html += '<div style="flex:1;min-width:180px">';
      html += '<div style="font-weight:700;font-size:14px">' + ae.name + '</div>';
      html += '<div style="font-size:12px;color:var(--muted)">' + ae.email + ' · ' + ae.phone + '</div>';
      html += '</div>';
      html += '<div style="min-width:140px">';
      html += '<div style="font-weight:600;font-size:13px">Gói ' + ae.pkg + '</div>';
      html += advisorCellHtml_(ae, 'care');
      html += '</div>';
      html += '<div style="display:flex;align-items:center;gap:8px;min-width:110px"><div style="flex:1;height:6px;background:var(--bg);border-radius:100px;overflow:hidden;min-width:50px"><div style="height:100%;width:' + pct + '%;background:var(--green);border-radius:100px"></div></div><span style="font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap">' + ae.sessionsDone + '/' + ae.sessionsTotal + '</span></div>';
      html += expiryTag;
      html += '<button class="detail-btn" onclick="navToStaffAdviseeDetail(\'' + ae.id + '\',\'staffcare\')" style="flex-shrink:0;margin-left:auto">Chi tiết →</button>';
      html += '</div>';

      if (rescheduleNotices.length || delayNotices.length) {
        html += '<div style="margin-top:10px;display:flex;flex-direction:column;gap:6px;padding-left:54px">';
        rescheduleNotices.forEach(function(r){
          html += '<div style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:#1D4ED8;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:8px;padding:6px 10px;width:fit-content">🔔 Buổi ' + r.sessionNo + ' vừa được đổi giờ — thông báo cho advisor & advisee để xác nhận lại.</div>';
        });
        delayNotices.forEach(function(d){
          html += '<div style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:#92400E;background:#FFFBEB;border:1px solid #FDE68A;border-radius:8px;padding:6px 10px;width:fit-content">⏳ Advisor chậm gửi nhận xét buổi ' + d.no + ' (' + d.days + ' ngày) — nhắc advisor giúp khách.</div>';
        });
        html += '</div>';
      }

      html += '</div>';
    });
    html += '</div>'; // đóng #care-list
  }
  html += '</div>';

  // ── Khách đã "Đăng ký" qua tư vấn/web nhưng CHƯA có booking gói/lịch chính thức ──
  // Chuyển từ mục "đăng ký mới" sang đây theo yêu cầu; khi có booking thật khớp
  // tên/email/SĐT, khách sẽ tự động chỉ còn hiện ở danh sách advisee phía trên (không trùng).
  if (pendingBookingLeads.length > 0) {
    html += '<div class="card" style="margin-top:16px"><div class="card-header"><div class="card-header-left">Khách đã đăng ký — chờ xác nhận gói (' + pendingBookingLeads.length + ')</div>';
    html += '<span style="font-size:12px;color:var(--muted)">Đã chuyển kết quả "Đăng ký" từ tư vấn, chưa ghi nhận booking gói/lịch chính thức</span></div>';
    pendingBookingLeads.forEach(function(lead){
      html += '<div style="padding:14px 24px;border-top:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap">';
      html += avatarCircle(lead.name, 40);
      html += '<div style="flex:1;min-width:180px">';
      html += '<div style="font-weight:700;font-size:14px">' + lead.name + '</div>';
      html += '<div style="font-size:12px;color:var(--muted)">' + (lead.email||'—') + ' · ' + (lead.phone||'—') + '</div>';
      html += '</div>';
      html += '<span style="background:var(--brand-light);color:var(--brand);font-size:12px;font-weight:700;padding:4px 12px;border-radius:100px">' + lead.consultAbout + '</span>';
      html += '<button class="detail-btn" onclick="navToConsultationDetail(\'' + lead.id + '\')" style="flex-shrink:0;margin-left:auto">Chi tiết →</button>';
      html += '</div>';
    });
    html += '</div>';
  }

  return html;
}

function saveNewStaff() {
  const name = document.getElementById('ns-name').value.trim();
  const email = document.getElementById('ns-email').value.trim();
  if (!name || !email) { toast('Vui lòng điền họ tên và email', 'error'); return; }
  const payload = {
    action: 'addStaff', name: name, email: email,
    phone: document.getElementById('ns-phone').value.trim(),
    sub_role: document.getElementById('ns-role').value,
    note: document.getElementById('ns-note').value.trim(),
  };
  const btn = document.querySelector('#modal-actions .login-btn');
  if (btn) { btn.innerHTML = '<span class="spinner"></span>'; btn.disabled = true; }
  apiPost(payload).then(function(res){
    if (res && res.success) {
      toast('Đã thêm ' + name + ' — mật khẩu tạm đã gửi qua email ✅', 'success');
      closeModal();
      loadStaffListFromSheet(function(){ navTo('stf-list'); }, true);
    } else {
      toast('Lỗi: ' + (res && res.error ? res.error : 'không thêm được'), 'error');
      if (btn) { btn.innerHTML = 'Thêm nhân viên'; btn.disabled = false; }
    }
  }).catch(function(err){
    toast('Lỗi kết nối: ' + err.message, 'error');
    if (btn) { btn.innerHTML = 'Thêm nhân viên'; btn.disabled = false; }
  });
}

let selectedSaleSlots = new Set();

// State cho calendar "Gửi lịch trống" của Staff (tách riêng khỏi calMonthOffset
// đang dùng chung cho Advisor / Meeting calendar để tránh đụng nhau)
var staffCalMonthOffset = 0;
  
// Tải lịch trống THẬT từ Sheet cho TẤT CẢ Sale đang active, dùng cho trang tổng quan của Admin.
// Chỉ cần 1 lần gọi vào pool chung STAFF_SLOT_IDENTITY, sau đó tách theo created_by cho từng người.
function loadStaffSchedulePageAsync() {
  var mc = document.getElementById('main-content');
  mc.innerHTML = skeletonRows(3);
  var saleStaff = sheetData.staffList.filter(function(s){ return isSaleLike_(s) && s.active; });
  var saleNames = saleStaff.map(function(s){ return s.name; });

  Promise.all([
    apiGet('getSlots', { advisor: STAFF_SLOT_IDENTITY }).catch(function(){ return null; }),
    apiGet('getSessions', { advisor: 'LinkaJob Team' }).catch(function(){ return null; })
  ]).then(function(results){
    var slotRes = results[0], sessRes = results[1];

    var allSlots = (slotRes && slotRes.data) ? slotRes.data : [];
    MOCK.saleSlots = MOCK.saleSlots.filter(function(sl){ return saleNames.indexOf(sl.staff) === -1; });
    allSlots.forEach(function(rs){
      var owner = rs.created_by || '';
      if (saleNames.indexOf(owner) === -1) return;
      MOCK.saleSlots.push({
        staff: owner,
        date: String(rs.date || '').slice(0, 10),
        time: rs.time_start,
        status: rs.status === 'booked' ? 'booked' : 'available',
        client: rs.status === 'booked' ? (rs.booking_id || 'Đã đặt') : '',
        note: 'Tư vấn miễn phí',
        slot_id: rs.slot_id,
      });
    });

    var sessions = (sessRes && sessRes.data) ? sessRes.data : [];
    sessions.sort(function(a,b){
      return extractSessionTimestamp(b.session_id) > extractSessionTimestamp(a.session_id) ? 1 : -1;
    });
    window._newRegSessions = sessions;

    mc.innerHTML = renderStaffSchedulePage();
  }).catch(function(err){
    toast('Không tải được dữ liệu: ' + err.message, 'error');
    mc.innerHTML = renderStaffSchedulePage();
  });
}

  // Chọn nhân viên Sale
  html += '<div class="card"><div class="card-header"><div class="card-header-left">Chọn Sale để xem / thêm lịch</div></div>';

  saleStaff.forEach(function(s){
    const myCount = MOCK.saleSlots.filter(function(sl){ return sl.staff === s.name && sl.status === 'available'; }).length;
    html += '<div style="border:2px solid var(--border);border-radius:12px;padding:14px 18px;cursor:pointer;min-width:160px;transition:all .15s" ' +
      'onmouseover="this.style.borderColor=\'var(--brand)\'" onmouseout="this.style.borderColor=\'var(--border)\'">' +

      '<div style="font-size:12px;color:var(--muted)">' + myCount + ' slot trống</div>' +
      '<button class="update-btn" style="margin-top:10px;width:100%" onclick="openSaleScheduleModal(\'' + s.name + '\')">📅 Thêm lịch trống</button>' +
      '</div>';
  });
  html += '</div></div>';

  // Bảng tất cả lịch tư vấn
  html += '<div class="card"><div class="card-header"><div class="card-header-left">Tất cả lịch tư vấn</div></div>';
  if (MOCK.saleSlots.length === 0) {
    html += '<div class="empty-state"><div class="icon">📭</div>Chưa có lịch nào</div>';
  } else {
    html += '<table class="bookings-table"><thead><tr><th>SALE</th><th>NGÀY</th><th>GIỜ</th><th>KHÁCH HÀNG</th><th>GHI CHÚ</th><th>TRẠNG THÁI</th><th></th></tr></thead><tbody>';
    MOCK.saleSlots.forEach(function(sl, i){
      html += '<tr>';
      html += '<td><b>' + sl.staff + '</b></td>';
      html += '<td>' + fmtDateStr(sl.date) + '</td>';
      html += '<td>' + sl.time + '</td>';
      html += '<td>' + (sl.client || '<span style="color:var(--muted)">—</span>') + '</td>';
      html += '<td style="font-size:12px;color:var(--muted)">' + sl.note + '</td>';
      html += '<td>' + (sl.status === 'booked'
        ? '<span class="badge badge-pending">Đã đặt</span>'
        : '<span class="badge badge-confirmed">Trống</span>') + '</td>';
      html += '<td>' + (sl.status === 'available'
        ? '<button class="update-btn" onclick="deleteSaleSlot(' + i + ')">Xoá</button>'
        : '<button class="update-btn" onclick="openSaleBookingDetail(' + i + ')">Chi tiết</button>') + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table>';
  }
  html += '</div>';
  return html;
}

var _saleModalStaffName = null;
var _saleModalDayIdx = 0;
var _saleModalDays = [];

function openSaleScheduleModal(staffName) {
  selectedSaleSlots.clear();
  _saleModalStaffName = staffName;
  _saleModalDayIdx = 0;

  const base = new Date();
  _saleModalDays = [];
  for (let i=0;i<7;i++) { const d = new Date(base); d.setDate(base.getDate()+i); _saleModalDays.push(d); }

  document.getElementById('modal-title').textContent = '📅 Thêm lịch trống — ' + staffName;
  renderSaleScheduleModalBody();

  var modalBox = document.querySelector('.modal');
  if (modalBox) modalBox.style.maxWidth = '560px';
  document.getElementById('modal-overlay').classList.add('open');
}

function renderSaleScheduleModalBody() {
  const staffName = _saleModalStaffName;
  const existingKeys = {};
  MOCK.saleSlots.forEach(function(sl){
    if (sl.staff === staffName) existingKeys[sl.date + '_' + sl.time] = sl.status;
  });

  // Đếm số slot đã chọn/đã có mỗi ngày để hiện chấm trên tab ngày
  function countForDay(d) {
    const dateStr = ymd(d);
    let n = 0;
    ['09:00','10:00','11:00','14:00','15:00','16:00','17:00','19:00','20:00'].forEach(function(t){
      const key = dateStr + '_' + t;
      if (selectedSaleSlots.has(key) || existingKeys[key] === 'available') n++;
    });
    return n;
  }

  let html = '<div style="font-size:13px;color:var(--muted);margin-bottom:14px">Chọn ngày rồi bấm giờ trống cho <b>' + staffName + '</b>. Mỗi buổi 20 phút tư vấn miễn phí.</div>';

  // Thanh chọn ngày
  html += '<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;border-bottom:1.5px solid var(--border)">';
  _saleModalDays.forEach(function(d, i){
    const dow = DAYS_VI[d.getDay()];
    const active = i === _saleModalDayIdx;
    const cnt = countForDay(d);
    html += '<button onclick="switchSaleModalDay(' + i + ')" style="flex-shrink:0;min-width:56px;padding:8px 6px;border-radius:10px;border:1.5px solid ' + (active?'var(--brand)':'var(--border)') + ';background:' + (active?'var(--brand)':'var(--white)') + ';color:' + (active?'#fff':'var(--text)') + ';cursor:pointer;text-align:center;font-family:inherit">';
    html += '<div style="font-size:11px;font-weight:600">' + dow + '</div><div style="font-size:13px;font-weight:700">' + d.getDate() + '/' + (d.getMonth()+1) + '</div>';
    if (cnt > 0) html += '<div style="font-size:9px;margin-top:2px;' + (active?'color:#fff':'color:var(--brand)') + '">' + cnt + ' slot</div>';
    html += '</button>';
  });
  html += '</div>';

  // Giờ trong ngày đang chọn
  const curDay = _saleModalDays[_saleModalDayIdx];
  const dateStr = ymd(curDay);
  const dow = DAYS_VI[curDay.getDay()];
  html += '<div style="font-size:13px;font-weight:700;margin-bottom:10px">' + dow + ' ' + curDay.getDate() + '/' + (curDay.getMonth()+1) + ' — chọn giờ trống</div>';
  html += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px" id="sale-slot-grid">';
  ['09:00','10:00','11:00','14:00','15:00','16:00','17:00','19:00','20:00'].forEach(function(t){
    const key = dateStr + '_' + t;
    const exist = existingKeys[key];
    let cls = 'day-time-chip';
    let disabled = '';
    let label = '<b>' + t + '</b>';
    if (exist === 'booked') { cls += ' booked'; disabled = 'disabled'; label += '<br><span style="font-size:9px">Đã đặt</span>'; }
    else if (selectedSaleSlots.has(key) || exist === 'available') { cls += ' selected'; label += '<br><span style="font-size:9px">' + (exist==='available'?'Đã có':'Mới chọn') + '</span>'; }
    html += '<button class="' + cls + '" data-key="' + key + '" ' + disabled + ' onclick="toggleSaleSlot(this,\'' + key + '\')" style="padding:12px 4px;font-size:13px;line-height:1.4">' + label + '</button>';
  });
  html += '</div>';

  html += '<div style="font-size:12px;color:var(--muted);margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">Tổng đã chọn (tất cả các ngày): <span id="sale-sel-count" style="color:var(--brand);font-weight:700">' + selectedSaleSlots.size + '</span> slot</div>';

  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal-body').style.maxHeight = '65vh';
  document.getElementById('modal-body').style.overflowY = 'auto';
  document.getElementById('modal-actions').innerHTML =
    '<button class="btn-secondary" onclick="closeModal()" style="width:auto;padding:10px 20px">Huỷ</button>' +
    '<button class="login-btn" id="sale-send-btn" onclick="saveSaleSlots(\'' + staffName + '\')" style="width:auto;padding:10px 24px">Lưu lịch trống (' + selectedSaleSlots.size + ')</button>';
}

function switchSaleModalDay(idx) {
  _saleModalDayIdx = idx;
  renderSaleScheduleModalBody();
}

function toggleSaleSlot(btn, key) {
  if (btn.classList.contains('booked')) return;
  if (selectedSaleSlots.has(key)) selectedSaleSlots.delete(key);
  else selectedSaleSlots.add(key);
  renderSaleScheduleModalBody();
}

function saveSaleSlots(staffName) {
  if (selectedSaleSlots.size === 0) { toast('Chưa chọn giờ nào!', 'error'); return; }
  var st = sheetData.staffList.find(function(x){ return x.name === staffName; });
  var btn = document.getElementById('sale-send-btn');
  if (btn) { btn.innerHTML = '<span class="spinner"></span> Đang lưu...'; btn.disabled = true; }

  var slotsToAdd = Array.from(selectedSaleSlots); // ["2026-07-20_09:00", ...]

  apiPost({
    action: 'addSlots',
    advisor: STAFF_SLOT_IDENTITY,
    advisor_email: st ? st.email : '',
    created_by: staffName,
    slots: slotsToAdd,
  }).then(function(res){
    if (res && res.success) {
      // ── Optimistic update: hiện ngay trên UI, không đợi fetch lại Sheet ──
      slotsToAdd.forEach(function(key){
        var parts = key.split('_');
        var d = parts[0], t = parts[1];
        var already = MOCK.saleSlots.some(function(sl){ return sl.staff === staffName && sl.date === d && sl.time === t; });
        if (!already) {
          MOCK.saleSlots.push({ staff: staffName, date: d, time: t, status: 'available', client: '', note: 'Tư vấn miễn phí', slot_id: null });
        }
      });

      toast('Đã lưu ' + slotsToAdd.length + ' slot cho ' + staffName + ' ✅', 'success');
      selectedSaleSlots.clear();
      closeModal();
      if (_staffDetailId) document.getElementById('main-content').innerHTML = renderStaffMemberDetail(_staffDetailId, 'schedule', _staffDetailSelfView);
      else navTo('stf-schedule');

      // Đồng bộ nền với Sheet (không xoá dữ liệu local nếu Sheet thiếu cột created_by)
      if (_staffDetailId) loadStaffScheduleTabAsync();
    } else {
      toast('Lỗi: ' + (res && res.error ? res.error : 'không lưu được lên Sheet'), 'error');
      if (btn) { btn.innerHTML = 'Lưu lịch trống đã chọn'; btn.disabled = false; }
    }
  }).catch(function(err){
    toast('Lỗi kết nối: ' + err.message, 'error');
    if (btn) { btn.innerHTML = 'Lưu lịch trống đã chọn'; btn.disabled = false; }
  });
}

function deleteSaleSlot(i) {

var _reportPeriod = (function(){ var t = new Date(); return { year: t.getFullYear(), month: t.getMonth(), mode: 'month' }; })();
var _reportLeadsCache = null;
var _reportBookingsCache = null;

var REPORT_COLORS = ['#fc5229','#6D28D9','#0EA5E9','#10B981','#F59E0B','#EC4899','#64748B','#84CC16'];

function loadMarketingReportPageAsync() {

    _reportBookingsCache = (results[1] && results[1].data) ? results[1].data : [];
    _reportRerender = function(){ document.getElementById('main-content').innerHTML = renderMarketingReportPage(); };
    mc.innerHTML = renderMarketingReportPage();
  }).catch(function(err){
    mc.innerHTML = '<div class="card"><div class="empty-state"><div class="icon">⚠</div>Không tải được báo cáo.<br><small style="color:var(--muted)">' + err.message + '</small></div></div>';
  });
}

function reportChangePeriod(delta) {
  if (_reportPeriod.mode === 'month') {
    _reportPeriod.month += delta;
    if (_reportPeriod.month < 0) { _reportPeriod.month = 11; _reportPeriod.year--; }
    if (_reportPeriod.month > 11) { _reportPeriod.month = 0; _reportPeriod.year++; }
  } else {
    var q = Math.floor(_reportPeriod.month / 3) + delta;
    if (q < 0) { q = 3; _reportPeriod.year--; }
    if (q > 3) { q = 0; _reportPeriod.year++; }
    _reportPeriod.month = q * 3;
  }
  reportRerender();
}

function reportSetMode(mode) {
  _reportPeriod.mode = mode;
  reportRerender();
}

function reportPeriodRange() {
  var y = _reportPeriod.year, m = _reportPeriod.month;
  if (_reportPeriod.mode === 'month') {
    var start = new Date(y, m, 1);
    var end = new Date(y, m + 1, 1);
    return { start: start, end: end, label: 'Tháng ' + (m+1) + '/' + y };
  } else {
    var qStart = Math.floor(m / 3) * 3;
    var start2 = new Date(y, qStart, 1);
    var end2 = new Date(y, qStart + 3, 1);
    return { start: start2, end: end2, label: 'Quý ' + (Math.floor(qStart/3)+1) + '/' + y };
  }
}

function reportPrevPeriodRange() {
  var cur = reportPeriodRange();
  var lenMs = cur.end.getTime() - cur.start.getTime();
  return { start: new Date(cur.start.getTime() - lenMs), end: cur.start };
}

function parseSheetDate(v) {
  if (!v) return null;
  var s = String(v).slice(0, 10);
  var d = new Date(s + 'T00:00:00');
  return isNaN(d.getTime()) ? null : d;
}

function reportAggregate(leads, bookings, range) {
  var agg = {
    totalLeads: 0, converted: 0,
    byChannel: {}, byRegion: {}, byCustomerType: {}, byDept: {}, byLevel: {},
    byDay: {}, revenue: 0,
  };
  leads.forEach(function(r){
    var d = parseSheetDate(r.created_at);
    if (!d || d < range.start || d >= range.end) return;
    agg.totalLeads++;
    if (isRegisteredResult(r.result) || String(r.status||'').trim() === LEAD_CONVERTED_STATUS) agg.converted++;
    var ch = r.source_channel || r.source || 'Không rõ';
    agg.byChannel[ch] = (agg.byChannel[ch]||0) + 1;
    var rg = r.region || 'Không rõ';
    agg.byRegion[rg] = (agg.byRegion[rg]||0) + 1;
    var ct = r.customer_type || 'Không rõ';
    agg.byCustomerType[ct] = (agg.byCustomerType[ct]||0) + 1;
    var dp = deptPrimary_(r.interested_dept);
    agg.byDept[dp] = (agg.byDept[dp]||0) + 1;
    var lv = r.interested_level || 'Không rõ';
    agg.byLevel[lv] = (agg.byLevel[lv]||0) + 1;
    var dayKey = String(r.created_at).slice(0,10);
    agg.byDay[dayKey] = (agg.byDay[dayKey]||0) + 1;
  });
  bookings.forEach(function(b){
    var d = parseSheetDate(b.created_at);
    if (!d || d < range.start || d >= range.end) return;
    var st = String(b.status||'').toLowerCase();
    if (st !== 'confirmed' && st !== 'completed') return; // chỉ tính booking đã xác nhận/hoàn tất, giống trang Doanh thu
    agg.revenue += Number(b.package_price) || 0;
  });
  return agg;
}

function svgBarList(dataObj, opts) {
  opts = opts || {};
  var color = opts.color || 'var(--brand)';
  var entries = Object.keys(dataObj).map(function(k){ return { label: k, value: dataObj[k] }; })
    .sort(function(a,b){ return b.value - a.value; });
  var total = entries.reduce(function(s,e){ return s + e.value; }, 0) || 1;
  var max = Math.max.apply(null, entries.map(function(e){ return e.value; })) || 1;
  if (entries.length === 0) return '<div style="padding:16px 0;color:var(--muted);font-size:13px">Chưa có dữ liệu.</div>';
  var html2 = '<div style="display:flex;flex-direction:column;gap:12px">';
  entries.forEach(function(e, i){
    var pct = Math.round(e.value / max * 100);
    var sharePct = Math.round(e.value / total * 100);
    var c = Array.isArray(color) ? color[i % color.length] : color;
    html2 += '<div><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span>' + e.label + '</span><span style="color:var(--muted)">' + e.value + ' (' + sharePct + '%)</span></div>';
    html2 += '<div style="height:8px;background:var(--bg);border-radius:100px;overflow:hidden"><div style="height:100%;width:' + pct + '%;background:' + c + ';border-radius:100px"></div></div></div>';
  });
  html2 += '</div>';
  return html2;
}

function svgDonut(dataObj, size) {
  size = size || 180;
  var entries = Object.keys(dataObj).map(function(k){ return { label: k, value: dataObj[k] }; })
    .sort(function(a,b){ return b.value - a.value; });
  var total = entries.reduce(function(s,e){ return s + e.value; }, 0);
  if (total === 0) return '<div style="padding:16px 0;color:var(--muted);font-size:13px">Chưa có dữ liệu.</div>';
  var r = size/2 - 14, cx = size/2, cy = size/2, circ = 2*Math.PI*r;
  var offset = 0;
  var svg = '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">';
  entries.forEach(function(e, i){
    var frac = e.value / total;
    var len = frac * circ;
    var color = REPORT_COLORS[i % REPORT_COLORS.length];
    svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="22" ' +
      'stroke-dasharray="' + len + ' ' + (circ-len) + '" stroke-dashoffset="' + (-offset) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')"/>';
    offset += len;
  });
  svg += '<text x="' + cx + '" y="' + cy + '" text-anchor="middle" dominant-baseline="middle" font-size="22" font-weight="700" fill="var(--text)">' + total + '</text>';
  svg += '</svg>';
  var legend = '<div style="display:flex;flex-direction:column;gap:8px;justify-content:center">';
  entries.forEach(function(e, i){
    var color = REPORT_COLORS[i % REPORT_COLORS.length];
    var pct = Math.round(e.value/total*100);
    legend += '<div style="display:flex;align-items:center;gap:8px;font-size:12.5px"><span style="width:10px;height:10px;border-radius:3px;background:' + color + ';flex-shrink:0"></span>' + e.label + ' <span style="color:var(--muted)">— ' + e.value + ' (' + pct + '%)</span></div>';
  });
  legend += '</div>';
  return '<div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap">' + svg + legend + '</div>';
}

function reportTopEntry(dataObj) {
  var keys = Object.keys(dataObj);
  if (!keys.length) return null;
  keys.sort(function(a,b){ return dataObj[b] - dataObj[a]; });
  return { label: keys[0], value: dataObj[keys[0]] };
}

// Gợi ý hành động — RULE-BASED dựa trên số liệu thật (chưa dùng AI thật, có thể
// nối vào 1 API AI sau này để thay thế/nâng cấp phần này khi có API key).
function generateReportInsights(agg, prevAgg) {
  var tips = [];
  var topChannel = reportTopEntry(agg.byChannel);
  if (topChannel) {
    var channelShare = Math.round(topChannel.value / agg.totalLeads * 100);
    tips.push('Kênh <b>' + topChannel.label + '</b> đang mang về nhiều lead nhất (' + channelShare + '% tổng lead) — nên ưu tiên phân bổ thêm ngân sách marketing vào kênh này trong tháng tới.');
  }
  var topDept = reportTopEntry(agg.byDept);
  if (topDept && topDept.label !== 'Không rõ') {
    tips.push('Phòng ban/vị trí được quan tâm nhiều nhất: <b>' + topDept.label + '</b> (' + topDept.value + ' lượt) — cân nhắc ưu tiên tuyển thêm Advisor mảng này, hoặc mở khoá học/nội dung chuyên sâu đúng chủ đề.');
  }
  var convRate = agg.totalLeads > 0 ? Math.round(agg.converted / agg.totalLeads * 100) : 0;
  if (agg.totalLeads > 0) {
    tips.push('Tỷ lệ chốt (lead → đăng ký) tháng này: <b>' + convRate + '%</b>' + (convRate < 15 ? ' — khá thấp, nên rà lại chất lượng tư vấn hoặc kịch bản chăm sóc của Sale.' : '.'));
  }
  if (prevAgg && prevAgg.totalLeads > 0) {
    var deltaPct = Math.round((agg.totalLeads - prevAgg.totalLeads) / prevAgg.totalLeads * 100);
    if (deltaPct <= -15) tips.push('Số lead giảm <b>' + Math.abs(deltaPct) + '%</b> so với kỳ trước — nên kiểm tra lại hiệu quả các kênh quảng cáo/nội dung đang chạy.');
    else if (deltaPct >= 15) tips.push('Số lead tăng <b>' + deltaPct + '%</b> so với kỳ trước — nên đảm bảo đủ Sale/Advisor để không bị nghẽn ở khâu tư vấn/xếp lịch.');
  }
  var topRegion = reportTopEntry(agg.byRegion);
  if (topRegion && topRegion.label !== 'Không rõ') {
    tips.push('Khách hàng tập trung nhiều nhất ở <b>' + topRegion.label + '</b> — có thể cân nhắc chiến dịch/ưu đãi theo khu vực này để tối ưu chi phí marketing.');
  }
  if (tips.length === 0) tips.push('Chưa đủ dữ liệu trong kỳ này để đưa ra gợi ý — hãy đảm bảo Sale điền đầy đủ "Hồ sơ khách hàng" khi chăm sóc lead.');
  return tips;
}

function reportDeltaLabel(cur, prev) {
  if (!prev) return 'Chưa có dữ liệu kỳ trước để so sánh';
  var delta = Math.round((cur - prev) / prev * 100);
  if (delta === 0) return 'Không đổi so với kỳ trước';
  return (delta > 0 ? '▲ +' : '▼ ') + delta + '% so với kỳ trước';
}

  var convRate = agg.totalLeads > 0 ? Math.round(agg.converted / agg.totalLeads * 100) : 0;

  var html = pageHeader('Báo cáo Marketing', 'Khách hàng theo tháng hoặc quý, phục vụ quyết định marketing và mở rộng đội ngũ');

  html += '<div class="stat-cell"><div class="stat-num">' + agg.converted + '</div><div class="stat-label">Đã đăng ký</div><div class="stat-detail">Tỷ lệ chốt ' + convRate + '%</div></div>';

  });

  html += '</div>';

  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px">';
  html += '<div class="card"><div class="card-header"><div class="card-header-left">Sinh viên vs Đã đi làm</div></div><div style="padding:20px 24px">' + svgDonut(agg.byCustomerType) + '</div></div>';
  html += '<div class="card"><div class="card-header"><div class="card-header-left">Biết đến LinkaJob qua đâu</div></div><div style="padding:20px 24px">' + svgDonut(agg.byChannel) + '</div></div>';
  html += '</div>';

  html += '<div class="card" style="margin-bottom:20px"><div class="card-header"><div class="card-header-left">Phòng ban / vị trí quan tâm</div></div><div style="padding:16px 24px 24px">' + svgBarList(agg.byDept, {color: REPORT_COLORS}) + '</div></div>';
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px">';
  html += '<div class="card"><div class="card-header"><div class="card-header-left">Khu vực</div></div><div style="padding:16px 24px 24px">' + svgBarList(agg.byRegion, {color:'#0EA5E9'}) + '</div></div>';
  html += '<div class="card"><div class="card-header"><div class="card-header-left">Level quan tâm</div></div><div style="padding:16px 24px 24px">' + svgBarList(agg.byLevel, {color:'#6D28D9'}) + '</div></div>';
  html += '</div>';

  html += '</div>';

  return html;
}
