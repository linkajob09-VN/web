// Gom buổi meeting sắp tới (tư vấn của lead + cố vấn 1:1) trong khoảng [fromYmd, toYmd]
function saleMeetings_(d, fromYmd, toYmd) {
  var list = [];
  d.sessions.forEach(function(x){
    var date = String(x.scheduled_date || '').slice(0, 10);
    if (!date || date < fromYmd || date > toYmd) return;
    var st = String(x.status || '').toLowerCase();
    if (st === 'completed' || st === 'cancelled' || st === 'canceled') return;
    if (x.session_type === 'consult' || x.session_type === 'course' || x.advisor_name === STAFF_SLOT_IDENTITY) return;   // tư vấn lấy từ lead
    list.push({ kind: 'Cố vấn 1:1', date: date, time: fmtHHMM(x.scheduled_time), who: x.advisee_name || '', host: x.advisor_name || '',
                link: x.meet_link || '', sessionId: x.session_id, leadId: '',
                prepReq: String(x.prep_required || '').toLowerCase() === 'yes', hasPrep: !!String(x.prep_question || '').trim() });
  });
  d.leads.forEach(function(c){
    if (!c.date || c.date < fromYmd || c.date > toYmd) return;
    if (SLA_TERMINAL.indexOf(c.status) > -1) return;
    list.push({ kind: 'Tư vấn miễn phí', date: c.date, time: c.time || '', who: c.name || '', host: c.staff || 'LinkaJob',
                link: c.meetLink || '', sessionId: c.sessionId || '', leadId: c.id });
  });
  list.sort(function(a, b){ return (a.date + ' ' + a.time).localeCompare(b.date + ' ' + b.time); });
  return list;
}

function renderSaleToday(s) {
  if (!_saleData || _saleData.loadedFor !== s.id) return skeletonRows(4);

  var today = ymd(new Date());
  var meetings = saleMeetings_(d, today, addDaysYmd_(1));
  d.meetList = meetings;
  var todayCount = meetings.filter(function(m){ return m.date === today; }).length;
  var open = d.leads.filter(function(c){ return !leadIsClosed(c); });
  var needAct = open.filter(function(c){ return leadIsOverdue(c) || !c.date || c.status === 'Chưa liên hệ'; }).sort(function(a, b){
    return ((leadIsOverdue(b) ? 1 : 0) - (leadIsOverdue(a) ? 1 : 0)) || (leadAgeDays(b) - leadAgeDays(a));
  });
  var remind = adviseesOfSale_(s).filter(function(ae){ return expiryAlert_(ae).red; }).sort(expiryCompare_);
  var pend = pendingReschedules(d.reqs);

  var html = '<div style="font-size:13px;color:var(--muted);margin-bottom:12px">' + escHtml(todayLabelVN()) + ' · việc cần làm hôm nay</div>';
  if (d.failed.length) html += '<div class="today-warn">Không tải được: ' + escHtml(d.failed.join(', ')) + '. Số liệu có thể chưa đầy đủ.</div>';

<script>
(function(){
var LV = {red:'red',amber:'amber',green:'green',blue:'blue'};
function nextWord(){ return _reportPeriod.mode === 'quarter' ? 'quý tới' : 'tháng tới'; }
function pctDelta(c, p){ return p ? Math.round((c - p) / p * 100) : null; }
function rpDelta(c, p, goodUp){
  var d = pctDelta(c, p);
  if (d === null) return '<span class="rp-d-n">Chưa có kỳ trước để so</span>';
  if (d === 0) return '<span class="rp-d-n">Không đổi so với kỳ trước</span>';
  var good = (d > 0) === (goodUp !== false);
  return '<span class="' + (good ? 'rp-d-g' : 'rp-d-b') + '">' + (d > 0 ? '▲ +' : '▼ ') + d + '%</span> <span class="rp-d-n">so kỳ trước</span>';
}
// trạng thái theo biến động: giảm >25% đỏ, >10% vàng
function stByDelta(c, p, goodUp){

  return '<div class="rp-banner green"><span class="rp-ic">✅</span><div><b>Ổn định</b> — chưa có cảnh báo trong kỳ này</div></div>';

  if (!list.length) return h + '<div class="rp-ok">✅ Không có việc phát sinh. Duy trì nhịp hiện tại.</div></div>';
  list.forEach(function(i){ h += '<div class="rp-act-i"><span class="rp-dot ' + (LV[i.lv] || '') + '"></span><div><div class="rp-act-t">' + i.title + '</div><div class="rp-act-x">' + i.text + '</div></div></div>'; });

}
function det(sum, body){ return '<details class="rp-det"><summary>' + sum + '</summary><div class="rp-det-b">' + body + '</div></details>'; }
function tbl(head, rows, numCols){

}
function empty(cols, t){ return '<tr><td colspan="' + cols + '" style="text-align:center;color:var(--muted);padding:20px">' + (t || 'Không có dữ liệu trong kỳ.') + '</td></tr>'; }

  return h + '<div id="report-printable">' + reportPrintTitle(title, range);
}
function funnel(f){
  var steps = [['Lead mới', f.lead], ['Đã liên hệ', f.contacted], ['Chốt lịch', f.scheduled], ['Đã tư vấn', f.consulted], ['Đăng ký', f.registered]], top = f.lead || 1, h = '<div class="rp-fun">';
  steps.forEach(function(s, i){

    h += '<div class="rp-fun-r"><span>' + s[0] + '</span><div class="rp-fun-b"><i style="width:' + Math.max(2, Math.round(s[1] / top * 100)) + '%"></i></div><span><b>' + s[1] + '</b>' + (drop !== null && steps[i - 1][1] >= 5 ? ' <span class="' + (drop >= 50 ? 'rp-d-b' : 'rp-d-n') + '">−' + drop + '%</span>' : '') + '</span></div>';
  });

}
function targetsProg(range, cur){

  }).join('') + '</div>';
}
function curTotals(D, range){ var c = { leads: 0, bookings: 0, revenue: 0 }; D.leads.forEach(function(l){ if (inRange(l.created_at, range)) c.leads++; }); D.bookings.filter(bookingCounts).forEach(function(b){ if (inRange(b.created_at, range)) { c.bookings++; c.revenue += Number(b.package_price) || 0; } }); return c; }

// ── 1. TỔNG QUAN ĐIỀU HÀNH ──
window.renderExecPage = function(){

// ── Khung nhập mục tiêu (đặt ở Tổng quan) ──

function lvRank(l){ return l === 'red' ? 0 : (l === 'amber' ? 1 : 2); }

// ── 2. CUNG – CẦU & ADVISOR (gộp Cung–Cầu + Công suất advisor) ──
window.loadInsightsPageAsync = function(){ insLoadPage_('lj-insights', 'Cung – Cầu & Advisor', renderInsightsPage); };

<script>
// ═══ Lĩnh vực quan tâm của advisee: dùng chung bộ nhãn với tag của Advisor để ghép cung-cầu chính xác ═══
var LJ_FIELD_GROUPS = [
  ['Ngành', ['FMCG','Logistic & Supply Chain','Global Agency','Retail','E-commerce','Tech','HR','Bank','Insurance','Education','Design']],
  ['Marketing & Truyền thông', ['Brand Management','Brand Marketing','Digital Marketing','Trade Marketing','Communication','PR','Strategic Planning','Account']],
  ['Sales & Kênh phân phối', ['Sales','Business Development','Channel Management','General Trade','Modern Trade','Commercial','Shopper']],
  ['Logistics & Chuỗi cung ứng', ['Logistics Operation','E-Logistics','Sales Logistics','Freight Forwarding','Warehouse','Procurement','Demand Planning','Product Planning']],
  ['Tài chính & Tư vấn', ['Audit','Accounting','Finance','Consultant']],
  ['Nhân sự', ['Talent Acquisition','Learning & Development','Recruitment']],
  ['Công nghệ & Dữ liệu', ['IT','AI','Software Engineer','Data Analysis']],
  ['Thiết kế', ['Visual Merchandiser']]
];
function deptPrimary_(s) { s = String(s || '').trim(); if (s.indexOf(' / ') > -1) s = s.split(' / ')[0].trim(); return s || 'Không rõ'; }
function cvFieldPicker(cur) {
  var toks = String(cur || '').split(' / ').map(function(t){ return t.trim(); }).filter(function(t){ return t && t !== 'Khác'; });
  var all = []; LJ_FIELD_GROUPS.forEach(function(g){ all = all.concat(g[1]); });
  var other = toks.filter(function(t){ return all.indexOf(t) === -1; }).join(', ');
  var h = '<div class="cvf"><input type="hidden" id="cv-interesteddept" value="' + escHtml(String(cur || '')) + '">';
  LJ_FIELD_GROUPS.forEach(function(g){
    h += '<div class="cvf-g">' + g[0] + '</div><div class="cvf-w">' + g[1].map(function(o){
      return '<button type="button" class="cvf-chip' + (toks.indexOf(o) > -1 ? ' on' : '') + '" data-v="' + escHtml(o) + '" onclick="cvFieldToggle(this)">' + escHtml(o) + '</button>';
    }).join('') + '</div>';
  });
  h += '<div class="cvf-g">Khác</div><div class="cvf-w"><button type="button" class="cvf-chip cvf-other' + (other ? ' on' : '') + '" onclick="cvFieldToggle(this)">Khác (tự nhập)</button></div>' +
    '<input class="form-input cvf-other-in" placeholder="Nhập ngành / vị trí khác, cách nhau bằng dấu phẩy" value="' + escHtml(other) + '" oninput="cvFieldSync(this)" style="margin-top:8px;display:' + (other ? 'block' : 'none') + '">' +
    '<div class="cvf-sel"></div></div>';
  return h;
}
function cvFieldToggle(btn) {
  btn.classList.toggle('on');
  var root = btn.closest('.cvf');
  if (btn.classList.contains('cvf-other')) {
    var inp = root.querySelector('.cvf-other-in'); inp.style.display = btn.classList.contains('on') ? 'block' : 'none';
    if (btn.classList.contains('on')) inp.focus();
  }
  cvFieldSync(btn);
}
function cvFieldSync(el) {
  var root = el.closest('.cvf'), vals = [];
  root.querySelectorAll('.cvf-chip.on:not(.cvf-other)').forEach(function(b){ vals.push(b.getAttribute('data-v')); });
  var ob = root.querySelector('.cvf-other');
  if (ob.classList.contains('on')) root.querySelector('.cvf-other-in').value.split(',').forEach(function(t){ t = t.replace(/\//g, '-').trim(); if (t) vals.push(t); });
  root.querySelector('#cv-interesteddept').value = vals.join(' / ');
  root.querySelector('.cvf-sel').textContent = vals.length ? 'Đã chọn: ' + vals.join(', ') : '';
}
function cvOtherSelect(id, opts, cur) {
  cur = cur || ''; var isOther = cur && opts.indexOf(cur) === -1, sv = isOther ? 'Khác' : cur;
  return '<select class="form-select" id="' + id + '-sel" onchange="cvOtherSync(\'' + id + '\')"><option value="">-- Chọn --</option>' +
    opts.map(function(o){ return '<option' + (o === sv ? ' selected' : '') + '>' + escHtml(o) + '</option>'; }).join('') + '</select>' +
    '<input class="form-input" id="' + id + '-other" placeholder="Nhập nội dung khác..." value="' + escHtml(isOther ? cur : '') + '" oninput="cvOtherSync(\'' + id + '\')" style="margin-top:6px;display:' + (sv === 'Khác' ? 'block' : 'none') + '">' +
    '<input type="hidden" id="' + id + '" value="' + escHtml(cur) + '">';
}
function cvOtherSync(id) {
  var sel = document.getElementById(id + '-sel').value, inp = document.getElementById(id + '-other');
  inp.style.display = sel === 'Khác' ? 'block' : 'none';
  document.getElementById(id).value = sel === 'Khác' ? (inp.value.trim() || 'Khác') : sel;
}
// Chuẩn hoá lỗi chính tả / cách viết khác nhau giữa tag advisor và lựa chọn advisee
function deptCanon_(n) {
  n = String(n || '').trim();
  return n.replace(/\bmarekting\b/g, 'marketing').replace(/\becomerce\b|\be commerce\b/g, 'ecommerce').replace(/\bmonder\b/g, 'modern')
    .replace(/\bretailer\b/g, 'retail').replace(/^edu$/, 'education').replace(/^logistics supply chain$/, 'logistic supply chain');
}
deptAliases_ = function(dept) { return String(dept || '').split(/\s\/\s|\//).map(function(p){ return deptCanon_(insNorm_(p)); }).filter(Boolean); };
advisorMatchesDept_ = function(adv, dept) { var al = deptAliases_(dept); if (!al.length) return false; return (adv.tags || []).some(function(t){ return al.indexOf(deptCanon_(insNorm_(t))) > -1; }); };
insDeptOf_ = function(lead) { return deptPrimary_(lead && lead.interested_dept); };
</script>

<script id="lj-staff-ext">
/* ════════════════════════════════════════════════════════════════════════
   LinkaJob Staff — bộ mở rộng (v3)
   1) Điều hướng bằng '#' (nút Back của trình duyệt + nút "← Quay lại")
   2) Staff xem / thêm / xoá slot trống của Advisor
   3) Staff đặt lịch hộ Advisee ("Đặt lịch hộ")
   4) "Tạo meeting" hoàn chỉnh (Cố vấn 1-1 · Tư vấn · Khoá học)
   ════════════════════════════════════════════════════════════════════════ */

// ───────────────────────── 1) ĐIỀU HƯỚNG BẰNG '#' ─────────────────────────
(function () {
  var _initialHash = location.hash || '';
  var _lastHash = location.hash || '';
  var _hist = [], _pos = -1;
  var _modalBase = '', _wasOpen = false;
  window._ljRestoring = false;

  function baseOf_(h) { return String(h || '').replace(/\/m$/, ''); }

  // Đẩy 1 mục mới vào lịch sử trình duyệt, vd ljPushHash('/aee-list')
  window.ljPushHash = function (path) {
    if (window._ljRestoring || !currentUser) return;
    path = String(path || '');
    if (path.charAt(0) !== '/') path = '/' + path;
    var t = '#' + path;
    if (location.hash === t) return;
    _lastHash = t;
    _hist = _hist.slice(0, _pos + 1); _hist.push(t); _pos = _hist.length - 1;
    try { location.hash = t; } catch (e) {}
  };

  function ensureAdvisees_(cb) { if (adviseesLoaded) cb(); else loadAdviseesFromSheet(cb); }
  window.ljEnsureCourses_ = function (cb) {
    if (CM_COURSES.length && CM_SEASONS.length) { cb(); return; }
    apiGet('getCourseSeasons').then(function (res) {
      if (res && res.success && res.data) {
        CM_COURSES = (res.data.courses || []).map(function (x) { return { id: x.course_id, name: x.name, active: x.active }; });
        CM_SEASONS = (res.data.seasons || []).map(function (x) {
          return {
            id: x.season_id, course_id: x.course_id, season_no: Number(x.season_no) || 0,
            status: x.status, start_date: csNormDate(x.start_date),
            class_link: x.class_link || '', slide_link: x.slide_link || '',
            price_full: Number(x.price_full) || 0, plans: x.plans || [],
            max_seats: Number(x.max_seats) || 0, enrolled_count: Number(x.enrolled_count) || 0, instructor_advisor: x.instructor_advisor || '',
          };
        });
      }
      cb();
    }).catch(function () { cb(); });
  };

  // Dựng lại đúng màn hình từ 1 đường dẫn '#'
  function routeFromHash_(h) {
    var path = baseOf_(String(h || '').replace(/^#\/?/, ''));
    if (!path || !currentUser) return;
    var seg = path.split('/').map(function (x) { try { return decodeURIComponent(x); } catch (e) { return x; } });
    var isStaff = currentUser.role === 'Staff' || currentUser.role === 'Admin';
    window._ljRestoring = true;
    var done = function () { window._ljRestoring = false; };
    try {
      if (isStaff && seg[0] === 'advisee' && seg[1]) {
        ensureAdvisees_(function () { try { navToStaffAdviseeDetail(seg[1], null); } finally { done(); } });
        return;
      }
      if (isStaff && seg[0] === 'advisor' && seg[1]) {
        loadAdvisorsFromSheet(function () {
          ensureAdvisees_(function () { try { navToStaffAdvisorDetail(seg[1]); } finally { done(); } });
        });
        return;
      }
      if (isStaff && seg[0] === 'season' && seg[1]) {
        ljEnsureCourses_(function () { try { navToSeasonDetail(seg[1], seg[2] || 'enroll'); } finally { done(); } });
        return;
      }
      if (isStaff && seg[0] === 'staff' && seg[1]) {
        try { navToStaffMemberDetail(seg[1], seg[2] || 'consult'); } finally { done(); }
        return;
      }
      if (isStaff && seg[0] === 'lead' && seg[1]) {
        try {
          if (MOCK.consultations && MOCK.consultations.some(function (c) { return c.id === seg[1]; })) navToConsultationDetail(seg[1]);
          else navTo('lj-newreg');
        } finally { done(); }
        return;
      }
      if (typeof ROUTE_MAP !== 'undefined' && ROUTE_MAP[seg[0]] && document.getElementById('ni-' + seg[0])) {
        try { navTo(seg[0]); } finally { done(); }
        return;
      }
    } catch (err) { console.warn('routeFromHash_:', err); }
    done();
  }
  window.ljRouteFromHash = routeFromHash_;

  window.addEventListener('hashchange', function () {
    var h = location.hash;
    if (h === _lastHash) return;            // do chính app vừa đặt → bỏ qua
    _lastHash = h;
    var i = _hist.lastIndexOf(h);
    if (i > -1) _pos = i; else { _hist.push(h); _pos = _hist.length - 1; }

    var overlay = document.getElementById('modal-overlay');
    var modalOpen = overlay && overlay.classList.contains('open');
    if (/\/m$/.test(h)) {                   // đi "tới" 1 trạng thái có modal: không dựng lại modal, về trang gốc
      var b = baseOf_(h);
      try { history.replaceState(null, '', b); } catch (e) {}
      _lastHash = b;
      if (!modalOpen) routeFromHash_(b);
      return;
    }
    if (modalOpen) {                        // bấm Back khi đang mở popup → đóng popup, giữ nguyên trang
      overlay.classList.remove('open');
      _wasOpen = false;
      var mb = document.querySelector('.modal'); if (mb) mb.style.maxWidth = '';
      if (h === _modalBase) return;
    }
    routeFromHash_(h);
  });

  // Mỗi lần mở popup → thêm 1 mục '#…/m' vào lịch sử để nút Back đóng popup
  (function watchModal() {
    var overlayEl = document.getElementById('modal-overlay');
    if (!overlayEl || !window.MutationObserver) return;
    new MutationObserver(function () {
      var open = overlayEl.classList.contains('open');
      if (open === _wasOpen) return;
      _wasOpen = open;
      if (open) {
        if (!currentUser) return;
        var cur = location.hash || ('#/' + (typeof activeNavId !== 'undefined' && activeNavId ? activeNavId : ''));
        if (/\/m$/.test(cur)) return;
        _modalBase = cur;
        ljPushHash(cur.replace(/^#/, '') + '/m');
      } else if (/\/m$/.test(location.hash)) {
        _lastHash = baseOf_(location.hash);
        if (_pos > 0) _pos--;
        try { history.back(); } catch (e) {}
      }
    }).observe(overlayEl, { attributes: true, attributeFilter: ['class'] });
  })();

  function wrap_(name, pathFn) {
    var f0 = window[name];
    if (typeof f0 !== 'function') return;
    window[name] = function () {
      try { var p = pathFn.apply(null, arguments); if (p) ljPushHash(p); } catch (e) {}
      return f0.apply(this, arguments);
    };
  }
  wrap_('navTo', function (id) { return '/' + id; });
  wrap_('navToStaffAdviseeDetail', function (id) { return '/advisee/' + encodeURIComponent(id); });
  wrap_('navToStaffAdvisorDetail', function (id) { return '/advisor/' + encodeURIComponent(id); });
  wrap_('navToSeasonDetail', function (id, tab) { return '/season/' + encodeURIComponent(id) + '/' + (tab || 'enroll'); });
  wrap_('cmSwitchTab', function (tab) { return _cmCurrentSeasonId ? '/season/' + encodeURIComponent(_cmCurrentSeasonId) + '/' + tab : null; });
  wrap_('navToStaffMemberDetail', function (id, tab) { return '/staff/' + encodeURIComponent(id) + '/' + (tab || 'consult'); });
  wrap_('navToConsultationDetail', function (id) { return '/lead/' + encodeURIComponent(id); });
  wrap_('loadCoursesPageAsync', function () { return /^#\/season\//.test(location.hash) ? '/lj-courses' : null; });

  // Sau khi dựng sidebar lần đầu: nếu URL đang có '#…' (F5 / mở link được chia sẻ) → mở đúng màn đó
  var _bs0 = window.buildSidebar;
  if (typeof _bs0 === 'function') {
    window.buildSidebar = function () {
      var r = _bs0.apply(this, arguments);
      if (_initialHash && !window._ljInitialDone) {
        window._ljInitialDone = true;
        var h = _initialHash;
        setTimeout(function () { _lastHash = location.hash; routeFromHash_(h); }, 0);
      }
      return r;
    };
  }
  var _lo0 = window.doLogout;
  if (typeof _lo0 === 'function') {
    window.doLogout = function () {
      var r = _lo0.apply(this, arguments);
      _hist = []; _pos = -1; _lastHash = ''; _initialHash = '';
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
      return r;
    };
  }

})();

// ───────────────────────── tiện ích dùng chung ─────────────────────────
(function () {
  var st = document.createElement('style');
  st.textContent =
    '.lj-seg{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}' +
    '.lj-seg button{flex:1;min-width:130px;padding:10px 12px;border:1.5px solid var(--border);background:#fff;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--text)}' +
    '.lj-seg button.on{background:var(--brand);border-color:var(--brand);color:#fff}' +
    '.lj-note{background:#EFF6FF;border:1px solid #BFDBFE;border-radius:10px;padding:10px 14px;font-size:12.5px;line-height:1.7;color:#1E40AF;margin-bottom:14px}' +
    '.lj-warn{background:#FFF7ED;border:1px solid #FDE68A;border-radius:10px;padding:10px 14px;font-size:12.5px;line-height:1.7;color:#92400E;margin-bottom:14px}' +
    '.lj-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}' +

    '.lj-pick{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1.5px solid var(--border);border-radius:12px;margin-bottom:8px;cursor:pointer;background:#fff}' +
    '.lj-pick:hover{border-color:var(--brand);background:var(--brand-light)}' +

    '.lj-pick.off:hover{border-color:var(--border);background:#fff}' +
    '.lj-slotbox{max-height:250px;overflow:auto;border:1px solid var(--border);border-radius:10px;padding:4px 14px 12px}' +
    '.lj-lbl{font-size:12.5px;font-weight:700;margin:12px 0 8px}';
  document.head.appendChild(st);
})();

function ljWideModal_(px) { var m = document.querySelector('.modal'); if (m) m.style.maxWidth = px ? px + 'px' : ''; }
function ljOpenModal_(title, bodyHtml, actionsHtml, wide) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  document.getElementById('modal-actions').innerHTML = actionsHtml || '';
  ljWideModal_(wide || 0);
  var mb = document.getElementById('modal-body');
  if (mb && wide) { mb.style.maxHeight = '72vh'; mb.style.overflowY = 'auto'; }
  document.getElementById('modal-overlay').classList.add('open');
}
function ljDowLabel_(dateStr) {
  var d = new Date(dateStr + 'T00:00:00');
  return DAYS_VI[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1) + '/' + d.getFullYear();
}
function ljTodayYmd_() { return ymd(new Date()); }
function ljSlotStartMs_(date, time) { return sessionStartMs_(date, time); }
function ljAdvisorByName_(name) {
  var n = normContact(name);
  return (sheetData.advisors || []).find(function (a) { return normContact(a.name) === n; }) || null;
}

// ───────────────────────── 2) STAFF QUẢN LÝ SLOT CỦA ADVISOR ─────────────────────────
var _sl = { advisorId: '', advisor: null, slots: [], monthOffset: 0, loading: false, error: '' };
var _slDay = { date: '', pending: [] };

function ljNormSlot_(s) {
  return {
    slot_id: s.slot_id, date: String(s.date || '').slice(0, 10), time: fmtHHMM(s.time_start), end: fmtHHMM(s.time_end),
    status: String(s.status || '').toLowerCase(), booking_id: String(s.booking_id || '').trim(),
  };
}

function ljLoadAdvisorSlots(advisorId, done) {
  var a = (sheetData.advisors || []).find(function (x) { return x.id === advisorId; });
  if (!a) return;
  if (_sl.advisorId !== advisorId) _sl.monthOffset = 0;
  _sl.advisorId = advisorId; _sl.advisor = a; _sl.loading = true; _sl.error = '';
  ljRenderSlotsCard_();
  apiGet('getSlots', { advisor: a.name }).then(function (res) {
    _sl.slots = ((res && res.data) || []).map(ljNormSlot_).filter(function (s) { return s.date && s.time; });
    _sl.loading = false;
    ljRenderSlotsCard_();
    if (done) done();
  }).catch(function (err) {
    _sl.loading = false; _sl.error = err.message;
    ljRenderSlotsCard_();
  });
}

function ljOpenAdvisorSlots(advisorId) {
  navToStaffAdvisorDetail(advisorId);
  setTimeout(function () {
    var el = document.getElementById('sa-slots-card');
    if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 350);
}

function ljSlotCounts_() {
  var now = Date.now(), map = {}, totalFree = 0, totalBooked = 0;
  _sl.slots.forEach(function (s) {
    var isFuture = ljSlotStartMs_(s.date, s.time) > now;
    if (!map[s.date]) map[s.date] = { free: 0, booked: 0 };
    if (s.status === 'booked') { map[s.date].booked++; if (isFuture) totalBooked++; }
    else if (s.status === 'available' && isFuture) { map[s.date].free++; totalFree++; }
  });
  return { byDate: map, totalFree: totalFree, totalBooked: totalBooked };
}

function ljRenderSlotsCard_() {
  var host = document.getElementById('sa-slots-card');
  if (!host || !_sl.advisor) return;
  var a = _sl.advisor;
  var html = '<div class="card" style="margin-bottom:16px"><div class="card-header"><div class="card-header-left">📅 Lịch trống của ' + escHtml(a.name) + '</div>' +
    '<div style="display:flex;gap:8px"><button class="refresh-btn" onclick="ljLoadAdvisorSlots(\'' + a.id + '\')">↻ Làm mới</button>' +
    '<button class="submit-btn" style="padding:8px 16px;font-size:13px;width:auto" onclick="ljSlotDay(\'' + ymd(new Date(Date.now() + 86400000)) + '\')">+ Thêm giờ trống</button></div></div>';
  if (_sl.loading && !_sl.slots.length) {
    html += '<div class="empty-state" style="padding:24px">Đang tải lịch...</div></div>';
    host.innerHTML = html; return;
  }
  if (_sl.error) {
    html += '<div class="empty-state"><div class="icon">⚠</div>Không tải được lịch trống.<br><small style="color:var(--muted)">' + escHtml(_sl.error) + '</small></div></div>';
    host.innerHTML = html; return;
  }
  var c = ljSlotCounts_();
  html += '<div style="padding:12px 24px 0;font-size:13px;color:var(--muted)">' +
    '<span class="cal-badge slot">' + c.totalFree + ' slot trống sắp tới</span> &nbsp; <span class="cal-badge meeting">' + c.totalBooked + ' buổi đã đặt</span>' +
    ' &nbsp; Bấm vào 1 ngày để <b>xem / thêm / xoá</b> khung giờ — dùng khi Advisor báo bận hoặc cần mở thêm lịch cho Advisee.</div>';
  var m = getCalendarMatrix(_sl.monthOffset);
  var monthNames = ['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];
  html += '<div class="cal-nav"><div class="cal-nav-left"><button onclick="ljSlotMonth(-1)">‹</button><span class="cal-nav-label">' + monthNames[m.month] + ' ' + m.year + '</span><button onclick="ljSlotMonth(1)">›</button></div>' +
    '<button class="cal-today-btn" onclick="ljSlotMonth(0)">Hôm nay</button></div>';
  html += '<div class="cal-grid">';
  DAYS_VI_FULL.forEach(function (d) { html += '<div class="cal-weekday-hdr">' + d + '</div>'; });
  var today = new Date(), todayStr = ymd(today);
  m.weeks.forEach(function (week) {
    week.forEach(function (d) {
      var ds = ymd(d), cnt = c.byDate[ds];
      var cls = 'cal-cell' + (d.getMonth() !== m.month ? ' other-month' : '') + (ds === todayStr ? ' today' : '');
      html += '<div class="' + cls + '" onclick="ljSlotDay(\'' + ds + '\')"><div class="cal-daynum">' + d.getDate() + '</div><div class="cal-add">+</div><div class="cal-badges">';
      if (cnt && cnt.free > 0) html += '<span class="cal-badge slot">' + cnt.free + ' trống</span>';
      if (cnt && cnt.booked > 0) html += '<span class="cal-badge meeting">' + cnt.booked + ' đã đặt</span>';
      html += '</div></div>';
    });
  });
  html += '</div></div>';
  host.innerHTML = html;
}

function ljSlotMonth(dir) {
  _sl.monthOffset = dir === 0 ? 0 : _sl.monthOffset + dir;
  ljRenderSlotsCard_();
}

function ljSlotDay(dateStr) {
  _slDay = { date: dateStr, pending: [] };
  ljRenderSlotDay_(true);
}

function ljRangesOf_(times) {
  return groupTimesIntoRanges(times.slice().sort());
}

function ljRenderSlotDay_(openIt) {
  var a = _sl.advisor; if (!a) return;
  var d = _slDay.date;
  var daySlots = _sl.slots.filter(function (s) { return s.date === d; });
  var freeMap = {}, bookedList = [];
  daySlots.forEach(function (s) {
    if (s.status === 'available') freeMap[s.time] = s;
    else if (s.status === 'booked') bookedList.push(s);
  });
  var freeRanges = ljRangesOf_(Object.keys(freeMap));
  var isPastDay = d < ljTodayYmd_();

  var html = '';
  if (isPastDay) html += '<div class="lj-warn">Ngày này đã qua — chỉ để xem.</div>';
  html += '<div class="lj-lbl" style="margin-top:0">Giờ trống hiện có</div><div style="display:flex;flex-direction:column;gap:8px" id="lj-day-free">';
  if (!freeRanges.length) html += '<div style="font-size:13px;color:var(--muted)">Chưa có khung giờ trống nào cho ngày này.</div>';
  freeRanges.forEach(function (r, i) {
    html += '<div style="display:flex;align-items:center;justify-content:space-between;border:1px solid var(--border);border-radius:10px;padding:10px 14px">' +
      '<div style="font-size:13.5px;font-weight:600">🕐 ' + minutesToTimeStr(r.startMins) + ' – ' + minutesToTimeStr(r.endMins) + ' <span class="badge badge-confirmed" style="margin-left:6px">Trống</span></div>' +
      (isPastDay ? '' : '<button class="detail-btn" style="color:#DC2626" onclick="ljSlotDelRange(' + i + ')">Xoá khung giờ</button>') + '</div>';
  });
  html += '</div>';

  if (bookedList.length) {
    html += '<div class="lj-lbl">Đã có Advisee đặt</div>';
    bookedList.sort(function (x, y) { return x.time.localeCompare(y.time); }).forEach(function (s) {
      var ae = (MOCK.advisees || []).find(function (x) { return x.bookingId === s.booking_id; });
      html += '<div style="display:flex;align-items:center;gap:10px;border:1px solid #BFDBFE;background:#EFF6FF;border-radius:10px;padding:10px 14px;margin-bottom:8px">' +
        '<div style="font-size:13.5px;font-weight:600;color:#1D4ED8">🔒 ' + s.time + '</div>' +
        '<div style="flex:1;font-size:13px">' + (ae ? '<b>' + escHtml(ae.name) + '</b>' : 'Booking ' + escHtml(s.booking_id || '—')) + '</div>' +
        (ae ? '<button class="detail-btn" onclick="closeModal();setTimeout(function(){navToStaffAdviseeDetail(\'' + ae.id + '\',null)},300)">Mở hồ sơ →</button>' : '') + '</div>';
    });
    html += '<div style="font-size:12px;color:var(--muted)">Muốn dời buổi đã đặt: vào hồ sơ Advisee → "📅 Đổi lịch".</div>';
  }

  if (!isPastDay) {
    html += '<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border)"><div class="lj-lbl" style="margin-top:0">Thêm khung giờ trống</div>' +
      '<div class="lj-row"><div><div class="form-label">Từ</div><select class="form-input" id="lj-sl-from" style="margin-top:4px">' +
      HALF_HOUR_OPTIONS.map(function (t) { return '<option value="' + t + '"' + (t === '09:00' ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select></div>' +
      '<div><div class="form-label">Đến</div><select class="form-input" id="lj-sl-to" style="margin-top:4px">' +
      HALF_HOUR_OPTIONS.map(function (t) { return '<option value="' + t + '"' + (t === '10:00' ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select></div>' +
      '<div><div class="form-label">Lặp lại</div><select class="form-input" id="lj-sl-rep" style="margin-top:4px">' +
      [[0, 'Chỉ ngày này'], [1, '+ 1 tuần sau'], [2, '+ 2 tuần sau'], [3, '+ 3 tuần sau'], [4, '+ 4 tuần sau'], [7, '+ 7 tuần sau']].map(function (o) { return '<option value="' + o[0] + '">' + o[1] + '</option>'; }).join('') + '</select></div></div>' +
      '<div style="font-size:11.5px;color:var(--muted);margin-top:6px">"Lặp lại" = cùng thứ, cùng giờ ở các tuần tiếp theo (hợp với lịch cố định của Advisor).</div></div>';
  }

  var actions = '<button class="btn-secondary" onclick="closeModal()" style="width:auto;padding:10px 20px">Đóng</button>';
  if (!isPastDay) {
    if (freeRanges.length) actions += '<button class="btn-secondary" onclick="ljSlotClearDay()" style="width:auto;padding:10px 16px;color:#DC2626;border-color:#FCA5A5">🚫 Advisor bận — xoá hết giờ trống ngày này</button>';
    actions += '<button class="login-btn" id="lj-sl-add" onclick="ljSlotAdd()" style="width:auto;padding:10px 22px">+ Thêm vào lịch</button>';
  }
  if (openIt) ljOpenModal_(ljDowLabel_(d) + ' — Lịch của ' + a.name, html, actions, 560);
  else {
    document.getElementById('modal-body').innerHTML = html;
    document.getElementById('modal-actions').innerHTML = actions;
  }
}

function ljSlotAfterChange_() {
  ljLoadAdvisorSlots(_sl.advisorId, function () { ljRenderSlotDay_(false); });
}

function ljSlotAdd() {
  var a = _sl.advisor; if (!a) return;
  var from = document.getElementById('lj-sl-from').value, to = document.getElementById('lj-sl-to').value;
  var rep = Number(document.getElementById('lj-sl-rep').value) || 0;
  if (timeStrToMinutes(to) <= timeStrToMinutes(from)) { toast('Giờ "Đến" phải sau giờ "Từ"', 'error'); return; }
  var existing = {};
  _sl.slots.forEach(function (s) { existing[s.date + '_' + s.time] = true; });
  var keys = [], skippedPast = 0;
  for (var w = 0; w <= rep; w++) {
    var dt = new Date(_slDay.date + 'T00:00:00'); dt.setDate(dt.getDate() + w * 7);
    var ds = ymd(dt);
    for (var m = timeStrToMinutes(from); m < timeStrToMinutes(to); m += 30) {
      var t = minutesToTimeStr(m);
      if (ljSlotStartMs_(ds, t) <= Date.now()) { skippedPast++; continue; }
      if (existing[ds + '_' + t]) continue;
      keys.push(ds + '_' + t);
    }
  }
  if (!keys.length) { toast(skippedPast ? 'Các khung giờ này đã qua hoặc đã tồn tại' : 'Khung giờ này đã có trong lịch rồi', 'error'); return; }
  var btn = document.getElementById('lj-sl-add');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Đang thêm...'; }
  apiPost({ action: 'addSlots', advisor: a.name, advisor_id: a.id, advisor_email: a.email, slots: keys, duration_minutes: 30, added_by: currentUser && currentUser.email }).then(function (res) {
    if (!res || !res.success) { toast('Lỗi: ' + ((res && res.error) || 'không thêm được'), 'error'); if (btn) { btn.disabled = false; btn.textContent = '+ Thêm vào lịch'; } return; }
    toast('Đã thêm ' + res.count + ' slot cho ' + a.name + (res.skipped ? ' (bỏ qua ' + res.skipped + ' slot trùng)' : '') + ' ✅', 'success');
    ljSlotAfterChange_();
  }).catch(function (e) { toast('Lỗi kết nối: ' + e.message, 'error'); if (btn) { btn.disabled = false; btn.textContent = '+ Thêm vào lịch'; } });
}

function ljDeleteSlotIds_(ids, label) {
  if (!ids.length) return;
  if (!confirm('Xoá ' + label + '?\nSlot đã có Advisee đặt sẽ được giữ lại.')) return;
  apiPost({ action: 'deleteSlots', slot_ids: ids }).then(function (res) {
    if (!res || !res.success) { toast('Lỗi: ' + ((res && res.error) || 'không xoá được'), 'error'); return; }
    toast('Đã xoá ' + res.deleted + ' slot' + (res.skipped_booked ? ' (giữ ' + res.skipped_booked + ' slot đã đặt)' : '') + ' ✅', 'success');
    ljSlotAfterChange_();
  }).catch(function (e) { toast('Lỗi kết nối: ' + e.message, 'error'); });
}

function ljSlotDelRange(idx) {
  var d = _slDay.date;
  var freeMap = {};
  _sl.slots.forEach(function (s) { if (s.date === d && s.status === 'available') freeMap[s.time] = s; });
  var r = ljRangesOf_(Object.keys(freeMap))[idx];
  if (!r) return;
  ljDeleteSlotIds_(r.times.map(function (t) { return freeMap[t].slot_id; }), 'khung giờ ' + minutesToTimeStr(r.startMins) + ' – ' + minutesToTimeStr(r.endMins));
}
function ljSlotClearDay() {
  var d = _slDay.date;
  var ids = _sl.slots.filter(function (s) { return s.date === d && s.status === 'available'; }).map(function (s) { return s.slot_id; });
  ljDeleteSlotIds_(ids, 'TẤT CẢ ' + ids.length + ' slot trống của ngày ' + ljDowLabel_(d));
}

// ───────────────────────── 3) STAFF ĐẶT LỊCH HỘ ADVISEE ─────────────────────────
var _sb = null;

function ljBookableNos_(ae) {
  var out = [];
  (ae.sessions || []).forEach(function (s) {
    if (s.session_id) return;
    if (s.no === 1 || (ae.sessions[s.no - 2] && ae.sessions[s.no - 2].session_id)) out.push(s.no);
  });
  return out;
}

function ljOpenStaffBook(aeId, sessionNo, opts) {
  var ae = (MOCK.advisees || []).find(function (x) { return x.id === aeId; });
  if (!ae) { toast('Không tìm thấy Advisee — bấm "Làm mới" rồi thử lại', 'error'); return; }
  var nos = ljBookableNos_(ae);
  if (!nos.length) { toast(ae.name + ' đã đặt lịch đủ mọi buổi hiện có — dùng "Đổi lịch" nếu cần dời giờ', 'error'); return; }
  var no = (sessionNo && nos.indexOf(sessionNo) > -1) ? sessionNo : nos[0];
  var unassigned = isUnassignedAdvisor_(ae.advisor);
  var firstAdvisor = '';
  if (unassigned) firstAdvisor = ((sheetData.advisors || []).filter(function (a) { return a.active; })[0] || {}).name || '';
  _sb = { aeId: aeId, sessionNo: no, unassigned: unassigned, advisorName: unassigned ? firstAdvisor : ae.advisor, slots: {}, selected: null, opts: opts || {}, loading: true, busy: false, hidden: 0 };
  ljRenderStaffBook_();
  ljSbLoadSlots_();
}

function ljSbLoadSlots_(thenSelect) {
  if (!_sb || !_sb.advisorName) { if (_sb) { _sb.loading = false; ljRenderStaffBook_(); } return; }
  _sb.loading = true;
  var name = _sb.advisorName;
  apiGet('getSlots', { advisor: name }).then(function (res) {
    if (!_sb || _sb.advisorName !== name) return;
    var all = ((res && res.data) || []).map(ljNormSlot_).filter(function (s) { return s.date && s.time; });
    var booked = all.filter(function (s) { return s.status === 'booked'; });
    var now = Date.now();
    _sb.slots = {}; _sb.hidden = 0;
    all.filter(function (s) { return s.status === 'available' && ljSlotStartMs_(s.date, s.time) > now; }).forEach(function (s) {
      // khớp luật máy chủ: không được cách 1 buổi đã đặt của cùng Advisor dưới 60 phút
      var tooClose = booked.some(function (b) {
        return b.date === s.date && Math.abs(timeStrToMinutes(b.time) - timeStrToMinutes(s.time)) < 60;
      });
      if (tooClose) { _sb.hidden++; return; }
      (_sb.slots[s.date] = _sb.slots[s.date] || []).push({ slot_id: s.slot_id, time: s.time });
    });
    Object.keys(_sb.slots).forEach(function (d) { _sb.slots[d].sort(function (x, y) { return x.time.localeCompare(y.time); }); });
    _sb.loading = false;
    if (thenSelect) {
      var hit = (_sb.slots[thenSelect.date] || []).find(function (x) { return x.time === thenSelect.time; });
      if (hit) _sb.selected = { date: thenSelect.date, time: thenSelect.time, slotId: hit.slot_id };
    }
    ljRenderStaffBook_();
  }).catch(function (err) {
    if (!_sb) return;
    _sb.loading = false; _sb.error = err.message;
    ljRenderStaffBook_();
  });
}

function ljRenderStaffBook_() {
  if (!_sb) return;
  var ae = (MOCK.advisees || []).find(function (x) { return x.id === _sb.aeId; });
  if (!ae) return;
  var nos = ljBookableNos_(ae);
  var remaining = (ae.sessions || []).filter(function (s) { return !s.session_id; }).length;
  var keepPrep = {
    cv: (document.getElementById('lj-sb-cv') || {}).value, q: (document.getElementById('lj-sb-q') || {}).value, links: (document.getElementById('lj-sb-links') || {}).value,
    open: !!(document.getElementById('lj-sb-prep') || {}).open,
  };
  var html = '<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">' + avatarCircle(ae.name, 40) +
    '<div style="flex:1"><div style="font-weight:700;font-size:15px">' + escHtml(ae.name) + '</div>' +
    '<div style="font-size:12.5px;color:var(--muted)">' + escHtml(ae.email || '') + ' · Gói ' + escHtml(ae.pkg) + ' · còn ' + remaining + ' buổi chưa đặt' + (ae.expiry ? ' · hạn ' + escHtml(fmtDmy_(ae.expiry)) : '') + '</div></div></div>';
  html += '<div class="lj-row" style="margin-bottom:12px"><div><div class="form-label">Buổi số</div><select class="form-input" style="margin-top:4px" onchange="ljSbSetNo(this.value)">' +
    nos.map(function (n) { return '<option value="' + n + '"' + (n === _sb.sessionNo ? ' selected' : '') + '>Buổi ' + n + ' / ' + ae.sessionsTotal + '</option>'; }).join('') + '</select></div>';
  if (_sb.unassigned) {
    var advs = (sheetData.advisors || []).filter(function (a) { return a.active; });
    html += '<div style="flex:2"><div class="form-label">Advisor (chưa xếp → chọn để gán luôn)</div><select class="form-input" style="margin-top:4px" onchange="ljSbSetAdvisor(this.value)">' +
      advs.map(function (a) { return '<option value="' + escHtml(a.name) + '"' + (a.name === _sb.advisorName ? ' selected' : '') + '>' + escHtml(a.name) + (a.title ? ' — ' + escHtml(a.title) : '') + '</option>'; }).join('') + '</select></div>';
  } else {
    html += '<div style="flex:2"><div class="form-label">Advisor phụ trách</div><div style="margin-top:8px;font-weight:600;font-size:14px">' + escHtml(_sb.advisorName) +
      ' <button class="update-btn" style="margin-left:6px;font-size:11px" onclick="closeModal();setTimeout(function(){openAssignAdvisor(\'' + ae.id + '\',\'detail\')},320)">Đổi</button></div></div>';
  }
  html += '</div>';

  html += '<div class="lj-note">📌 <b>Đặt hộ</b> được bỏ qua quy định đặt trước ' + BOOK_MIN_HOURS + 'h và hạn gửi câu hỏi ' + PREP_DEADLINE_HOURS + 'h. Khi xác nhận, hệ thống tạo Google Meet và gửi lịch cho cả Advisee lẫn Advisor.</div>';

  html += '<div class="lj-lbl" style="margin-top:0">Chọn giờ trống của Advisor' + (_sb.hidden ? ' <span style="font-weight:400;color:var(--muted)">(ẩn ' + _sb.hidden + ' giờ trùng/sát buổi đã đặt)</span>' : '') + '</div>';
  if (_sb.loading) html += '<div class="lj-slotbox" style="padding:20px;color:var(--muted);font-size:13px">Đang tải lịch trống...</div>';
  else if (_sb.error) html += '<div class="lj-warn">Không tải được lịch trống: ' + escHtml(_sb.error) + '</div>';
  else {
    var dates = Object.keys(_sb.slots).filter(function (d) { return _sb.slots[d].length; }).sort();
    html += '<div class="lj-slotbox">';
    if (!dates.length) html += '<div style="padding:16px 0;font-size:13px;color:var(--muted)">Advisor chưa có giờ trống nào phù hợp. Thêm giờ mới ở ô bên dưới.</div>';
    dates.forEach(function (d) {
      html += '<div class="lj-lbl">' + ljDowLabel_(d) + '</div><div style="display:flex;flex-wrap:wrap;gap:8px">';
      _sb.slots[d].forEach(function (sl) {
        var on = _sb.selected && _sb.selected.slotId === sl.slot_id;
        html += '<button class="day-time-chip' + (on ? ' selected' : '') + '" style="min-width:64px" onclick="ljSbPick(\'' + d + '\',\'' + sl.time + '\',\'' + sl.slot_id + '\')">' + sl.time + '</button>';
      });
      html += '</div>';
    });
    html += '</div>';
  }

  // Thêm slot riêng khi Advisor không có giờ hợp
  html += '<details style="margin-top:12px"><summary style="cursor:pointer;font-size:13px;font-weight:600;color:var(--brand)">Không có giờ phù hợp? Thêm giờ mới cho Advisor</summary>' +
    '<div class="lj-row" style="margin-top:10px"><div><div class="form-label">Ngày</div><input class="form-input" type="date" id="lj-sb-nd" min="' + ljTodayYmd_() + '" style="margin-top:4px"></div>' +
    '<div><div class="form-label">Giờ bắt đầu</div><select class="form-input" id="lj-sb-nt" style="margin-top:4px">' +
    HALF_HOUR_OPTIONS.map(function (t) { return '<option value="' + t + '"' + (t === '19:00' ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select></div>' +
    '<div style="flex:0 0 auto"><button class="update-btn" id="lj-sb-addslot" style="padding:11px 16px;font-size:13px" onclick="ljSbAddSlot()">+ Thêm & chọn</button></div></div>' +
    '<div style="font-size:11.5px;color:var(--muted);margin-top:6px">Dùng khi đã thống nhất giờ với Advisor ngoài hệ thống. Slot mới được lưu vào lịch của Advisor.</div></details>';

  // Thông tin chuẩn bị (không bắt buộc)
  html += '<details id="lj-sb-prep" style="margin-top:12px"' + (keepPrep.open ? ' open' : '') + '><summary style="cursor:pointer;font-size:13px;font-weight:600">Điền hộ thông tin chuẩn bị cho Advisor (không bắt buộc)</summary>' +
    '<div style="margin-top:10px"><div class="form-label">Link CV / Portfolio</div><input class="form-input" id="lj-sb-cv" placeholder="https://drive.google.com/..." value="' + escHtml(keepPrep.cv || '') + '" style="margin-top:4px"></div>' +
    '<div style="margin-top:10px"><div class="form-label">Câu hỏi của Advisee</div><textarea class="form-input" id="lj-sb-q" rows="3" placeholder="Advisee muốn hỏi gì?" style="margin-top:4px">' + escHtml(keepPrep.q || '') + '</textarea></div>' +
    '<div style="margin-top:10px"><div class="form-label">Link / tài liệu khác</div><textarea class="form-input" id="lj-sb-links" rows="2" style="margin-top:4px">' + escHtml(keepPrep.links || '') + '</textarea></div>' +
    '<div style="font-size:11.5px;color:var(--muted);margin-top:6px">Nếu điền, Advisor nhận ngay email buổi cố vấn kèm CV, câu hỏi và link.</div></details>';

  var actions = '<button class="btn-secondary" onclick="closeModal()" style="width:auto;padding:10px 20px">Đóng</button>';
  if (_sb.selected) actions += '<button class="login-btn" id="lj-sb-confirm" onclick="ljSbConfirm()" style="width:auto;padding:10px 22px">Xác nhận đặt ' + _sb.selected.date.split('-').reverse().join('/') + ' · ' + _sb.selected.time + ' →</button>';
  else actions += '<button class="login-btn" disabled style="width:auto;padding:10px 22px;opacity:.5;cursor:not-allowed">Chọn 1 khung giờ ở trên</button>';

  var openNow = document.getElementById('modal-overlay').classList.contains('open');
  var titleTxt = 'Đặt lịch hộ — Buổi ' + _sb.sessionNo;
  if (openNow && document.getElementById('lj-sb-confirm') === null && document.getElementById('modal-title').textContent.indexOf('Đặt lịch hộ') !== 0) {
    ljOpenModal_(titleTxt, html, actions, 640);
  } else if (openNow && document.getElementById('modal-title').textContent.indexOf('Đặt lịch hộ') === 0) {
    document.getElementById('modal-body').innerHTML = html;
    document.getElementById('modal-actions').innerHTML = actions;
  } else {
    ljOpenModal_(titleTxt, html, actions, 640);
  }
  document.getElementById('modal-title').textContent = titleTxt;
}

function ljSbSetNo(v) { _sb.sessionNo = Number(v) || _sb.sessionNo; ljRenderStaffBook_(); }
function ljSbSetAdvisor(name) { _sb.advisorName = name; _sb.selected = null; ljRenderStaffBook_(); ljSbLoadSlots_(); }
function ljSbPick(date, time, slotId) { _sb.selected = { date: date, time: time, slotId: slotId }; ljRenderStaffBook_(); }

function ljSbAddSlot() {
  var date = (document.getElementById('lj-sb-nd') || {}).value, time = (document.getElementById('lj-sb-nt') || {}).value;
  if (!date) { toast('Chọn ngày cho giờ mới', 'error'); return; }
  if (ljSlotStartMs_(date, time) <= Date.now()) { toast('Giờ này đã qua', 'error'); return; }
  var adv = ljAdvisorByName_(_sb.advisorName);
  if (!adv) { toast('Không tìm thấy hồ sơ Advisor "' + _sb.advisorName + '"', 'error'); return; }
  var btn = document.getElementById('lj-sb-addslot'); if (btn) { btn.disabled = true; btn.textContent = 'Đang thêm...'; }
  apiPost({ action: 'addSlots', advisor: adv.name, advisor_id: adv.id, advisor_email: adv.email, slots: [date + '_' + time], duration_minutes: 30, added_by: currentUser && currentUser.email }).then(function (res) {
    if (!res || !res.success) { toast('Lỗi: ' + ((res && res.error) || 'không thêm được'), 'error'); if (btn) { btn.disabled = false; btn.textContent = '+ Thêm & chọn'; } return; }
    toast(res.count ? 'Đã thêm giờ mới cho ' + adv.name + ' ✅' : 'Giờ này đã có sẵn trong lịch — đã chọn giúp bạn', 'success');
    ljSbLoadSlots_({ date: date, time: time });
  }).catch(function (e) { toast('Lỗi kết nối: ' + e.message, 'error'); if (btn) { btn.disabled = false; btn.textContent = '+ Thêm & chọn'; } });
}

function ljSbConfirm() {
  if (!_sb || !_sb.selected || _sb.busy) return;
  var ae = (MOCK.advisees || []).find(function (x) { return x.id === _sb.aeId; });
  if (!ae) return;
  var sel = _sb.selected, ctx = _sb;

function ljAddMonths_(ymdStr, k, day) {
  var p = String(ymdStr).split('-'); if (p.length < 3) return '';
  var dt = new Date(+p[0], (+p[1] - 1) + k, 1);
  var last = new Date(dt.getFullYear(), dt.getMonth() + 1, 0).getDate();
  return dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(Math.min(day || +p[2], last));
}
function ljInstInfo_(b, pays) {
  // b: dòng booking (package_price, installment_*); pays: các lần đã thu
  var price = Number(b.package_price != null ? b.package_price : b.price) || 0;
  var paid = (pays || []).reduce(function (s, x) { return s + (Number(x.amount) || 0); }, 0);
  var count = Number(b.installment_count != null ? b.installment_count : b.instCount) || 0;
  var amt = Number(b.installment_amount != null ? b.installment_amount : b.instAmount) || 0;
  var day = Number(b.installment_day != null ? b.installment_day : b.instDay) || 0;
  var first = String(b.installment_first_due || b.instFirstDue || '').slice(0, 10);
  var remaining = Math.max(0, price - paid);
  var paidCount = amt > 0 ? Math.min(count, Math.floor(paid / amt + 1e-9)) : 0;
  var nextDue = (remaining > 0 && first && paidCount < count) ? ljAddMonths_(first, paidCount, day) : '';
  var lastDue = (first && count) ? ljAddMonths_(first, count - 1, day) : '';
  var today = ymd(new Date());
  return { price: price, paid: paid, remaining: remaining, count: count, amount: amt, day: day, first: first,
           paidCount: paidCount, nextDue: nextDue, lastDue: lastDue, overdue: !!(nextDue && nextDue < today),
           pct: price > 0 ? Math.min(100, Math.round(paid / price * 100)) : 0 };
}

  var lastMon = new Date(thisMon); lastMon.setDate(lastMon.getDate() - 7); var lastSun = new Date(thisMon); lastSun.setDate(lastSun.getDate() - 1);
  var bkThis = bkIn(ymd(thisMon), today), bkLast = bkIn(ymd(lastMon), ymd(lastSun));
  var sumP = function (l) { return l.reduce(function (s, b) { return s + (Number(b.package_price) || 0); }, 0); };
  var opsRows = ops.slice(0, 15).map(function (o) {
    var c = o.kind === 'expired' ? '#DC2626' : (o.kind === 'soon' ? '#D97706' : '#6B7280');
    return '<tr onclick="navToStaffAdviseeDetail(\'' + escHtml(o.ae.id) + '\',\'staffcare\')" style="cursor:pointer"><td><b>' + escHtml(o.ae.name) + '</b></td><td>' + escHtml(o.ae.advisor || '—') + '</td><td>' + escHtml(o.ae.pkg) + '</td><td>' + o.remaining + '/' + o.ae.sessionsTotal + ' buổi</td><td>' + (o.ae.expiry ? fmtDMY(o.ae.expiry) : '—') + '</td><td style="color:' + c + ';font-weight:700">' + escHtml(o.note) + '</td></tr>';
  });
  // 6) Follow-up hôm nay + cảnh báo
  var g = wkGroups_(all, bookings);
  var items = [];
  var nrAll = booked.filter(wkNoResult_).length;
  if (nrAll >= 1) items.push({ lv: nrAll >= 5 ? 'red' : 'amber', t: nrAll + ' lead đã tư vấn nhưng chưa ghi kết quả', x: 'Thiếu kết quả thì tỷ lệ chốt thật có thể cao hơn số đang hiện. Sale cập nhật cột “Kết quả” ngay sau buổi tư vấn.' });
  if (g.stale.length) items.push({ lv: g.stale.length >= 5 ? 'red' : 'amber', t: g.stale.length + ' lead mở quá 48 giờ chưa được cập nhật', x: 'Liên hệ lại hoặc đổi trạng thái để không bỏ sót khách.' });
  if (g.unassigned.length) items.push({ lv: 'amber', t: g.unassigned.length + ' lead chưa gán người phụ trách', x: 'Chia cho Sale trong tab Leads (lọc “Chưa gán người”).' });
  var full = weekStats.filter(function (w) { return !w.current && w.n >= 3; });
  if (full.length >= 3) { var last = full[full.length - 1], prev = full.slice(-5, -1), avg = Math.round(prev.reduce(function (s, w) { return s + (w.rate || 0); }, 0) / prev.length); if (last.rate !== null && avg - last.rate >= 15) items.push({ lv: 'amber', t: 'Tỷ lệ chốt tuần ' + wkLbl_(last.start) + ' giảm còn ' + last.rate + '% (TB các tuần trước ' + avg + '%)', x: 'Kiểm tra số lead chưa ghi kết quả của tuần đó trước khi kết luận.' }); }
  var exp = ops.filter(function (o) { return o.kind === 'expired'; }).length, soon = ops.filter(function (o) { return o.kind === 'soon'; }).length;
  if (exp) items.push({ lv: 'red', t: exp + ' khách đã hết hạn nhưng còn buổi chưa dùng', x: 'Quyết định gia hạn hay đặt lịch bù (bảng “Khách vận hành cần xử lý”).' });
  if (soon) items.push({ lv: 'amber', t: soon + ' khách sắp hết hạn trong 10 ngày', x: 'Nhắc khách đặt lịch trước hạn.' });
  if (staleSched) items.push({ lv: 'amber', t: staleSched + ' buổi còn trạng thái “scheduled” nhưng ngày đã qua', x: 'Có thể là dữ liệu thử hoặc chưa cập nhật — dọn lại trong Sheet Sessions.' });
  items.sort(function (a, b) { return (a.lv === 'red' ? 0 : 1) - (b.lv === 'red' ? 0 : 1); });
  var wkEnd = new Date(thisMon); wkEnd.setDate(wkEnd.getDate() + 6);
  var rate = wkPct_(regOf(inWin), inWin.length), nrWin = noResOf(inWin);

  var h = pageHeader('Báo cáo tuần', 'Lead chốt lịch, tỷ lệ chốt, theo người phụ trách, lý do chưa đăng ký, khách vận hành và việc follow-up — tự tính từ Sheet mỗi lần mở',
    '<button class="update-btn" onclick="window.print()">⬇ Xuất PDF</button>');
  h += '<div class="card period-bar"><div class="period-bar-inner"><div class="period-nav"><div class="period-label">Từ ' + wkLbl_(winStart) + ' đến ' + wkLbl_(now) + '/' + now.getFullYear() + '</div></div>' +
    '<label style="font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center">Xem gộp <select class="form-select" style="padding:6px 10px;width:auto" onchange="WK.weeks=+this.value;reportRerender()">' +
    [1, 2, 4, 8].map(function (w) { return '<option value="' + w + '"' + (W === w ? ' selected' : '') + '>' + w + ' tuần gần nhất</option>'; }).join('') + '</select></label></div></div>';
  h += '<div id="report-printable"><div class="print-only"><h2 style="margin:0 0 4px">Báo cáo tuần LinkaJob</h2><div style="color:#666;font-size:13px;margin-bottom:16px">' + wkLbl_(winStart) + ' – ' + wkLbl_(now) + '/' + now.getFullYear() + '</div></div>';

  var redN = items.filter(function (x) { return x.lv === 'red'; }).length;
  h += '<div class="rp-banner ' + (redN ? 'red' : (items.length ? 'amber' : 'green')) + '"><span class="rp-ic">' + (redN ? '⚠️' : (items.length ? '👀' : '✅')) + '</span><div><b>' +
    (items.length ? 'Cần chú ý: ' + redN + ' vấn đề nghiêm trọng, ' + (items.length - redN) + ' cần theo dõi' : 'Không có cảnh báo trong kỳ này') + '</b></div></div>';
  if (items.length) h += '<div class="rp-act">' + items.map(function (x) { return '<div class="rp-act-i"><span class="rp-dot ' + x.lv + '"></span><div><div class="rp-act-t">' + escHtml(x.t) + '</div><div class="rp-act-x">' + escHtml(x.x) + '</div></div></div>'; }).join('') + '</div>';

  var kp = function (cls, l, v, d) { return '<div class="rp-kpi ' + cls + '"><div class="l">' + l + '</div><div class="v">' + v + '</div><div class="d">' + d + '</div></div>'; };
  h += '<div class="rp-kpis">' +
    kp('', 'Lead đã chốt lịch', inWin.length, '<span class="rp-d-n">' + W + ' tuần gần nhất · có link Meet</span>') +
    kp(rate === null ? '' : (rate < 20 ? 'red' : rate < 35 ? 'amber' : 'green'), 'Tỷ lệ chốt', rate === null ? '—' : rate + '%', '<span class="rp-d-n">' + regOf(inWin) + ' đăng ký / ' + inWin.length + ' lead</span>') +
    kp(nrWin ? 'amber' : 'green', 'Chưa ghi kết quả', nrWin, '<span class="rp-d-n">Đã tư vấn xong nhưng chưa chọn kết quả</span>') +
    kp('', 'Booking mới tuần này', bkThis.length, '<span class="rp-d-n">' + ljRevMoney_(sumP(bkThis)) + ' · tuần trước ' + bkLast.length + ' (' + ljRevMoney_(sumP(bkLast)) + ')</span>') + '</div>';

  h += sec('Số khách và tỷ lệ chốt theo tuần tư vấn', 'chỉ tính lead đã chốt lịch (có link Meet), xếp theo ngày tư vấn');
  h += tbl(['TUẦN BẮT ĐẦU', 'LEAD CHỐT LỊCH', 'ĐĂNG KÝ', 'TỶ LỆ CHỐT', '', 'CHƯA GHI KẾT QUẢ', 'SẮP DIỄN RA'], weekRows, 'Chưa có dữ liệu.', [1, 2, 3, 5, 6]);
  h += '<div style="font-size:12px;color:var(--muted);margin:-8px 4px 14px">Tỷ lệ chốt = lead có kết quả “Đăng ký” hoặc đã chuyển thành khách ÷ lead đã chốt lịch. Tuần gần đây còn thấp vì nhiều lead chưa ghi kết quả hoặc chưa tới buổi.</div>';

  h += '<div class="two-col"><div>' + sec('Team Sale · theo người phụ trách', wkLbl_(winStart) + ' – ' + wkLbl_(now)) +
    tbl(['NGƯỜI PHỤ TRÁCH', 'CHỐT LỊCH', 'ĐĂNG KÝ', 'TỶ LỆ', 'CHƯA GHI KQ'], staffRows, 'Chưa có lead chốt lịch trong kỳ.', [1, 2, 3, 4]) +
    (inWin.length && inWin.length < 15 ? '<div style="font-size:12px;color:var(--muted);margin:-8px 4px 10px">Mẫu còn nhỏ (' + inWin.length + ' lead) nên chưa đủ để so sánh từng người.</div>' : '') + '</div>' +
    '<div>' + sec('Kết quả & lý do chưa đăng ký') + tbl(['KẾT QUẢ', 'SỐ LEAD', '%'], resRows, 'Chưa có dữ liệu.', [1, 2]) + '</div></div>';

  h += sec('Khách vận hành cần xử lý (' + ops.length + ')', 'hết hạn còn buổi · sắp hết hạn 10 ngày · mua nhưng chưa dùng');
  h += '<div class="card" style="margin-bottom:6px"><div style="padding:14px 24px;font-size:13px;line-height:1.7">Tổng <b>' + conf.length + '</b> booking · <b>' + sold + '</b> buổi đã bán · <b>' + done + '</b> đã hoàn thành' + (sold ? ' (' + wkPct_(done, sold) + '%)' : '') + ' · <b>' + sched + '</b> đang “scheduled” · <b>' + canc + '</b> huỷ' + (staleSched ? ' · <span style="color:#D97706;font-weight:700">' + staleSched + ' buổi scheduled đã quá ngày</span>' : '') + '</div></div>';
  h += tbl(['KHÁCH', 'ADVISOR', 'GÓI', 'CÒN LẠI', 'HẠN', 'VẤN ĐỀ'], opsRows, '✓ Không có khách nào cần xử lý gấp.') + (ops.length > 15 ? '<div style="font-size:12px;color:var(--muted);margin:-8px 4px 14px">Hiển thị 15 / ' + ops.length + ' khách.</div>' : '');

  h += '<div class="two-col"><div>' + sec('Ngành khách quan tâm', 'lead chốt lịch trong kỳ') + tbl(['NGÀNH', 'LEAD'], deptRows, 'Chưa có lead điền ngành.', [1]) + '</div>' +
    '<div>' + sec('Câu hỏi khách điền', qList.length + ' / ' + inWin.length + ' lead có điền') +
    '<div class="card"><div style="padding:6px 24px 14px;max-height:260px;overflow:auto">' + (qList.length ? qList.map(function (n) { return '<div style="padding:8px 0;border-bottom:1px solid var(--border);font-size:13px"><b>' + escHtml(n.name) + '</b> <span style="color:var(--muted);font-size:11.5px">' + fmtDMY(n.date) + '</span><div style="color:#374151;margin-top:2px;white-space:pre-wrap">' + escHtml(n.question) + '</div></div>'; }).join('') : '<div class="today-empty">Chưa có câu hỏi nào.</div>') + '</div></div></div></div>';

  h += sec('Follow-up hôm nay') + wkFollowCard_(g, {});

  var badNext = booked.filter(function (n) { return n.deadline && !wkParseDate_(n.deadline); }).length;
  var noNext = booked.filter(function (n) { return !n.deadline; }).length;
  var noContact = booked.filter(function (n) { return !n.contacted; }).length;
  h += sec('Chất lượng dữ liệu') + '<div class="card"><div style="padding:14px 24px;font-size:13px;line-height:1.9">' +
    '• Lead đã chốt lịch chưa có kết quả (đã qua giờ hẹn): <b>' + nrAll + '</b> / ' + booked.length + '<br>' +
    '• Lead chốt lịch chưa có ngày hạn follow-up (next_step_deadline): <b>' + noNext + '</b>' + (badNext ? ' · <span style="color:#DC2626">' + badNext + ' ô đang chứa chữ thay vì ngày</span>' : '') + '<br>' +
    '• Lead chốt lịch chưa điền ngày liên hệ (contacted_date): <b>' + noContact + '</b><br>' +
    '• Lead chưa gán người phụ trách: <b>' + g.unassigned.length + '</b></div></div>';
  return h + '</div>';
};

// ───────────────────────── Nút con mắt hiện / ẩn mật khẩu ─────────────────────────
(function () {
  var EYE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  var EYE_OFF = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  function addEye(inp) {
    if (inp.dataset.ljEye) return;
    inp.dataset.ljEye = '1';
    var wrap = document.createElement('div');
    wrap.style.cssText = 'position:relative;width:100%';
    inp.parentNode.insertBefore(wrap, inp);
    wrap.appendChild(inp);
    inp.style.paddingRight = '44px';
    var b = document.createElement('button');
    b.type = 'button';
    b.title = 'Hiện / ẩn mật khẩu';
    b.setAttribute('aria-label', 'Hiện hoặc ẩn mật khẩu');
    b.innerHTML = EYE;
    b.style.cssText = 'position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#777;padding:6px;display:flex;align-items:center';
    b.onclick = function () {
      var show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      b.innerHTML = show ? EYE_OFF : EYE;
      inp.focus();
    };
    wrap.appendChild(b);
  }
  function scan() {
    document.querySelectorAll('input[type="password"]').forEach(addEye);
  }
  scan();
  new MutationObserver(scan).observe(document.body, { childList: true, subtree: true });
})();
</script>
