// Bước 2: người dùng bấm nút xác nhận riêng thì mới thực sự gửi request đặt lịch
function confirmBookSession() {
  var ctx = _bookSessionCtx;
  var sel = _bookSessionSelected;
  if (!sel) { toast('Vui lòng chọn 1 khung giờ trước!', 'error'); return; }
  var ae = MOCK.advisees.find(function(x){ return x.id === ctx.aeId; });
  if (!ae) return;

  var btn = document.querySelector('#modal-actions .login-btn');
  if (btn) { btn.innerHTML = '<span class="spinner"></span> Đang đặt lịch...'; btn.disabled = true; }

  apiPost({
    action: 'bookSession',
    slot_id: sel.slotId,
    booking_id: ae.bookingId,
    session_number: ctx.sessionNo,
    advisee_name: ae.name,
  }).then(function(res){
    if (!res || !res.success) {
      toast('Lỗi: ' + (res && res.error ? res.error : 'không đặt được lịch — slot có thể vừa bị người khác chọn'), 'error');
      _bookSessionSelected = null;
      openBookSessionModal(ctx.aeId, ctx.sessionNo);
      return;
    }
    var s = ae.sessions.find(function(x){ return x.no === ctx.sessionNo; });
    if (s) {
      s.date = sel.date;
      s.timeStart = sel.time;
      s.session_id = res.session_id; // backend trả về session_id thật vừa tạo
      s.status = 'upcoming';
      // Backend luôn tạo session với duration_minutes = 60 (xem action bookSession)
      var parts = sel.time.split(':');
      var endMins = (Number(parts[0])||0) * 60 + (Number(parts[1])||0) + 60;
      var eh = Math.floor(endMins / 60) % 24, em = endMins % 60;
      s.timeEnd = (eh<10?'0':'') + eh + ':' + (em<10?'0':'') + em;
    }
    toast('Đã đặt lịch buổi ' + ctx.sessionNo + ' ✅', 'success');
    _bookSessionSelected = null;
    closeModal();
    document.getElementById('main-content').innerHTML = renderMyBookings();
  }).catch(function(err){
    toast('Lỗi kết nối: ' + err.message, 'error');
    if (btn) { btn.innerHTML = 'Xác nhận đặt lịch →'; btn.disabled = false; }
  });
}

  html += '<span style="background:var(--brand-light);color:var(--brand);font-size:12px;font-weight:700;padding:4px 12px;border-radius:100px">Gói ' + ae.pkg + '</span>';
  html += '<span style="background:var(--bg);color:var(--muted);font-size:12px;font-weight:600;padding:4px 12px;border-radius:100px">' + ae.bookingId + '</span>';
  html += '<span style="background:var(--green-bg);color:var(--green);font-size:12px;font-weight:700;padding:4px 12px;border-radius:100px">' + ae.sessionsDone + '/' + ae.sessionsTotal + ' buổi</span>';
  html += '<span style="background:#F3F4F6;color:var(--muted);font-size:12px;font-weight:600;padding:4px 12px;border-radius:100px">Hết hạn ' + ae.expiry + '</span>';
  html += '</div></div>';
  // Progress bar
  html += '<div style="text-align:right;min-width:80px"><div style="font-size:24px;font-weight:800;color:var(--brand)">' + pctOf(ae.sessionsDone, ae.sessionsTotal) + '%</div><div style="font-size:11px;color:var(--muted)">hoàn thành</div></div>';
  html += '</div></div>';

  // ── Danh sách buổi meeting ──
  html += '<div class="card"><div class="card-header"><div class="card-header-left">Các buổi meeting</div></div>';
  ae.sessions.forEach(function(s) {
    var d = s.date ? new Date(s.date + 'T00:00:00') : null;
    var dow = d ? ['CN','T2','T3','T4','T5','T6','T7'][d.getDay()] : '';
    var dateLabel = d ? dow + ' ' + d.getDate() + '/' + (d.getMonth()+1) + '/' + d.getFullYear() + ' · ' + s.timeStart + '–' + s.timeEnd : 'Chưa xếp lịch';

    var statusCfg = {
      done     : { bg:'var(--green-bg)',  color:'var(--green)',  label:'✓ Hoàn thành' },
      feedback : { bg:'#FFF7ED',          color:'#C2410C',       label:'Cần feedback' },
      upcoming : { bg:'#EFF6FF',          color:'#1D4ED8',       label:'Sắp tới' },
      locked   : { bg:'var(--bg)',        color:'var(--muted)',  label:'Đã khoá' },
    };
    var sc = statusCfg[s.status] || statusCfg.locked;

    var needNote = (s.status === 'done' || s.status === 'feedback') && !s.advisorNotes;

    html += '<div style="display:flex;align-items:center;gap:14px;padding:14px 24px;border-top:1px solid var(--border)">';
    // Số buổi
    html += '<div style="width:32px;height:32px;border-radius:50%;background:' + sc.bg + ';color:' + sc.color + ';display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0">' + s.no + '</div>';
    // Info
    html += '<div style="flex:1"><div style="font-weight:600;font-size:14px">Buổi ' + s.no + '</div>';
    html += '<div style="font-size:12px;color:var(--muted);margin-top:2px">' + dateLabel + '</div></div>';
    // Tags
    html += '<span style="background:' + sc.bg + ';color:' + sc.color + ';font-size:12px;font-weight:700;padding:4px 12px;border-radius:100px">' + sc.label + '</span>';
    if (needNote) html += '<span style="background:#FEF3C7;color:#92400E;font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px">Cần nhận xét</span>';
    // Meet link
    if (s.meetLink && s.status !== 'locked') html += '<a href="' + s.meetLink + '" target="_blank" class="detail-btn" style="font-size:12px;padding:6px 12px">🎥 Meet</a>';
    // Chi tiết
    if (s.status !== 'locked') {
      html += '<button class="detail-btn" onclick="openSessionDetailModal(\'' + aeId + '\',' + s.no + ')" style="font-size:12px;padding:6px 12px">Chi tiết</button>';
    }
    html += '</div>';
  });
  html += '</div>';
  return html;
}

// ── Modal chi tiết từng buổi meeting ──
function openSessionDetailModal(aeId, sessionNo) {
  var ae = MOCK.advisees.find(function(x){ return x.id === aeId; });
  if (!ae) return;
  var s = ae.sessions.find(function(x){ return x.no === sessionNo; });
  if (!s) return;

  var d = s.date ? new Date(s.date + 'T00:00:00') : null;
  var dow = d ? ['CN','T2','T3','T4','T5','T6','T7'][d.getDay()] : '';
  var dateLabel = d ? dow + ' ' + d.getDate() + '/' + (d.getMonth()+1) + '/' + d.getFullYear() + ' · ' + s.timeStart + '–' + s.timeEnd : 'Chưa xếp lịch';

  document.getElementById('modal-title').textContent = ae.name + ' · Buổi ' + sessionNo;

  var body = '';

  // Thời gian + link Meet
  body += '<div style="display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:10px;padding:12px 16px;margin-bottom:16px;flex-wrap:wrap;gap:8px">';
  body += '<div><div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px">Thời gian</div><div style="font-size:14px;font-weight:600">' + dateLabel + '</div></div>';
  body += '<div style="display:flex;gap:8px">';
  if (s.meetLink) body += '<a href="' + s.meetLink + '" target="_blank" class="detail-btn">🎥 Vào Meet</a>';
  if (s.status === 'upcoming' && s.date) body += '<button class="detail-btn" onclick="closeModal();openRescheduleModal(\'' + ae.id + '\',' + sessionNo + ',\'advisor\')">🔄 Đổi giờ</button>';
  body += '</div></div>';

  // Prep info từ Advisee
  body += '<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px">Chuẩn bị của Advisee</div>';
  body += renderPrepCard(s.prepInfo);

  // Feedback của Advisee cho Advisor (nếu có)
  if (s.feedback) {
    body += '<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:14px 0 8px">Feedback của Advisee</div>';
    body += '<div style="background:#FFF7ED;border:1.5px solid #FED7AA;border-radius:10px;padding:12px 14px">';
    var stars = '';
    for (var i=1;i<=5;i++) stars += '<span style="color:' + (i<=s.feedback.rating?'#F59E0B':'#D1D5DB') + ';font-size:15px">★</span>';
    body += '<div style="margin-bottom:6px">' + stars + '</div>';
    if (s.feedback.text) body += '<div style="font-size:13px;color:var(--text);line-height:1.65">' + s.feedback.text + '</div>';
    body += '</div>';
  }

  // Advisor notes — đã có hoặc form điền mới
  body += '<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:14px 0 8px">Nhận xét của Advisor</div>';
  if (s.advisorNotes) {
    body += renderAdvisorNotesCard(s.advisorNotes, false, null, s.no);
    body += '<div style="margin-top:8px;text-align:right"><button class="anote-edit-btn" style="font-size:12px" onclick="openAdvisorNotesEdit(\'' + aeId + '\',' + sessionNo + ')">✎ Sửa nhận xét</button></div>';
  } else if (s.status === 'done' || s.status === 'feedback') {
    // Form nhận xét inline trong modal
    body += '<div style="background:#FAF5FF;border:1.5px solid #E9D5FF;border-radius:10px;padding:14px">';
    body += '<div style="font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Nội dung đã trao đổi <span style="color:var(--brand)">*</span></div>';
    body += '<textarea class="anote-input" id="an-summary-' + aeId + '-' + sessionNo + '" rows="3" placeholder="Tóm tắt nội dung chính đã thảo luận..."></textarea>';
    body += '<div style="font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 6px">Nhận xét & Góp ý <span style="color:var(--brand)">*</span></div>';
    body += '<textarea class="anote-input" id="an-feedback-' + aeId + '-' + sessionNo + '" rows="3" placeholder="Điểm mạnh, điểm cần cải thiện..."></textarea>';
    body += '<div style="font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 6px">Việc cần làm trước buổi sau</div>';
    body += '<textarea class="anote-input" id="an-actions-' + aeId + '-' + sessionNo + '" rows="2" placeholder="1. Cập nhật CV...\n2. Đọc case study..."></textarea>';
    body += '</div>';
  } else {
    body += '<div class="anote-missing">Buổi chưa diễn ra.</div>';
  }

  document.getElementById('modal-body').innerHTML = body;

  // Actions
  var actions = '<button class="btn-secondary" onclick="closeModal()" style="width:auto;padding:10px 20px">Đóng</button>';
  if (!s.advisorNotes && (s.status === 'done' || s.status === 'feedback')) {
    actions += '<button class="login-btn" onclick="submitAdvisorNotes(\'' + aeId + '\',' + sessionNo + ')" style="width:auto;padding:10px 24px;background:#7C3AED">Gửi nhận xét →</button>';
  }
  document.getElementById('modal-actions').innerHTML = actions;
  document.getElementById('modal-overlay').classList.add('open');
}


// ════════════════════════════════════════════════════════════
//  ĐỔI GIỜ MEETING — Advisor/Advisee đề xuất, Staff xác nhận
// ════════════════════════════════════════════════════════════
function openRescheduleModal(aeId, sessionNo, requestedBy) {
  var ae = MOCK.advisees.find(function(x){ return x.id === aeId; });
  if (!ae) return;
  var s = ae.sessions.find(function(x){ return x.no === sessionNo; });
  if (!s) return;

  document.getElementById('modal-title').textContent = '🔄 Đổi giờ meeting — Buổi ' + sessionNo;
  var body = '<div style="font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:14px">Điền lý do không thể tham gia và đề xuất 2 khung giờ khác. Staff sẽ xác nhận và thông báo cho ' + (requestedBy === 'advisee' ? 'Advisor' : 'Advisee') + ' qua Zalo/Email.</div>';
  body += '<div class="form-label" style="margin-bottom:6px">Lý do <span style="color:var(--brand)">*</span></div>';
  body += '<textarea class="form-textarea" id="rs-reason" rows="2" placeholder="VD: Đột xuất có việc bận trùng giờ..." style="margin-bottom:14px"></textarea>';
  body += '<div class="form-label" style="margin-bottom:6px">Đề xuất khung giờ 1 <span style="color:var(--brand)">*</span></div>';
  body += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">';
  body += '<input class="form-input" type="date" id="rs-date1"><input class="form-input" type="time" id="rs-time1">';
  body += '</div>';
  body += '<div class="form-label" style="margin-bottom:6px">Đề xuất khung giờ 2 <span style="color:var(--brand)">*</span></div>';
  body += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">';
  body += '<input class="form-input" type="date" id="rs-date2"><input class="form-input" type="time" id="rs-time2">';
  body += '</div>';

  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal-actions').innerHTML =
    '<button class="btn-secondary" onclick="closeModal()" style="width:auto;padding:10px 20px">Huỷ</button>' +
    '<button class="login-btn" onclick="submitRescheduleRequest(\'' + aeId + '\',' + sessionNo + ',\'' + requestedBy + '\')" style="width:auto;padding:10px 24px">Gửi yêu cầu đổi giờ →</button>';
  document.getElementById('modal-overlay').classList.add('open');
}

function submitRescheduleRequest(aeId, sessionNo, requestedBy) {
  var ae = MOCK.advisees.find(function(x){ return x.id === aeId; });
  if (!ae) return;
  var s = ae.sessions.find(function(x){ return x.no === sessionNo; });
  if (!s || !s.date || !s.timeStart) { toast('Buổi này chưa có lịch cụ thể — không thể yêu cầu đổi giờ', 'error'); return; }

  var reason = document.getElementById('rs-reason').value.trim();
  var d1 = document.getElementById('rs-date1').value, t1 = document.getElementById('rs-time1').value;
  var d2 = document.getElementById('rs-date2').value, t2 = document.getElementById('rs-time2').value;
  if (!reason || !d1 || !t1 || !d2 || !t2) { toast('Vui lòng điền đầy đủ lý do và 2 khung giờ đề xuất', 'error'); return; }

  var btn = document.querySelector('#modal-actions .login-btn');
  if (btn) { btn.innerHTML = '<span class="spinner"></span> Đang gửi...'; btn.disabled = true; }

  apiPost({
    action: 'submitRescheduleRequest',
    session_id: s.session_id,
    requested_by: requestedBy, // 'advisor' hoặc 'advisee'
    reason: reason,
    option1_date: d1, option1_time: t1, option2_date: d2, option2_time: t2,
  }).then(function(res){
    if (!res || !res.success) {
      toast('Lỗi: ' + (res && res.error ? res.error : 'không gửi được, thử lại'), 'error');
      if (btn) { btn.innerHTML = 'Gửi yêu cầu đổi giờ →'; btn.disabled = false; }
      return;
    }
    toast('Đã gửi yêu cầu đổi giờ — Staff sẽ xác nhận sớm ✅', 'success');
    closeModal();
  }).catch(function(err){
    toast('Lỗi kết nối: ' + err.message, 'error');
    if (btn) { btn.innerHTML = 'Gửi yêu cầu đổi giờ →'; btn.disabled = false; }
  });
}

function loadRescheduleRequestsPage() {
  var c = document.getElementById('main-content');
  c.innerHTML = pageHeader('Yêu cầu đổi lịch', 'Advisor và Advisee đề xuất đổi giờ meeting, cần Staff xác nhận') + skeletonRows(3);

  // Backend chỉ lưu session_id trong RescheduleRequests — cần ghép thêm Sessions
  // để lấy tên advisee/advisor/số buổi hiển thị.
  Promise.all([
    apiGet('getRescheduleRequests', {}),
    apiGet('getSessions', {}),
  ]).then(function(results){
    var reqs = (results[0] && results[0].data) ? results[0].data : [];
    var allSessions = (results[1] && results[1].data) ? results[1].data : [];
    var sessById = {};
    allSessions.forEach(function(s){ sessById[s.session_id] = s; });
    reqs.forEach(function(r){
      var s = sessById[r.session_id];
      r._ae_name = s ? s.advisee_name : '';
      r._advisor_name = s ? s.advisor_name : '';
      r._session_no = s ? s.session_number : '';
    });
    window._rescheduleRequests = reqs;
    c.innerHTML = renderRescheduleRequestsPage(reqs);
  }).catch(function(err){
    c.innerHTML = pageHeader('Yêu cầu đổi lịch', 'Advisor và Advisee đề xuất đổi giờ meeting, cần Staff xác nhận') +
      '<div class="card"><div class="empty-state"><div class="icon">⚠</div>Không tải được danh sách yêu cầu.<br><small style="color:var(--muted)">' + err.message + '</small></div></div>';
  });
}

function renderRescheduleRequestsPage(reqs) {
  reqs = reqs || window._rescheduleRequests || [];
  var html = pageHeader('Yêu cầu đổi lịch', 'Advisor và Advisee đề xuất đổi giờ meeting, cần Staff xác nhận');
  var pending = reqs.filter(function(r){ return String(r.status||'').trim().toLowerCase() === 'pending'; });
  var resolved = reqs.filter(function(r){ return String(r.status||'').trim().toLowerCase() !== 'pending'; });
  setNavBadge('aee-reschedule', pending.length);

  html += '<div class="card" style="margin-bottom:16px"><div class="card-header"><div class="card-header-left">Đang chờ xác nhận (' + pending.length + ')</div><button class="refresh-btn" onclick="loadRescheduleRequestsPage()">↻</button></div>';
  if (pending.length === 0) {
    html += '<div class="empty-state"><div class="icon">✅</div>Không có yêu cầu đổi lịch nào đang chờ</div>';
  } else {
    pending.forEach(function(r){
      var aeName = r._ae_name || '(không rõ)';
      html += '<div style="padding:16px 24px;border-top:1px solid var(--border)">';
      html += '<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">' + avatarCircle(aeName, 36);
      html += '<div style="flex:1"><div style="font-weight:700;font-size:14px">' + aeName + (r._session_no ? ' · Buổi ' + r._session_no : '') + '</div>';
      html += '<div style="font-size:12px;color:var(--muted)">' + (r._advisor_name ? 'Advisor: ' + r._advisor_name + ' · ' : '') + 'Đề xuất bởi: ' + (r.requested_by==='advisee'?'Advisee':'Advisor') + ' · ' + r.created_at + '</div></div>';
      html += '<button class="update-btn" style="border-color:var(--brand);color:var(--brand)" onclick="rejectReschedule(\'' + r.request_id + '\')">Từ chối</button>';
      html += '</div>';
      html += '<div style="font-size:13px;color:var(--text);background:var(--bg);border-radius:8px;padding:10px 12px;margin-bottom:10px"><b>Lý do:</b> ' + r.reason + '</div>';
      html += '<div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Chọn 1 khung giờ để xác nhận</div>';
      html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">';
      html += '<button class="detail-btn" style="padding:12px" onclick="confirmReschedule(\'' + r.request_id + '\',\'' + r.option1_date + '\',\'' + r.option1_time + '\')">📅 ' + fmtDateStr(r.option1_date) + ' · ' + r.option1_time + '</button>';
      html += '<button class="detail-btn" style="padding:12px" onclick="confirmReschedule(\'' + r.request_id + '\',\'' + r.option2_date + '\',\'' + r.option2_time + '\')">📅 ' + fmtDateStr(r.option2_date) + ' · ' + r.option2_time + '</button>';
      html += '</div></div>';
    });
  }
  html += '</div>';

  if (resolved.length > 0) {
    html += '<div class="card"><div class="card-header"><div class="card-header-left">Đã xử lý</div></div>';
    resolved.forEach(function(r){
      var st = String(r.status||'').trim().toLowerCase();
      var aeName = r._ae_name || '(không rõ)';
      var tag = st === 'confirmed' ? '<span class="badge badge-confirmed">✓ Đã xác nhận</span>' : '<span class="badge badge-cancelled">Đã từ chối</span>';
      html += '<div style="display:flex;align-items:center;gap:12px;padding:14px 24px;border-top:1px solid var(--border)">' + avatarCircle(aeName, 32);
      html += '<div style="flex:1"><div style="font-weight:600;font-size:13px">' + aeName + (r._session_no ? ' · Buổi ' + r._session_no : '') + '</div><div style="font-size:12px;color:var(--muted)">' + r.reason + '</div></div>' + tag + '</div>';
    });
    html += '</div>';
  }
  return html;
}

function confirmReschedule(reqId, chosenDate, chosenTime) {
  apiPost({
    action: 'resolveRescheduleRequest',
    request_id: reqId,
    approve: true,
    confirmed_date: chosenDate,
    confirmed_time: chosenTime,
  }).then(function(res){
    if (!res || !res.success) { toast('Lỗi: ' + (res && res.error ? res.error : 'không xác nhận được'), 'error'); return; }
    toast('Đã xác nhận đổi giờ ✅', 'success');
    loadRescheduleRequestsPage();
  }).catch(function(err){ toast('Lỗi kết nối: ' + err.message, 'error'); });
}

function rejectReschedule(reqId) {
  apiPost({ action: 'resolveRescheduleRequest', request_id: reqId, approve: false }).then(function(res){
    if (!res || !res.success) { toast('Lỗi: ' + (res && res.error ? res.error : 'không từ chối được'), 'error'); return; }
    toast('Đã từ chối yêu cầu', 'success');
    loadRescheduleRequestsPage();
  }).catch(function(err){ toast('Lỗi kết nối: ' + err.message, 'error'); });
}


function submitBooking() {
  const btn = document.getElementById('submit-booking-btn');
  const msg = document.getElementById('submit-msg');
  const data = {
    advisee_name: v('f-advisee-name'), advisee_phone: v('f-advisee-phone'),
    advisee_email: v('f-advisee-email'), advisee_year: v('f-advisee-year'),
    advisee_industry: v('f-advisee-industry'), advisee_goal: v('f-goal'),
    advisor_name: v('f-advisor-name'), advisor_email: v('f-advisor-email'),
    package_name: document.getElementById('f-package').value
  };
  if (!data.advisee_name || !data.advisee_email || !data.advisor_name) { toast('Điền đầy đủ các trường bắt buộc (*)', 'error'); return; }
  btn.innerHTML = '<span class="spinner"></span> Đang gửi...'; btn.disabled = true;
  apiPost(data).then(function(res){
    if (res && res.success) {
      toast('Booking ' + res.booking_id + ' đã tạo!', 'success');
      msg.textContent = 'ID: ' + res.booking_id;
      msg.style.color = 'var(--green)';
    } else {
      toast('Lỗi: ' + (res && res.error), 'error');
      msg.textContent = res && res.error;
      msg.style.color = 'var(--brand)';
    }
    btn.innerHTML = 'Tạo Booking &amp; Gửi Email'; btn.disabled = false;
  }).catch(function(e){
    toast('Lỗi: ' + e.message, 'error');
    msg.textContent = e.message; msg.style.color = 'var(--brand)';
    btn.innerHTML = 'Tạo Booking &amp; Gửi Email'; btn.disabled = false;
  });
}

function confirmBooking(id) {
  apiPost({ action: 'updateStatus', booking_id: id, status: 'confirmed' }).then(function(res){
    if (res && res.success) { toast('Đã xác nhận! Email & Meet link đã gửi.', 'success'); loadDashboard('Staff','all-bookings'); }
    else toast('Vào Sheet, cột Status, đổi thành confirmed.', 'error');
  }).catch(function(){ toast('Vào Sheet, cột Status, đổi thành confirmed.', 'error'); });
}

function markComplete(id) {
  apiPost({ action: 'updateStatus', booking_id: id, status: 'completed' }).then(function(res){
    if (res && res.success) { toast('Đã đánh dấu hoàn thành!', 'success'); loadDashboard('Advisor','booked'); }
    else toast('Vào Sheet, cột Status, đổi thành completed.', 'error');

// ════════════════════════════════════════════════════════════
//  QUY TẮC ĐẶT LỊCH CỐ VẤN 1:1 (khớp với Apps Script: PREP_RULE)
//   • Đặt lịch trước giờ hẹn ít nhất BOOK_MIN_HOURS giờ.
//   • Gửi câu hỏi chuẩn bị chậm nhất PREP_DEADLINE_HOURS giờ trước giờ hẹn (hệ thống gửi email nhắc);
//     quá hạn mà chưa gửi → buổi tự huỷ, khách phải đặt lại.
//  Muốn đổi số giờ: sửa 2 số dưới đây VÀ PREP_RULE trong Apps Script cho khớp.
// ════════════════════════════════════════════════════════════
var BOOK_MIN_HOURS = 24;
var PREP_DEADLINE_HOURS = 20;
function sessionStartMs_(date, time) {
  var t = fmtHHMM(time), d = String(date || '').slice(0, 10);
  if (!d || !t) return NaN;
  return new Date(d + 'T' + t + ':00').getTime();
}
function prepDeadlineInfo_(date, time) {
  var st = sessionStartMs_(date, time);
  if (isNaN(st)) return null;
  var dl = st - PREP_DEADLINE_HOURS * 3600000, d = new Date(dl);
  return { ms: dl, hoursLeft: (dl - Date.now()) / 3600000, label: pad(d.getHours()) + ':' + pad(d.getMinutes()) + ' ngày ' + d.getDate() + '/' + (d.getMonth() + 1) };
}
// Nhãn nhỏ cho Sale/Admin theo dõi: đã gửi câu hỏi chưa, hạn là khi nào
function prepBadgeHtml_(date, time, prepRequired, hasPrep) {
  if (!prepRequired) return '';
  if (hasPrep) return '<span style="background:#ECFDF5;color:#065F46;font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px;white-space:nowrap">✓ Đã gửi câu hỏi</span>';
  var pd = prepDeadlineInfo_(date, time);
  if (!pd) return '';
  var urgent = pd.hoursLeft <= 6;
  return '<span style="background:' + (urgent ? '#FEE2E2' : '#FEF3C7') + ';color:' + (urgent ? '#B91C1C' : '#92400E') + ';font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px;white-space:nowrap" title="Quá hạn mà chưa gửi câu hỏi thì buổi tự huỷ">' +
    (pd.hoursLeft <= 0 ? '⚠ Quá hạn gửi câu hỏi' : '⏰ Chưa gửi câu hỏi — hạn ' + pd.label) + '</span>';
}

// ════════════════════════════════════════════════════════════
//  SẮP XẾP DANH SÁCH (dùng chung cho: Leads tư vấn, Lịch tư vấn, Chưa đặt lịch, Advisee, Khách đã mua)
//  Mặc định: MỚI ĐĂNG KÝ NHẤT lên đầu. Mỗi người chọn cách xếp riêng; lựa chọn được nhớ trên trình duyệt đó.
// ════════════════════════════════════════════════════════════
var SORT_OPTS_ = {
  lead: [['newest','Mới đăng ký nhất'],['oldest','Cũ nhất'],['name','Tên A → Z'],['when','Giờ hẹn gần nhất'],['prio','Ưu tiên cần xử lý']],
  ae:   [['newest','Mới đăng ký nhất'],['oldest','Cũ nhất'],['name','Tên A → Z'],['expiry_soon','Sắp hết hạn trước'],['expiry_late','Hết hạn xa nhất'],['prio','Ưu tiên khách đang dùng']]
};
function sortPref_(kind) {
  var v = '';
  try { v = localStorage.getItem('lj_sort_' + kind) || ''; } catch (e) {}
  return SORT_OPTS_[kind].some(function(o){ return o[0] === v; }) ? v : 'newest';
}
function setSortPref_(kind, v) { try { localStorage.setItem('lj_sort_' + kind, v); } catch (e) {} }
function tsOf_(v) {
  if (!v) return 0;
  var d = parseLeadCreated(v);
  return (d && !isNaN(d.getTime())) ? d.getTime() : 0;
}
// Khoá sắp xếp của 1 lead (kind='lead') hoặc 1 advisee (kind='ae')
function sortKeys_(kind, o) {
  var k = { name: stripDiacritics(o.name || ''), created: 0, when: NaN, expiry: NaN, prio: 0 };
  if (kind === 'lead') {
    k.created = tsOf_(o.createdAt);
    if (!k.created) { var an = getLeadAnchor(o); k.created = an ? an.getTime() : 0; }
    if (o.date) { var w = new Date(o.date + 'T' + (o.time || '00:00')).getTime(); if (!isNaN(w)) k.when = w; }
    var s = getLeadSlaInfo(o);
    k.prio = leadPriority(o) * 1000 - ((s && s.overdue) ? Math.min(s.days || 0, 999) : 0);
  } else {
    k.created = tsOf_(o.createdAtRaw) || tsOf_(o.registeredAt);
    if (o.expiry) { var e = new Date(o.expiry + 'T00:00:00').getTime(); if (!isNaN(e)) k.expiry = e; }
    var ex = expiryAlert_(o);
    k.prio = ex.group * 1000000 + Math.min(ex.rank, 999999);
  }
  return k;
}
function sortCmp_(mode) {
  var td = new Date(); td.setHours(0, 0, 0, 0); var today0 = td.getTime(), now = Date.now();
  var c3 = function(x, y) { return x < y ? -1 : (x > y ? 1 : 0); };
  return function(a, b) {
    var r = 0;
    if (mode === 'oldest') r = c3(a.created, b.created);
    else if (mode === 'name') r = String(a.name).localeCompare(String(b.name), 'vi');
    else if (mode === 'prio') r = c3(a.prio, b.prio);
    else if (mode === 'when') {
      // buổi sắp tới (gần nhất trước) → buổi đã qua (mới nhất trước) → chưa có giờ
      var g = function(k){ return isNaN(k.when) ? 2 : (k.when >= now ? 0 : 1); };
      r = c3(g(a), g(b));
      if (!r) r = g(a) === 0 ? c3(a.when, b.when) : (g(a) === 1 ? c3(b.when, a.when) : 0);
    }
    else if (mode === 'expiry_soon' || mode === 'expiry_late') {
      // còn hạn trước, đã hết hạn sau, chưa có hạn cuối cùng
      var h = function(k){ return isNaN(k.expiry) ? 2 : (k.expiry >= today0 ? 0 : 1); };
      r = c3(h(a), h(b));
      if (!r && h(a) === 0) r = mode === 'expiry_soon' ? c3(a.expiry, b.expiry) : c3(b.expiry, a.expiry);
      if (!r && h(a) === 1) r = c3(b.expiry, a.expiry);
    }
    else r = c3(b.created, a.created);          // newest (mặc định)
    return r || c3(b.created, a.created) || String(a.name).localeCompare(String(b.name), 'vi');
  };
}
function sortList_(kind, list) {
  var cmp = sortCmp_(sortPref_(kind));
  return list.map(function(o, i){ return { o: o, i: i, k: sortKeys_(kind, o) }; })
    .sort(function(a, b){ return cmp(a.k, b.k) || a.i - b.i; })
    .map(function(x){ return x.o; });
}
// Thuộc tính data-sk-* gắn vào mỗi dòng để sắp xếp lại ngay trên trang (không tải lại, không mất ô tìm kiếm)
function skAttrs_(kind, o) {
  var k = sortKeys_(kind, o);
  var n = function(v){ return isNaN(v) ? 'x' : v; };
  return ' data-sk-name="' + escHtml(k.name) + '" data-sk-created="' + k.created + '" data-sk-when="' + n(k.when) + '" data-sk-expiry="' + n(k.expiry) + '" data-sk-prio="' + k.prio + '"';
}
function sortSelectHtml_(kind, containerId) {
  var cur = sortPref_(kind);
  return '<label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);white-space:nowrap">Sắp xếp' +
    '<select class="form-select sort-sel" data-kind="' + kind + '" data-c="' + (containerId || '') + '" style="width:auto;min-width:190px;padding-top:9px;padding-bottom:9px" onchange="onSortChange_(this)">' +
    SORT_OPTS_[kind].map(function(o){ return '<option value="' + o[0] + '"' + (o[0] === cur ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') +
    '</select></label>';
}
function searchSortHtml_(containerId, placeholder, kind) {
  return '<div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap">' +
    '<div style="flex:1;min-width:220px">' + searchBoxHtml(containerId, placeholder) + '</div>' +
    '<div style="margin-top:2px">' + sortSelectHtml_(kind, containerId) + '</div></div>';
}
function sortContainer_(id, mode) {
  var box = document.getElementById(id);
  if (!box) return;
  var cmp = sortCmp_(mode);
  var keyed = Array.prototype.filter.call(box.children, function(el){ return el.hasAttribute('data-sk-created'); }).map(function(el, i){
    var f = function(a){ return parseFloat(el.getAttribute(a)); };
    return { el: el, i: i, k: { name: el.getAttribute('data-sk-name') || '', created: f('data-sk-created') || 0, when: f('data-sk-when'), expiry: f('data-sk-expiry'), prio: f('data-sk-prio') || 0 } };
  });
  keyed.sort(function(a, b){ return cmp(a.k, b.k) || a.i - b.i; });
  keyed.forEach(function(x){ box.appendChild(x.el); });
}
function onSortChange_(sel) {
  var kind = sel.getAttribute('data-kind'), mode = sel.value;
  setSortPref_(kind, mode);
  // đồng bộ mọi danh sách cùng loại đang hiện trên trang (vd Lịch sắp tới + Đã tư vấn)
  document.querySelectorAll('select.sort-sel[data-kind="' + kind + '"]').forEach(function(s){
    s.value = mode;
    if (s.getAttribute('data-c')) sortContainer_(s.getAttribute('data-c'), mode);
  });
}

// ── Ô tìm kiếm dùng chung cho mọi trang danh sách (Advisor, nhân viên, khách
//    hàng, lead, lịch tư vấn...). "containerId" là id của phần tử bao ngoài
//    chứa các dòng/card cần lọc; mỗi dòng/card cần có data-search="..." (chữ
//    thường, gộp sẵn các trường muốn tìm — tên/email/sđt...).
function searchBoxHtml(containerId, placeholder) {

    '<input type="text" class="form-input" placeholder="' + (placeholder || 'Tìm kiếm...') + '" ' +

    '<span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px">🔎</span>' +

function filterRowsBySearch(inputEl, containerId) {
  var q = String(inputEl.value || '').trim().toLowerCase();
  var container = document.getElementById(containerId);
  if (!container) return;
  var rows = container.querySelectorAll('[data-search]');
  var visibleCount = 0;
  rows.forEach(function(row){
    var match = !q || row.getAttribute('data-search').indexOf(q) > -1;
    row.style.display = match ? '' : 'none';
    if (match) visibleCount++;
  });
  var emptyEl = container.querySelector('.search-empty-state');
  if (emptyEl) emptyEl.style.display = (visibleCount === 0 && q) ? '' : 'none';
}

function pad(n) { return String(n).padStart(2,'0'); }

// Phòng thủ cho lỗi "cột định dạng Giờ (Time) trong Sheet" — khi Apps Script chưa
// format đúng, giá trị trả về là 1 chuỗi ISO giả với phần ngày = mốc epoch 1899-12-30
// (vd "1899-12-30T06:23:30.000Z") thay vì "06:23". Hàm này nhận diện và tự trích giờ:phút
// đúng, đồng thời vẫn chấp nhận chuỗi "HH:mm" sạch nếu backend đã format đúng từ đầu.
function fmtHHMM(v) {
  if (!v) return '';
  var s = String(v).trim();
  if (/^\d{1,2}:\d{2}(:\d{2})?$/.test(s)) return s.slice(0, 5);
  var d = new Date(s);
  if (!isNaN(d.getTime())) return pad(d.getHours()) + ':' + pad(d.getMinutes());
  return s;
}

}

function escHtml(v) {

function fmtMoneyShort(n) {
  n = Number(n) || 0;
  var s;
  if (n >= 1e9) s = (n / 1e9).toFixed(1).replace(/\.0$/, '') + ' tỷ';
  else if (n >= 1e6) s = (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'tr';
  else if (n >= 1e3) s = Math.round(n / 1e3) + 'k';
  else s = String(n);
  return s.replace('.', ',');
}
function fmtDMY(s) {
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || ''));
  return m ? (m[3] + '/' + m[2] + '/' + m[1]) : (s || '');
}
function safeHttpUrl(u) {

}

// Mốc tính SLA: ưu tiên nhật ký đầu tiên, nếu chưa tải nhật ký thì dùng ngày tạo lead
function parseLeadCreated(v) {
  if (!v) return null;
  var s = String(v).trim();
  var d = parseVNDateTime(s);
  if (d) return d;
  d = new Date(s.replace(' ', 'T'));
  if (!isNaN(d.getTime())) return d;
  return parseSheetDate(s);
}
function getLeadAnchor(c) {
  if (c.log && c.log[0]) { var t = parseVNDateTime(c.log[0].time); if (t) return t; }
  if (c.createdAt) { var d = parseLeadCreated(c.createdAt); if (d) return d; }
  return null;
}
function leadAgeDays(c) {
  var a = getLeadAnchor(c);
  return a ? Math.max(0, Math.floor((new Date() - a) / 86400000)) : 0;
}

function leadIsClosed(c) { return SLA_TERMINAL.indexOf(c.status) > -1 || isRegisteredResult(c.result); }
function leadIsOverdue(c) { var s = getLeadSlaInfo(c); return !!(s && s.overdue); }
function leadNeedsAction(c) {
  if (leadIsClosed(c)) return false;
  if (c.status === 'Chưa liên hệ' || c.status === 'Không tham gia tư vấn') return true;
  if (!c.staff) return true;
  if (leadIsOverdue(c)) return true;
  if (c.status === 'Đã tư vấn xong' && !c.result) return true;
  return false;
}
function leadMatchesFilter(c, f) {
  if (String(f).indexOf('st:') === 0) { var st = f.slice(3); return st === 'Đã đóng' ? SLA_TERMINAL.indexOf(c.status) > -1 : c.status === st; }
  if (f === 'todo') return leadNeedsAction(c);
  if (f === 'overdue') return !leadIsClosed(c) && leadIsOverdue(c);
  if (f === 'unassigned') return !leadIsClosed(c) && !c.staff;
  if (f === 'nodate') return !leadIsClosed(c) && !c.date;
  return true;
}
function leadPriority(c) {
  if (leadIsClosed(c)) return 3;
  if (leadIsOverdue(c)) return 0;
  if (leadNeedsAction(c)) return 1;
  return 2;
}
function leadSearchKey(c) {
  var raw = String(c.phone || '');
  return stripDiacritics(c.name + ' ' + raw + ' ' + raw.replace(/\D/g, '') + ' ' + fmtPhoneVN(raw).replace(/\s/g, '') + ' ' + c.email);
}
function leadRowVisible(c, q) {
  if (!_leadShowClosed && leadIsClosed(c) && String(_leadFilter).indexOf('st:') !== 0) return false;
  if (!leadMatchesFilter(c, _leadFilter)) return false;
  if (q === undefined) q = stripDiacritics(String(_leadSearch || '').trim());
  if (q && leadSearchKey(c).indexOf(q) === -1) return false;
  return true;
}
function getVisibleLeads() {
  var q = stripDiacritics(String(_leadSearch || '').trim());
  var dec = [];
  var cmp = sortCmp_(sortPref_('lead'));
  _leadObjs.forEach(function(c, i){
    if (!leadRowVisible(c, q)) return;
    dec.push({ c: c, i: i, k: sortKeys_('lead', c) });
  });
  dec.sort(function(a, b){ return cmp(a.k, b.k) || a.i - b.i; });
  return dec.map(function(x){ return x.c; });
}
function leadCounts() {
  var open = _leadObjs.filter(function(c){ return !leadIsClosed(c); });
  return {
    all: _leadObjs.length,
    open: open.length,
    closed: _leadObjs.length - open.length,
    todo: open.filter(leadNeedsAction).length,
    overdue: open.filter(leadIsOverdue).length,
    unassigned: open.filter(function(c){ return !c.staff; }).length,
    nodate: open.filter(function(c){ return !c.date; }).length,
    byStatus: CONSULT_STATUS.reduce(function(m, s){ m[s] = _leadObjs.filter(function(c){ return s === 'Đã đóng' ? SLA_TERMINAL.indexOf(c.status) > -1 : c.status === s; }).length; return m; }, {}),
  };
}

function shortSlaLabel(label) {
  return String(label || '').replace(/^⚠ Quá hạn — /, '').replace(/\s*\([^)]*\)/g, '').replace(/^(Ngày \d): /, '$1 · ');
}
function leadSlaBadgeHtml(c) {
  if (isRegisteredResult(c.result)) return '';
  var s = getLeadSlaInfo(c);
  if (!s) return '';
  var text = s.overdue ? '⚠ Quá hạn ' + Math.max(1, (s.days || 0) - 3) + ' ngày' : shortSlaLabel(s.label);
  return '<span class="sla-badge" style="background:' + s.bg + ';color:' + s.color + '" title="' + escHtml(s.label) + '">' + escHtml(text) + '</span>';
}

function todayMeetings(d) {

      time: fmtHHMM(s.scheduled_time), type: type, who: s.advisee_name || '',
      host: s.advisor_name === STAFF_SLOT_IDENTITY ? 'LinkaJob' : (s.advisor_name || ''),
      link: s.meet_link || '', done: st === 'completed', leadId: '',

  });
  d.leads.forEach(function(c){
    if (c.date !== today) return;
    if (SLA_TERMINAL.indexOf(c.status) > -1) return;
    list.push({
      time: c.time || '', type: 'Tư vấn miễn phí', who: c.name || '', host: c.staff || 'Chưa gán',
      link: c.meetLink || '', done: c.status === 'Đã tư vấn xong', leadId: c.id,
    });
  });
  list.sort(function(a, b){ return String(a.time).localeCompare(String(b.time)); });
  return list;
}

var _revBookings = null;

function bookingCounts(b) {

}

  });

function revBars(items, maxVal) {
  var h = '<div class="rev-bars">';
  items.forEach(function(it, i){
    var pct = maxVal > 0 ? Math.round(it.value / maxVal * 100) : 0;
    var showLabel = items.length <= 12 || i % 5 === 0 || i === items.length - 1;
    h += '<div class="rev-col" title="' + escHtml(it.title) + ': ' + escHtml(fmtMoney(it.value)) + '">' +
      '<div class="rev-val">' + (it.value > 0 && items.length <= 12 ? fmtMoneyShort(it.value) : '') + '</div>' +
      '<div class="rev-barwrap"><div class="rev-bar" style="height:' + Math.max(pct, it.value > 0 ? 3 : 0) + '%"></div></div>' +
      '<div class="rev-lbl">' + (showLabel ? escHtml(it.label) : '&nbsp;') + '</div></div>';
  });
  return h + '</div>';
}

function renderRevenuePage() {
  var range = reportPeriodRange(), prev = reportPrevPeriodRange();
  var all = (_revBookings || []).filter(bookingCounts);
  var cur = all.filter(function(b){ return inRange(b.created_at, range); });
  var prv = all.filter(function(b){ return inRange(b.created_at, prev); });
  function sum(list) { return list.reduce(function(s, b){ return s + (Number(b.package_price) || 0); }, 0); }
  var total = sum(cur), prevTotal = sum(prv);
  var avg = cur.length > 0 ? Math.round(total / cur.length) : 0;
  var yearStart = new Date(range.start.getFullYear(), 0, 1), yearEnd = new Date(range.start.getFullYear() + 1, 0, 1);
  var ytd = sum(all.filter(function(b){ return inRange(b.created_at, { start: yearStart, end: yearEnd }); }));

  var html = pageHeader('Doanh thu', 'Tính từ booking đã xác nhận hoặc hoàn tất, theo ngày tạo booking');
  html += renderPeriodBar();
  html += '<div id="report-printable">' + reportPrintTitle('Báo cáo doanh thu', range);

  html += '<div class="stats-row cols-4">';
  html += '<div class="stat-cell"><div class="stat-num">' + fmtMoney(total) + '</div><div class="stat-label">Doanh thu ' + range.label + '</div><div class="stat-detail">' + reportDeltaLabel(total, prevTotal) + '</div></div>';
  html += '<div class="stat-cell"><div class="stat-num">' + cur.length + '</div><div class="stat-label">Số giao dịch</div><div class="stat-detail">' + reportDeltaLabel(cur.length, prv.length) + '</div></div>';
  html += '<div class="stat-cell"><div class="stat-num">' + fmtMoney(avg) + '</div><div class="stat-label">Giá trị trung bình / đơn</div><div class="stat-detail">Trong kỳ đang xem</div></div>';
  html += '<div class="stat-cell"><div class="stat-num">' + fmtMoney(ytd) + '</div><div class="stat-label">Lũy kế năm ' + range.start.getFullYear() + '</div><div class="stat-detail">Từ 01/01 đến hết năm</div></div>';
  html += '</div>';

  // Biểu đồ trong kỳ
  html += '<div class="card"><div class="card-header"><div class="card-header-left">' + (_reportPeriod.mode === 'month' ? 'Doanh thu theo ngày' : 'Doanh thu theo tháng') + '</div></div>';
  if (cur.length === 0) {
    var latest = null;
    all.forEach(function(b){ var d = parseSheetDate(b.created_at); if (d && (!latest || d > latest)) latest = d; });
    html += '<div class="today-empty">Chưa có doanh thu trong ' + range.label.toLowerCase() + '.' +
      (latest ? '<br><a href="#" onclick="reportJumpTo(' + latest.getFullYear() + ',' + latest.getMonth() + ');return false" style="color:var(--brand);font-weight:600">Xem kỳ gần nhất có doanh thu: tháng ' + (latest.getMonth() + 1) + '/' + latest.getFullYear() + '</a>' : '') + '</div>';
  } else {
    var items = [], byKey = {};
    cur.forEach(function(b){
      var k = _reportPeriod.mode === 'month' ? String(b.created_at).slice(8, 10) : String(b.created_at).slice(0, 7);
      byKey[k] = (byKey[k] || 0) + (Number(b.package_price) || 0);
    });
    if (_reportPeriod.mode === 'month') {
      var days = new Date(range.start.getFullYear(), range.start.getMonth() + 1, 0).getDate();
      for (var d = 1; d <= days; d++) { var k = (d < 10 ? '0' : '') + d; items.push({ label: String(d), title: 'Ngày ' + d, value: byKey[k] || 0 }); }
    } else {
      for (var m = 0; m < 3; m++) {
        var dt = new Date(range.start.getFullYear(), range.start.getMonth() + m, 1);
        var key = dt.getFullYear() + '-' + pad(dt.getMonth() + 1);
        items.push({ label: 'Tháng ' + (dt.getMonth() + 1), title: 'Tháng ' + (dt.getMonth() + 1), value: byKey[key] || 0 });
      }
    }
    var maxVal = Math.max.apply(null, items.map(function(x){ return x.value; })) || 1;
    html += revBars(items, maxVal);
  }
  html += '</div>';

  // Bảng giao dịch trong kỳ
  html += '<div class="card"><div class="card-header"><div class="card-header-left">Giao dịch trong kỳ (' + cur.length + ')</div></div>';
  if (cur.length === 0) {
    html += '<div class="today-empty">Không có giao dịch nào trong kỳ này.</div>';
  } else {
    html += '<div style="overflow-x:auto"><table class="bookings-table"><thead><tr><th>ADVISEE</th><th>GÓI</th><th>GIÁ TRỊ</th><th>NGÀY TẠO</th><th>TRẠNG THÁI</th></tr></thead><tbody>';
    cur.slice().sort(function(a, b){ return String(b.created_at) > String(a.created_at) ? 1 : -1; }).forEach(function(b){
      html += '<tr><td><b>' + escHtml(b.advisee_name || '—') + '</b></td><td>' + escHtml(b.package_name || '—') + '</td><td><b>' + fmtMoney(Number(b.package_price) || 0) + '</b></td><td>' + fmtDMY(String(b.created_at).slice(0, 10)) + '</td><td>' + bookingStatusBadge(b) + '</td></tr>';
    });
    html += '</tbody></table></div>';
  }
  html += '</div></div>';
  return html;
}

  });

function opsEmailKey(b) { return String(b.advisee_email || b.advisee_name || '').trim().toLowerCase(); }

function opsAggregate(bookings, sessions, range) {
  var all = bookings.filter(bookingCounts);
  var inR = all.filter(function(b){ return inRange(b.created_at, range); });
  // Khách mới = lần mua đầu tiên của email đó nằm trong kỳ; quay lại = đã có booking trước đó
  var firstBuy = {};
  all.forEach(function(b){
    var k = opsEmailKey(b); if (!k) return;
    var d = parseSheetDate(b.created_at); if (!d) return;
    if (!firstBuy[k] || d < firstBuy[k]) firstBuy[k] = d;
  });
  var newCount = 0, returning = 0;
  inR.forEach(function(b){
    var k = opsEmailKey(b), d = parseSheetDate(b.created_at);
    if (k && firstBuy[k] && d && d.getTime() > firstBuy[k].getTime() && firstBuy[k] < range.start) returning++; else newCount++;
  });
  // Mua lại sau khi hết hạn: gói hết hạn trong kỳ, cùng email có booking tạo sau booking đó
  var expired = all.filter(function(b){ return inRange(b.expiry_date, range); });
  var renewed = expired.filter(function(b){
    var k = opsEmailKey(b); if (!k) return false;
    return all.some(function(o){ return o !== b && opsEmailKey(o) === k && String(o.created_at) > String(b.created_at); });
  });
  var sessInR = sessions.filter(function(s){
    var st = String(s.status || '').toLowerCase();
    return inRange(s.scheduled_date, range) && st !== 'cancelled' && st !== 'canceled';
  });
  var done = sessInR.filter(function(s){ return String(s.status || '').toLowerCase() === 'completed'; });
  var byAdvisor = {}, byPkg = {}, revByPkg = {};
  done.forEach(function(s){
    var n = (s.advisor_name === STAFF_SLOT_IDENTITY) ? 'LinkaJob (tư vấn)' : (s.advisor_name || 'Không rõ');
    byAdvisor[n] = (byAdvisor[n] || 0) + 1;
  });
  inR.forEach(function(b){
    var p = b.package_name || 'Không rõ';
    byPkg[p] = (byPkg[p] || 0) + 1;
    revByPkg[p] = (revByPkg[p] || 0) + (Number(b.package_price) || 0);
  });
  return { bookings: inR.length, newCount: newCount, returning: returning, expired: expired.length, renewed: renewed.length,
    scheduled: sessInR.length, done: done.length, byAdvisor: byAdvisor, byPkg: byPkg, revByPkg: revByPkg };
}

function opsActiveAdvisees(bookings, sessions) {
  var today = ymd(new Date());
  return bookings.filter(function(b){
    if (String(b.status || '').trim().toLowerCase() !== 'confirmed') return false;
    var total = Number(b.sessions_total) || 0;
    var done = sessions.filter(function(s){ return s.booking_id === b.booking_id && String(s.status || '').toLowerCase() === 'completed'; }).length;
    var exp = String(b.expiry_date || '').slice(0, 10);
    return done < total && (!exp || exp >= today);
  }).length;
}

function renderReportPage(partial) {
  var range = reportPeriodRange(), prev = reportPrevPeriodRange();
  var bk = _opsBookings || [], ss = _opsSessions || [];
  var cur = opsAggregate(bk, ss, range), prv = opsAggregate(bk, ss, prev);
  var active = opsActiveAdvisees(bk, ss);

  html += '<div id="report-printable">' + reportPrintTitle('Báo cáo vận hành', range);

  var newRate = cur.bookings > 0 ? Math.round(cur.newCount / cur.bookings * 100) : null;
  var renewRate = cur.expired > 0 ? Math.round(cur.renewed / cur.expired * 100) : null;
  html += '<div class="stats-row cols-4">';
  html += '<div class="stat-cell"><div class="stat-num">' + cur.bookings + '</div><div class="stat-label">Booking trong kỳ</div><div class="stat-detail">' + reportDeltaLabel(cur.bookings, prv.bookings) + '</div></div>';
  html += '<div class="stat-cell"><div class="stat-num">' + (newRate === null ? '—' : newRate + '%') + '</div><div class="stat-label">Tỷ lệ khách mới</div><div class="stat-detail">' + (newRate === null ? 'Chưa có booking trong kỳ' : cur.newCount + ' mới, ' + cur.returning + ' quay lại') + '</div></div>';
  html += '<div class="stat-cell"><div class="stat-num">' + (renewRate === null ? '—' : renewRate + '%') + '</div><div class="stat-label">Mua lại sau khi hết hạn</div><div class="stat-detail">' + (renewRate === null ? 'Không có gói nào hết hạn trong kỳ' : cur.renewed + '/' + cur.expired + ' gói hết hạn trong kỳ đã mua lại') + '</div></div>';
  html += '<div class="stat-cell"><div class="stat-num">' + cur.done + '</div><div class="stat-label">Buổi hoàn thành</div><div class="stat-detail">' + cur.done + '/' + cur.scheduled + ' buổi trong kỳ · ' + reportDeltaLabel(cur.done, prv.done) + '</div></div>';
  html += '</div>';
  html += '<div class="stat-note">Advisee đang học hiện tại (còn buổi và chưa hết hạn): <b>' + active + '</b></div>';

  html += '<div class="two-col"><div class="card"><div class="card-header"><div class="card-header-left">Buổi hoàn thành theo Advisor</div></div><div style="padding:8px 24px 24px">' + svgBarList(cur.byAdvisor, { color: '#fc5229' }) + '</div></div>';
  var pkgDisplay = {};
  Object.keys(cur.byPkg).forEach(function(p){ pkgDisplay[p + ' · ' + fmtMoneyShort(cur.revByPkg[p])] = cur.byPkg[p]; });
  html += '<div class="card"><div class="card-header"><div class="card-header-left">Gói được mua trong kỳ</div></div><div style="padding:8px 24px 24px">' + svgBarList(pkgDisplay, { color: '#6D28D9' }) + '</div></div></div>';
  html += '</div>';
  return html;
}

// ── 0. CUNG – CẦU & PHỄU (Giai đoạn 1): nối Lead → Booking → Buổi tư vấn → Advisor theo NGÀNH ──
var INSIGHT_DEFAULTS = { overload: 3, drop: 20, minLeads: 3, lowConv: 20 };
var INSIGHT_DEPTS = ['Marketing','Sales','Tài chính','Kế toán','Công nghệ','Nhân sự','Vận hành','Thiết kế','Kinh doanh'];
var INSIGHT_TOPICS = {
  'CV': ['cv','resume','ho so'], 'Phỏng vấn': ['phong van','interview'], 'Chuyển ngành': ['chuyen nganh','doi nganh','trai nganh'],
  'Định hướng': ['dinh huong','lo trinh','huong di'], 'Thực tập/Fresher': ['thuc tap','fresher','intern','moi ra truong','sinh vien'],
  'Lương': ['luong','thu nhap','offer'], 'Portfolio': ['portfolio'], 'LinkedIn': ['linkedin'], 'Kỹ năng': ['ky nang','skill']
};
var _insData = { leads: [], bookings: [], sessions: [] };

function insightCfg() {
  var c = {}; try { c = JSON.parse(localStorage.getItem('lj_insight_cfg') || '{}') || {}; } catch (e) { c = {}; }
  var out = {};
  Object.keys(INSIGHT_DEFAULTS).forEach(function(k){ var v = Number(c[k]); out[k] = (isFinite(v) && c[k] !== '' && c[k] != null && v >= 0) ? v : INSIGHT_DEFAULTS[k]; });
  return out;
}
function saveInsightCfg() {
  var c = {};
  Object.keys(INSIGHT_DEFAULTS).forEach(function(k){ var el = document.getElementById('ins-cfg-' + k); if (el) c[k] = el.value; });
  try { localStorage.setItem('lj_insight_cfg', JSON.stringify(c)); } catch (e) {}
  reportRerender();
}
function resetInsightCfg() { try { localStorage.removeItem('lj_insight_cfg'); } catch (e) {} reportRerender(); }

function insNorm_(s) { return ' ' + stripDiacritics(String(s || '')).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim() + ' '; }
function deptAliases_(dept) {
  return String(dept || '').split('/').map(function(p){ return insNorm_(p).trim(); }).filter(Boolean);
}
function advisorMatchesDept_(adv, dept) {
  var al = deptAliases_(dept); if (!al.length) return false;
  return (adv.tags || []).some(function(t){ var n = insNorm_(t).trim(); return al.indexOf(n) > -1; });
}
function insPhoneKey_(p) {
  var s = String(p || '').replace(/\D/g, '');
  if (s.indexOf('84') === 0 && s.length >= 11) s = '0' + s.slice(2);
  return s.length >= 9 ? s : '';
}
function insEmailKey_(e) { var s = String(e || '').trim().toLowerCase(); return s.indexOf('@') > 0 ? s : ''; }
function insDeptOf_(lead) { return String((lead && lead.interested_dept) || '').trim() || 'Không rõ'; }

function insightCompute(D, range, prev, cfg) {
  var leads = D.leads || [], bookings = (D.bookings || []).filter(bookingCounts), sessions = D.sessions || [], advisors = D.advisors || [];
  // index lead → ngành theo email / sđt (lead mới nhất thắng)
  var byEmail = {}, byPhone = {};
  leads.slice().sort(function(a, b){ return String(a.created_at) > String(b.created_at) ? 1 : -1; }).forEach(function(l){
    var e = insEmailKey_(l.email), p = insPhoneKey_(l.phone), dp = insDeptOf_(l);
    if (dp === 'Không rõ') return;
    if (e) byEmail[e] = dp; if (p) byPhone[p] = dp;
  });
  var bkDept = {};
  bookings.forEach(function(b){
    bkDept[b.booking_id] = byEmail[insEmailKey_(b.advisee_email)] || byPhone[insPhoneKey_(b.advisee_phone)] || null;
    if (!bkDept[b.booking_id]) {
      // Không ghép được lead → lấy ngành đầu tiên của advisor được gán cho booking
      var ad = advisors.filter(function(a){ return a.name === b.advisor_name; })[0];
      bkDept[b.booking_id] = (ad && ad.tags && ad.tags[0]) ? String(ad.tags[0]).trim() : 'Không rõ';
    }
  });
  var months = function(r){ return Math.max(1, Math.round((r.end.getTime() - r.start.getTime()) / (30.44 * 864e5))); };
  function period(r) {
    var m = {}; var get = function(d){ return m[d] || (m[d] = { dept: d, leads: 0, advisees: 0, meetings: 0, registered: 0, topics: {} }); };
    leads.forEach(function(l){
      if (!inRange(l.created_at, r)) return;
      var x = get(insDeptOf_(l)); x.leads++;
      if (isRegisteredResult(l.result) || String(l.status || '').trim() === LEAD_CONVERTED_STATUS) x.registered++;
      var q = insNorm_(l.question);
      Object.keys(INSIGHT_TOPICS).forEach(function(t){ if (INSIGHT_TOPICS[t].some(function(w){ return q.indexOf(' ' + w + ' ') > -1 || q.indexOf(w) > -1 && w.length > 4; })) x.topics[t] = (x.topics[t] || 0) + 1; });
    });
    bookings.forEach(function(b){ if (inRange(b.created_at, r)) get(bkDept[b.booking_id]).advisees++; });
    sessions.forEach(function(s){
      var st = String(s.status || '').toLowerCase();
      if (st === 'cancelled' || st === 'canceled' || s.advisor_name === STAFF_SLOT_IDENTITY || s.session_type === 'consult' || s.session_type === 'course') return;
      if (!inRange(s.scheduled_date, r)) return;
      if (bkDept[s.booking_id] != null) get(bkDept[s.booking_id]).meetings++;
    });
    return m;
  }
  var cur = period(range), prv = period(prev);
  // 3 tháng gần nhất tính đến cuối kỳ: lead ≥ minLeads mỗi tháng?
  var last3 = [];
  for (var i = 0; i < 3; i++) last3.push({ start: new Date(range.end.getFullYear(), range.end.getMonth() - 1 - i, 1), end: new Date(range.end.getFullYear(), range.end.getMonth() - i, 1) });
  var stable = {};
  leads.forEach(function(l){ var d = insDeptOf_(l); last3.forEach(function(r, idx){ if (inRange(l.created_at, r)) { stable[d] = stable[d] || [0,0,0]; stable[d][idx]++; } }); });
  var depts = {}; Object.keys(cur).forEach(function(k){ depts[k] = 1; }); Object.keys(prv).forEach(function(k){ depts[k] = 1; });
  // Ngành chỉ có Advisor (chưa có lead) vẫn hiện, trừ khi đã nằm trong 1 ngành có lead
  var known = []; Object.keys(depts).forEach(function(k){ known = known.concat(deptAliases_(k)); });
  advisors.forEach(function(a){ (a.tags || []).forEach(function(t){ var n = insNorm_(t).trim(); if (n && known.indexOf(n) < 0) { depts[String(t).trim()] = 1; known.push(n); } }); });
  var rows = Object.keys(depts).map(function(d){
    var c = cur[d] || { leads: 0, advisees: 0, meetings: 0, registered: 0, topics: {} }, p = prv[d] || { leads: 0, advisees: 0, meetings: 0 };
    var adv = advisors.filter(function(a){ return advisorMatchesDept_(a, d); }).length;
    return { dept: d, cur: c, prev: p, advisors: adv, perAdvisor: adv > 0 ? c.advisees / months(range) / adv : null,
      convPct: c.leads > 0 ? Math.round(c.registered / c.leads * 100) : null,
      stable3: !!(stable[d] && stable[d].every(function(n){ return n >= cfg.minLeads; })) };
  }).filter(function(r){ return r.cur.leads || r.cur.advisees || r.cur.meetings || r.prev.leads || r.prev.advisees || r.prev.meetings || r.advisors; });
  rows.forEach(function(r){ r.actions = insightActions_(r, cfg); });
  rows.sort(function(a, b){ return (b.cur.leads + b.cur.advisees) - (a.cur.leads + a.cur.advisees); });
  return rows;
}

function insightActions_(r, cfg) {
  var out = [], c = r.cur, p = r.prev;
  if (r.dept === 'Không rõ') return [{ type: 'data', level: 'amber', text: 'Bổ sung ngành quan tâm cho lead/booking để phân tích' }];
  if (r.advisors === 0 && (c.leads > 0 || c.advisees > 0)) out.push({ type: 'hire', level: 'red', text: 'Chưa có Advisor ngành này nhưng có nhu cầu → tuyển Advisor mới' });
  else if (r.perAdvisor != null && r.perAdvisor > cfg.overload) out.push({ type: 'hire', level: 'red', text: 'Quá tải (' + r.perAdvisor.toFixed(1) + ' advisee/advisor/tháng > ' + cfg.overload + ') → tuyển thêm Advisor' });
  var dropped = [];
  var chk = function(a, b, n){ if (b >= 2 && (b - a) / b * 100 > cfg.drop) dropped.push(n + ' ' + Math.round((a - b) / b * 100) + '%'); };
  chk(c.leads, p.leads, 'lead'); chk(c.advisees, p.advisees, 'advisee'); chk(c.meetings, p.meetings, 'meeting');
  if (dropped.length) out.push({ type: 'content', level: 'amber', text: 'Cầu giảm (' + dropped.join(', ') + ') → Marketing đẩy content cho ngành này' });
  if (r.stable3 && !dropped.length) out.push({ type: 'event', level: 'blue', text: 'Nhu cầu ổn định cao 3 tháng liền → mở webinar / khoá học' });
  if (c.leads >= 5 && r.convPct != null && r.convPct < cfg.lowConv) out.push({ type: 'sale', level: 'amber', text: 'Nhiều lead nhưng chỉ ' + r.convPct + '% đăng ký → xem lại giá/gói/kịch bản Sale' });
  if (!out.length) out.push({ type: 'ok', level: 'green', text: 'Ổn định' });
  return out;
}

function loadInsightsPageAsync() {
  var mc = document.getElementById('main-content');
  mc.innerHTML = pageHeader('Cung – Cầu & Phễu', 'Đang tải...') + skeletonRows(4);
  Promise.all([
    apiGet('getLeads', {}).catch(function(){ return null; }),
    apiGet('getBookings', {}).catch(function(){ return null; }),
    apiGet('getSessions', {}).catch(function(){ return null; }),
    loadAdvisorsFromSheet(null, false).catch(function(){ return null; })
  ]).then(function(r){
    if (activeNavId !== 'lj-insights') return;
    _insData = { leads: (r[0] && r[0].data) || [], bookings: (r[1] && r[1].data) || [], sessions: (r[2] && r[2].data) || [], partial: !r[0] || !r[1] || !r[2] };
    _reportRerender = function(){ document.getElementById('main-content').innerHTML = renderInsightsPage(); };
    mc.innerHTML = renderInsightsPage();
  }).catch(function(err){
    if (activeNavId !== 'lj-insights') return;
    mc.innerHTML = pageHeader('Cung – Cầu & Phễu', '') + '<div class="card"><div class="empty-state"><div class="icon">⚠</div>Không tải được dữ liệu.<br><small style="color:var(--muted)">' + escHtml(err.message) + '</small></div></div>';
  });
}

function insDelta_(a, b) {
  if (!b) return a ? '<span style="color:var(--muted);font-size:11px"> mới</span>' : '';
  var d = Math.round((a - b) / b * 100); if (!d) return '';
  return '<span style="font-size:11px;color:' + (d < 0 ? '#B91C1C' : '#047857') + '"> ' + (d > 0 ? '▲+' : '▼') + d + '%</span>';
}

function renderInsightsPage() {
  var range = reportPeriodRange(), prev = reportPrevPeriodRange(), cfg = insightCfg();
  var D = { leads: _insData.leads, bookings: _insData.bookings, sessions: _insData.sessions, advisors: (typeof sheetData !== 'undefined' && sheetData.advisors) || [] };
  var rows = insightCompute(D, range, prev, cfg);
  var h = pageHeader('Cung – Cầu & Phễu', 'Nối lead → booking → buổi tư vấn → advisor theo ngành để biết nên tuyển, mở webinar hay đẩy content');
  h += renderPeriodBar();
  if (_insData.partial) h += '<div class="today-warn">Một phần dữ liệu không tải được, số liệu có thể chưa đầy đủ.</div>';
  h += '<div id="report-printable">' + reportPrintTitle('Cung – Cầu & Phễu', range);
  // Ngưỡng
  var fld = function(k, label, suffix){ return '<label style="font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px">' + label + '<span><input id="ins-cfg-' + k + '" type="number" min="0" value="' + cfg[k] + '" style="width:70px;padding:6px 8px;border:1px solid var(--border);border-radius:6px"> ' + suffix + '</span></label>'; };
  h += '<div class="card" style="padding:16px 24px;margin-bottom:16px"><div style="font-weight:600;margin-bottom:10px">Ngưỡng cảnh báo</div><div style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end">' +
    fld('overload', 'Quá tải khi >', 'advisee/advisor/tháng') + fld('drop', 'Cầu giảm khi giảm >', '%') + fld('minLeads', 'Nhu cầu ổn định: lead/tháng ≥', '') + fld('lowConv', 'Chuyển đổi thấp khi <', '%') +
    '<button class="update-btn no-print" onclick="saveInsightCfg()">Áp dụng</button><button class="detail-btn no-print" onclick="resetInsightCfg()">Mặc định</button></div></div>';
  // Tóm tắt hành động
  var groups = { hire: ['Cần tuyển Advisor', '#FEE2E2', '#B91C1C'], content: ['Marketing đẩy content', '#FEF3C7', '#B45309'], event: ['Mở webinar / khoá học', '#DBEAFE', '#1D4ED8'], sale: ['Xem lại Sale/giá/gói', '#FEF3C7', '#B45309'] };
  var gh = '';
  Object.keys(groups).forEach(function(t){
    var names = rows.filter(function(r){ return r.actions.some(function(a){ return a.type === t; }); }).map(function(r){ return r.dept; });
    if (!names.length) return;
    gh += '<div style="flex:1;min-width:200px;background:' + groups[t][1] + ';color:' + groups[t][2] + ';border-radius:10px;padding:12px 16px"><div style="font-weight:700;font-size:13px">' + groups[t][0] + ' (' + names.length + ')</div><div style="font-size:13px;margin-top:4px">' + names.map(escHtml).join(', ') + '</div></div>';
  });
  h += '<div style="display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px">' + (gh || '<div class="card" style="padding:14px 24px;flex:1;color:var(--muted)">Chưa có cảnh báo nào trong kỳ.</div>') + '</div>';
  // Bảng
  var colr = { red: '#FEE2E2;color:#B91C1C', amber: '#FEF3C7;color:#B45309', blue: '#DBEAFE;color:#1D4ED8', green: '#D1FAE5;color:#047857' };
  h += '<div class="card"><div class="card-header"><div class="card-header-left">Cung – Cầu theo ngành</div></div><div style="overflow-x:auto"><table class="bookings-table"><thead><tr><th>NGÀNH</th><th>LEAD</th><th>ADVISEE MỚI</th><th>BUỔI MEETING</th><th>% ĐĂNG KÝ</th><th>ADVISOR</th><th>ADVISEE/ADVISOR/THÁNG</th><th>CHỦ ĐỀ HAY HỎI</th><th>GỢI Ý HÀNH ĐỘNG</th></tr></thead><tbody>';
  if (!rows.length) h += '<tr><td colspan="9" style="text-align:center;color:var(--muted);padding:20px">Không có dữ liệu trong kỳ.</td></tr>';
  rows.forEach(function(r){
    var tp = Object.keys(r.cur.topics).sort(function(a, b){ return r.cur.topics[b] - r.cur.topics[a]; }).slice(0, 3).map(function(t){ return t + ' (' + r.cur.topics[t] + ')'; }).join(', ') || '—';
    h += '<tr><td><b>' + escHtml(r.dept) + '</b></td><td>' + r.cur.leads + insDelta_(r.cur.leads, r.prev.leads) + '</td><td>' + r.cur.advisees + insDelta_(r.cur.advisees, r.prev.advisees) + '</td><td>' + r.cur.meetings + insDelta_(r.cur.meetings, r.prev.meetings) + '</td><td>' + (r.convPct == null ? '—' : r.convPct + '%') + '</td><td>' + r.advisors + '</td><td>' + (r.perAdvisor == null ? '—' : r.perAdvisor.toFixed(1)) + '</td><td style="font-size:12px">' + escHtml(tp) + '</td><td>' +
      r.actions.map(function(a){ return '<div style="margin:2px 0"><span style="display:inline-block;padding:3px 8px;border-radius:6px;font-size:12px;background:' + colr[a.level] + '">' + escHtml(a.text) + '</span></div>'; }).join('') + '</td></tr>';
  });
  h += '</tbody></table></div><div style="padding:12px 24px;font-size:12px;color:var(--muted)">Advisee = booking mới đã xác nhận/hoàn tất trong kỳ. Advisee/advisor/tháng = advisee ÷ số tháng của kỳ ÷ số advisor cùng ngành. Meeting = buổi advisor không huỷ (không tính tư vấn miễn phí/khoá học). Mức giảm chỉ xét khi kỳ trước ≥ 2.</div></div>';
  // Phễu
  var f = insightFunnel_(D, range);
  var steps = [['Lead mới', f.lead], ['Đã liên hệ', f.contacted], ['Chốt lịch tư vấn', f.scheduled], ['Đã tư vấn', f.consulted], ['Đăng ký gói', f.registered]];
  var worst = -1, worstDrop = -1;
  for (var i = 1; i < steps.length; i++) { if (steps[i - 1][1] > 0) { var dr = 1 - steps[i][1] / steps[i - 1][1]; if (dr > worstDrop) { worstDrop = dr; worst = i; } } }
  var fh = '<div style="display:flex;flex-direction:column;gap:10px">';
  steps.forEach(function(s, i){
    var pct = f.lead > 0 ? Math.round(s[1] / f.lead * 100) : 0;
    var note = i > 0 && steps[i - 1][1] > 0 ? ' · giữ ' + Math.round(s[1] / steps[i - 1][1] * 100) + '% so với bước trước' : '';
    fh += '<div><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>' + s[0] + (i === worst ? ' <b style="color:#B91C1C">← rơi nhiều nhất</b>' : '') + '</span><span style="color:var(--muted)">' + s[1] + ' (' + pct + '%)' + note + '</span></div><div style="height:10px;background:var(--bg);border-radius:100px;overflow:hidden"><div style="height:100%;width:' + pct + '%;background:' + (i === worst ? '#DC2626' : 'var(--brand)') + '"></div></div></div>';
  });
  fh += '</div>';
  var ops = opsAggregate(D.bookings, D.sessions, range);
  fh += '<div style="margin-top:14px;font-size:13px;color:var(--muted)">Sau mua trong kỳ: ' + ops.bookings + ' booking · ' + ops.done + '/' + ops.scheduled + ' buổi hoàn thành · mua lại ' + ops.renewed + '/' + ops.expired + ' gói hết hạn</div>';
  // Lý do mất
  var lost = {}, lostN = 0, noReason = 0;
  D.leads.forEach(function(l){
    if (!inRange(l.created_at, range) || isRegisteredResult(l.result) || String(l.status || '').trim() === LEAD_CONVERTED_STATUS) return;
    var closed = SLA_TERMINAL.indexOf(String(l.status || '').trim()) > -1;
    var rs = String(l.result || '').trim();
    if (!closed && !rs) return;
    var k = rs || 'Chưa ghi lý do'; if (!rs) noReason++;
    lost[k] = (lost[k] || 0) + 1; lostN++;
  });
  h += '<div class="two-col"><div class="card"><div class="card-header"><div class="card-header-left">Phễu chuyển đổi (lead tạo trong kỳ)</div></div><div style="padding:8px 24px 24px">' + fh + '</div></div>';
  h += '<div class="card"><div class="card-header"><div class="card-header-left">Lý do mất khách (' + lostN + ')</div></div><div style="padding:8px 24px 24px">' + svgBarList(lost, { color: '#6D28D9' }) + '</div></div></div>';
  // Chất lượng dữ liệu
  var inL = D.leads.filter(function(l){ return inRange(l.created_at, range); });
  var unk = inL.filter(function(l){ return insDeptOf_(l) === 'Không rõ'; }).length;
  var warns = [];
  if (inL.length && unk / inL.length > 0.2) warns.push(Math.round(unk / inL.length * 100) + '% lead chưa có ngành quan tâm → phân tích ngành thiếu chính xác');
  if (lostN && noReason / lostN > 0.2) warns.push(Math.round(noReason / lostN * 100) + '% lead mất chưa ghi lý do (cột Kết quả)');
  if (warns.length) h += '<div class="today-warn">⚠ Chất lượng dữ liệu: ' + warns.map(escHtml).join(' · ') + '</div>';
  h += '</div>';
  return h;
}

function insightFunnel_(D, range) {
  var f = { lead: 0, contacted: 0, scheduled: 0, consulted: 0, registered: 0 }, now = new Date();
  D.leads.forEach(function(l){
    if (!inRange(l.created_at, range)) return;
    var st = String(l.status || '').trim();
    var reg = isRegisteredResult(l.result) || st === LEAD_CONVERTED_STATUS;
    var meetDate = parseSheetDate(l.date);
    var consulted = reg || (meetDate && meetDate <= now) || /^đã tư vấn/i.test(st);
    var scheduled = consulted || !!meetDate || /chốt lịch|đã hẹn/i.test(st);
    var contacted = scheduled || !!l.contacted_date || (st && st !== 'Chưa liên hệ');
    f.lead++; if (contacted) f.contacted++; if (scheduled) f.scheduled++; if (consulted) f.consulted++; if (reg) f.registered++;
  });
  return f;
}

// ── 0b. GIAI ĐOẠN 2–3: Kênh & Công suất · Tổng quan điều hành ──
var INSIGHT2_DEFAULTS = { capSessions: 20, idleSessions: 2 };
function ins2Cfg_() {
  var c = {}; try { c = JSON.parse(localStorage.getItem('lj_ins2_cfg') || '{}') || {}; } catch (e) { c = {}; }
  var o = {}; Object.keys(INSIGHT2_DEFAULTS).forEach(function(k){ var v = Number(c[k]); o[k] = (c[k] != null && c[k] !== '' && isFinite(v) && v >= 0) ? v : INSIGHT2_DEFAULTS[k]; });
  return o;
}
function ins2Store_(key, obj) { try { localStorage.setItem(key, JSON.stringify(obj)); } catch (e) {} }
function ins2Load_(key) { try { return JSON.parse(localStorage.getItem(key) || '{}') || {}; } catch (e) { return {}; } }
function saveIns2Cfg() {
  var c = {}; Object.keys(INSIGHT2_DEFAULTS).forEach(function(k){ var el = document.getElementById('ins2-cfg-' + k); if (el) c[k] = el.value; });
  ins2Store_('lj_ins2_cfg', c); reportRerender();
}
// Chi phí kênh & mục tiêu: lưu theo từng kỳ (khoá "YYYY-MM" hoặc "YYYY-Qn") trong trình duyệt
function ins2PeriodKey_(range) {
  return _reportPeriod.mode === 'month' ? (range.start.getFullYear() + '-' + pad(range.start.getMonth() + 1)) : (range.start.getFullYear() + '-Q' + (Math.floor(range.start.getMonth() / 3) + 1));
}
function saveChannelCost(ch, el) {
  var all = ins2Load_('lj_channel_cost'), k = ins2PeriodKey_(reportPeriodRange());
  all[k] = all[k] || {}; all[k][ch] = Number(String(el.value).replace(/\D/g, '')) || 0;

}

function insightAdvisors_(D, range, cfg, cfg2) {
  var mo = Math.max(1, Math.round((range.end - range.start) / (30.44 * 864e5)));
  var today = new Date(), todayStr = ymd(today), in14 = new Date(today.getTime() + 14 * 864e5), m = {};

  var get = function(n){ return m[n] || (m[n] = { name: n, tags: '', sessions: 0, done: 0, newAdvisees: 0, active: 0, upcoming: 0 }); };
  D.advisors.forEach(function(a){ get(a.name).tags = (a.tags || []).join(', '); });
  var doneBy = {};
  D.sessions.forEach(function(s){
    var st = String(s.status || '').toLowerCase();
    if (st === 'completed' && s.booking_id) doneBy[s.booking_id] = (doneBy[s.booking_id] || 0) + 1;
    if (st === 'cancelled' || st === 'canceled' || s.advisor_name === STAFF_SLOT_IDENTITY || s.session_type === 'consult' || s.session_type === 'course') return;
    if (!live(s.advisor_name) || !m[s.advisor_name]) return;
    var x = m[s.advisor_name];
    if (inRange(s.scheduled_date, range)) { x.sessions++; if (st === 'completed') x.done++; }
    var d = parseSheetDate(s.scheduled_date);
    if (d && d >= new Date(today.getFullYear(), today.getMonth(), today.getDate()) && d <= in14 && st !== 'completed') x.upcoming++;
  });
  // Advisee do advisor phụ trách = cột advisor_name của Booking
  D.bookings.filter(bookingCounts).forEach(function(b){
    if (!live(b.advisor_name)) return;
    var x = get(b.advisor_name);
    if (inRange(b.created_at, range)) x.newAdvisees++;
    var exp = String(b.expiry_date || '').slice(0, 10);
    if ((doneBy[b.booking_id] || 0) < (Number(b.sessions_total) || 0) && (!exp || exp >= todayStr)) x.active++;

    var x = m[k]; x.perMonth = x.newAdvisees / mo; x.sessPerMonth = x.sessions / mo;

    return x;
  }).sort(function(a, b){ return b.active - a.active || b.sessions - a.sessions; });
}

function perfRows(range) {
  var sales = (_perfStaff || []).filter(function(s){ return s.subRole === 'Sale'; });
  return sales.map(function(s){
    var mine = _perfLeads.filter(function(l){ return staffMatchesEntity(s, l, 'staff_id', 'staff'); });
    var inR = mine.filter(function(l){ return inRange(l.created_at, range); });
    var booked = inR.filter(function(l){ return !!l.date; }).length;
    var consulted = inR.filter(function(l){ return l.status === 'Đã tư vấn xong' || !!l.result; }).length;
    var converted = inR.filter(function(l){ return isRegisteredResult(l.result) || String(l.status || '').trim() === LEAD_CONVERTED_STATUS; }).length;
    var openNow = mine.filter(function(l){ return SLA_TERMINAL.indexOf(l.status) === -1 && !isRegisteredResult(l.result); });
    var overdueNow = openNow.filter(function(l){
      var s2 = getLeadSlaInfo({ status: l.status, date: l.date ? String(l.date).slice(0, 10) : '', time: fmtHHMM(l.time), log: [], createdAt: l.created_at });
      return !!(s2 && s2.overdue);
    }).length;
    var doneSess = _perfSessions.filter(function(x){
      return staffMatchesEntity(s, x, 'assigned_staff_id', 'assigned_staff') && String(x.status || '').toLowerCase() === 'completed' && inRange(x.scheduled_date, range);
    }).length;
    return { staff: s, leads: inR.length, booked: booked, consulted: consulted, converted: converted,
      rate: inR.length > 0 ? Math.round(converted / inR.length * 100) : null,
      load: openNow.length, overdue: overdueNow, doneSess: doneSess };
  });
}

//  NHẬP KHÁCH TỪ WEB CŨ (Admin) — KHÔNG gửi email cho khách / Advisor / Admin.
//  Dán trực tiếp các dòng copy từ Google Sheet cũ (cột: Khách | Gói | ngày | Các buổi | giá).
//  Ô "Khách" nhiều dòng (tên / SĐT / email) được tách tự động.
// ════════════════════════════════════════════════════════════
var LEGACY = { parsed: [], checked: false };

// Parse TSV có hỗ trợ ô đặt trong "..." chứa xuống dòng (đúng định dạng Google Sheets khi copy).
function legacyParseTsv_(text) {
  var rows = [], row = [], cell = '', inQ = false;
  for (var i = 0; i < text.length; i++) {
    var ch = text[i];
    if (inQ) {
      if (ch === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else inQ = false; }
      else cell += ch;
    } else if (ch === '"' && cell === '') inQ = true;
    else if (ch === '\t') { row.push(cell); cell = ''; }
    else if (ch === '\r') { /* bỏ qua */ }
    else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
function legacyDate_(s) {
  s = String(s || '').trim();
  var m, y, mo, d;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) { y = +m[1]; mo = +m[2]; d = +m[3]; }
  else if ((m = s.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/))) {
    mo = +m[1]; d = +m[2];            // định dạng tháng/ngày như trong sheet cũ (9/21)
    if (m[3]) { y = +m[3]; if (y < 100) y += 2000; }
    else {
      var now = new Date(); y = now.getFullYear();
      if (new Date(y, mo - 1, d) > new Date(now.getTime() + 86400000)) y -= 1; // chưa tới → năm trước
    }
  } else return '';
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return '';
  return y + '-' + (mo < 10 ? '0' : '') + mo + '-' + (d < 10 ? '0' : '') + d;
}
// Tra cả gói ĐÃ ẨN (PACKAGES_RAW) — khách cũ có thể đang giữ gói không còn bán trên web mới.
function legacyPkgInfo_(name) {
  var key = String(name || '').trim().toLowerCase();
  var raw = (PACKAGES_RAW || []).filter(function(p){ return String(p.name || '').trim().toLowerCase() === key; })[0];
  if (raw) return { name: String(raw.name).trim(), sessions: Number(raw.sessions) || 0, active: raw.active === true || raw.active === 'TRUE' || raw.active === 'true' };
  var k2 = Object.keys(PACKAGES).filter(function(k){ return k.toLowerCase() === key; })[0];
  return k2 ? { name: k2, sessions: Number(PACKAGES[k2].sessions) || 0, active: true } : null;
}
function legacyFindPkg_(name) {
  var info = legacyPkgInfo_(name);
  return info ? info.name : '';
}
function legacyParse_(text) {
  var out = [];
  legacyParseTsv_(text).forEach(function(c, idx) {
    var a = String(c[0] || '').trim();
    if (!a && !String(c[1] || '').trim()) return;                       // dòng trống
    if (/^kh[aá]ch$/i.test(a) || /^g[oó]i$/i.test(String(c[1] || '').trim())) return; // dòng tiêu đề
    var item = { line: idx + 1, errors: [], warns: [] };
    var parts = a.split(/\n/).map(function(x){ return x.trim(); }).filter(Boolean);
    var nameParts = [];
    parts.forEach(function(p) {
      if (/\S+@\S+\.\S+/.test(p)) item.email = p;
      else if (/^\+?[\d\s.\-()]{8,}$/.test(p)) item.phone = p.replace(/[\s.\-()]/g, '');
      else nameParts.push(p);
    });
    item.name = nameParts.join(' ');
    var pkgRaw = String(c[1] || '').trim();
    item.pkgRaw = pkgRaw;
    item.dateRaw = String(c[2] || '').trim();
    item.sessRaw = String(c[3] || '').trim();
    item.priceRaw = String(c[4] || '').trim();

    if (/kho[aá]\s*h[oọ]c/i.test(pkgRaw)) { item.skip = 'Khoá học — không phải gói meeting'; out.push(item); return; }
    if (!item.email && !item.phone) { item.skip = 'Không có email/SĐT'; out.push(item); return; }

    item.package_name = legacyFindPkg_(pkgRaw);
    if (!item.package_name) item.errors.push('Gói "' + pkgRaw + '" không có trong Sản phẩm');
    item.purchased_at = legacyDate_(item.dateRaw);
    if (!item.purchased_at) item.errors.push('Ngày "' + item.dateRaw + '" không hiểu được');
    var sm = item.sessRaw.match(/^(\d+)\s*\/\s*(\d+)$/);
    if (!sm) { item.errors.push('Cột buổi "' + item.sessRaw + '" phải dạng 1/4'); }
    else {
      item.sessions_used = +sm[1];
      var pk = legacyPkgInfo_(item.package_name);
      if (pk) {
        if (+sm[2] !== Number(pk.sessions)) item.warns.push('Sheet ghi ' + item.sessRaw + ' nhưng gói ' + item.package_name + ' có ' + pk.sessions + ' buổi → dùng ' + item.sessions_used + '/' + pk.sessions);
        if (item.sessions_used > Number(pk.sessions)) item.errors.push('Đã dùng nhiều hơn tổng buổi');
      }
    }
    var digits = item.priceRaw.replace(/[^\d]/g, '');
    if (digits) item.price = +digits;
    if (!item.name) item.errors.push('Thiếu tên');
    out.push(item);
  });
  return out;
}

function legacyRenderPreview_(res) {

  }
  var html = '';
  if (res && res.warnings && res.warnings.length) html += '<div style="background:#FEF3C7;color:#92400E;padding:8px 12px;border-radius:8px;font-size:12px;margin-bottom:8px">' + res.warnings.map(escHtml).join('<br>') + '</div>';

  LEGACY.parsed.forEach(function(x, i) {
    var r = byIndex[i], tag = '', color = '';
    if (x.skip) { tag = '⏭ Bỏ qua: ' + escHtml(x.skip); color = 'var(--muted)'; }
    else if (x.errors.length) { tag = '❌ ' + x.errors.map(escHtml).join('; '); color = '#DC2626'; }
    else if (r && r.status === 'would_add') { tag = '✅ Sẽ nhập'; color = 'var(--green)'; }
    else if (r && r.status === 'skipped') { tag = '⏭ ' + escHtml(r.reason); color = 'var(--muted)'; }
    else if (r && r.status === 'error') { tag = '❌ ' + escHtml(r.reason); color = '#DC2626'; }
    if (x.warns.length) tag += '<div style="color:#92400E;font-size:11px">⚠ ' + x.warns.map(escHtml).join('; ') + '</div>';
    html += '<tr><td>' + x.line + '</td><td><b>' + escHtml(x.name) + '</b><div style="font-size:11px;color:var(--muted)">' + escHtml(x.email || '') + ' ' + escHtml(x.phone || '') + '</div></td>' +
      '<td>' + escHtml(x.package_name || x.pkgRaw) + '</td><td>' + escHtml(x.purchased_at || x.dateRaw) + '</td><td>' + escHtml(x.sessRaw) + '</td>' +
      '<td>' + (x.price ? fmtMoney(x.price) : '') + '</td><td style="font-size:12px;color:' + color + '">' + tag + '</td></tr>';
  });

function isUnassignedAdvisor_(name) {

var _saleData = null;

function loadSaleTabAsync(tab) {
  var s = sheetData.staffList.find(function(x){ return x.id === _staffDetailId; });
  if (!s) return;
  _staffDetailTab = tab;
  var mc = document.getElementById('main-content');
  mc.innerHTML = renderStaffMemberDetail(_staffDetailId, tab, _staffDetailSelfView);   // hiện khung + skeleton ngay
  Promise.all([
    apiGet('getLeads', { staff: s.name }).catch(function(){ return null; }),
    apiGet('getRescheduleRequests', {}).catch(function(){ return null; }),
    apiGet('getSessions', {}).catch(function(){ return null; }),
    new Promise(function(resolve){ loadAdviseesFromSheet(resolve); }),
  ]).then(function(r){
    var failed = [];
    if (!r[0]) failed.push('danh sách lead'); if (!r[1]) failed.push('yêu cầu đổi lịch'); if (!r[2]) failed.push('lịch buổi');
    var leadRows = (r[0] && r[0].data) ? r[0].data : [];
    var reqs = (r[1] && r[1].data) ? r[1].data : [];
    var sessions = (r[2] && r[2].data) ? r[2].data : [];
    var ownBk = {};
    adviseesOfSale_(s).forEach(function(ae){ ownBk[ae.bookingId || ae.id] = true; });
    sessions = sessions.filter(function(x){ return !x.booking_id || ownBk[x.booking_id] || x.session_type === 'consult'; });
    var sessById = {}; sessions.forEach(function(x){ sessById[x.session_id] = x; });
    reqs = reqs.filter(function(q){ return !!sessById[q.session_id]; });
    reqs.forEach(function(q){
      var x = sessById[q.session_id];
      q._ae_name = x ? x.advisee_name : ''; q._advisor_name = x ? x.advisor_name : ''; q._session_no = x ? x.session_number : '';
    });
    var leads = leadRows.map(function(x){ return mergeLeadRow(x); }).filter(Boolean);
    _saleData = { leads: leads, reqs: reqs, sessions: sessions, failed: failed, loadedFor: s.id };
    if (_saleSidebarMode) {
      var nOpen = leads.filter(function(c){ return !c.date && !isHiddenOnDashboard(c) && !isRegisteredResult(c.result); }).length;
      var nRemind = adviseesOfSale_(s).filter(function(ae){ return expiryAlert_(ae).red; }).length;
      var nPend = pendingReschedules(reqs).length;
      setNavBadge('sale-nodate', nOpen); setNavBadge('sale-buyers', nRemind); setNavBadge('sale-resched', nPend);
      setNavBadge('sale-today', nOpen + nRemind + nPend);
    }
    if (_staffDetailTab === tab && activeStaffDetailIsSale_()) {
      document.getElementById('main-content').innerHTML = renderStaffMemberDetail(_staffDetailId, tab, _staffDetailSelfView);
    }
  });
}
