      html += '<div class="pkg-card-meta">' +
        '<b>' + (isSessionsUnlimited ? 'Không giới hạn buổi' : (p.sessions + ' buổi')) + '</b>' + (isAdvisorUnlimited ? ' · Advisor tự do' : '') + '<br>' +
        (p.duration_label || fmtPkgDuration(p.days)) + ' sử dụng · ' + (Number(p.duration_minutes) || 60) + ' phút/buổi' +
        '</div>';
      html += '<div class="pkg-card-actions">' +
        '<button class="update-btn" onclick="openPackageEditor(' + esc(p) + ')">✎ Sửa</button>' +
        '<button class="detail-btn" onclick="togglePackageActive(\'' + p.package_id + '\',' + (!isActive) + ')">' + (isActive ? 'Ẩn' : 'Bật lại') + '</button>' +
        '<button class="detail-btn" onclick="deletePackageConfirm(' + esc(p) + ')">Xoá</button>' +
        '</div>';
      html += '</div>';
    });
    html += '</div>';
  }
  html += '</div>';
  return html;
}

// ── Widget chỉnh sửa gói — GỘP thông tin cơ bản (giá/số buổi/hạn dùng/thời
//    lượng buổi) VÀ nội dung hỗ trợ (bảng so sánh feature) vào 1 trang duy
//    nhất, lưu 1 lần cho cả 2 phần. Không truyền p (hoặc p=null) → form
//    Thêm mới (chưa có nội dung hỗ trợ để tải). ──
var _editingPackage = null;
var _editingFeatures = [];   // chỉ còn các dòng "Quyền lợi khác" (gõ tự do, hiện ở mục "Xem thêm" trên trang đăng ký)
var _editingTable = {};      // trạng thái các hàng của bảng so sánh
var _editingDraft = null;    // giữ lại các ô thông tin cơ bản khi form vẽ lại
var _editingLegacy = false;  // true nếu gói đang sửa là dữ liệu cũ vừa được tự chuyển sang form mới

// ── Các hàng của BẢNG SO SÁNH trên trang đăng ký cố vấn. Mỗi hàng lưu 1 dòng trong PackageFeatures:
//    group_label = '_table', feature_label = fname (PHẢI khớp với trang đăng ký), value = giá trị ngắn
//    hiện trong ô ('check' = dấu tick, 'Không giới hạn', '2 vị trí', '1 bài', 'Chọn 1 mục', '70%'). ──
var TABLE_ROWS = [
  { key: 'guide',  fname: 'Định hướng',        label: 'Định hướng ngành/phòng ban/vị trí phù hợp', type: 'toggle' },
  { key: 'cv',     fname: 'Sửa CV',            label: 'Sửa CV',                 type: 'limit', unit: 'vị trí' },
  { key: 'pv',     fname: 'Luyện phỏng vấn',   label: 'Luyện phỏng vấn',        type: 'limit', unit: 'vị trí' },
  { key: 'cs',     fname: 'Case Study',        label: 'Case Study',             type: 'limit', unit: 'bài' },
  { key: 'doc',    fname: 'Tài liệu ngành',    label: 'Tài liệu chuyên ngành',  type: 'toggle' },
  { key: 'course', fname: 'Khoá học LinkaJob', label: 'Khoá học LinkaJob',      type: 'toggle' },
  { key: 'refund', fname: 'Hoàn tiền',         label: 'Hoàn tiền nếu chưa có offer', type: 'refund' }
];

function _pkEsc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

function emptyTableState() {
  var st = {};
  TABLE_ROWS.forEach(function(r){
    st[r.key] = r.type === 'limit' ? { mode: 'none', n: 1 } : r.type === 'refund' ? { on: false, pct: 70 } : { on: false };
  });
  return st;
}

// state -> value lưu vào Sheet. null = hàng không có, false = nhập sai.
function encodeTableRow(r, st) {
  if (r.type === 'toggle') return st.on ? 'check' : null;
  if (r.type === 'refund') {
    if (!st.on) return null;
    var pct = Number(st.pct);
    return (pct > 0 && pct <= 100) ? (Math.round(pct) + '%') : false;
  }
  if (st.mode === 'none') return null;
  if (st.mode === 'pick') return 'Chọn 1 mục';
  if (st.mode === 'yes') return 'check';
  if (st.mode === 'unl') return 'Không giới hạn';
  var n = Number(st.n);
  return (n > 0) ? (Math.round(n) + ' ' + r.unit) : false;
}

// value trong Sheet -> state
function decodeTableRow(r, value) {
  var v = String(value || '').trim();
  if (r.type === 'toggle') return { on: true };
  if (r.type === 'refund') return { on: true, pct: parseInt(v, 10) || 70 };
  if (v === 'check') return { mode: 'yes', n: 1 };
  if (v === 'Chọn 1 mục') return { mode: 'pick', n: 1 };
  if (v === 'Không giới hạn') return { mode: 'unl', n: 1 };
  var m = v.match(/^(\d+)/);
  return m ? { mode: 'n', n: Number(m[1]) } : { mode: 'yes', n: 1 };
}

function limitFromText(t) {
  var s = String(t || '').normalize('NFC');
  if (/^\s*hoặc\b/i.test(s)) return { mode: 'pick', n: 1 };
  if (/không giới hạn/i.test(s)) return { mode: 'unl', n: 1 };
  var m = s.match(/(\d+)\s*vị trí/i) || s.match(/(\d+)\s*(?:case study|bài)/i);
  if (m) return { mode: 'n', n: Number(m[1]) };
  return { mode: 'yes', n: 1 };
}

// Gói cũ (chỉ có các dòng gõ tự do) -> tự điền sẵn form mới để admin kiểm tra rồi bấm Lưu.
// Dòng nào khớp 1 hàng của bảng thì được chuyển vào hàng đó; dòng nói về số Advisor bỏ đi vì đã có ô
// "Không giới hạn Advisor"; các dòng còn lại giữ nguyên ở mục "Quyền lợi khác".
function legacyToTable(list) {
  var st = emptyTableState(), rest = [], seen = {};
  function setLimit(key, t) {
    var lim = limitFromText(t);
    if (!seen[key] || (seen[key] === 'yes' && lim.mode !== 'yes')) { st[key] = lim; seen[key] = lim.mode; }
  }
  list.forEach(function(f){
    var t = String(f.feature_label || '').normalize('NFC'), hit = false, m;
    if (/\u0111\u1ecbnh h\u01b0\u1edbng ng\u00e0nh|ph\u00f2ng ban/i.test(t)) { st.guide.on = true; hit = true; }
    if (/\bcv\b/i.test(t) && !/cover|portfolio|linkedin/i.test(t)) { setLimit('cv', t); hit = true; }
    if (/ph\u1ecfng v\u1ea5n/i.test(t)) { setLimit('pv', t); hit = true; }
    if (/case study/i.test(t)) { setLimit('cs', t); hit = true; }
    if (/t\u00e0i li\u1ec7u chuy\u00ean ng\u00e0nh/i.test(t)) { st.doc.on = true; hit = true; }
    if (/kho\u00e1\s*h\u1ecdc|kh\u00f3a\s*h\u1ecdc/i.test(t)) { st.course.on = true; hit = true; }
    if ((m = t.match(/ho\u00e0n\s*(\d+)\s*%/i))) { st.refund = { on: true, pct: Number(m[1]) }; hit = true; }
    if (/advisor/i.test(t) && /kh\u00f4ng gi\u1edbi h\u1ea1n|duy nh\u1ea5t|1 advisor|c\u1ed1 v\u1ea5n/i.test(t)) hit = true;
    if (!hit) rest.push(f);
  });
  return { state: st, rest: rest };
}

function openPackageEditor(p) {
  _editingPackage = p || null;
  _editingDraft = null;
  _editingLegacy = false;
  var c = document.getElementById('main-content');
  c.className = 'content';

  if (!p) { // Thêm gói mới — form bảng so sánh nhập được ngay, lưu cùng lúc với gói
    _editingFeatures = [];
    _editingTable = emptyTableState();
    c.innerHTML = renderPackageEditor();
    return;
  }

  c.innerHTML = skeletonRows(3);

  apiGet('getPackageFeatures', {}).then(function(res){
    var all = (res && res.data) ? res.data : [];
    var mine = all
      .filter(function(f){ return String(f.package_id).trim() === p.package_id && f.value !== 'dash' && String(f.group_label || '').trim() !== '_meta'; })
      .sort(function(a, b){ return (Number(a.sort_order) || 0) - (Number(b.sort_order) || 0); });
    var tableRows = mine.filter(function(f){ return String(f.group_label || '').trim() === '_table'; });
    var others = mine.filter(function(f){ return String(f.group_label || '').trim() !== '_table'; }).map(function(f){
      var desc = String(f.feature_label || '').trim();
      if (f.value && f.value !== 'check' && f.value !== 'dash') desc += (desc ? ' — ' : '') + String(f.value).trim();
      return { group_label: 'Khác', feature_label: desc, sort_order: Number(f.sort_order) || 0 };
    });

    if (tableRows.length) {
      _editingTable = emptyTableState();
      TABLE_ROWS.forEach(function(r){
        var f = tableRows.find(function(x){ return String(x.feature_label || '').trim() === r.fname; });
        if (f) _editingTable[r.key] = decodeTableRow(r, f.value);
      });
      _editingFeatures = others;
    } else {
      var conv = legacyToTable(others);
      _editingTable = conv.state;
      _editingFeatures = conv.rest;
      _editingLegacy = true;
    }
    _editingFeatures.forEach(function(f, i){ f.sort_order = (i + 1) * 10; });
    c.innerHTML = renderPackageEditor();
  }).catch(function(err){
    toast('Không tải được nội dung hỗ trợ: ' + err.message, 'error');
    _editingFeatures = [];
    _editingTable = emptyTableState();
    c.innerHTML = renderPackageEditor();
  });
}

function captureEditorDraft() {
  var g = function(id){ return document.getElementById(id); };
  if (!g('pkg-name')) return;
  _editingDraft = {

    advisorUnlimited: g('pkg-advisor-unlimited').checked, contact: g('pkg-contact-price').checked,

    sessionsUnlimited: g('pkg-sessions-unlimited').checked, durationLabel: g('pkg-duration-label').value
  };

}

function tablePreview(r, st) {
  var dot = '<span style="color:var(--muted)">·</span>', tick = '<span style="color:var(--brand);font-weight:700">✓</span>';
  if (r.type === 'toggle') return st.on ? tick : dot;
  if (r.type === 'refund') return st.on ? (tick + ' <span style="font-size:11.5px;color:var(--muted)">Hoàn ' + (Number(st.pct) || '?') + '%</span>') : dot;
  if (st.mode === 'none') return dot;
  if (st.mode === 'pick') return 'Chọn 1 mục';
  if (st.mode === 'yes') return tick;
  if (st.mode === 'unl') return 'Không giới hạn';
  return (Number(st.n) > 0 ? Number(st.n) : '?') + ' ' + r.unit;
}

function renderTableRows() {
  var inp = 'class="form-input" style="padding:6px 8px;font-size:12.5px;';

    var st = _editingTable[r.key], ctrl = '';
    if (r.type === 'toggle') {
      ctrl = '<select ' + inp + 'width:150px" onchange="tblSet(\'' + r.key + '\',\'on\',this.value===\'1\')"><option value="1"' + (st.on ? ' selected' : '') + '>Có</option><option value="0"' + (!st.on ? ' selected' : '') + '>Không</option></select>';
    } else if (r.type === 'refund') {
      ctrl = '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><select ' + inp + 'width:150px" onchange="tblSet(\'refund\',\'on\',this.value===\'1\')"><option value="1"' + (st.on ? ' selected' : '') + '>Có hoàn tiền</option><option value="0"' + (!st.on ? ' selected' : '') + '>Không</option></select>' +
        (st.on ? '<input type="number" min="1" max="100" ' + inp + 'width:70px" value="' + _pkEsc(st.pct) + '" onchange="tblSet(\'refund\',\'pct\',this.value)"><span style="font-size:12.5px;color:var(--muted)">% giá trị gói</span>' : '') + '</div>';
    } else {
      var opts = [['none', 'Không có'], ['pick', 'Chọn 1 mục'], ['yes', 'Có (không nêu số)'], ['n', 'Giới hạn số lượng'], ['unl', 'Không giới hạn']];
      ctrl = '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><select ' + inp + 'width:170px" onchange="tblSet(\'' + r.key + '\',\'mode\',this.value)">' +
        opts.map(function(o){ return '<option value="' + o[0] + '"' + (st.mode === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select>' +
        (st.mode === 'n' ? '<input type="number" min="1" ' + inp + 'width:70px" value="' + _pkEsc(st.n) + '" onchange="tblSet(\'' + r.key + '\',\'n\',this.value)"><span style="font-size:12.5px;color:var(--muted)">' + r.unit + '</span>' : '') + '</div>';

    html += '<div style="display:grid;grid-template-columns:210px minmax(0,1fr) 150px;gap:0;align-items:center;padding:10px 24px;border-top:1px solid var(--border)">' +
      '<span style="font-size:13px;padding-right:10px">' + r.label + '</span><div>' + ctrl + '</div>' +
      '<div style="text-align:center;font-size:13px;font-weight:600">' + tablePreview(r, st) + '</div></div>';
  });
  return html;
}

function tblSet(key, field, value) {
  if (!_editingTable[key]) return;
  _editingTable[key][field] = value;
  var el = document.getElementById('pkg-table-body');

}

    html += '<tr><td><input class="form-input" style="padding:6px 8px;font-size:12.5px" value="' + _pkEsc(f.feature_label) + '" placeholder="VD: Tài liệu Aptitude Test nâng cao" onchange="updateFeatureField(' + idx + ',\'feature_label\',this.value)"></td>' +
      '<td style="white-space:nowrap">' +
      '<button class="detail-btn" style="padding:4px 8px" ' + (isFirst ? 'disabled' : '') + ' title="Chuyển lên" onclick="moveFeatureRow(' + idx + ',-1)">↑</button> ' +
      '<button class="detail-btn" style="padding:4px 8px" ' + (isLast ? 'disabled' : '') + ' title="Chuyển xuống" onclick="moveFeatureRow(' + idx + ',1)">↓</button> ' +
      '<button class="detail-btn" onclick="removeFeatureRow(' + idx + ')">Xoá</button></td></tr>';
  });
  html += '</tbody></table></div>';

  html += '<div style="padding:0 0 20px"><button class="login-btn" style="width:auto;padding:10px 24px" onclick="savePackageEditor(' + (isEdit ? "'" + p.package_id + "'" : 'null') + ')">' + (isEdit ? 'Lưu tất cả thay đổi' : 'Thêm gói') + '</button></div>';
  return html;
}

function updateFeatureField(idx, field, value) {
  if (!_editingFeatures[idx]) return;
  _editingFeatures[idx][field] = value;   // không vẽ lại form, tránh mất ô đang nhập
}

function moveFeatureRow(idx, dir) {
  var newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= _editingFeatures.length) return;
  var tmp = _editingFeatures[idx];
  _editingFeatures[idx] = _editingFeatures[newIdx];
  _editingFeatures[newIdx] = tmp;
  _editingFeatures.forEach(function(f, i){ f.sort_order = (i + 1) * 10; });
  rerenderPackageEditor();
}

function addFeatureRow() {
  var maxSort = _editingFeatures.reduce(function(m,f){ return Math.max(m, Number(f.sort_order)||0); }, 0);
  _editingFeatures.push({ group_label: 'Khác', feature_label: '', sort_order: maxSort + 10 });
  rerenderPackageEditor();
}

function removeFeatureRow(idx) {
  _editingFeatures.splice(idx, 1);
  rerenderPackageEditor();
}

function onPkgContactPriceToggle(checked) {
  var priceInput = document.getElementById('pkg-price');
  priceInput.disabled = checked;
  if (checked) priceInput.value = '';
}

function onPkgSessionsUnlimitedToggle(checked) {
  var sessionsInput = document.getElementById('pkg-sessions');
  sessionsInput.disabled = checked;
  if (checked) sessionsInput.value = '';
}

// Lưu CẢ 2 phần: thông tin cơ bản (savePackage) rồi tới nội dung hỗ trợ
// (savePackageFeaturesForPackage) — nối tiếp nhau vì features cần đúng
// package_id (gói mới tạo chỉ có ID sau khi savePackage trả về).
function savePackageEditor(packageId) {
  var name = v('pkg-name');
  var isContactPrice = document.getElementById('pkg-contact-price').checked;
  var isSessionsUnlimited = document.getElementById('pkg-sessions-unlimited').checked;
  var isAdvisorUnlimited = document.getElementById('pkg-advisor-unlimited').checked;
  var price = isContactPrice ? 0 : v('pkg-price').trim();
  var sessions = isSessionsUnlimited ? 0 : Number(document.getElementById('pkg-sessions').value);
  var durationLabel = v('pkg-duration-label');
  var days = parseDaysFromLabel(durationLabel);
  var duration = Number(document.getElementById('pkg-duration').value) || 60;
  var badgeLabel = v('pkg-badge');
  if (!name) { toast('Vui lòng nhập tên gói', 'error'); return; }
  if (!isContactPrice && !price) { toast('Giá không hợp lệ (hoặc tick "Hiện Liên hệ")', 'error'); return; }
  if (!isSessionsUnlimited && (!sessions || sessions <= 0)) { toast('Số buổi không hợp lệ (hoặc tick "Không giới hạn")', 'error'); return; }
  if (!durationLabel) { toast('Vui lòng nhập Hạn dùng (VD: 3 ngày, 1 tháng...)', 'error'); return; }

  var tableErr = null, allFeatures = [];
  TABLE_ROWS.forEach(function(r, i){
    var val = encodeTableRow(r, _editingTable[r.key]);
    if (val === false) { tableErr = tableErr || ('Hàng "' + r.label + '": nhập số hợp lệ'); }
    else if (val) allFeatures.push({ group_label: '_table', feature_label: r.fname, value: val, sort_order: i + 1 });
  });
  if (tableErr) { toast(tableErr, 'error'); return; }
  var invalidFeature = _editingFeatures.some(function(f){ return !String(f.feature_label || '').trim(); });
  if (invalidFeature) { toast('Mỗi dòng "Quyền lợi khác" cần có nội dung — điền hoặc xoá dòng trống', 'error'); return; }
  _editingFeatures.forEach(function(f, i){
    allFeatures.push({ group_label: 'Khác', feature_label: String(f.feature_label).trim(), value: 'check', sort_order: 100 + (i + 1) * 10 });
  });

  var existing = packageId ? PACKAGES_RAW.find(function(x){ return x.package_id === packageId; }) : null;
  var payload = {
    action: 'savePackage', name: name, price: price, sessions: sessions, days: days,
    duration_minutes: duration, badge_label: badgeLabel, duration_label: durationLabel,
    price_mode: isContactPrice ? 'contact' : 'fixed',
    sessions_unlimited: isSessionsUnlimited,
    advisor_unlimited: isAdvisorUnlimited,
    active: existing ? (existing.active === true || existing.active === 'TRUE' || existing.active === 'true') : true,
  };
  if (packageId) payload.package_id = packageId;

  var btn = document.querySelector('.login-btn');
  if (btn) { btn.innerHTML = '<span class="spinner"></span> Đang lưu...'; btn.disabled = true; }

  apiPost(payload).then(function(res){
    if (!res || !res.success) {
      toast('Lỗi: ' + (res && res.error), 'error');
      if (btn) { btn.innerHTML = packageId ? 'Lưu tất cả thay đổi' : 'Thêm gói'; btn.disabled = false; }
      return;
    }
    var savedPackageId = res.package_id || packageId;
    // Các hàng của bảng so sánh lưu với group_label '_table' và value ngắn (vd '2 vị trí');
    // "Quyền lợi khác" lưu group 'Khác' với value 'check'.
    apiPost({
      action: 'savePackageFeaturesForPackage',
      package_id: savedPackageId,
      features: allFeatures,
    }).then(function(res2){
      toast(packageId ? 'Đã cập nhật gói "' + name + '" ✅' : 'Đã thêm gói "' + name + '" ✅', 'success');
      loadProductsPageAsync();
      if (!res2 || !res2.success) toast('Lưu gói thành công, nhưng lỗi lưu nội dung hỗ trợ: ' + (res2 && res2.error || ''), 'error');
    }).catch(function(e){
      toast('Lưu gói thành công, nhưng lỗi kết nối lúc lưu nội dung hỗ trợ: ' + e.message, 'error');
      loadProductsPageAsync();
    });
  }).catch(function(e){
    toast('Lỗi: ' + e.message, 'error');
    if (btn) { btn.innerHTML = packageId ? 'Lưu tất cả thay đổi' : 'Thêm gói'; btn.disabled = false; }
  });
}

// Ẩn/bật gói — KHÔNG xoá dữ liệu, chỉ ngừng hiển thị gói này ở form đặt lịch mới.
function togglePackageActive(packageId, newActive) {
  apiPost({ action: 'setPackageActive', package_id: packageId, active: newActive }).then(function(res){
    if (res && res.success) {
      toast(newActive ? 'Đã bật lại gói' : 'Đã ẩn gói khỏi form đặt lịch', 'success');
      loadProductsPageAsync();
    } else {
      toast('Lỗi: ' + (res && res.error), 'error');
    }
  }).catch(function(e){ toast('Lỗi: ' + e.message, 'error'); });
}

// Xoá hẳn 1 gói — server sẽ từ chối nếu đã có booking dùng gói này (gợi ý
// dùng "Ẩn" thay vì "Xoá" trong trường hợp đó).
function deletePackageConfirm(p) {
  if (!confirm('Xoá hẳn gói "' + p.name + '"? Hành động này không thể hoàn tác.')) return;
  apiPost({ action: 'deletePackage', package_id: p.package_id }).then(function(res){
    if (res && res.success) {
      toast('Đã xoá gói "' + p.name + '"', 'success');
      loadProductsPageAsync();
    } else {
      toast('Lỗi: ' + (res && res.error), 'error');

  }).catch(function(e){ toast('Lỗi: ' + e.message, 'error'); });

// ════════════════════════════════════════════════════════════
//  MODULE KHOÁ HỌC — mùa học, học viên, bài tập & chấm bài, thanh toán
//  Đã nối Google Sheet / Apps Script thật (action getCourseSeasons,

//  addCourseAssignment, logCourseSubmission, gradeCourseSubmission,
//  recordCoursePayment).
// ════════════════════════════════════════════════════════════
var CM_COURSES = [];
var CM_SEASONS = [];
var CM_ENROLLMENTS = [];
var CM_PAYMENTS = [];
var CM_ASSIGNMENTS = [];
var CM_SUBMISSIONS = [];
var CM_PENDING_PAYMENTS = [];

var _cmCurrentSeasonId = null;
var _cmSeasonTab = 'enroll';

function cmPlanLabel(plan) {
  return { full: 'Đóng full', deposit_500k: 'Cọc 500k', deposit_50: 'Cọc 50%' }[plan] || plan;
}
// Tổng đã đóng của 1 học viên (cộng dồn mọi lần trong Payments) so với học
// phí đầy đủ của mùa → suy ra trạng thái, KHÔNG cho admin tick tay để
// tránh sai khi học viên đóng nhiều lần (cọc trước, đóng nốt sau).
function cmComputePayment(enrollmentId, priceFull) {
  var paid = CM_PAYMENTS.filter(function(p){ return p.enrollment_id === enrollmentId; }).reduce(function(sum, p){ return sum + Number(p.amount || 0); }, 0);
  var due = Math.max(0, priceFull - paid);
  var status = paid <= 0 ? 'none' : (due <= 0 ? 'paid' : 'partial');
  return { paid: paid, due: due, status: status };
}
function cmPayBadge(status) {
  var map = { paid: ['cm-pay-badge-paid', 'Đã đóng đủ'], partial: ['cm-pay-badge-partial', 'Đã cọc'], none: ['cm-pay-badge-none', 'Chưa đóng'] };
  var m = map[status] || map.none;
  return '<span class="badge ' + m[0] + '">' + m[1] + '</span>';
}

function csNormDate(s) { return String(s || '').slice(0, 10); }

// ── Trang danh sách Khoá học → Mùa ──
function loadCoursesPageAsync() {
  var c = document.getElementById('main-content');
  c.className = 'content';
  c.innerHTML = '<div class="empty-state">Đang tải...</div>';
  apiGet('getCourseSeasons').then(function(res){
    if (!res || !res.success) { c.innerHTML = '<div class="empty-state">Lỗi tải dữ liệu khoá học: ' + (res && res.error || '') + '</div>'; return; }
    CM_COURSES = (res.data.courses || []).map(function(x){ return { id: x.course_id, name: x.name, active: x.active }; });
    CM_SEASONS = (res.data.seasons || []).map(function(x){
      return {
        id: x.season_id, course_id: x.course_id, season_no: Number(x.season_no) || 0,
        status: x.status, start_date: csNormDate(x.start_date),
        class_link: x.class_link || '', slide_link: x.slide_link || '',
        price_full: Number(x.price_full) || 0, plans: x.plans || [],
        max_seats: Number(x.max_seats) || 0, enrolled_count: Number(x.enrolled_count) || 0, instructor_advisor: x.instructor_advisor || '',
      };
    });
    c.innerHTML = renderCoursesPage();
  }).catch(function(e){ c.innerHTML = '<div class="empty-state">Lỗi kết nối: ' + e.message + '</div>'; });
}

function renderCoursesPage() {
  var html = pageHeader('Khoá học', 'Quản lý mùa học, học viên, bài tập & chấm bài, thanh toán',
    '<button class="update-btn" onclick="openNewCourse()">+ Thêm khoá học</button>');
  if (CM_COURSES.length === 0) html += '<div class="empty-state"><div class="icon">📚</div>Chưa có khoá học nào — bấm "+ Thêm khoá học" để tạo.</div>';
  CM_COURSES.forEach(function(course){
    var seasons = CM_SEASONS.filter(function(s){ return s.course_id === course.id; }).sort(function(a, b){ return b.season_no - a.season_no; });
    html += '<div class="cm-course-card">';
    html += '<div class="cm-course-head"><div><div class="cm-course-name">' + course.name + '</div><div class="cm-course-sub">' + seasons.length + ' mùa</div></div>' +
      '<button class="update-btn" onclick="openSeasonEditor(\'' + course.id + '\')">+ Mở mùa mới</button></div>';
    if (seasons.length === 0) {
      html += '<div style="padding:16px 20px;color:var(--muted);font-size:13px">Chưa có mùa nào.</div>';
    } else {
      seasons.forEach(function(s){
        var enrolledCount = s.enrolled_count || 0;
        var statusBadge = s.status === 'Đang học' ? 'badge-confirmed' : (s.status === 'Sắp mở' ? 'badge-pending' : 'badge-cancelled');
        html += '<div class="cm-season-row">';
        html += '<div class="cm-season-no">Mùa ' + s.season_no + '</div>';
        html += '<div class="cm-season-info"><div class="cm-season-title">' + '<span class="badge ' + statusBadge + '">' + s.status + '</span></div>' +
          '<div class="cm-season-meta">' + enrolledCount + ' học viên · Khai giảng ' + fmtDateStr(s.start_date) + ' · ' + fmtMoney(s.price_full) + '</div></div>';
        html += '<button class="update-btn" onclick="navToSeasonDetail(\'' + s.id + '\',\'settings\')">✎ Sửa</button> ';
        html += '<button class="detail-btn" onclick="navToSeasonDetail(\'' + s.id + '\')">Chi tiết →</button>';
        html += '</div>';
      });
    }
    html += '</div>';
  });
  return html;
}

// ── Form Mở mùa mới / Sửa mùa ──
// ── Mở mùa mới: hỏi nhanh "Số mùa" rồi tạo với giá trị mặc định — phần còn
//    lại (học phí, link lớp học, slide...) điền tiếp ngay trong tab "Cài đặt
//    mùa" của trang chi tiết — gộp làm 1, không còn trang "Sửa" riêng nữa. ──
function openNewCourse() {
  document.getElementById('modal-title').textContent = 'Thêm khoá học';
  document.getElementById('modal-body').innerHTML = '<div class="modal-field"><div class="form-label">Tên khoá học</div><input class="form-input" id="cm-newcourse-name" placeholder="VD: Khoá Phỏng vấn tiếng Anh"></div>' +
    '<div style="font-size:12px;color:var(--muted)">Sau khi tạo, bấm "+ Mở mùa mới" để mở mùa đầu tiên. Không gửi email cho ai.</div>';
  document.getElementById('modal-actions').innerHTML = '<button class="detail-btn" onclick="closeModal()">Hủy</button> <button class="login-btn" id="cm-newcourse-save" style="width:auto;padding:10px 24px" onclick="saveNewCourse()">Tạo khoá học</button>';
  document.getElementById('modal-overlay').classList.add('open');
}
function saveNewCourse() {
  var name = v('cm-newcourse-name');
  if (!name) { toast('Vui lòng nhập tên khoá học', 'error'); return; }
  var btn = document.getElementById('cm-newcourse-save'); btn.disabled = true; btn.textContent = 'Đang tạo...';
  apiPost({ action: 'saveCourse', name: name, created_by: currentUser.email }).then(function(res){
    if (!res || !res.success) { toast((res && res.error) || 'Không tạo được khoá học', 'error'); btn.disabled = false; btn.textContent = 'Tạo khoá học'; return; }
    closeModal();
    toast('Đã tạo khoá học ✅', 'success');
    loadCoursesPageAsync();
  }).catch(function(e){ toast('Lỗi kết nối: ' + e.message, 'error'); btn.disabled = false; btn.textContent = 'Tạo khoá học'; });
}

function openSeasonEditor(courseId) {
  document.getElementById('modal-title').textContent = 'Mở mùa mới';
  var html = '<div class="modal-field"><div class="form-label">Số mùa</div><input class="form-input" type="number" id="cm-newseason-no" placeholder="VD: 10"></div>';
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal-actions').innerHTML = '<button class="detail-btn" onclick="closeModal()">Hủy</button> <button class="login-btn" style="width:auto;padding:10px 24px" onclick="saveNewSeasonQuick(\'' + courseId + '\')">Tạo & điền tiếp</button>';
  document.getElementById('modal-overlay').classList.add('open');
}

function saveNewSeasonQuick(courseId) {
  var seasonNo = Number(document.getElementById('cm-newseason-no').value);
  if (!seasonNo) { toast('Vui lòng nhập số mùa', 'error'); return; }
  apiPost({ action: 'saveCourseSeason', course_id: courseId, season_no: seasonNo, status: 'Sắp mở', price_full: 0, plans: ['full', 'deposit_500k', 'deposit_50'] }).then(function(res){
    if (!res || !res.success) { toast('Lỗi: ' + (res && res.error), 'error'); return; }
    closeModal();
    toast('Đã mở Mùa ' + seasonNo + ' — điền tiếp thông tin bên dưới nhé', 'success');
    navToSeasonDetail(res.season_id, 'settings');
  }).catch(function(e){ toast('Lỗi kết nối: ' + e.message, 'error'); });
}

function saveSeasonEditor(seasonId) {
  var seasonNo = Number(document.getElementById('cm-se-no').value);
  var status = document.getElementById('cm-se-status').value;
  var start = document.getElementById('cm-se-start').value;
  var price = Number(document.getElementById('cm-se-price').value) || 0;
  var classLink = v('cm-se-classlink');
  var slideLink = v('cm-se-slidelink');
  var maxSeats = Number(document.getElementById('cm-se-maxseats').value) || 0;
  var instructorAdvisor = v('cm-se-instructor');
  var plans = Array.prototype.slice.call(document.querySelectorAll('.cm-se-plan:checked')).map(function(el){ return el.value; });
  if (!seasonNo) { toast('Vui lòng nhập số mùa', 'error'); return; }
  if (!price) { toast('Vui lòng nhập học phí', 'error'); return; }
  if (plans.length === 0) { toast('Chọn ít nhất 1 hình thức thanh toán', 'error'); return; }

  var currentSeason = CM_SEASONS.find(function(x){ return x.id === seasonId; });
  var payload = {
    action: 'saveCourseSeason', season_id: seasonId, course_id: currentSeason ? currentSeason.course_id : '',
    season_no: seasonNo, status: status, start_date: start, price_full: price,
    class_link: classLink, slide_link: slideLink, max_seats: maxSeats, instructor_advisor: instructorAdvisor, plans: plans,
  };

  var btn = document.getElementById('cm-se-save-btn');
  if (btn) { btn.innerHTML = '<span class="spinner"></span> Đang lưu...'; btn.disabled = true; }

  apiPost(payload).then(function(res){
    if (!res || !res.success) {
      toast('Lỗi: ' + (res && res.error), 'error');
      if (btn) { btn.innerHTML = 'Lưu thay đổi'; btn.disabled = false; }
      return;
    }
    toast('Đã lưu Mùa ' + seasonNo + ' ✅', 'success');
    csLoadSeasonDetail(seasonId, function(){ document.getElementById('main-content').innerHTML = renderSeasonDetail(); });
  }).catch(function(e){

    toast('Lỗi kết nối: ' + e.message, 'error');
    if (btn) { btn.innerHTML = 'Lưu thay đổi'; btn.disabled = false; }
  });
}

// ── Trang chi tiết 1 mùa — 3 tab: Học viên / Bài tập & Chấm bài / Thanh toán ──
// Tải 1 lần duy nhất (enrollments + assignments + submissions + payments),
// dùng chung cho cả 3 tab — không gọi lại API khi chỉ chuyển tab.
function csLoadSeasonDetail(seasonId, callback) {
  apiGet('getSeasonDetail', { season_id: seasonId }).then(function(res){
    if (!res || !res.success) { toast('Lỗi tải chi tiết mùa: ' + (res && res.error), 'error'); return; }
    CM_ENROLLMENTS = (res.data.enrollments || []).map(function(x){
      return { id: x.enrollment_id, season_id: x.season_id, name: x.name, email: x.email || '', phone: x.phone, plan: x.plan, enrolled_at: csNormDate(x.enrolled_at) };
    });
    CM_ASSIGNMENTS = (res.data.assignments || []).map(function(x){
      return { id: x.assignment_id, season_id: x.season_id, title: x.title, problem_link: x.problem_link || '', due_date: csNormDate(x.due_date), sort_order: Number(x.sort_order) || 0, sent_at: x.sent_at ? csNormDate(x.sent_at) : '' };
    });
    CM_SUBMISSIONS = (res.data.submissions || []).map(function(x){
      return { id: x.submission_id, assignment_id: x.assignment_id, enrollment_id: x.enrollment_id, file_link: x.file_link, submitted_at: csNormDate(x.submitted_at), grade: x.grade, feedback: x.feedback };
    });
    CM_PAYMENTS = (res.data.payments || []).map(function(x){
      return { id: x.order_id, enrollment_id: x.ref_id, amount: Number(x.amount) || 0, method: x.method, paid_at: csNormDate(x.paid_at), note: x.note };
    });
    CM_PENDING_PAYMENTS = (res.data.pending_payments || []).map(function(x){
      return { order_id: x.order_id, enrollment_id: x.ref_id, amount: Number(x.amount) || 0, expires_at: x.expires_at, payment_url: '' };
    });
    if (callback) callback();
  }).catch(function(e){ toast('Lỗi kết nối: ' + e.message, 'error'); });
}

function navToSeasonDetail(seasonId, tab) {
  _cmCurrentSeasonId = seasonId;
  _cmSeasonTab = tab || 'enroll';
  var c = document.getElementById('main-content');
  c.className = 'content';
  c.innerHTML = '<div class="empty-state">Đang tải...</div>';
  csLoadSeasonDetail(seasonId, function(){ c.innerHTML = renderSeasonDetail(); });
}

function cmSwitchTab(tab) {
  _cmSeasonTab = tab;
  document.getElementById('main-content').innerHTML = renderSeasonDetail(); // dữ liệu đã có sẵn, không cần gọi lại API
}

function renderSeasonDetail() {
  var s = CM_SEASONS.find(function(x){ return x.id === _cmCurrentSeasonId; });
  if (!s) return '<div class="empty-state">Không tìm thấy mùa học</div>';
  var course = CM_COURSES.find(function(c){ return c.id === s.course_id; });

  var html = '<div style="margin-bottom:14px"><button class="detail-btn" onclick="loadCoursesPageAsync()">← Quay lại Khoá học</button></div>';
  html += pageHeader((course ? course.name : '') + ' — Mùa ' + s.season_no, 'Khai giảng ' + fmtDateStr(s.start_date) + ' · ' + fmtMoney(s.price_full) + ' · ' + s.status);

  html += '<div class="card" style="margin-bottom:16px"><div style="padding:16px 24px;display:grid;grid-template-columns:1fr 1fr;gap:14px;font-size:13px">';
  html += '<div><div class="form-label">Link lớp học</div>' + (s.class_link ? ('<a href="' + s.class_link + '" target="_blank" style="color:var(--brand)">' + s.class_link + '</a>') : '<span style="color:var(--muted)">Chưa có — vào tab "Cài đặt mùa" để thêm</span>') + '</div>';
  html += '<div><div class="form-label">Tài liệu slide</div>' + (s.slide_link ? ('<a href="' + s.slide_link + '" target="_blank" style="color:var(--brand)">' + s.slide_link + '</a>') : '<span style="color:var(--muted)">Chưa có — vào tab "Cài đặt mùa" để thêm</span>') + '</div>';
  html += '</div></div>';

  html += '<div class="card">';
  html += '<div class="cm-tabs">';
  [['enroll', 'Học viên'], ['assign', 'Bài tập & Chấm bài'], ['pay', 'Thanh toán'], ['settings', 'Cài đặt mùa']].forEach(function(t){
    html += '<div class="cm-tab' + (_cmSeasonTab === t[0] ? ' active' : '') + '" onclick="cmSwitchTab(\'' + t[0] + '\')">' + t[1] + '</div>';
  });
  html += '</div>';

  if (_cmSeasonTab === 'assign') html += renderCmAssignTab(s);
  else if (_cmSeasonTab === 'pay') html += renderCmPayTab(s);
  else if (_cmSeasonTab === 'settings') html += renderCmSettingsTab(s);
  else html += renderCmEnrollTab(s);

  html += '</div>';
  return html;
}

function renderCmSettingsTab(s) {

  html += '<div><div class="form-label">Số chỗ tối đa</div><input class="form-input" type="number" id="cm-se-maxseats" value="' + s.max_seats + '" placeholder="VD: 30" style="margin-top:6px"></div>';
  html += '<div><div class="form-label">Giảng viên (Advisor)</div><input class="form-input" id="cm-se-instructor" value="' + (s.instructor_advisor || '') + '" placeholder="Tên Advisor làm giảng viên" style="margin-top:6px"></div>';

  [['full', 'Đóng full'], ['deposit_500k', 'Cọc 500k'], ['deposit_50', 'Cọc 50%']].forEach(function(pl){
    var checked = (s.plans || []).indexOf(pl[0]) !== -1;
    html += '<label style="display:inline-flex;align-items:center;gap:6px;font-size:13px;margin-right:18px;cursor:pointer">' +
      '<input type="checkbox" class="cm-se-plan" value="' + pl[0] + '" ' + (checked ? 'checked' : '') + '> ' + pl[1] + '</label>';

function renderCmEnrollTab(s) {
  var list = CM_ENROLLMENTS.filter(function(e){ return e.season_id === s.id; });
  var html = '<div style="padding:16px 24px;display:flex;justify-content:flex-end"><button class="update-btn" onclick="openEnrollModal(\'' + s.id + '\')">+ Thêm học viên</button></div>';
  html += '<table class="bookings-table"><thead><tr><th>HỌC VIÊN</th><th>SĐT</th><th>HÌNH THỨC</th><th>THANH TOÁN</th><th>NGÀY ĐĂNG KÝ</th><th></th></tr></thead><tbody>';
  if (list.length === 0) html += '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:24px 0">Chưa có học viên nào — bấm "+ Thêm học viên" để bắt đầu.</td></tr>';
  list.forEach(function(e){
    var pay = cmComputePayment(e.id, s.price_full);
    var pending = CM_PENDING_PAYMENTS.filter(function(x){ return x.enrollment_id === e.id; });
    var pendingHtml = pending.map(function(x){
      return '<div style="font-size:11px;color:#B45309;margin-top:3px">⏳ Mã <b>' + x.order_id + '</b> — ' + fmtMoney(x.amount) + ' — đang chờ chuyển khoản</div>';
    }).join('');
    html += '<tr><td><b>' + e.name + '</b>' + (e.email ? '<div style="font-size:11.5px;color:var(--muted)">' + e.email + '</div>' : '') + '</td><td>' + (e.phone || '') + '</td><td>' + cmPlanLabel(e.plan) + '</td>' +
      '<td>' + cmPayBadge(pay.status) + ' <span style="font-size:11.5px;color:var(--muted)">(' + fmtMoney(pay.paid) + ' / ' + fmtMoney(s.price_full) + ')</span>' + pendingHtml + '</td>' +
      '<td>' + fmtDateStr(e.enrolled_at) + '</td>' +
      '<td style="white-space:nowrap"><button class="detail-btn" onclick="openCollectPaymentModal(\'' + e.id + '\')">Thu học phí</button></td></tr>';
  });
  html += '</tbody></table>';
  return html;
}

function renderCmAssignTab(s) {
  var list = CM_ASSIGNMENTS.filter(function(a){ return a.season_id === s.id; }).sort(function(a, b){ return (a.sort_order || 0) - (b.sort_order || 0); });
  var enrolled = CM_ENROLLMENTS.filter(function(e){ return e.season_id === s.id; });
  var html = '<div style="padding:16px 24px;display:flex;justify-content:flex-end"><button class="update-btn" onclick="openAssignmentModal(\'' + s.id + '\')">+ Thêm bài tập</button></div>';
  if (list.length === 0) html += '<div style="padding:0 24px 20px;color:var(--muted);font-size:13px">Chưa có bài tập nào.</div>';
  list.forEach(function(a){
    var subs = CM_SUBMISSIONS.filter(function(sub){ return sub.assignment_id === a.id; });
    var gradedCount = subs.filter(function(sub){ return sub.grade !== '' && sub.grade != null; }).length;
    html += '<div style="border-top:1px solid var(--border);padding:16px 24px">';
    html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px">';
    html += '<div><b>' + a.title + '</b><div style="font-size:12px;color:var(--muted);margin-top:2px">Hạn nộp ' + fmtDateStr(a.due_date) + ' · ' + subs.length + '/' + enrolled.length + ' đã nộp · ' + gradedCount + '/' + subs.length + ' đã chấm' +
      (a.problem_link ? ' · <a href="' + a.problem_link + '" target="_blank" style="color:var(--brand)">Xem đề bài</a>' : ' · <span style="color:var(--muted)">Chưa có link đề bài</span>') + '</div></div>';
    html += '<div style="white-space:nowrap">' + (a.sent_at ? '<span style="font-size:11.5px;color:#15803D">✓ Đã gửi lúc ' + fmtDateStr(a.sent_at) + '</span>' : '<button class="detail-btn" onclick="sendAssignmentToStudents(\'' + a.id + '\')">📤 Gửi cho học viên</button>') + '</div>';
    html += '</div>';
    html += '<table class="bookings-table"><thead><tr><th>HỌC VIÊN</th><th>BÀI NỘP</th><th>ĐIỂM / NHẬN XÉT</th><th></th></tr></thead><tbody>';
    enrolled.forEach(function(e){
      var sub = subs.find(function(x){ return x.enrollment_id === e.id; });
      html += '<tr><td>' + e.name + '</td>';
      html += '<td>' + (sub ? ('<a href="' + sub.file_link + '" target="_blank" style="color:var(--brand)">Xem bài</a>') : '<span style="color:var(--muted)">Chưa nộp</span>') + '</td>';
      html += '<td>' + (sub && sub.grade ? ('<b>' + sub.grade + '</b> — ' + (sub.feedback || '')) : '<span style="color:var(--muted)">—</span>') + '</td>';
      html += '<td>' + (sub ? ('<button class="detail-btn" onclick="openGradeModal(\'' + a.id + '\',\'' + e.id + '\')">Chấm bài</button>') : ('<button class="detail-btn" onclick="openLogSubmissionModal(\'' + a.id + '\',\'' + e.id + '\')">+ Ghi bài nộp</button>')) + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table></div>';
  });
  return html;
}

function renderCmPayTab(s) {
  var enrolled = CM_ENROLLMENTS.filter(function(e){ return e.season_id === s.id; });
  var allPayments = [];
  enrolled.forEach(function(e){
    CM_PAYMENTS.filter(function(p){ return p.enrollment_id === e.id; }).forEach(function(p){
      allPayments.push({ amount: p.amount, method: p.method, paid_at: p.paid_at, note: p.note, studentName: e.name });
    });
  });
  allPayments.sort(function(a, b){ return new Date(b.paid_at) - new Date(a.paid_at); });
  var totalCollected = allPayments.reduce(function(sum, p){ return sum + Number(p.amount || 0); }, 0);
  var totalExpected = enrolled.length * s.price_full;

  var html = '<div style="padding:16px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">';
  html += '<div style="font-size:13px;color:var(--muted)">Đã thu <b style="color:var(--text)">' + fmtMoney(totalCollected) + '</b> / dự kiến ' + fmtMoney(totalExpected) + '</div>';
  html += '<button class="update-btn" onclick="openCollectPaymentModal()">+ Thu học phí</button></div>';

  html += '<table class="bookings-table"><thead><tr><th>HỌC VIÊN</th><th>SỐ TIỀN</th><th>HÌNH THỨC</th><th>NGÀY</th><th>GHI CHÚ</th></tr></thead><tbody>';
  if (allPayments.length === 0) html += '<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:24px 0">Chưa có giao dịch nào.</td></tr>';
  allPayments.forEach(function(p){
    html += '<tr><td>' + p.studentName + '</td><td><b>' + fmtMoney(p.amount) + '</b></td><td>' + p.method + '</td><td>' + fmtDateStr(p.paid_at) + '</td><td style="color:var(--muted)">' + (p.note || '') + '</td></tr>';
  });
  html += '</tbody></table>';
  return html;
}

// ── Modal: Thêm học viên vào mùa ──
// MỚI: nếu mùa chưa cấu hình "Hình thức thanh toán cho phép" vẫn cho chọn đủ 3 hình thức
// (trước đây dropdown trống → không chọn được). Gợi ý nhanh từ danh sách Advisee đã có.
function openEnrollModal(seasonId) {
  var s = CM_SEASONS.find(function(x){ return x.id === seasonId; });
  if (!s) { toast('Không tìm thấy mùa học — bấm "Quay lại Khoá học" rồi thử lại', 'error'); return; }
  document.getElementById('modal-title').textContent = 'Thêm học viên — Mùa ' + s.season_no;
  var plans = (s.plans && s.plans.length) ? s.plans : ['full', 'deposit_500k', 'deposit_50'];
  var planOptions = plans.map(function(p){ return '<option value="' + p + '">' + cmPlanLabel(p) + '</option>'; }).join('');
  var dl = '';
  try {
    dl = '<datalist id="cm-en-suggest">' + (MOCK.advisees || []).slice(0, 400).map(function(a){
      return '<option value="' + escHtml(a.name) + '" label="' + escHtml((a.email || '') + (a.phone ? ' · ' + a.phone : '')) + '"></option>';
    }).join('') + '</datalist>';
  } catch (e) {}
  var html = '<div class="modal-field"><div class="form-label">Họ tên <span style="color:var(--brand)">*</span></div><input class="form-input" id="cm-en-name" list="cm-en-suggest" oninput="cmEnrollAutofill()" placeholder="VD: Nguyễn Văn A" style="margin-top:6px"></div>' + dl;
  html += '<div class="modal-field"><div class="form-label">Email (để phát tài khoản đăng nhập)</div><input class="form-input" type="email" id="cm-en-email" placeholder="hocvien@gmail.com" style="margin-top:6px"></div>';
  html += '<div class="modal-field"><div class="form-label">Số điện thoại</div><input class="form-input" id="cm-en-phone" placeholder="VD: 0901234567" style="margin-top:6px"></div>';
  html += '<div class="modal-field"><div class="form-label">Hình thức thanh toán</div><select class="form-input" id="cm-en-plan" style="margin-top:6px">' + planOptions + '</select></div>';
  html += '<div class="modal-field"><div class="form-label">Số tiền đóng ngay (nếu có)</div><input class="form-input" type="number" id="cm-en-initial-pay" placeholder="VD: 500000" style="margin-top:6px"></div>';
  html += '<div id="cm-en-error" style="color:var(--brand);font-size:12.5px;display:none"></div>';
  html += '<div style="font-size:12px;color:var(--muted)">Không gửi email cho học viên khi thêm.</div>';
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal-actions').innerHTML = '<button class="detail-btn" onclick="closeModal()">Hủy</button> <button class="login-btn" id="cm-en-save" style="width:auto;padding:10px 24px" onclick="saveEnrollModal(\'' + seasonId + '\')">Thêm học viên</button>';
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(function(){ var el = document.getElementById('cm-en-name'); if (el) el.focus(); }, 100);
}

// Chọn đúng tên 1 Advisee có sẵn trong gợi ý → tự điền email + SĐT
function cmEnrollAutofill() {
  var name = (document.getElementById('cm-en-name') || {}).value || '';
  var hit = (MOCK.advisees || []).find(function(a){ return a.name === name; });
  if (!hit) return;
  var em = document.getElementById('cm-en-email'), ph = document.getElementById('cm-en-phone');
  if (em && !em.value) em.value = hit.email || '';
  if (ph && !ph.value) ph.value = hit.phone || '';
}

function saveEnrollModal(seasonId) {
  var name = v('cm-en-name');
  var email = v('cm-en-email');
  var phone = v('cm-en-phone');
  var plan = document.getElementById('cm-en-plan').value;
  var initialPay = Number(document.getElementById('cm-en-initial-pay').value) || 0;
  var errEl = document.getElementById('cm-en-error');
  var showErr = function(msg){ if (errEl) { errEl.textContent = msg; errEl.style.display = 'block'; } toast(msg, 'error'); };
  if (errEl) errEl.style.display = 'none';
  if (!name) { showErr('Vui lòng nhập họ tên'); return; }
  if (email && !/^\S+@\S+\.\S+$/.test(email)) { showErr('Email không hợp lệ'); return; }
  var btn = document.getElementById('cm-en-save');
  if (btn) { btn.disabled = true; btn.textContent = 'Đang thêm...'; }
  apiPost({ action: 'addCourseEnrollment', season_id: seasonId, name: name, email: email, phone: phone, plan: plan, initial_pay: initialPay, by: currentUser && currentUser.email }).then(function(res){
    if (!res || !res.success) {
      showErr('Không thêm được học viên: ' + ((res && res.error) || 'lỗi không rõ — kiểm tra bản Apps Script đã Deploy phiên bản mới chưa'));
      if (btn) { btn.disabled = false; btn.textContent = 'Thêm học viên'; }
      return;
    }
    closeModal();
    toast('Đã thêm học viên "' + name + '" ✅' + (email ? ' — đã phát tài khoản đăng nhập (mật khẩu = mã ' + res.enrollment_id + ')' : ''), 'success');
    var s = CM_SEASONS.find(function(x){ return x.id === seasonId; });
    if (s) s.enrolled_count = (s.enrolled_count || 0) + 1;
    csLoadSeasonDetail(seasonId, function(){ document.getElementById('main-content').innerHTML = renderSeasonDetail(); });
  }).catch(function(e){
    showErr('Lỗi kết nối: ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = 'Thêm học viên'; }
  });
}

// ── Modal: Thêm bài tập ──
function openAssignmentModal(seasonId) {
  document.getElementById('modal-title').textContent = 'Thêm bài tập mới';
  var html = '<div class="modal-field"><div class="form-label">Tên bài tập</div><input class="form-input" id="cm-as-title" placeholder="VD: Bài 3: Case Study phòng Marketing"></div>';
  html += '<div class="modal-field"><div class="form-label">Hạn nộp</div><input class="form-input" type="date" id="cm-as-due"></div>';
  html += '<div class="modal-field"><div class="form-label">Link đề bài</div><input class="form-input" id="cm-as-problemlink" placeholder="https://drive.google.com/..."></div>';
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal-actions').innerHTML = '<button class="detail-btn" onclick="closeModal()">Hủy</button> <button class="login-btn" style="width:auto;padding:10px 24px" onclick="saveAssignmentModal(\'' + seasonId + '\')">Thêm bài tập</button>';
  document.getElementById('modal-overlay').classList.add('open');

function saveAssignmentModal(seasonId) {
  var title = v('cm-as-title');
  var due = document.getElementById('cm-as-due').value;
  var problemLink = v('cm-as-problemlink');
  if (!title) { toast('Vui lòng nhập tên bài tập', 'error'); return; }
  apiPost({ action: 'addCourseAssignment', season_id: seasonId, title: title, due_date: due, problem_link: problemLink }).then(function(res){
    if (!res || !res.success) { toast('Lỗi: ' + (res && res.error), 'error'); return; }
    closeModal();
    toast('Đã thêm bài tập ✅', 'success');
    csLoadSeasonDetail(seasonId, function(){ document.getElementById('main-content').innerHTML = renderSeasonDetail(); });
  }).catch(function(e){ toast('Lỗi kết nối: ' + e.message, 'error'); });
}

// ── Gửi bài tập cho học viên: copy sẵn tin nhắn (tên bài, hạn nộp, link đề
//    bài) để admin dán vào nhóm Zalo lớp, đồng thời đánh dấu "đã gửi". ──
function sendAssignmentToStudents(assignmentId) {
  var a = CM_ASSIGNMENTS.find(function(x){ return x.id === assignmentId; });
  if (!a) return;
  var msg = '📌 ' + a.title + '\nHạn nộp: ' + fmtDateStr(a.due_date) + (a.problem_link ? '\nĐề bài: ' + a.problem_link : '');
  navigator.clipboard.writeText(msg).catch(function(){});
  apiPost({ action: 'sendCourseAssignment', assignment_id: assignmentId }).then(function(res){
    if (!res || !res.success) { toast('Lỗi: ' + (res && res.error), 'error'); return; }
    toast('Đã copy tin nhắn — dán vào nhóm Zalo lớp ✅', 'success');
    csLoadSeasonDetail(_cmCurrentSeasonId, function(){ document.getElementById('main-content').innerHTML = renderSeasonDetail(); });
  }).catch(function(e){ toast('Lỗi kết nối: ' + e.message, 'error'); });
}

function saveGradeModal(subId) {
  var grade = v('cm-grade-score');
  var feedback = v('cm-grade-feedback');

      enrolled.map(function(e){ return '<option value="' + e.id + '">' + e.name + '</option>'; }).join('') + '</select></div>';

    '<label id="cm-cp-mode-manual-label" style="flex:1;border:1.5px solid var(--border);border-radius:8px;padding:9px;font-size:12px;cursor:pointer;text-align:center">' +
      '<input type="radio" name="cm-cp-mode" value="manual" onclick="cmSwitchPayMode()"> Đã nhận rồi<br><span style="color:var(--muted)">(ghi tay)</span></label>' +
    '</div></div>';
  html += '<div class="modal-field"><div class="form-label">Số tiền</div><input class="form-input" type="number" id="cm-cp-amount" value="' + (due > 0 ? due : '') + '" placeholder="VD: 1000000"></div>';

function cmSwitchPayMode() {
  var mode = document.querySelector('input[name="cm-cp-mode"]:checked').value;
  document.getElementById('cm-cp-method-field').style.display = mode === 'manual' ? '' : 'none';
  document.getElementById('cm-cp-submit-btn').textContent = mode === 'manual' ? 'Ghi nhận đã đóng' : 'Tạo mã CK';
  document.getElementById('cm-cp-mode-ck-label').style.borderColor = mode === 'ck' ? 'var(--brand)' : 'var(--border)';
  document.getElementById('cm-cp-mode-manual-label').style.borderColor = mode === 'manual' ? 'var(--brand)' : 'var(--border)';
}

function saveCollectPayment() {
  var mode = document.querySelector('input[name="cm-cp-mode"]:checked').value;
  var enrollmentId = document.getElementById('cm-cp-enrollment').value;
  var amount = Number(document.getElementById('cm-cp-amount').value) || 0;
  var note = v('cm-cp-note');
  if (!enrollmentId) { toast('Vui lòng chọn học viên', 'error'); return; }
  if (!amount || amount <= 0) { toast('Số tiền không hợp lệ', 'error'); return; }

  if (mode === 'ck') {
    // Sinh mã DH... + QR thật — webhook SePay tự đối chiếu & đánh dấu 'paid'
    // ngay khi học viên chuyển khoản đúng nội dung, KHÔNG cần thao tác ghi
    // nhận nào thêm — đúng yêu cầu "tạo mã + ghi nhận tự động luôn".
    apiPost({ action: 'createCoursePaymentOrder', enrollment_id: enrollmentId, amount: amount, note: note }).then(function(res){
      if (!res || !res.success) { toast('Lỗi: ' + (res && res.error), 'error'); return; }
      var resultHtml = '<div style="border-top:1px solid var(--border);margin-top:14px;padding-top:14px;text-align:center">' +
        '<img src="' + res.qr_url + '" style="width:180px;height:180px;border:1px solid var(--border);border-radius:10px;margin-bottom:10px">' +
        '<div style="font-size:13px;margin-bottom:6px">Nội dung CK: <b style="background:#F3F4F6;padding:2px 8px;border-radius:6px">' + res.order_id + '</b></div>' +
        '<div style="font-size:13px;margin-bottom:10px">Số tiền: <b>' + fmtMoney(res.amount) + '</b></div>' +
        '<button class="detail-btn" onclick="navigator.clipboard.writeText(\'' + res.payment_url + '\');toast(\'Đã copy link ✅\',\'success\')">Copy link gửi học viên</button>' +
        '<div style="font-size:11.5px;color:var(--muted);margin-top:8px">Mã hết hạn sau 15 phút. Hệ thống tự xác nhận khi học viên chuyển khoản đúng nội dung — không cần thao tác gì thêm.</div>' +
        '</div>';
      document.getElementById('cm-cp-result').innerHTML = resultHtml;
      toast('Đã tạo mã CK ✅', 'success');
      csLoadSeasonDetail(_cmCurrentSeasonId, function(){ /* nạp ngầm để badge "đang chờ CK" cập nhật khi đóng modal */ });
    }).catch(function(e){ toast('Lỗi kết nối: ' + e.message, 'error'); });
  } else {
    var method = document.getElementById('cm-cp-method').value;
    apiPost({ action: 'recordCoursePayment', enrollment_id: enrollmentId, amount: amount, method: method, note: note }).then(function(res){
      if (!res || !res.success) { toast('Lỗi: ' + (res && res.error), 'error'); return; }
      closeModal();
      toast('Đã ghi nhận thanh toán ✅', 'success');
      csLoadSeasonDetail(_cmCurrentSeasonId, function(){ document.getElementById('main-content').innerHTML = renderSeasonDetail(); });
    }).catch(function(e){ toast('Lỗi kết nối: ' + e.message, 'error'); });
  }
}

function saveNewAdvisor() {
  var btn = document.getElementById('na-submit');
  if (btn && btn.disabled) return; // chống bấm đúp tạo trùng
  var name = document.getElementById('na-name').value.trim();
  var title = document.getElementById('na-title').value.trim();
  var email = document.getElementById('na-email').value.trim();
  var phone = document.getElementById('na-phone').value.trim();
  if (!name || !title || !email || !phone) { toast('Vui lòng điền đầy đủ các trường bắt buộc (*)', 'error'); return; }
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { toast('Email chưa đúng định dạng', 'error'); return; }
  var phoneDigits = phone.replace(/\D/g, '');
  if (phoneDigits.length < 9 || phoneDigits.length > 12) { toast('SĐT cần 9 đến 12 chữ số', 'error'); return; }
  var emailLower = email.toLowerCase();
  if ((sheetData.advisors || []).some(function(a){ return String(a.email || '').trim().toLowerCase() === emailLower; })) {
    toast('Email này đã có trong danh sách Advisor', 'error'); return;
  }

  var supportItems = [];
  for (var i = 0; i < 3; i++) {
    var t = document.getElementById('na-si-title-' + i).value.trim();
    if (t) supportItems.push({ icon: document.getElementById('na-si-icon-' + i).value.trim() || '✦', title: t, desc: document.getElementById('na-si-desc-' + i).value.trim() });
  }

  var experience = [];
  document.querySelectorAll('#na-exp-list .ea-exp-row').forEach(function(row){
    var t = row.querySelector('.ea-exp-title').value.trim();
    if (!t) return;
    experience.push({
      title: t,
      company: row.querySelector('.ea-exp-company').value.trim(),
      type: row.querySelector('.ea-exp-type').value,
      location: row.querySelector('.ea-exp-location').value.trim(),
      dateRange: row.querySelector('.ea-exp-daterange').value.trim(),
      desc: row.querySelector('.ea-exp-desc').value.trim(),
    });
  });

  var products = Array.from(document.querySelectorAll('.na-pkg-cb:checked')).map(function(cb){ return cb.value; });
  var wantActive = !!document.getElementById('na-active').checked;

  if (btn) { btn.disabled = true; btn.textContent = 'Đang lưu...'; }
  function unlock() { if (btn) { btn.disabled = false; btn.textContent = 'Thêm Advisor'; } }

  apiPost({
    action: 'registerAdvisor',
    name: name, role: title,
    company: document.getElementById('na-company').value.trim(),
    industry: document.getElementById('na-tags').value.trim(),
    email: email, phone: phone,
    zalo_id: document.getElementById('na-contact').value.trim(), // cùng cột với trang sửa hồ sơ (hiển thị là "Liên hệ")
    bio: document.getElementById('na-bio').value.trim(),
    message: document.getElementById('na-message').value.trim(),
    experience: experience,
    support_items: supportItems,
    products: products,
    is_active: wantActive,
  }).then(function(res){
    if (res && res.success) {
      toast('Đã thêm ' + name + (wantActive ? ' và bật hiển thị trên web ✅' : '. Bật "hoạt động" trong danh sách để hiện trên web ✅'), 'success');
      // Tải lại danh sách từ Sheet để advisor mới xuất hiện ngay
      loadAdvisorsFromSheet(function(){ navTo('adv-list'); }, true);
    } else {
      unlock();
      toast('Lỗi khi lưu lên Sheet: ' + (res && res.error ? res.error : 'không rõ nguyên nhân'), 'error');
    }
  }).catch(function(err){
    unlock();
    toast('Lỗi kết nối: ' + err.message, 'error');
  });
}

    });
    html += '</tbody></table></div>';
  }
  return html;
}

var _advToggleBusy = {};
function toggleAdvisorActive(advisorId) {
  var a = sheetData.advisors.find(function(x){ return x.id === advisorId; });
  if (!advisorId || !a) { toast('Không tìm thấy advisor_id của người này. Bấm "Làm mới" ở danh sách rồi thử lại, hoặc kiểm tra cột advisor_id trong Sheet', 'error'); return; }
  if (_advToggleBusy[advisorId]) return; // đang xử lý, bỏ qua lần bấm đúp
  _advToggleBusy[advisorId] = true;
  var want = !a.active;
  toast('Đang cập nhật...');
  function done() { _advToggleBusy[advisorId] = false; }

  apiPost({ action: 'updateAdvisor', advisor_id: advisorId, is_active: want }).then(function(res){
    if (!res || !res.success) throw new Error((res && res.error) ? res.error : 'máy chủ không trả kết quả hợp lệ');
    // Tải lại từ Sheet để hiển thị đúng dữ liệu thật, không dựa vào giả định phía trình duyệt
    return loadAdvisorsFromSheet(null, true);
  }).then(function(){
    done();
    var fresh = sheetData.advisors.find(function(x){ return x.id === advisorId; });
    if (fresh && fresh.active === want) {
      toast(want ? '✅ Đã hiện trên web' : '🔕 Đã ẩn khỏi web', 'success');
    } else {
      toast('Sheet chưa đổi sang đúng trạng thái. Kiểm tra cột is_active của advisor này trong tab Advisors', 'error');
    }
    navToStaffAdvisorDetail(advisorId);
  }).catch(function(err){
    done();
    toast('Không đổi được trạng thái: ' + err.message, 'error');
    navToStaffAdvisorDetail(advisorId);
  });
}

function saveAdvisorEdit(advisorId) {
  var a = sheetData.advisors.find(function(x){ return x.id === advisorId; });
  if (!a) return;
  a.name    = document.getElementById('ea-name').value.trim()    || a.name;
  a.photo   = toDirectImageUrl(document.getElementById('ea-photo').value.trim());
  a.title   = document.getElementById('ea-title').value.trim()   || a.title;
  a.company = document.getElementById('ea-company').value.trim();
  a.tags    = document.getElementById('ea-tags').value.split(',').map(function(t){ return t.trim(); }).filter(Boolean);
  a.email   = document.getElementById('ea-email').value.trim()   || a.email;
  a.phone   = document.getElementById('ea-phone').value.trim()   || a.phone;
  a.contact = document.getElementById('ea-contact').value.trim();
  a.bio     = document.getElementById('ea-bio').value.trim()     || a.bio;
  a.message = document.getElementById('ea-message').value.trim() || a.message;

  a.supportItems = [];
  for (var i = 0; i < 3; i++) {
    var iconEl = document.getElementById('ea-si-icon-' + i);
    var titleEl = document.getElementById('ea-si-title-' + i);
    var descEl = document.getElementById('ea-si-desc-' + i);
    if (titleEl && titleEl.value.trim()) {
      a.supportItems.push({ icon: iconEl.value.trim() || '✦', title: titleEl.value.trim(), desc: descEl.value.trim() });
    }
  }

  a.experience = [];
  document.querySelectorAll('#ea-exp-list .ea-exp-row').forEach(function(row){
    var title = row.querySelector('.ea-exp-title').value.trim();
    if (!title) return;
    a.experience.push({
      title: title,
      company: row.querySelector('.ea-exp-company').value.trim(),
      type: row.querySelector('.ea-exp-type').value,
      location: row.querySelector('.ea-exp-location').value.trim(),
      dateRange: row.querySelector('.ea-exp-daterange').value.trim(),
      desc: row.querySelector('.ea-exp-desc').value.trim(),
    });
  });

  a.products = Array.from(document.querySelectorAll('.ea-pkg-cb:checked')).map(function(cb){ return cb.value; });

  a.feedbacks = [];
  document.querySelectorAll('#ea-fb-list .ea-fb-row').forEach(function(row){
    var from = row.querySelector('.ea-fb-from').value.trim();
    var text = row.querySelector('.ea-fb-text').value.trim();
    if (!from || !text) return; // bỏ dòng trống (vd người dùng bấm "+ Thêm" nhưng không điền)
    a.feedbacks.push({
      from: from, text: text,
      rating: Number(row.querySelector('.ea-fb-rating').value) || 5,
      service: row.querySelector('.ea-fb-service').value || '',
      date: row.querySelector('.ea-fb-date').value || ''
    });
  });

  apiPost({
    action: 'updateAdvisor',
    advisor_id: advisorId,
    name: a.name, role: a.title, company: a.company,
    industry: (a.tags||[]).join(', '),
    email: a.email, phone: a.phone, zalo_id: a.contact,
    bio: a.bio, message: a.message, photo_url: a.photo,
    experience: a.experience, products: a.products, feedbacks: a.feedbacks,
    support_items: a.supportItems,
  }).then(function(res){
    if (!(res && res.success)) { toast('Lỗi khi lưu lên Sheet: ' + (res && res.error), 'error'); return; }
    // Đẩy feedback nhập tay sang tab AdvisorReviews để hiện trên feedback.html / index.html / đội-ngũ-advisor.html
    return apiPost({
      action: 'syncManualAdvisorFeedback',
      advisor_id: advisorId, advisor_name: a.name, feedbacks: a.feedbacks,
    }).then(function(r2){
      if (r2 && r2.success) toast('Đã lưu & đồng bộ lên Sheet ✅ (' + r2.count + ' feedback hiển thị trên web)', 'success');
      else toast('Đã lưu hồ sơ, nhưng đồng bộ feedback lỗi: ' + (r2 && r2.error), 'error');
    });
  }).catch(function(err){ toast('Lỗi kết nối: ' + err.message, 'error'); });
  closeModal();

  if (currentUser && currentUser.role === 'Advisor' && currentUser.name === a.name) {
    // Advisor tự sửa thông tin của mình — cập nhật lại topbar rồi render lại tab hiện tại
    document.getElementById('user-name').textContent = a.name;
    document.getElementById('dropdown-name').textContent = a.name;
    document.getElementById('user-avatar').textContent = mkInitials(a.name);
    renderAdvisor(_activeRoleTab || 'overview');
  } else {
    navToStaffAdvisorDetail(advisorId);
  }
}

  closeUserMenu();

      html += '</tr>';

// ════════════════════════════════════════════════════════════
//  QUY TẮC NHẮC HẠN DÙNG GÓI (dùng chung: trang Advisee, tab "Khách đã mua", trang Hôm nay của Sale)
//  Chỉ hiện NGÀY hết hạn (dd/mm/yyyy), không hiện "còn/quá X ngày".
//  Thứ tự ưu tiên (khách đang dùng dịch vụ lên trước):
//    nhóm 0  ĐỎ   : còn hiệu lực và hết hạn trong EXPIRY_WARN_DAYS ngày → nhắc / upsell
//    nhóm 1       : đang dùng, còn buổi, chưa sắp hết hạn
//    nhóm 2       : đã dùng hết buổi, chưa hết hạn
//    nhóm 3  XÁM  : đã hết hạn
//  Muốn đổi ngưỡng "sắp hết hạn": sửa số dưới đây.
// ════════════════════════════════════════════════════════════
var EXPIRY_WARN_DAYS = 7;
function fmtDmy_(s) {
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || ''));
  return m ? (m[3] + '/' + m[2] + '/' + m[1]) : String(s || '');
}
// Trả về { red, state, group, rank, daysLeft, remaining, badge, hint }
function expiryAlert_(ae) {
  var total = Number(ae.sessionsTotal) || 0, done = Number(ae.sessionsDone) || 0;
  var remaining = Math.max(0, total - done);
  var out = { red: false, state: 'active', group: 1, rank: 0, daysLeft: null, remaining: remaining, badge: '', hint: '' };
  if (!ae.expiry) { out.group = remaining > 0 ? 1 : 2; out.rank = 99999; return out; }
  var today = new Date(); today.setHours(0,0,0,0);
  var daysLeft = Math.ceil((new Date(ae.expiry + 'T00:00:00') - today) / 86400000);
  if (isNaN(daysLeft)) { out.rank = 99999; return out; }
  out.daysLeft = daysLeft;
  var dateTxt = 'Hết hạn ' + fmtDmy_(ae.expiry);
  var redBadge = function(t){ return '<span class="badge" style="background:#FEE2E2;color:#B91C1C;font-weight:700">' + t + '</span>'; };
  var greyBadge = function(t){ return '<span class="badge" style="background:#F3F4F6;color:var(--muted)">' + t + '</span>'; };
  if (daysLeft < 0) {
    out.state = 'expired'; out.group = 3; out.rank = -daysLeft;   // mới hết hạn gần đây xếp trước
    out.badge = greyBadge(dateTxt);
    out.hint = remaining > 0 ? 'Còn ' + remaining + ' buổi chưa dùng' : '';
    return out;
  }
  var soon = daysLeft <= EXPIRY_WARN_DAYS;
  out.rank = daysLeft;
  if (remaining <= 0) {
    out.state = 'allused'; out.group = soon ? 0 : 2;
    out.hint = soon ? '👉 Đã dùng hết buổi — cơ hội upsell gói mới' : 'Đã dùng hết buổi';
  } else {
    out.state = 'active'; out.group = soon ? 0 : 1;
    out.hint = soon ? '👉 Còn ' + remaining + ' buổi chưa dùng — nhắc khách đặt lịch' : '';
  }
  out.red = soon;
  out.badge = soon ? redBadge(dateTxt) : '<span style="font-size:12px;color:var(--muted)">' + dateTxt + '</span>';
  return out;
}
function expiryCompare_(a, b) {
  var ea = expiryAlert_(a), eb = expiryAlert_(b);
  if (ea.group !== eb.group) return ea.group - eb.group;
  return ea.rank - eb.rank;
}

// ── Bộ lọc TRẠNG THÁI advisee (mỗi khách thuộc đúng 1 trạng thái, xét theo thứ tự bên dưới) ──
//   completed  Hoàn thành gói : đã meet đủ số buổi của gói
//   expired    Hết hạn        : quá ngày hết hạn mà vẫn còn buổi chưa dùng
//   soon       Sắp hết hạn    : còn hiệu lực, hết hạn trong EXPIRY_WARN_DAYS ngày, còn buổi chưa dùng
//   new        Mới đăng ký    : đăng ký trong AE_NEW_DAYS ngày gần đây và chưa meet buổi nào
//   active     Đang dùng gói  : các khách còn lại đang trong hạn dùng
var AE_NEW_DAYS = 7;
var _aeFilter = 'all';
function aeStatusOf_(ae) {
  var total = Number(ae.sessionsTotal) || 0, done = Number(ae.sessionsDone) || 0;
  if (total > 0 && done >= total) return 'completed';
  var ex = expiryAlert_(ae);
  if (ex.state === 'expired') return 'expired';
  if (ex.red) return 'soon';
  var created = tsOf_(ae.createdAtRaw) || tsOf_(ae.registeredAt);
  if (done === 0 && created && (Date.now() - created) <= AE_NEW_DAYS * 86400000) return 'new';
  return 'active';
}
var AE_STATUS_CHIPS = [
  ['all', 'Tất cả', 'Mọi advisee'],
  ['new', '🆕 Mới đăng ký', 'Đăng ký trong ' + AE_NEW_DAYS + ' ngày gần đây, chưa meet buổi nào'],
  ['active', 'Đang dùng gói', 'Đang trong hạn dùng, còn buổi chưa dùng, chưa sắp hết hạn'],
  ['soon', '⏰ Sắp hết hạn', 'Hết hạn trong ' + EXPIRY_WARN_DAYS + ' ngày tới — cần nhắc / upsell'],
  ['completed', 'Hoàn thành gói', 'Đã meet đủ số buổi của gói'],
  ['expired', 'Hết hạn', 'Quá hạn dùng nhưng vẫn còn buổi chưa dùng'],
];
function aeStatusCounts_() {
  var n = { all: MOCK.advisees.length, new: 0, active: 0, soon: 0, completed: 0, expired: 0 };
  MOCK.advisees.forEach(function(a){ n[aeStatusOf_(a)]++; });
  return n;
}
function aeFilterBarHtml_() {
  var n = aeStatusCounts_();
  return '<div class="chip-row">' + AE_STATUS_CHIPS.map(function(c){
    return '<button class="chip' + (_aeFilter === c[0] ? ' active' : '') + (c[0] === 'soon' && n.soon > 0 ? ' chip-danger' : '') + '" title="' + escHtml(c[2]) + '" onclick="setAeFilter(\'' + c[0] + '\')">' +
      escHtml(c[1]) + ' <span class="chip-n">' + n[c[0]] + '</span></button>';
  }).join('') + '</div>';
}
function setAeFilter(key) {
  var inp = document.querySelector('input[oninput*="advisee-list-tbody"]');
  var q = inp ? inp.value : '';
  _aeFilter = key;
  document.getElementById('main-content').innerHTML = renderAdviseeModule();
  var inp2 = document.querySelector('input[oninput*="advisee-list-tbody"]');
  if (inp2 && q) { inp2.value = q; filterRowsBySearch(inp2, 'advisee-list-tbody'); }
}
function toggleAeUrgent() { setAeFilter(_aeFilter === 'soon' ? 'all' : 'soon'); }

  if (newDone > newTotal) { toast('Số buổi đã dùng không thể lớn hơn tổng số buổi', 'error'); return; }

  var btn = document.getElementById('eae-save');
  if (btn) { btn.disabled = true; btn.textContent = 'Đang lưu...'; }
  apiPost({
    action: 'updateAdvisee', booking_id: ae.bookingId || ae.id,
    name: newName, email: newEmail,
    phone: document.getElementById('eae-phone').value.trim(),
    package_name: document.getElementById('eae-pkg').value,
    sessions_total: newTotal, sessions_done: newDone, done_before: ae.sessionsDone,
    paid: Number(document.getElementById('eae-paid').value) || 0,
    expiry: document.getElementById('eae-expiry').value || '',
    updated_by: currentUser.email
  }).then(function(res){
    if (!res || !res.success) {
      toast((res && res.error) || 'Không lưu được', 'error');
      if (btn) { btn.disabled = false; btn.textContent = 'Lưu thay đổi'; }
      return;
    }
    if (res.warnings && res.warnings.length) toast(res.warnings.join(' '), 'error');
    else toast('Đã lưu thông tin Advisee ✅', 'success');
    closeModal();
    loadAdviseesFromSheet(function(){ navToStaffAdviseeDetail(aeId, fromAdvisorId || null); });
  }).catch(function(e){
    toast('Lỗi kết nối: ' + e.message, 'error');
    if (btn) { btn.disabled = false; btn.textContent = 'Lưu thay đổi'; }
  });
}

function openAdviseeSessionModal(sessionNo) {

  if (!ae) return;
  var s = ae.sessions.find(function(x){ return x.no === sessionNo; });

  var d = s.date ? new Date(s.date + 'T00:00:00') : null;
  var dow = d ? ['CN','T2','T3','T4','T5','T6','T7'][d.getDay()] : '';
  var dateLabel = d ? dow + ' ' + d.getDate() + '/' + (d.getMonth()+1) + '/' + d.getFullYear() + ' · ' + s.timeStart + '–' + s.timeEnd : 'Chưa xếp lịch';
  document.getElementById('modal-title').textContent = 'Buổi ' + sessionNo;

  body += '<div style="display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:10px;padding:12px 16px;margin-bottom:16px;flex-wrap:wrap;gap:8px">';

  body += '<div style="display:flex;gap:8px">';
  if (s.meetLink) body += '<a href="' + s.meetLink + '" target="_blank" class="detail-btn">🎥 Vào Meet</a>';
  if (s.status === 'upcoming' && !s.date) body += '<button class="detail-btn" onclick="closeModal();openBookSessionModal(\'' + ae.id + '\',' + sessionNo + ')">🗓 Chọn giờ meeting</button>';
  else if (s.status === 'upcoming' && s.date) body += '<button class="detail-btn" onclick="closeModal();openRescheduleModal(\'' + ae.id + '\',' + sessionNo + ',\'advisee\')">🔄 Đổi giờ</button>';
  body += '</div></div>';

  // Chuẩn bị
  body += '<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px">Chuẩn bị của bạn</div>';
  if (s.status === 'upcoming') {
    if (s.prepInfo) {
      body += '<div class="prep-panel-submitted" style="border-radius:10px;border:1.5px solid #BBF7D0">';
      body += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"><div style="font-size:12px;font-weight:700;color:#065F46">✅ Đã gửi</div><button class="prep-edit-btn" onclick="closeModal();openPrepFormModal(' + sessionNo + ')">✎ Sửa</button></div>';
      if (s.prepInfo.cvLink)     body += '<div class="prep-submitted-row"><span class="prep-submitted-label">CV / Hồ sơ</span><span class="prep-submitted-val"><a href="' + s.prepInfo.cvLink + '" target="_blank">' + s.prepInfo.cvLink + '</a></span></div>';
      if (s.prepInfo.question)   body += '<div class="prep-submitted-row"><span class="prep-submitted-label">Câu hỏi</span><span class="prep-submitted-val">' + s.prepInfo.question + '</span></div>';
      if (s.prepInfo.otherLinks) body += '<div class="prep-submitted-row"><span class="prep-submitted-label">Links khác</span><span class="prep-submitted-val">' + s.prepInfo.otherLinks + '</span></div>';
      body += '</div>';
    } else {
      body += '<div class="prep-panel" style="border-radius:10px">';
      var _pdl = (s.date && s.prepRequired) ? prepDeadlineInfo_(s.date, s.timeStart) : null;
      if (_pdl) body += '<div style="background:' + (_pdl.hoursLeft <= 6 ? '#FEE2E2' : '#FFFBEB') + ';border:1px solid ' + (_pdl.hoursLeft <= 6 ? '#FCA5A5' : '#FDE68A') + ';border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:12.5px;line-height:1.6;color:#7C2D12">⏰ Gửi câu hỏi <b>trước ' + _pdl.label + '</b> (' + PREP_DEADLINE_HOURS + ' giờ trước giờ hẹn). Nếu chưa gửi, buổi này sẽ <b>tự huỷ</b> và bạn cần đặt lại lịch.</div>';
      if (s.lastCancelled) body += '<div style="background:#F3F4F6;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:12.5px;line-height:1.6;color:var(--muted)">🚫 Lịch ' + escHtml(fmtDmy_(s.lastCancelled.date)) + ' ' + escHtml(s.lastCancelled.time) + ' đã tự huỷ vì chưa gửi câu hỏi trước hạn. Buổi này vẫn còn nguyên trong gói — bạn chọn lại giờ mới nhé.</div>';
      body += '<div class="prep-alert">📋 <div>Điền thông tin chuẩn bị để <strong>Advisor đọc trước buổi meeting</strong>.</div></div>';
      body += '<div class="prep-section-label">CV / Hồ sơ</div><input class="prep-input" id="m-prep-cv-' + sessionNo + '" placeholder="Link Google Drive, Notion..."/>';
      body += '<div class="prep-section-label">Câu hỏi cho Advisor <span style="color:var(--brand)">*</span></div><textarea class="prep-textarea" id="m-prep-q-' + sessionNo + '" rows="3" placeholder="VD: Em muốn hỏi về cách xây dựng portfolio..."></textarea>';
      body += '<div class="prep-section-label">Links khác</div><input class="prep-input" id="m-prep-links-' + sessionNo + '" placeholder="Portfolio, JD, kết quả test..."/>';
      body += '</div>';
    }
  } else {
    body += s.prepInfo ? renderPrepCard(s.prepInfo) : '<div class="prep-missing">Không có thông tin chuẩn bị.</div>';
  }

  // Nhận xét Advisor
  if (s.status === 'done' || s.status === 'feedback') {
    body += '<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:16px 0 8px">Nhận xét từ Advisor</div>';
    body += renderAdvisorNotesCard(s.advisorNotes, false, null, sessionNo);
  }

  // Feedback form (status === feedback)
  if (s.status === 'feedback') {
    if (!adviseeStarState[sessionNo]) adviseeStarState[sessionNo] = { selected:0, hover:0 };
    var st = adviseeStarState[sessionNo];
    body += '<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:16px 0 8px">Feedback của bạn cho Advisor</div>';
    body += '<div style="background:#FFF7ED;border:1.5px solid #FED7AA;border-radius:10px;padding:14px">';
    body += '<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Đánh giá</div>';
    body += '<div id="m-stars-' + sessionNo + '" style="display:flex;gap:6px;margin-bottom:12px">';
    for (var star = 1; star <= 5; star++) {
      var isActive = star <= (st.hover || st.selected);
      body += '<span style="font-size:28px;cursor:pointer;color:' + (isActive?'#F59E0B':'#D1D5DB') + ';line-height:1" onmouseover="aeeHoverStarModal('+sessionNo+','+star+')" onmouseout="aeeHoverStarModal('+sessionNo+',0)" onclick="aeeSelectStarModal('+sessionNo+','+star+')">★</span>';
    }
    body += '</div>';
    body += '<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Ghi chú & góp ý</div>';
    body += '<textarea class="aee-feedback-textarea" id="m-fbtext-' + sessionNo + '" rows="3" placeholder="VD: Anh giải thích rất rõ, em muốn buổi sau thực hành nhiều hơn..."></textarea>';
    body += '</div>';
  }

  // Feedback đã gửi (done)
  if (s.status === 'done' && s.feedback) {
    body += '<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:16px 0 8px">Feedback của bạn</div>';
    body += '<div style="background:#FFF7ED;border:1.5px solid #FED7AA;border-radius:10px;padding:12px 14px">';
    var stars2 = '';
    for (var i2=1;i2<=5;i2++) stars2 += '<span style="color:'+(i2<=s.feedback.rating?'#F59E0B':'#D1D5DB')+';font-size:16px">★</span>';
    body += '<div style="margin-bottom:6px">' + stars2 + '</div>';
    if (s.feedback.text) body += '<div style="font-size:13px;color:var(--text);line-height:1.65">' + s.feedback.text + '</div>';
    body += '</div>';
  }

  document.getElementById('modal-body').innerHTML = body;
  var actions = '<button class="btn-secondary" onclick="closeModal()" style="width:auto;padding:10px 20px">Đóng</button>';
  if (s.status === 'upcoming' && !s.prepInfo) actions += '<button class="login-btn" onclick="submitPrepInfoModal('+sessionNo+')" style="width:auto;padding:10px 24px">Gửi chuẩn bị →</button>';
  if (s.status === 'feedback') actions += '<button class="login-btn" onclick="submitAdviseeFeedbackModal('+sessionNo+')" style="width:auto;padding:10px 24px;background:#C2410C">Gửi feedback & mở khoá →</button>';
  document.getElementById('modal-actions').innerHTML = actions;
  document.getElementById('modal-overlay').classList.add('open');
}

function aeeHoverStarModal(sessionNo, val) {
  if (!adviseeStarState[sessionNo]) adviseeStarState[sessionNo] = { selected:0, hover:0 };
  adviseeStarState[sessionNo].hover = val;
  var container = document.getElementById('m-stars-' + sessionNo);
  if (!container) return;
  container.querySelectorAll('span').forEach(function(el, i){ el.style.color = (i < (val || adviseeStarState[sessionNo].selected)) ? '#F59E0B' : '#D1D5DB'; });
}
function aeeSelectStarModal(sessionNo, val) {
  if (!adviseeStarState[sessionNo]) adviseeStarState[sessionNo] = { selected:0, hover:0 };
  adviseeStarState[sessionNo].selected = val;
  aeeHoverStarModal(sessionNo, val);
}

      var d = String(s.date || '').slice(0, 10);
      if (!d) return;
      var _stMs = sessionStartMs_(d, s.time_start);
      if (!isNaN(_stMs) && _stMs < Date.now() + BOOK_MIN_HOURS * 3600000) { _bookSessionHidden++; return; }   // phải đặt trước ≥ 24h
      if (!_bookSessionSlots[d]) _bookSessionSlots[d] = [];
      _bookSessionSlots[d].push({ slot_id: s.slot_id, time: s.time_start, timeEnd: s.time_end });
    });
    Object.keys(_bookSessionSlots).forEach(function(d){
      _bookSessionSlots[d].sort(function(a,b){ return a.time.localeCompare(b.time); });
    });
    renderBookSessionModalBody();
  }).catch(function(err){
    document.getElementById('modal-body').innerHTML =
      '<div class="empty-state"><div class="icon">⚠</div>Không tải được lịch trống của Advisor.<br><small style="color:var(--muted)">' + err.message + '</small></div>';
  });
}

function renderBookSessionModalBody() {
  var dates = Object.keys(_bookSessionSlots).filter(function(d){ return _bookSessionSlots[d].length > 0; }).sort();
  var html = '<div style="font-size:13px;color:var(--muted);margin-bottom:14px">Chọn 1 khung giờ trống từ lịch của Advisor <b>' + _bookSessionCtx.advisorName + '</b>, sau đó bấm "Xác nhận đặt lịch".</div>';
  html += '<div style="background:#EFF6FF;border:1px solid #BFDBFE;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:12.5px;line-height:1.7;color:#1E40AF">' +
    '📌 <b>Quy định đặt lịch</b><br>• Đặt lịch trước giờ hẹn ít nhất <b>' + BOOK_MIN_HOURS + ' giờ</b>' + (_bookSessionHidden ? ' (đã ẩn ' + _bookSessionHidden + ' khung giờ quá gần)' : '') + '.<br>' +
    '• Gửi <b>câu hỏi chuẩn bị</b> trước giờ hẹn <b>' + PREP_DEADLINE_HOURS + ' giờ</b> (hệ thống sẽ gửi email nhắc). Nếu chưa gửi, buổi sẽ <b>tự huỷ</b> và bạn cần đặt lại lịch.</div>';

  if (dates.length === 0) {
    html += '<div class="empty-state"><div class="icon">📭</div>Advisor hiện chưa có giờ trống nào. Vui lòng liên hệ đội LinkaJob để được hỗ trợ xếp lịch.</div>';
  } else {
    dates.forEach(function(d){
      var dateObj = new Date(d + 'T00:00:00');
      var label = DAYS_VI[dateObj.getDay()] + ' ' + dateObj.getDate() + '/' + (dateObj.getMonth()+1) + '/' + dateObj.getFullYear();
      html += '<div style="font-size:12.5px;font-weight:700;color:var(--text);margin:14px 0 8px">' + label + '</div>';
      html += '<div style="display:flex;flex-wrap:wrap;gap:8px">';
      _bookSessionSlots[d].forEach(function(sl){
        var isSel = _bookSessionSelected && _bookSessionSelected.date === d && _bookSessionSelected.slotId === sl.slot_id;
        html += '<button class="day-time-chip' + (isSel?' selected':'') + '" onclick="selectBookSlot(\'' + d + '\',\'' + sl.time + '\',\'' + sl.slot_id + '\')">' + sl.time + '</button>';
      });
      html += '</div>';
    });
  }
  document.getElementById('modal-body').innerHTML = html;
  renderBookSessionModalActions();
}

function renderBookSessionModalActions() {
