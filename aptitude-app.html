const X_arrow=a=>`<g transform="rotate(${((a%360)+360)%360} 30 30)"><polygon points="30,8 45,30 35,30 35,52 25,52 25,30 15,30" style="${X_FL}"/></g>`;
const X_dots=n=>{const P=[[15,15],[30,15],[45,15],[15,30],[30,30],[45,30],[15,45],[30,45],[45,45]];return P.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" style="${i<n?X_FL:X_ST+';opacity:.25'}"/>`).join('')};
const X_corner=k=>{const C=[[14,14],[46,14],[46,46],[14,46]];return `<rect x="14" y="14" width="32" height="32" style="${X_ST}"/><circle cx="${C[k][0]}" cy="${C[k][1]}" r="7" style="${X_FL}"/>`};
const X_tbl=(head,rows)=>'<div class=tw><table><tr><th></th>'+head.map(h=>`<th>${h}</th>`).join('')+'</tr>'+rows.map(x=>'<tr><td><b>'+x[0]+'</b></td>'+x.slice(1).map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')+'</table></div>';
const X_perms=a=>a.length<=1?[a]:a.flatMap((x,i)=>X_perms([...a.slice(0,i),...a.slice(i+1)]).map(p=>[x,...p]));

/* ── 1. Chuỗi hình học ── */
XG.geo=(r,d)=>{
const typ=d==1?pk(r,['dots','arr']):d==2?pk(r,['arr','cor']):'poly';let fr,c,ws,exp;
if(typ=='dots'){const s=ri(r,1,2),a=ri(r,1,9-4*s),n=a+4*s;fr=[0,1,2,3].map(k=>X_dots(a+k*s));c=X_dots(n);ws=[[X_dots(n-1),'Đếm thiếu 1'],[X_dots(a+3*s),'Lặp lại hình cuối'],[X_dots(n+1),'Đếm thừa 1'],[X_dots(n-2),'Đếm thiếu 2'],[X_dots(Math.max(1,a)),'Quay lại hình đầu']];exp=`Mỗi hình thêm ${s} chấm tô màu: ${a}, ${a+s}, ${a+2*s}, ${a+3*s} → ${n}.`}
else if(typ=='arr'){const st=d==1?pk(r,[90,-90]):pk(r,[45,-45]),a0=ri(r,0,7)*45,nx=a0+4*st;fr=[0,1,2,3].map(k=>X_arrow(a0+k*st));c=X_arrow(nx);ws=[[X_arrow(nx+st),'Quay thừa 1 bước'],[X_arrow(nx-st),'Lặp lại hình cuối'],[X_arrow(nx+180),'Sai góc quay'],[X_arrow(nx+2*st),'Quay nhảy cách 2 bước']];exp=`Mỗi bước mũi tên quay ${Math.abs(st)}° ${st>0?'theo':'ngược'} chiều kim đồng hồ.`}
else if(typ=='cor'){const st=pk(r,[1,3]),k0=ri(r,0,3),nx=(k0+3*st)%4;fr=[0,1,2].map(k=>X_corner((k0+k*st)%4));c=X_corner(nx);ws=[0,1,2,3].filter(x=>x!=nx).map(x=>[X_corner(x),x==(k0+2*st)%4?'Lặp lại vị trí cuối':'Nhầm hướng hoặc số bước di chuyển']);exp=`Chấm di chuyển ${st==1?'theo':'ngược'} chiều kim đồng hồ, mỗi lần sang 1 góc.`}
else{const f0=ri(r,0,1);fr=[0,1,2,3].map(k=>X_poly(3+k,(f0+k)%2));c=X_poly(7,f0);ws=[[X_poly(7,1-f0),'Bỏ sót quy luật tô màu xen kẽ'],[X_poly(6,f0),'Lặp lại số cạnh'],[X_poly(8,f0),'Nhảy cách 2 cạnh']];exp='Hai quy luật chạy song song: số cạnh tăng 1 mỗi hình (3, 4, 5, 6 → 7) và tô màu xen kẽ.'}
return mk(r,'Chọn hình tiếp theo trong chuỗi:<br>'+fr.map(X_FR).join('')+X_Q,X_SVG(c,46),ws.map(([x,t])=>[X_SVG(x,46),t]),exp,'geo',d)};

/* ── 2. Data interpretation (bảng, biểu đồ) ── */
const X_chart=(N,A,B)=>{const mx=Math.ceil(Math.max(...A,...B)/20)*20,H=120,x0=44;let s=`<svg viewBox="0 0 390 200" width="100%" style="max-width:430px;display:block;margin:6px 0">`;
for(let t=0;t<=4;t++){const y=160-H*t/4;s+=`<line x1="${x0}" y1="${y}" x2="380" y2="${y}" style="stroke:var(--ln);stroke-width:1"/><text x="${x0-6}" y="${y+4}" text-anchor="end" font-size="11" style="fill:var(--mu)">${mx*t/4}</text>`}
N.forEach((n,i)=>{const gx=x0+18+i*82;[[A[i],0,'var(--mu)'],[B[i],1,'var(--or)']].forEach(([v,k,col])=>{const h=H*v/mx,x=gx+k*26;s+=`<rect x="${x}" y="${160-h}" width="24" height="${h}" style="fill:${col}"/><text x="${x+12}" y="${160-h-4}" text-anchor="middle" font-size="11" style="fill:var(--tx)">${v}</text>`});s+=`<text x="${gx+25}" y="178" text-anchor="middle" font-size="12" style="fill:var(--tx)">${n}</text>`});
s+=`<rect x="${x0}" y="2" width="10" height="10" style="fill:var(--mu)"/><text x="${x0+14}" y="11" font-size="11" style="fill:var(--tx)">Q2</text><rect x="${x0+50}" y="2" width="10" height="10" style="fill:var(--or)"/><text x="${x0+64}" y="11" font-size="11" style="fill:var(--tx)">Q3</text><text x="380" y="11" text-anchor="end" font-size="11" style="fill:var(--mu)">Đơn vị: triệu đồng</text></svg>`;return s};
XG.dat=(r,d)=>{const N=['CN A','CN B','CN C','CN D'];let A,B,g,best,abs,mq,t=0,ok;
do{t++;A=N.map(()=>ri(r,8,18)*5);B=A.map(a=>a+ri(r,2,18));g=B.map((b,i)=>(b-A[i])/A[i]*100);const ord=g.map((v,i)=>[v,i]).sort((x,y)=>y[0]-x[0]);best=ord[0][1];const dl=B.map((b,i)=>b-A[i]);abs=dl.indexOf(Math.max(...dl));mq=B.indexOf(Math.max(...B));ok=ord[0][0]-ord[1][0]>=2&&(best!=abs||t>60)}while(!ok&&t<200);
const Q1=A.map(a=>a-ri(r,1,8)),sum=B.reduce((x,y)=>x+y,0),pct=(v)=>f(v,1)+'%';
const gtxt='Tăng trưởng = (Q3 − Q2) / Q2: '+N.map((n,i)=>n+' '+pct(g[i])).join('; ')+'.';
if(d==1){const ws=[[N[abs],'Chọn theo mức tăng tuyệt đối thay vì %'],[N[mq],'Chọn theo doanh thu Q3 cao nhất']].concat(N.map(n=>[n,'Sai số tính toán']));
return mk(r,'Doanh thu theo quý (triệu đồng):<br>'+X_tbl(['Q1','Q2','Q3'],N.map((n,i)=>[n,Q1[i],A[i],B[i]]))+'<br>Chi nhánh nào có TỐC ĐỘ TĂNG TRƯỞNG (%) cao nhất từ Q2 sang Q3?',N[best],ws,gtxt,'dat',d)}
if(d==2){const i=ri(r,0,3),share=B[i]/sum*100,sa=A[i]/A.reduce((x,y)=>x+y,0)*100;
return mk(r,'Doanh thu theo quý (triệu đồng):<br>'+X_tbl(['Q1','Q2','Q3'],N.map((n,j)=>[n,Q1[j],A[j],B[j]]))+`<br>Doanh thu Q3 của ${N[i]} chiếm bao nhiêu % tổng doanh thu Q3 của 4 chi nhánh (làm tròn 1 chữ số thập phân)?`,pct(share),[[pct(sa),'Lấy nhầm quý (Q2 thay vì Q3)'],[pct(B[i]/(sum-B[i])*100),'Chia cho phần còn lại thay vì tổng'],[pct(B[i]/Math.max(...B)*100),'So với chi nhánh lớn nhất thay vì tổng'],[pct(share+ri(r,2,5)),'Sai số tính toán']],`Tổng Q3 = ${sum}; ${N[i]} = ${B[i]} → ${B[i]}/${sum} = ${pct(share)}.`,'dat',d)}
const dlt=B[best]-A[best],other=best==abs?mq:abs,ws3=[[`${N[best]}, ${pct(dlt/B[best]*100)}`,'Chia chênh lệch cho Q3 thay vì Q2'],[`${N[other]}, ${pct(g[other])}`,'Chọn nhầm chi nhánh (theo mức tăng tuyệt đối hoặc doanh thu cao nhất)'],[`${N[best]}, ${pct(dlt)}`,'Nhầm mức tăng tuyệt đối với %']].concat(N.map(n=>[`${n}, ${pct(g[N.indexOf(n)])}`,'Sai chi nhánh']));
return mk(r,'Biểu đồ doanh thu Q2 và Q3:<br>'+X_chart(N,A,B)+'Chi nhánh nào tăng trưởng % cao nhất từ Q2 sang Q3, và tốc độ tăng là bao nhiêu (làm tròn 1 chữ số thập phân)?',`${N[best]}, ${pct(g[best])}`,ws3,gtxt,'dat',d)};

/* ── 3. Data sufficiency (kiểu GMAT) ── */
const X_SUF={
C1:r=>{const P=ri(r,2,9)*10000,Q=ri(r,2,9)*50;return{s:'Doanh thu tháng 3 của cửa hàng X là bao nhiêu?',a:`Giá bán mỗi sản phẩm là ${f(P)} đồng.`,b:`Cửa hàng bán được ${Q} sản phẩm trong tháng 3.`,k:'C',why:'Doanh thu = giá × số lượng. Mỗi dữ kiện riêng chỉ cho một thừa số; phải gộp cả hai mới tính được.'}},
C2:r=>{const p=pk(r,[40,30,25]),T=ri(r,4,20)*20;return{s:'Công ty Y có bao nhiêu nhân viên?',a:`Nhân viên nữ chiếm ${p}% tổng số nhân viên.`,b:`Công ty có ${T*(100-p)/100} nhân viên nam.`,k:'C',why:`(1) chỉ cho tỷ lệ, (2) chỉ cho số nam. Gộp lại: nam chiếm ${100-p}% = ${T*(100-p)/100} → tổng = ${T}.`}},
C3:r=>{const T=ri(r,3,9)*120,n=pk(r,[4,6,8,12]);return{s:'Trung bình mỗi nhân viên bán được bao nhiêu sản phẩm?',a:`Tổng số sản phẩm cả nhóm bán được là ${T}.`,b:`Nhóm có ${n} nhân viên.`,k:'C',why:`Trung bình = tổng ÷ số người. Cần cả hai dữ kiện: ${T} ÷ ${n} = ${T/n}.`}},
D1:r=>{const S=ri(r,4,9)*20000,m=pk(r,[20,25,40]),l=S*m/100;return{s:'Giá vốn mỗi sản phẩm là bao nhiêu?',a:`Giá bán là ${f(S)} đồng, biên lợi nhuận gộp là ${m}% trên giá bán.`,b:`Giá bán là ${f(S)} đồng, lãi gộp mỗi sản phẩm là ${f(l)} đồng.`,k:'D',why:`(1): giá vốn = ${f(S)} × (1 − ${m}%) = ${f(S-l)}. (2): giá vốn = ${f(S)} − ${f(l)} = ${f(S-l)}. Mỗi dữ kiện riêng đã đủ.`}},
D2:r=>{const L=ri(r,2,9)*50000,p=pk(r,[10,20,25]),c=L*p/100;return{s:'Giá bán sau chiết khấu của sản phẩm Z là bao nhiêu?',a:`Giá niêm yết là ${f(L)} đồng và chiết khấu ${p}%.`,b:`Giá niêm yết là ${f(L)} đồng và số tiền được giảm là ${f(c)} đồng.`,k:'D',why:`Cả hai đều dẫn tới ${f(L-c)} đồng.`}},
A1:r=>{const Bp=ri(r,2,9)*10,p=pk(r,[10,20,50]),x=ri(r,3,9);return{s:'Ngân sách quảng cáo tháng này là bao nhiêu?',a:`Tháng trước ngân sách là ${Bp} triệu và tháng này tăng ${p}% so với tháng trước.`,b:`Ngân sách tháng này cao hơn tháng trước ${x} triệu.`,k:'A',why:`(1) đủ: ${Bp} × ${f(1+p/100,2)} = ${Bp*(1+p/100)} triệu. (2) chỉ cho chênh lệch, không biết mốc tháng trước.`}},
E1:r=>{const p=ri(r,5,25);return{s:'Doanh thu quý 4 là bao nhiêu?',a:`Doanh thu quý 4 tăng ${p}% so với quý 3.`,b:'Doanh thu quý 4 cao hơn doanh thu quý 2.',k:'E',why:'Không dữ kiện nào cho một mốc số tuyệt đối; gộp lại vẫn chỉ có quan hệ tương đối.'}},
E2:r=>{const p=ri(r,20,45),q=ri(r,15,30);return{s:'Tổng chi phí tháng 5 là bao nhiêu?',a:`Chi phí nhân sự chiếm ${p}% tổng chi phí.`,b:`Chi phí marketing chiếm ${q}% tổng chi phí.`,k:'E',why:'Chỉ có tỷ lệ phần trăm, không có giá trị tuyệt đối nào của một khoản chi để suy ra tổng.'}}};
XG.suf=(r,d)=>{const o=X_SUF[pk(r,d==1?['C1','D1']:d==2?['A1','C2','D2','C3']:['E1','E2','C3','A1'])](r);
if(o.k=='A'&&r()<.5){const t=o.a;o.a=o.b;o.b=t;o.k='B';o.why=o.why.replace(/\(1\)/g,'§').replace(/\(2\)/g,'(1)').replace(/§/g,'(2)')}
const L=['A','B','C','D','E'],T=['Chỉ dữ kiện (1) đủ; (2) không đủ','Chỉ dữ kiện (2) đủ; (1) không đủ','Phải gộp cả (1) và (2) mới đủ; mỗi dữ kiện riêng thì không','Mỗi dữ kiện riêng đã đủ','Gộp cả hai vẫn không đủ'];
const trap=(i)=>i==4?'Quá thận trọng: bỏ sót khả năng gộp dữ kiện':i==3?'Nhầm: dữ kiện không đủ khi đứng riêng':i==2?'Gộp dữ kiện khi chưa cần, hoặc khi vẫn thiếu':'Đánh giá sai mức đủ của từng dữ kiện riêng';
return fx(r,`Câu hỏi: ${o.s}\n(1) ${o.a}\n(2) ${o.b}\n\nChỉ xét đủ hay không đủ để TRẢ LỜI (không cần tính). Chọn đáp án đúng:`,T.map((t,i)=>[t,L[i]==o.k,L[i]==o.k?0:trap(i)]),o.why,'suf',d,0)};

/* ── 4. Puzzle logic (bảng loại trừ) ── */
XG.puz=(r,d)=>{const n=d==1?3:d==2?4:5,P=['An','Bình','Chi','Dũng','Hà'].slice(0,n),J=sh(r,['Kế toán','Kỹ sư','Marketing','Nhân sự','Kinh doanh']).slice(0,n);
const sol=sh(r,[...Array(n).keys()]),ask=ri(r,0,n-1),all=X_perms([...Array(n).keys()]);
let pool=[];for(let p=0;p<n;p++)for(let j=0;j<n;j++){if(sol[p]==j){if(p!=ask)pool.push({t:'d',p,j})}else pool.push({t:'n',p,j})}
pool=sh(r,pool);const sat=(cl,pm)=>cl.every(c=>c.t=='d'?pm[c.p]==c.j:pm[c.p]!=c.j),cnt=cl=>all.filter(pm=>sat(cl,pm)).length;
let cl=[];for(const c of pool){cl.push(c);if(cnt(cl)==1)break}
for(let i=cl.length-1;i>=0;i--){const t=cl.filter((_,k)=>k!=i);if(cnt(t)==1)cl=t}
cl=sh(r,cl);const holder=sol.indexOf(sol[ask]);const ansP=ask;
const q=`${n} người (${P.join(', ')}) làm ${n} nghề khác nhau (${J.join(', ')}), mỗi người một nghề.\nDữ kiện:\n`+cl.map(c=>`- ${P[c.p]} ${c.t=='d'?'làm':'không làm'} ${J[c.j]}.`).join('\n')+`\n\nAi làm nghề ${J[sol[ask]]}?`;
const it=P.map((x,i)=>[x,i==ask,i==ask?0:'Chưa lập bảng loại trừ đầy đủ']);if(n<=4)it.push(['Không đủ thông tin',0,'Bỏ qua suy luận loại trừ']);
return fx(r,q,it,'Lập bảng loại trừ: '+P.map((x,i)=>`${x} - ${J[sol[i]]}`).join('; ')+'.','puz',d,1)};

/* ── 5. Critical reasoning ── */
const X_CRT=[
r=>{const p=ri(r,10,20),s=ri(r,25,40);return{q:`Công ty ${pk(r,['Alpha','Sao Việt','Minh Long'])} giảm giá ${p}% cho một dòng sản phẩm. Tháng sau, doanh số dòng này tăng ${s}%. Ban giám đốc kết luận: việc giảm giá là nguyên nhân khiến doanh số tăng.\n\nPhát biểu nào làm YẾU nhất kết luận trên?`,c:`Tháng đó có đợt khuyến mãi lớn toàn thị trường, doanh số cả ngành cũng tăng khoảng ${s}% kể cả ở các hãng không giảm giá.`,w:[['Dòng sản phẩm này đã có chất lượng ổn định nhiều năm.','Không liên quan đến quan hệ nhân quả'],['Giảm giá làm lợi nhuận trên mỗi sản phẩm thấp hơn.','Nói về lợi nhuận, không đánh vào nguyên nhân tăng doanh số'],['Một số khách hàng chưa biết về chương trình giảm giá.','Chỉ giải thích vì sao chưa tăng nhiều hơn']],e:'Muốn làm yếu kết luận nhân quả, cần chỉ ra một nguyên nhân khác cũng giải thích được kết quả.'}},

genSet=function(t,no,n){const r=rng((TY.indexOf(t)+1)*7919+no*104729),s=no>=1000?Math.floor((no-1000)/10):no,b=s<=40?0:s<=80?1:2,lo=[1,1.6,2.2][b],hi=[3.2,4,4][b],seen=new Set(),out=[];
 for(let i=0;i<n;i++){const x=n>1?i/(n-1):.5,d=Math.max(1,Math.min(4,Math.round(lo+(hi-lo)*x)));let q,g=0;do{q=GEN[t](r,d)}while(seen.has(q.q)&&++g<14);seen.add(q.q);out.push(q)}return out};

const gd=()=>`<h1 class=h1 style="margin-top:14px">Hiểu đề trước khi làm</h1><p class=lead>Mỗi dạng bài dưới đây mô tả cấu trúc câu hỏi, cách đề được xây dựng và cách tính điểm, để bạn biết mình sẽ gặp gì trước khi bấm giờ.</p>

<div class=gd style="margin-top:16px">${Object.keys(SK).map(k=>`<div class=c><span class=tag>${SK[k][0].replace(/ \(.*\)/,'')}</span><h3 style="margin-top:10px">${SK[k][0]}</h3><p><b>Đo gì.</b> ${IN[k][0]}</p><p><b>Đề thi gồm.</b> ${IN[k][1]}</p><p><b>Độ khó và chấm điểm.</b> ${IN[k][2]}</p><button class=b2 data-go=${k}>Vào luyện dạng này →</button></div>`).join('')}</div>`;
hm=function(H){const n=new Date(),dw=(n.getDay()+6)%7,m0=new Date(n.getFullYear(),n.getMonth(),n.getDate()-dw).getTime();let cnt=0;const dots=['T2','T3','T4','T5','T6','T7','CN'].map((l,i)=>{const s=m0+i*864e5,on=H.some(h=>h.id>=s&&h.id<s+864e5);cnt+=on;return `<span class='dy${on?' on':''}${i==dw?' td':''}'>${on?'✓':l}</span>`}).join(''),av=H.length?Math.round(H.reduce((a,h)=>a+h.sc,0)/H.length):0;
return `<section class=hr><div class=ht><h1>Bộ đề aptitude<br><em>sát với phòng thi.</em></h1><div class=hs2><div><b>120</b>đề cho mỗi dạng</div><div><b>${Object.keys(SK).length}</b>dạng bài</div><div><b>${Object.keys(CO).length}</b>full section theo ngành</div></div></div><div class=dc><svg viewBox='0 0 400 300' preserveAspectRatio='xMidYMid slice'><path d='M-20 230C90 270 150 120 250 170S360 80 430 60' fill='none' stroke='#fc5229' stroke-width='16' stroke-linecap='round'/><circle cx='330' cy='70' r='26' fill='#f7b32b'/><circle cx='90' cy='60' r='12' fill='#fc5229'/></svg><div class=fc style='--r:-8deg;top:20%;right:36%'>+15% −10% = ?</div><div class=fc style='--r:6deg;top:46%;right:8%'>2, 6, 12, 20, ?</div><div class=fc style='--r:-4deg;bottom:12%;right:34%'>3142 · 2413 · ?</div></div></section>
<h2 class=h>Chọn cách luyện</h2><div class=g3><button class=cd data-go=num><span class=im></span><h3>Theo từng dạng bài</h3><p>${Object.keys(SK).length} dạng, mỗi dạng 120 đề có bấm giờ theo từng câu.</p><i>→</i></button><button class=cd data-go=fmcg><span class='im b'></span><h3>Full section theo ngành</h3><p>Cơ cấu và thời lượng riêng cho FMCG, Consulting, Big 4, Tài chính, Tech và bộ đề kiểu P&G.</p><i>→</i></button><button class=cd data-tab=guide><span class='im c'></span><h3>Hiểu đề</h3><p>Mô tả cấu trúc và cách chấm điểm của từng dạng trước khi làm.</p><i>→</i></button></div>
<div class=g2><div class=c><h3>Tiến độ luyện tập</h3><p>${H.length?`Đã làm ${H.length} đề, điểm trung bình ${av}/100.`:'Chưa có đề nào trong lịch sử. Bắt đầu ở mục Lộ trình.'}</p><div class=bar2><i style='width:${Math.min(100,H.length*5)}%'></i></div><p class=mu style='margin-top:6px'>Mốc đề xuất: 20 đề</p></div><div class=c><h3>${cnt}/7 ngày có luyện tập tuần này</h3><p>Mỗi ngày một đề, kết quả được lưu vào tài khoản.</p>${dots}</div></div>
<div style="text-align:center;margin-top:18px"><button class=b data-rnd>Làm một full section ngẫu nhiên →</button></div>`};
home=function(){clearInterval(tm);const H=hist().filter(h=>h.cfg),b=TAB=='home'?hm(H):TAB=='road'?rd():TAB=='guide'?gd():dn(H);app.innerHTML=`<div style='zoom:${SZ}'>${nav()}<main class=w>${b}</main>${ads()}<button class=fl data-ads>Sản phẩm LinkaJob</button></div>`};
tick=function(s){const e=$('#tmr');if(!e)return;if(!s.time){e.textContent='No time limit';return}e.textContent=String(Math.max(0,Math.floor(s.left/60))).padStart(2,'0')+':'+String(Math.max(0,s.left%60)).padStart(2,'0');if(s.left<=0)endSec()};
render=function(){const s=S.secs[S.si],q=s.qs[S.qi],last=S.qi==s.qs.length-1;
app.innerHTML=`<div class=w><div class=bar><span>${EN(s.nm)}${S.secs.length>1?` · Section ${S.si+1} of ${S.secs.length}`:''}</span><span id=tmr></span></div><div class=pg><i style="width:${S.qi/s.qs.length*100}%"></i></div><div class=c><p>Question ${S.qi+1} of ${s.qs.length} · difficulty ${'●'.repeat(q.d)}${'○'.repeat(4-q.d)}</p><div class=q lang=en>${q.q}</div>${q.o.map((o,i)=>`<button class=opt lang=en data-o=${i}><b>${'ABCDE'[i]}</b>${o.t}</button>`).join('')}<div class=ac><button class=b2 data-skip>Skip</button><button class=b id=nx disabled data-nx>${last?'Submit section':'Next question'}</button></div></div><p class=mu>You cannot go back to a previous question, just like in the real test.</p></div>`;tick(s)};
start=function(secs,title){const tg=$('#tm')?$('#tm').checked:true;S={title,secs:secs.map(s=>({...s,t0:s.time,time:tg?s.time:0,qs:genSet(s.type,s.no,s.n),a:[],done:0})),si:0,qi:0,cf:0};if(S.secs.length>1)hub();else brief(0)};
runSec=function(i){clearInterval(tm);if(i!=null)S.si=i;const s=S.secs[S.si];s.left=s.time;S.qi=0;s.sel=null;s.a=[];S.qt=Date.now();render();tm=setInterval(()=>{if(s.time){s.left--;tick(s)}},1000)};
endSec=function(){clearInterval(tm);const s=S.secs[S.si];s.qs.forEach((_,i)=>{if(!s.a[i])s.a[i]={k:null,out:1}});s.done=1;if(S.secs.length>1)hub();else result()};
function brief(i){const s=S.secs[i];app.innerHTML=`<div class=w><span class=tag>${EN(S.title)}</span><h2 style="margin-top:12px">${EN(s.nm)}</h2><div class=brf><div><b>${s.qs.length}</b>questions</div><div><b>${s.time?Math.round(s.time/60):'—'}</b>${s.time?'minutes':'no time limit'}</div><div><b>4</b>difficulty levels</div></div><div class=c><p style="color:var(--tx)">${BR[s.type]}</p><p>${BRL.join(' ')} A question cannot be reopened once you move on.</p></div><div class=dl><button class=b data-bs=${i}>Begin</button><button class=b2 data-bb>${S.secs.length>1?'Back to sections':'Cancel'}</button></div></div>`}
function hub(){clearInterval(tm);const done=S.secs.filter(s=>s.done).length,all=done==S.secs.length;
app.innerHTML=`<div class=w><span class=tag>${EN(S.title)}</span><h2 style="margin-top:12px">Choose a section</h2><p class=lead>This exam has ${S.secs.length} sections. Take them in any order: open a section, finish it, then return here for the next. Each section has its own timer that starts when you begin, and a submitted section cannot be changed.</p><div class=g>${S.secs.map((s,i)=>`<div class=c><span class=tag>${s.done?'Completed':'Not started'}</span><h3 style="margin-top:10px">${EN(s.nm)}</h3><p>${DESC[s.type]||''}<br>${s.qs.length} questions · ${s.time?Math.round(s.time/60)+' min':'No time limit'}</p>${s.done?'<button class=b disabled>Completed</button>':`<button class=b data-hs=${i}>Open section</button>`}</div>`).join('')}</div><p class=mu style="margin-top:14px">${done} of ${S.secs.length} sections completed.${all?'':' Sections you do not take will score 0.'}</p><div class=dl><button class=${all?'b':'b2'} data-hfin>${S.cf==1?'Confirm: finish now':all?'View results':'Finish exam and view results'}</button><button class=b2 data-hexit>${S.cf==2?'Confirm: leave without saving':'Leave exam'}</button></div></div>`}
app.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
if(d.rnd!==undefined){const r=rng(Date.now()),ty=['num',...sh(r,TY.filter(x=>x!='num'&&x!='peak'&&x!='sjt')).slice(0,3),'sjt'];start(ty.map((x,i)=>({type:x,no:1000+ri(r,1,60)*10+i,n:x=='sjt'?5:8,time:Math.round((x=='sjt'?5:8)*SK[x][1]*.9),nm:SK[x][0]})),'Full section ngẫu nhiên');return}
if(!S)return;
if(d.hs!==undefined){S.cf=0;brief(+d.hs)}
else if(d.bs!==undefined){S.cf=0;runSec(+d.bs)}
else if(d.bb!==undefined){if(S.secs.length>1)hub();else{S=null;home()}}
else if(d.hfin!==undefined){const all=S.secs.every(s=>s.done);if(all||S.cf==1){S.secs.forEach(s=>{if(!s.done){s.a=s.qs.map(()=>({k:null,out:1}));s.done=1}});result()}else{S.cf=1;hub()}}
else if(d.hexit!==undefined){if(S.cf==2){clearInterval(tm);S=null;home()}else{S.cf=2;hub()}}});
result=function(save=1){const W=[0,1,1.5,2,3],per={},traps={},dd=[0,0,0,0,0],cn=[0,0,0,0,0];let tot=0,got=0,N=0;
S.secs.forEach(s=>{const p=per[s.type]=per[s.type]||{n:0,att:0,ok:0,ms:0,out:0,sk:0,g:0,w:0};s.qs.forEach((q,i)=>{const a=s.a[i]||{k:null,out:1},w=W[q.d];p.n++;N++;p.w+=w;tot+=w;cn[q.d]++;
if(a.out)p.out++;else if(a.k===null)p.sk++;else{p.att++;p.ms+=a.ms;const o=q.o[a.k],cr=o.pts!=null?o.pts:o.ok?1:0;p.g+=w*cr;got+=w*cr;if(o.ok){p.ok++;dd[q.d]++}else if(o.trap&&s.type!='peak')traps[o.trap]=(traps[o.trap]||0)+1}})});
const sc=Math.round(got/tot*100),st=[],wk=[],tip=[];
for(const[k,p]of Object.entries(per)){const pc=Math.round(p.g/p.w*100),av=p.att?p.ms/p.att/1000:0,tg=SK[k][1],nm=EN(SK[k][0]);
if(p.n>=5&&pc>=75)st.push(`${nm}: ${pc}% score${av&&av<=tg*1.1?', pace within the reference time':''}.`);
if(p.n>=5&&pc<55)wk.push(`${nm}: ${pc}% score (${p.ok} of ${p.n} questions fully correct).`);
if(av>tg*1.25)tip.push(`${nm}: average ${Math.round(av)} s per question against a reference of ${tg} s.`);
if(p.att>=4&&av&&av<tg*.6&&p.ok/p.att<.6)tip.push(`${nm}: answered quickly (${Math.round(av)} s on average) but with many incorrect answers.`);
if(p.out)tip.push(`${nm}: ${p.out} question(s) were left unanswered when time ran out.`)}
const a1=cn[1]?dd[1]/cn[1]:1,a4=cn[4]?dd[4]/cn[4]:cn[3]?dd[3]/cn[3]:1;
if(cn[1]&&a1<.7)tip.push('Several level-1 questions were missed. Level 1 carries the lowest weight but reflects basic accuracy.');
if(cn[1]&&a1>=.8&&a4<.4)tip.push('Level-1 and level-2 questions were mostly correct, while level-3 and level-4 questions were mostly missed.');
const tr=Object.entries(traps).sort((a,b)=>b[1]-a[1]).slice(0,3),lv=sc>=82?'Competitive for Consulting roles and top Graduate programmes':sc>=70?'A good fit for Graduate / MT roles in Finance, Tech and Manufacturing':sc>=60?'A good fit for FMCG MT programmes and Big 4 internships':sc>=45?'Basic level: more practice recommended before applying':'Below the typical range: build the fundamentals first';
if(save)try{const rec={id:Date.now(),d:new Date().toLocaleDateString('vi-VN'),t:S.title,sc,cfg:S.secs.map(s=>({type:s.type,no:s.no,n:s.qs.length,time:s.t0,nm:s.nm,a:s.a}))};HIST.push(rec);HIST=HIST.slice(-100);toParent({apt:'save',rec:rec})}catch(e){}
const fit=Object.values(CO).map(c=>{const g=sc-c.thr;return`<tr><td>${EN(c.n)}</td><td>~${c.thr}</td><td class=${g>=0?'ok':'bad'}>${g>=0?'+':''}${g}</td><td>${g>=5?'Ready':g>=-5?'Close to threshold':'Needs more practice'}</td></tr>`}).join('');
app.innerHTML=`<div class=w><div class=c><span class=tag>${EN(S.title)}</span><div class=ring style="--p:${sc}"><span>${sc}</span></div><b>${lv}</b>${N<30?'<p class=mu>Fewer than 30 questions, so this result is indicative only. A full section gives a more reliable reading.</p>':''}</div>
<div class=c><h3>Results by question type</h3><div class=tw><table><tr><th>Type</th><th>Fully correct</th><th>Score</th><th>Avg sec/question</th><th>Skipped</th><th>Unanswered</th></tr>${Object.entries(per).map(([k,p])=>`<tr><td>${EN(SK[k][0])}</td><td>${p.ok}/${p.n}</td><td>${Math.round(p.g/p.w*100)}%</td><td>${p.att?Math.round(p.ms/p.att/1000):'-'}</td><td>${p.sk}</td><td>${p.out}</td></tr>`).join('')}</table></div><p class=mu style="margin-top:8px">Score is weighted by difficulty (levels 1 to 4 count 1, 1.5, 2 and 3). PEAK items give partial credit for responses next to the preferred one.</p></div>
<div class=c><h3 class=ok>Strengths</h3><ul>${st.map(x=>`<li>${x}</li>`).join('')||'<li>No question type reached 75% yet.</li>'}</ul><h3 class=bad>Weaknesses</h3><ul>${wk.map(x=>`<li>${x}</li>`).join('')||'<li>No question type scored below 55%.</li>'}</ul>
<h3>Patterns in the answers</h3><ul>${tr.map(([t,c])=>`<li>${t} (${c} time${c>1?'s':''})</li>`).join('')||'<li>No clear pattern of repeated mistakes.</li>'}${tip.map(x=>`<li>${x}</li>`).join('')}</ul></div>
<div class=c><h3>Fit by company group</h3><div class=tw><table><tr><th>Group</th><th>Estimated threshold</th><th>Gap</th><th>Verdict</th></tr>${fit}</table></div><p class=mu style="margin-top:8px">Thresholds are internal estimates for practice only and are not calibrated with real data. Employers do not publish pass marks.</p></div>
<div class=c><h3>Question review</h3>${S.secs.map(s=>s.qs.map((q,i)=>{const a=s.a[i]||{k:null,out:1},o=a.k!==null?q.o[a.k]:null,ok=o&&o.ok,pt=o&&o.pts!=null?Math.round(o.pts*100):null;return`<details><summary class=${ok?'ok':'bad'}>${EN(s.nm)} · question ${i+1}: ${ok?'Correct':a.out?'Unanswered':a.k===null?'Skipped':pt?`Partly correct (${pt}%)`:'Incorrect'}</summary><div class=q lang=en style="font-weight:400">${q.q}</div><p>Your answer: ${o?o.t:'(none)'}${o&&!o.ok&&o.trap?`<br><span class=mu>${o.trap}</span>`:''}<br>${s.type=='peak'?'Preferred response':'Correct answer'}: ${q.o.find(x=>x.ok).t}</p><p>${q.exp}</p></details>`}).join('')).join('')}</div>
${save?`<p class=mu id=sv>Saving your result…</p>`:''}<button class=b data-home>Back to home</button></div>`};
window.addEventListener('message',e=>{if(e.source!==parent)return;const m=e.data||{};if(m.apt==='saved'){const el=document.getElementById('sv');if(el)el.textContent=m.ok?'Your result has been saved to your account.':'Could not save your result. Please check your connection or sign in again.'}});
home();

})();
