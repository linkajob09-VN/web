<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>LinkaJob Aptitude</title>
<style>
:root{--bg:#F5F4F1;--tx:#1C1C1C;--mu:rgba(28,28,28,.62);--or:#fc5229;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0D0D0D;--tx:#F0F0F0;--mu:rgba(240,240,240,.62);color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,-apple-system,'Segoe UI',sans-serif;padding:24px}
#m{max-width:420px;text-align:center}h1{font-size:20px;margin:0 0 8px}p{color:var(--mu);margin:0 0 18px}
a.b{display:inline-block;background:var(--or);color:#fff;padding:11px 24px;border-radius:99px;text-decoration:none;font-weight:700}
.sp{width:30px;height:30px;border:3px solid rgba(252,82,41,.25);border-top-color:var(--or);border-radius:50%;margin:0 auto 14px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
</style></head><body><div id="m"><div class="sp"></div><p>Đang xác thực…</p></div>
<script>
(function(){
var API='https://script.google.com/macros/s/AKfycbx7Bd9VvoyzfiiezQV9huoY2BKHH_Br1RAFIz00mjdyKeis-Zv-38a0gf_b-fMlul2C/exec';
var PORTAL='https://linkajob09-vn.github.io/web/advisor_advisee.html';
var m=document.getElementById('m');
function deny(t){m.innerHTML='<h1>Cần đăng nhập</h1><p>'+t+'</p><a class="b" href="'+PORTAL+'">Đăng nhập LinkaJob</a>';}
var h=/^#t=([0-9a-f]{64})$/i.exec(location.hash);
try{history.replaceState(null,'',location.pathname);}catch(e){}   // xoá vé khỏi thanh địa chỉ ngay
if(!h){deny('Trang này chỉ mở được từ mục “Tài liệu luyện tập” sau khi bạn đăng nhập tài khoản LinkaJob. Link sao chép sẽ không dùng được.');return;}
fetch(API+'?action=aptitudeContent&ticket='+h[1]).then(function(r){return r.json();}).then(function(d){
  if(!d||!d.ok||!d.html){deny('Link đã hết hạn hoặc đã được sử dụng. Vui lòng mở lại từ tài khoản của bạn.');return;}
  document.open();document.write(d.html);document.close();
  // Lớp cản sao chép (chỉ gây khó, không ngăn tuyệt đối)
  var st=document.createElement('style');st.textContent='*{-webkit-user-select:none;user-select:none}input,textarea{-webkit-user-select:text;user-select:text}@media print{body{display:none!important}}';document.head.appendChild(st);
  ['contextmenu','copy','cut','dragstart'].forEach(function(e){document.addEventListener(e,function(ev){ev.preventDefault();});});
  document.addEventListener('keydown',function(ev){var k=(ev.key||'').toLowerCase();if(ev.key==='F12'||((ev.ctrlKey||ev.metaKey)&&['c','u','s','p','a'].indexOf(k)>-1)||((ev.ctrlKey||ev.metaKey)&&ev.shiftKey&&['i','j','c'].indexOf(k)>-1))ev.preventDefault();});
}).catch(function(){deny('Không kết nối được máy chủ. Vui lòng thử lại.');});
})();
</script></body></html>
