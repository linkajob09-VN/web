function go(G,n){if(G.co){const c=CO[G.k];start(c.s.map(([x,m],i)=>({type:x,no:n*10+i,n:m,time:Math.round(m*SK[x][1]*c.f),nm:SK[x][0]})),G.pre+n)}else{const k=G.k,m=k=='sjt'?5:10;start([{type:k,no:n,n:m,time:m*SK[k][1],nm:SK[k][0]}],G.pre+n)}}
function nav(){return `<header class=nv><div class=lg><span class=lgi role=img aria-label=LinkaJob></span><small>Aptitude</small></div><nav>${[['home','Trang chủ'],['road','Lộ trình'],['done','Đề đã làm']].map(([k,t])=>`<button class='tb${TAB==k?' on':''}' data-tab=${k}>${t}</button>`).join('')}</nav><div class=tl style='display:none'><label><input type=checkbox id=tm checked> Tính giờ</label><span class=sz>${[['S',.92],['M',1],['L',1.1]].map(([l,v])=>`<button class='${SZ==v?'on':''}' data-fs=${v}>${l}</button>`).join('')}</span><button class=th data-th>◐</button></div></header>`}
const ads=()=>`<footer id=ads class=ft><div><h2>Bắt đầu hành trình sự nghiệp cùng <em>LinkaJob</em></h2><p>Đừng chỉ dừng ở việc biết mình hợp ngành gì, hãy để LinkaJob giúp bạn bắt đầu sự nghiệp thật sự.</p></div><div><h3>Cố vấn 1-1 cùng LinkaJob</h3><ul><li>Sửa CV chi tiết với anh chị có 3+ năm kinh nghiệm từ công ty đa quốc gia</li><li>Phỏng vấn thử, nhận feedback về cách trả lời và cách tư duy</li><li>Insight thực tế ngành mong muốn, so khớp ngành nghề phù hợp</li><li>Kết nối Advisor để nhận gợi ý nghề nghiệp cá nhân hóa</li></ul></div><div><h3>Tài liệu luyện thêm</h3><ul><li>Numerical: Practice Aptitude Tests, AssessmentDay, SHL Direct; GMAT, SAT Math</li><li>Logical: AssessmentDay (Inductive), 123test; GMAT Critical Reasoning, LSAT</li><li>Thi thử nguyên đề: JobTestPrep, Graduatemonkey</li></ul></div></footer>`;
function hm(H){const n=new Date(),dw=(n.getDay()+6)%7,m0=new Date(n.getFullYear(),n.getMonth(),n.getDate()-dw).getTime();let cnt=0;const dots=['T2','T3','T4','T5','T6','T7','CN'].map((l,i)=>{const s=m0+i*864e5,on=H.some(h=>h.id>=s&&h.id<s+864e5);cnt+=on;return `<span class='dy${on?' on':''}${i==dw?' td':''}'>${on?'✓':l}</span>`}).join(''),av=H.length?Math.round(H.reduce((a,h)=>a+h.sc,0)/H.length):0;
return `<section class=hr><div class=ht><h1>Luyện theo từng chặng,<br><em>vượt qua vòng test.</em></h1><div class=hs2><div><b>120</b>đề mỗi dạng</div><div><b>6</b>dạng bài</div><div><b>5</b>ngành full section</div></div></div><div class=dc><svg viewBox='0 0 400 300' preserveAspectRatio='xMidYMid slice'><path d='M-20 230C90 270 150 120 250 170S360 80 430 60' fill='none' stroke='#fc5229' stroke-width='16' stroke-linecap='round'/><circle cx='330' cy='70' r='26' fill='#f7b32b'/><circle cx='90' cy='60' r='12' fill='#fc5229'/></svg><div class=fc style='--r:-8deg;top:20%;right:36%'>+15% −10% = ?</div><div class=fc style='--r:6deg;top:46%;right:8%'>2, 6, 12, 20, ?</div><div class=fc style='--r:-4deg;bottom:12%;right:34%'>Đúng · Sai · Không thể kết luận</div></div></section>
<h2 class=h>Chọn nội dung luyện</h2><div class=g3><button class=cd data-go=num><span class=im></span><h3>Luyện theo dạng bài</h3><p>6 dạng, mỗi dạng 120 đề, bấm giờ theo từng câu.</p><i>→</i></button><button class=cd data-go=fmcg><span class='im b'></span><h3>Full section theo ngành</h3><p>FMCG, Consulting, Big 4, Finance, Tech với cơ cấu và thời gian riêng.</p><i>→</i></button><button class=cd data-rd><span class='im c'></span><h3>Full section ngẫu nhiên</h3><p>Mỗi lần bấm là một đề mới gồm nhiều dạng.</p><i>→</i></button></div>
<div class=g2><div class=c><h3>Tiến độ luyện tập</h3><p>${H.length?`Đã làm ${H.length} đề, điểm trung bình ${av}/100.`:'Bạn chưa làm đề nào. Bắt đầu ở mục Lộ trình.'}</p><div class=bar2><i style='width:${Math.min(100,H.length*5)}%'></i></div><p class=mu style='margin-top:6px'>Mục tiêu gợi ý: 20 đề</p></div><div class=c><h3>${cnt}/7 ngày luyện tuần này</h3><p>Mỗi ngày làm một đề để giữ nhịp.</p>${dots}</div></div>
<h2 class=h>Giới thiệu aptitude test</h2><p class=lead>Aptitude test là vòng sàng lọc đo năng lực tư duy dưới áp lực thời gian, thường nằm ngay sau vòng hồ sơ. Dưới đây là 6 dạng bài bạn sẽ gặp nhiều nhất.</p><div class=g3>${Object.keys(SK).map((k,i)=>`<div class='ic i${i}'><div class=ih><span class=is></span><span class=ib>${{num:'12%',ver:'Aa',ind:'2 4 8',ded:'∴',err:'≠',sjt:'?!'}[k]}</span></div><h3>${SK[k][0]}</h3><p><b>Đo gì:</b> ${IN[k][0]}</p><p><b>Tips:</b> ${IN[k][1]}</p><button class=b2 data-go=${k}>Luyện dạng này →</button></div>`).join('')}</div><div class='c tipc'><b>Mẹo chung:</b> gặp câu khó thì bỏ qua và quay lại sau; đọc bảng hoặc biểu đồ từ tiêu đề, trục, đơn vị rồi mới tới số liệu; sau mỗi đề luôn xem lại vì sao sai.</div>`}
function rd(){const m=dm(),G=GR.find(g=>g.k==SEL),sb=['THEO DẠNG BÀI','THEO NGÀNH'].map((l,gi)=>`<div class=gl>${l}</div>`+GR.filter(g=>g.g==gi).map(g=>{const d=Object.keys(m).filter(t=>t.startsWith(g.pre)).length;return `<button class='lv${g.k==SEL?' on':''}' data-go=${g.k}><span class=bd>${g.c}</span><span class=lt><b>${g.t}</b><small>${d}/${g.tot} đề đã làm</small><i style='--p:${d/g.tot*100}%'></i></span></button>`}).join('')).join(''),rows=Array.from({length:Math.min(G.tot,SHOW)},(_,i)=>{const n=i+1,sc=m[G.pre+n];return `<button class='rw${i%2?' rv':''}' data-pl=${G.k}:${n}><span class='ci${sc!==undefined?' dn':''}'><b>${String(n).padStart(2,'0')}</b><small>${sc!==undefined?sc+'/100':'MỞ'}</small></span><span class=ln></span><span class=cr><small>${G.co?'FULL SECTION':'ĐỀ '+n}</small><h3>${G.t} · Đề ${n}</h3><em>${sc!==undefined?'Điểm cao nhất của bạn: '+sc+'/100':'Chưa làm, bấm để bắt đầu'}</em></span></button>`}).join('');
return `<div class=pg2><aside class=sd><div class=sh><small>LỘ TRÌNH LUYỆN</small><h2>Chọn chặng luyện</h2><p>Theo dạng bài hoặc theo ngành</p></div>${sb}</aside><section class=mn><div class=mh><span class=bd>${G.c}</span><div><h2>${G.t}</h2><p>${G.sub}</p></div></div><div class=bn><div><h3>Luyện ngẫu nhiên</h3><p>Hệ thống chọn một đề bất kỳ trong chặng này.</p></div><button class=wb data-pick=${G.k}>Làm ngay →</button></div>${rows}${G.tot>SHOW?`<button class=b2 data-more>Hiện thêm 12 đề</button>`:''}</section></div>`}
function dn(H){return `<div class=dh><div><h1 class=h1>Đề đã làm</h1><p>${H.length?'Bấm Xem kết quả để xem lại phân tích, hoặc Làm lại cùng đề.':'Chưa có đề nào trong lịch sử.'}</p></div><button class=pl data-tab=road>Vào luyện tập</button></div>${H.length?H.slice(-20).reverse().map(h=>`<div class='c hi'><span class=rg style='--p:${h.sc}'><b>${h.sc}</b></span><div class=hx><b>${h.t}</b><small>${h.d} · ${h.cfg.reduce((a,c)=>a+c.n,0)} câu</small></div><span><button class=b2 data-v=${h.id}>Xem kết quả</button> <button class=b data-r=${h.id}>Làm lại</button></span></div>`).join(''):`<div class=c><h3>Chưa có đề nào</h3><p>Làm một đề ở mục Lộ trình, kết quả và phân tích sẽ được lưu ở đây (trên trình duyệt này).</p><button class=b data-tab=road>+ Vào luyện tập</button></div>`}`}
function home(){clearInterval(tm);const H=hist().filter(h=>h.cfg),b=TAB=='home'?hm(H):TAB=='road'?rd():dn(H);app.innerHTML=`<div style='zoom:${SZ}'>${nav()}<main class=w>${b}</main>${ads()}<button class=fl data-ads>Sản phẩm LinkaJob</button></div>`}
app.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
if(d.tab){TAB=d.tab;home();scrollTo(0,0)}
else if(d.go){TAB='road';SEL=d.go;SHOW=12;home();scrollTo(0,0)}
else if(d.more!==undefined){SHOW+=12;home()}
else if(d.pl){const[k,n]=d.pl.split(':');go(GR.find(g=>g.k==k),+n)}
else if(d.pick){const G=GR.find(g=>g.k==d.pick);go(G,1+Math.floor(Math.random()*G.tot))}
else if(d.fs){SZ=+d.fs;home()}
else if(d.th!==undefined){const r=document.documentElement,c=r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');r.dataset.theme=c=='dark'?'light':'dark'}
else if(d.ads!==undefined){const a=$('#ads');if(a)a.scrollIntoView({behavior:'smooth'})}});
app.addEventListener('change',e=>{if(e.target.id=='tm')TM=e.target.checked});
home();
</script></body></html>
